const raycaster = new THREE.Raycaster();
const ptr = new THREE.Vector2(-2,-2);
let mouseXY = [0,0];
const ПОРОГ_ПЕРЕТАСКИВАНИЯ = 6;
let pointerStart = null;
let pointerDragged = false;
renderer.domElement.addEventListener('pointerdown', e => {
  if(e.pointerType === 'mouse' && e.button !== 0) return;
  pointerStart = { id:e.pointerId, x:e.clientX, y:e.clientY };
  pointerDragged = false;
});
addEventListener('pointermove', e => {
  ptr.x = (e.clientX/innerWidth)*2 - 1;
  ptr.y = -(e.clientY/innerHeight)*2 + 1;
  mouseXY = [e.clientX, e.clientY];
  if(pointerStart && e.pointerId === pointerStart.id &&
     Math.hypot(e.clientX - pointerStart.x, e.clientY - pointerStart.y) > ПОРОГ_ПЕРЕТАСКИВАНИЯ){
    pointerDragged = true;
  }
});
addEventListener('pointercancel', e => {
  if(pointerStart && e.pointerId === pointerStart.id){ pointerStart = null; pointerDragged = false; }
});
renderer.domElement.addEventListener('click', e => {
  const былоПеретаскивание = pointerDragged;
  pointerStart = null;
  pointerDragged = false;
  if(былоПеретаскивание) return;
  if(state.launching || state.closing) return;
  if(state.openId){
    // миниатюра в углу: нажатие по другому слою открывает его контент
    ptr.set((e.clientX/innerWidth)*2 - 1, -(e.clientY/innerHeight)*2 + 1);
    raycaster.setFromCamera(ptr, camera);
    const hit = raycaster.intersectObjects(pickMeshes, false)[0];
    const zoneId = hit ? hit.object.userData.zone : null;
    const subIndex = hit ? hit.object.userData.sub ?? null : null;
    if(zoneId === 'plast' && subIndex === 0) return;   // ГГДМ не открывает контент
    if(zoneId){
      if(zoneId === 'plast'){ panelState.zone = 'plast'; panelState.sub = subIndex; }
      if(zoneId !== state.openId) switchProject(zoneId);
      else if(zoneId === 'plast' && subIndex !== null) openProject('plast');
    }
    return;
  }
  if(state.hover){
    if(state.hover === 'plast' && state.hoverSub === 0) return;   // ГГДМ остаётся только визуальным слоем
    if(state.hover === 'plast') panelState.sub = state.hoverSub;
    launchProject(state.hover);
  }
  else if(state.locked){ state.locked = null; refresh(); }
});
addEventListener('keydown', e => { if(e.key === 'Escape'){
  if(state.launching){ cancelLaunch(); return; }
  if(state.openId){ closeProject(); return; }
  if(state.closing) return;   // закрытие короткое и необратимое — дожидаемся, а не прерываем на середине
  state.locked = null; state.hover = null; refresh();
} });
/* Слайд стоит в рамке подводки (demo_with_map.html, вход на финал): после клика по модели
   фокус остаётся в рамке, и нажатия «дальше/назад» ушли бы в пустоту — пробрасываем их
   родителю сообщением, как это делает этап тиражирования. */
if (new URLSearchParams(location.search).get('в_рамке') === '1') addEventListener('keydown', e => {
  const c = e.code;
  if (c === 'ArrowRight' || c === 'Enter' || c === 'NumpadEnter' || c === 'Space' || c === 'PageDown'){ e.preventDefault(); parent.postMessage({ слайд:true, шаг:+1 }, '*'); }
  if (c === 'ArrowLeft' || c === 'Backspace' || c === 'PageUp'){ e.preventDefault(); parent.postMessage({ слайд:true, шаг:-1 }, '*'); }
});

const elStack = document.getElementById('stack');
const elEffectsOverview = document.querySelector('#effects-overview .cols');
/* Три «главных» эффекта программы (23.09, Адиль): цифры и подписи взяты с
   плашки ТОП-12 в финале подводки (см. тиражирование.html) — на первом кадре
   они стоят единожды и не пересобираются от выбора контура. Цвет — циан,
   один язык с заголовком «ABAI» и линией процесса. */
/* 24.09 (Адиль): «326 млрд ₸» перестало быть подписью и стало вторым крупным
   значением — там программе так же важно назвать деньги, как и тонны, а мелким
   шрифтом их из зала не видно. В карточке можно ставить один или несколько
   пунктов; у каждого может быть своя подпись или не быть — «доп. добычи»
   относится только к тоннам, у денег подписи нет. */
/* 25.09 (Адиль, третья волна): два разных набора эффектов на кадре.
   · «Исходное положение» (только что зашли на страницу) — два коротких блока
     охвата: «Топ 12 месторождений» и «Более 90 % добычи».
   · «Возврат из слоя» (после openProject → closeProject) — расширенный
     финальный набор: тот же охват + пара цифр эффекта
     («2 864 тыс. тонн доп. добычи · 326 млрд ₸ — 3–5 % от EBITDA»).
   Пользователь просил проверить «2,68 млн тонн»: в прежней версии было
   «2 864 тыс. тонн» (~2,86 млн т). Оставляем полное «2 864 тыс. тонн»,
   чтобы не разойтись с материалами тиражирования и подводки. */
const ГЛАВНЫЕ_ЭФФЕКТЫ_ИСХОДНЫЕ = [
  [ { v:'Топ 12',     l:'месторождений' } ],
  [ { v:'Более 90 %', l:'добычи' } ],
];
const ГЛАВНЫЕ_ЭФФЕКТЫ_ФИНАЛЬНЫЕ = [
  [ { v:'Топ 12',                        l:'месторождений' },
    { v:'Более 90 %',                    l:'добычи всех активов' } ],
  /* 25.09 (Адиль, поправка): «3–5 % от EBITDA» — тоже крупным шрифтом,
     через дефис после суммы. Собираем всё во второй строке в одно
     крупное значение без мелкой подписи `l` — единая цельная фраза. */
  [ { v:'2 864 тыс. тонн',               l:'дополнительной добычи' },
    { v:'326 млрд ₸ — 3–5 % от EBITDA' } ],
];
let эффектыФиналВид = false;   /* переключается на true после первого возврата из слоя */
function рендерЭффекты(){
  const набор = эффектыФиналВид ? ГЛАВНЫЕ_ЭФФЕКТЫ_ФИНАЛЬНЫЕ : ГЛАВНЫЕ_ЭФФЕКТЫ_ИСХОДНЫЕ;
  elEffectsOverview.textContent = '';
  for(const пункты of набор){
    const col = document.createElement('div');
    col.className = 'effect-col';
    col.style.setProperty('--ec', 'var(--cyan)');
    col.innerHTML = `<div class="items">`
      + пункты.map(п => `<div class="item"><span class="v">${п.v}</span>`
          + (п.l ? `<span class="l">${п.l}</span>` : '')
          + `</div>`).join('')
      + `</div>`;
    elEffectsOverview.appendChild(col);
  }
}
рендерЭффекты();
/* Список слева. При выборе ЦД пласта он раскрывается в шаги, остальные контуры
   уходят — чтобы на экране был один смысловой уровень, а не два сразу. */
let stackBuilt = false;
function buildStack(){
  if(stackBuilt) return;      // список статичен: все шаги видны сразу
  stackBuilt = true;
  for(const id of ORDER){
    const zd = ZONES[id];
    const b = document.createElement('button');
    b.className = 'lay'; b.id = 'lay-'+id;
    b.style.setProperty('--lc', zd.color);
    /* Нумерация наружу: контуры 1–3, шаги внутри — 1.1, 1.2 и так далее.
       На показе докладчик ссылается на шаг голосом, и без номера зал ищет его
       по названию. Номер берём из данных (`no`), а не из позиции в списке:
       порядок кнопок менялся, а нумерация контуров закреплена сценарием. */
    const ном = String(Number(zd.no)) || '';
    b.innerHTML = `<div class="n">${ном}</div><div class="t">${zd.name}</div>`
                + ((zd.subs || []).length ? '<i class="ch"></i>' : '');
    b.addEventListener('mouseenter', () => { state.hover = id; state.hoverSub = null; refresh(); });
    b.addEventListener('mouseleave', () => { state.hover = null; refresh(); });
    /* 25.09 (Адиль): «по левому краю не нужно, чтобы тортик уходил вниз и
       открывалась система, а только раскрытие по пунктам и подсвечивание
       слоя». Клик по контуру фиксирует его как активный (`state.locked`) —
       подсвечивает 3D-плиту и раскрывает список шагов; сам openProject
       (сворачивание стопки в мини + видео справа) запускается только
       непосредственным нажатием на 3D-плиту (см. renderer.click). Если
       слой уже раскрыт (state.openId), клик по списку переключает
       содержимое, как раньше. */
    b.addEventListener('click', () => {
      if(state.launching || state.closing) return;
      if(state.openId){ switchProject(id); return; }
      panelState.zone = id; panelState.sub = null;
      state.locked = (state.locked === id) ? null : id;
      state.hover = null; state.hoverSub = null;
      refresh();
    });
    elStack.appendChild(b);

    // шаги контура — вложенные узлы той же цепочки, в цвете своего контура
    (zd.subs || []).forEach((s, si) => {
      const sb = document.createElement('button');
      sb.className = 'lay step'; sb.id = `lay-step-${id}-${si}`;
      sb.style.setProperty('--lc', s.color || zd.color);
      sb.innerHTML = `<div class="n">${ном}.${si + 1}</div><div class="t">${s.t}</div>`;
      sb.addEventListener('mouseenter', () => { state.hover = id; state.hoverSub = si; refresh(); });
      sb.addEventListener('mouseleave', () => { state.hoverSub = null; refresh(); });
      sb.addEventListener('click', () => {
        if(state.launching || state.closing) return;
        // ГГДМ — нижний слой без ссылки: то же ограничение, что и на клике по
        // самой плите (см. renderer.click ниже: plast + sub 0 → return).
        if(id === 'plast' && si === 0) return;
        if(state.openId){ switchProject(id); return; }
        /* 25.09: клик по шагу не запускает openProject — только подсвечивает
           слой и фиксирует выбранный шаг. Открытие системы — по 3D-плите. */
        panelState.zone = id;
        panelState.sub = si;
        state.locked = id;
        state.hover = null; state.hoverSub = null;
        refresh();
      });
      elStack.appendChild(sb);
    });
  }
}
buildStack();

const $ = s => document.getElementById(s);

/* Ведущая часть формулировки — до двоеточия или первой точки. Формулировки в
   ZONES написаны по схеме «суть: расшифровка», и на экране нужна только суть:
   расшифровку докладчик проговаривает вслух, а панель от неё разрасталась в
   стену текста. Резать механически, а не переписывать: исходные строки целы,
   вернуть полный вид — снять один вызов. */
function главное(текст){
  if(!текст) return '';
  const m = /^(.+?)(?::|\.\s)/.exec(текст);
  return m ? m[1].trim() : текст.replace(/\.$/, '');
}
function showPanel(id){
  const zd = ZONES[id];
  if(panelState.zone !== id){ panelState.zone = id; panelState.sub = null; }
  $('panel').style.setProperty('--pc', zd.color);
  $('p-kick').textContent = 'Из чего строится ЦД Актива';
  $('p-name').textContent = zd.name;
  $('p-claim').textContent = главное(zd.claim);
  $('p-fx').innerHTML = zd.fx.map(f => `<div class="fx"><div class="v">${f.v}</div><div class="l">${f.l}</div></div>`).join('');
  /* Панель намеренно держим короткой. Раньше она несла второй слой пояснений
     под каждым пунктом плюс сноску контура — на экране выходила стена текста,
     которую докладчик всё равно проговаривает вслух. Осталось то, что глазами
     считывают за секунду: название, одна строка сути, модули и эффект.
     Формулировки не тронуты — убрана только их вторая половина. */
  if(zd.subs && panelState.sub !== null){
    // выбран шаг: его название — заголовок, контур остаётся подзаголовком
    const s = zd.subs[panelState.sub];
    const sc = s.color || zd.color;
    $('panel').style.setProperty('--pc', sc);
    $('p-kick').textContent = 'Из чего строится ЦД Актива';
    $('p-name').textContent = s.t;
    $('p-claim').innerHTML = `<span style="color:${sc}">${zd.name}</span>`;
    $('p-h-blocks').textContent = 'Что это';
    $('p-blocks').innerHTML = `<div class="bl"><div class="bi">${главное(s.what)}</div></div>`;
    $('p-mods').innerHTML = s.mods.map(m => `<span class="mod">${m}</span>`).join('');
    $('p-note').textContent = '';
  } else {
    $('p-h-blocks').textContent = 'Что закрывает';
    // только заголовки пунктов: расшифровка под каждым — работа докладчика
    $('p-blocks').innerHTML = zd.blocks.map(b => `<div class="bl"><div class="bt">${b.t}</div></div>`).join('');
    $('p-mods').innerHTML = zd.mods.map(m => `<span class="mod">${m}</span>`).join('');
    $('p-note').textContent = '';
  }
  $('p-h-blocks').style.display = $('p-blocks').innerHTML ? '' : 'none';
  $('panel').classList.add('vis');
}
$('p-close').addEventListener('click', () => {
  if(state.openId){ closeProject(); return; }
  if(state.launching || state.closing) return;
  state.locked = null; state.hover = null; refresh();
});

const chip = $('chip');
function refresh(){
  const a = active();
  const panel = $('panel');
  $('mini-reset').classList.toggle('visible', Boolean(state.openId));
  const replacesStack = Boolean(state.locked || state.openId);
  const isFirstMove = replacesStack && !panel.classList.contains('вместо-стека');
  $('stack').classList.remove('скрыт');
  $('stack').classList.toggle('выбран', replacesStack);
  $('effects-overview').classList.toggle('у-стека', replacesStack);
  if(isFirstMove) panel.classList.remove('vis');
  panel.classList.toggle('вместо-стека', replacesStack);
  // Фиксируем начальную точку слева до .vis, чтобы панель именно встала вверх,
  // а не перепрыгивала мгновенно из правой позиции после hover.
  if(isFirstMove) void panel.offsetWidth;
  for(const id in zones) zones[id].target = (id === a) ? 1 : 0;
  buildStack();
  for(const id of ORDER){
    /* Шаги раскрываются только у выбранного контура. Наведения мало: иначе
       список дёргается высотой под курсором и сам себя выводит из-под него.
       И только пока слой не раскрыт полностью: когда справа стоит содержимое
       системы, слева должны оставаться три пункта (23.09, Адиль), без шагов —
       иначе получается два уровня одновременно, и глаз ищет, куда смотреть. */
    const раскрыт = (state.locked === id);
    const показатьШаги = раскрыт && !state.openId;
    const b = $('lay-'+id);
    if(b){ b.classList.toggle('hot', id === a); b.classList.toggle('open', показатьШаги); }
    const cur = state.locked === id ? panelState.sub : (state.hover === id ? state.hoverSub : null);
    (ZONES[id].subs || []).forEach((_, si) => {
      const sb = $(`lay-step-${id}-${si}`);
      if(!sb) return;
      sb.classList.toggle('show', показатьШаги);
      sb.classList.toggle('hot', a === id && cur === si);
    });
  }
  /* 25.09 (Адиль): «при наведении на слой справа появляется справка по слоям —
     этой штуки не нужно, убери». Панель справа с описанием контура/шага
     больше не открывается ни на hover, ни на выборе — 3D-плита сама
     служит подсказкой, а имя слоя видно в списке слева. Панель оставлена
     в DOM: её используют раскладка стека («вместо-стека») и стили в
     раскрытом слое; невидимая — не мешает. */
  const canShowPanel = false;
  if(canShowPanel) showPanel(a); else panel.classList.remove('vis');
  controls.autoRotateSpeed = ROT_SPEED;
  updateNavLine();
  // список меняет высоту и заново центрируется — уточняем позицию, когда раскладка устоялась
  requestAnimationFrame(updateNavLine);
  requestAnimationFrame(positionEffectsOverview);
  fitBetweenPanels();
}

function positionEffectsOverview(){
  const effects = $('effects-overview');
  if(!effects.classList.contains('у-стека')){
    effects.style.left = '';
    effects.style.top = '';
    effects.style.width = '';
    return;
  }
  const stackRect = elStack.getBoundingClientRect();
  effects.style.left = stackRect.left + 'px';
  effects.style.width = Math.max(stackRect.width, Math.min(560, innerWidth * .3 - 52)) + 'px';
  effects.style.top = Math.max(16, stackRect.top - effects.offsetHeight - 12) + 'px';
}

/* Заливка линии и бегущая точка доходят до текущего узла: видно, что процесс
   идёт от пласта через шаги к следующим контурам, а не набор отдельных кнопок. */
function updateNavLine(){
  const line = $('navline'), fill = $('navfill'), dot = $('navdot');
  if(!line) return;
  const sTop = elStack.getBoundingClientRect().top;
  const lTop = line.getBoundingClientRect().top;
  const btns = [...elStack.querySelectorAll('.lay')];
  const hot = btns.filter(b => b.classList.contains('hot')).pop();
  if(!hot){
    fill.style.height = '0px';
    dot.classList.remove('on');
    btns.forEach(b => b.classList.remove('done'));
    return;
  }
  const centerOf = b => { const r = b.getBoundingClientRect(); return r.top + r.height/2; };
  const y = centerOf(hot);
  line.style.setProperty('--nc', getComputedStyle(hot).getPropertyValue('--lc').trim() || '#F0AE4A');
  const dy = Math.max(0, y - lTop);
  fill.style.height = dy + 'px';
  dot.style.transform = 'translateY(' + dy + 'px)';
  dot.classList.add('on');
  btns.forEach(b => b.classList.toggle('done', centerOf(b) <= y + 1));
}
fitBetweenPanels();

/* ================================================================
   ЦИКЛ
   ================================================================ */
/* На сколько разлетевшиеся составляющие выходят за габарит своего слоя.
   Берём фактические значения прошлого кадра — стек и полосы едут синхронно. */
function subSpread(id){
  const z = zones[id];
  if(!z || !z.subs3d) return { up:0, down:0 };
  let top = -Infinity, bot = Infinity;
  for(const s of z.subs3d){
    const cy = (s.st + s.sb)/2, hh = (s.st - s.sb)/2 * (s.scl || 1);
    top = Math.max(top, cy + hh + s.off);
    bot = Math.min(bot, cy - hh + s.off);
  }
  return { up: Math.max(0, (top - z.yt) * 1.06), down: Math.max(0, (z.yb - bot) * 1.06) };
}

/* Подписи точек бурения. Считаем экранные координаты сами — так не нужен ещё
   один модуль three, а текст остаётся обычным HTML: чёткий и переводимый. */
const elTeo = document.getElementById('teo');
const подписиТЭО = [];   // те метки, у которых есть плашка; остальные столбы немые

/* Подписаны ровно две скважины из восьми: по одной из каждой полосы высот —
   горизонтальная и наклонно-направленная. Восемь подписей превращали стопку в
   таблицу, висящую над моделью, и сама раздвижка слоёв за ними терялась; две
   подписи читаются как сравнение двух решений — ради него слой и показывают.
   Остальные шесть столбов остаются без плашек: ранг виден высотой, тип ствола —
   заворотом и цветом.

   ВЫБОР — ПО БЛИЗОСТИ К ЦЕНТРУ ФУТПРИНТА, а не по отдаче. Модель вращается, и
   столб с краю на половине оборота уезжает за обрез стопки, утаскивая подпись
   за собой; центральные видны с любого ракурса. Поэтому подписанная наклонно-
   направленная — из середины фонда, а не лучшая по деньгам. На высказывании
   слоя это не сказывается: сравниваются полосы, а не две конкретные скважины.

   РАЗВЕДЕНИЕ ПЛАШЕК. Двух мер хватает, чтобы они не сходились ни на одном
   ракурсе: столбы стоят в разных полосах высот, то есть плашки заведомо на
   разной высоте экрана, и растут они в разные стороны — верхняя вправо от
   своего столба, нижняя влево. Экранных проверок на пересечение не делаем:
   геометрия уже разводит, а дёргающаяся от кадра к кадру подпись хуже.

   ДЕНЬГИ. В НРС ЭМГ есть графа «прибыль/убыток», дисконтированного NPV там нет,
   поэтому в подписи стоит прибыль — так она и называется. Подставят расчёт ЦРНС
   с настоящим NPV — менять здесь только заголовок строки и источник числа. */
const вМесяц = с => {
  const год = +String(с).replace(/[^\d]/g, '');
  return Math.round(год / 12).toLocaleString('ru-RU');
};
// слой собирается асинхронно, поэтому подписи заводим при первом показе
function создатьМеткиТЭО(){
  const кЦентру = (a, b) =>
    Math.hypot(a.точка.x, a.точка.z) - Math.hypot(b.точка.x, b.точка.z);
  const центральная = горизонтальная => меткиТЭО
    .filter(м => (м.точка.гориз !== undefined) === горизонтальная)
    .sort(кЦентру)[0];

  for(const [м, тип, бок] of [[центральная(true),  'горизонтальная',        ''],
                              [центральная(false), 'наклонно-направленная', ' влево']]){
    if(!м) continue;
    const d = document.createElement('div');
    d.className = 'tm' + бок;
    /* Номер и тип идут цветом своего ствола: зелёным у горизонтальной, красным
       у наклонно-направленной. Плашка тогда сама говорит, к какому столбу она
       относится, и на плотной стопке её не нужно связывать глазами. */
    d.style.setProperty('--ств', м.точка.гориз !== undefined ? '#2FBF5B' : '#F03A2E');
    d.innerHTML = `<div class="no">${м.точка.N} · ${тип}</div>`
      + `<div class="ec">добыча ≈ <b>${вМесяц(м.точка.добыча)}</b> т/мес</div>`
      + `<div class="ec">прибыль ≈ <b>${вМесяц(м.точка.прибыль)}</b> млн ₸/мес</div>`;
    elTeo.appendChild(d);
    м.div = d;
    подписиТЭО.push(м);
  }
}
const elNaz = document.getElementById('naz-lbl');
/* Наведение на слой наземки без выбранного шага: оцифровываются только станки
   и трубопровод, плиты промысла остаются физическими. Докладчик подводит курсор
   и сразу видит, что именно тут взято в двойник, — вместо того чтобы получить
   всю плиту в сетке, а это уже отдельный шаг рассказа. Подписи на наведении не
   выходят: они принадлежат шагам и всплывают по нажатию, как раньше. */
const ТРУБЫ_НА_НАВЕДЕНИИ = 0.85;      // доля от полной яркости на предпросмотре
/* Труба выглядит одинаково и на наведении, и на шаге: тёмный корпус с
   бегущими янтарными сгустками. Пробовал на наведении вести её цифровым
   фиолетовым и без потока — читалось хуже: труба без нефти перестаёт быть
   трубой, а становится просто ещё одной подсвеченной линией. */
const ТРУБА_КОРПУС = '#1A1006';

/* Акценты наземки: на первом шаге обводим резервуарный парк с трубопроводом,
   на втором — фонд скважин. Показываем только выбранный набор. */
function обновитьАкцентыНаземки(k, t){
  const z = zones.naz;
  if(!z || !z.акценты) return;
  const выбран = state.locked === 'naz' ? panelState.sub
               : (state.hover === 'naz' ? state.hoverSub : null);
  const наведёнСлой = state.locked !== 'naz' && state.hover === 'naz' && state.hoverSub == null;
  const ключи = ['инфра', 'добыча'];
  let активный = null;
  ключи.forEach((ключ, i) => {
    const н = z.акценты[ключ];
    const надо = (выбран === i) ? 1 : 0;
    н.вид = (н.вид === undefined ? 0 : н.вид) + (надо - (н.вид === undefined ? 0 : н.вид))*k;
    const виден = н.вид > 0.02;
    for(const у of н.узлы) у.visible = виден;
    for(const м of н.маты) м.opacity = н.вид * (0.55 + 0.45*Math.abs(Math.sin(t*2.2)));
    if(надо) активный = н;
  });

  /* Трубопровод: сгустки бегут сдвигом текстуры — скорость общая для всех
     сегментов, направление от устьев к резервуарному парку. Уровень свой:
     полный на шаге «Резервуарный парк и трубопровод», приглушённый на голом
     наведении на слой. */
  if(z.труба){
    const шаг = (выбран === 0);
    const надо = шаг ? 1 : (наведёнСлой ? ТРУБЫ_НА_НАВЕДЕНИИ : 0);
    z.трубыВид = (z.трубыВид === undefined ? 0 : z.трубыВид)
               + (надо - (z.трубыВид === undefined ? 0 : z.трубыВид))*k;
    const в = z.трубыВид;
    const виден = в > 0.02;
    for(const у of z.труба.узлы) у.visible = виден;
    z.труба.корпусМат.color.set(ТРУБА_КОРПУС);
    z.труба.корпусМат.opacity = в * 0.85;
    for(const м of z.труба.потокМаты) м.opacity = в;
    for(const тек of z.труба.тексты) тек.offset.x = -(t * 2.2) % 1;
    /* Приглушение оцифровки слоя вешаем только на выбранный шаг: там сетка
       обязана уступить потоку. На наведении глушить нечего — слой и так не
       оцифрован, а станки, наоборот, должны гореть в полную силу. */
    z.глушь = 1 - ((выбран === 0) ? в : 0) * 0.72;
  }

  elNaz.classList.toggle('on', !!активный && !state.openId);
  if(!активный || state.openId) return;
  elNaz.textContent = активный.подпись;
  активный.якорь.getWorldPosition(_вект);
  _вект.project(camera);
  if(_вект.z > 1){ elNaz.classList.remove('on'); return; }
  elNaz.style.left = ((_вект.x * 0.5 + 0.5) * innerWidth) + 'px';
  elNaz.style.top  = ((-_вект.y * 0.5 + 0.5) * innerHeight) + 'px';
}

const elDrill = document.getElementById('drill');
const elПроходка = elDrill.querySelector('.m');
const elГориз = document.getElementById('horiz');
const _вект = new THREE.Vector3();

/* Проходка. Растёт только пока слой раскрыт: за спиной у докладчика счётчик
   иначе убежал бы в тысячи метров, и вернувшись на слой он увидел бы чушь.
   Скорость взята показной, а не промысловой: при честных 20–30 м/ч цифра на
   глаз стоит на месте, и «бурение идёт» перестаёт читаться. */
let проходка = 1184.0, тикБурения = 0;

// подпись бурящейся скважины ходит за её забоем
function обновитьБурение(){
  const б = zones.skv && zones.skv.бурение;
  // по mixH, а не по mix: подпись обязана выходить вместе с самим долотом,
  // то есть уже на наведении, а не только после нажатия
  // при открытом контенте стопка — миниатюра в углу, подпись к ней великовата и вылезала за край
  const видно = б && !state.openId && ((zones.skv.mixH || 0) > 0.35);
  elDrill.classList.toggle('on', !!видно);
  if(!видно){ тикБурения = 0; return; }

  const сейчас = performance.now();
  // шаг ограничиваем: вкладка была в фоне — не засчитываем весь простой
  if(тикБурения) проходка += Math.min(0.25, (сейчас - тикБурения)/1000) * 0.05;
  тикБурения = сейчас;
  elПроходка.textContent = проходка.toFixed(1).replace('.', ',') + ' м';

  б.якорь.getWorldPosition(_вект);
  _вект.project(camera);
  if(_вект.z > 1){ elDrill.classList.remove('on'); return; }
  elDrill.style.left = ((_вект.x * 0.5 + 0.5) * innerWidth) + 'px';
  elDrill.style.top  = ((-_вект.y * 0.5 + 0.5) * innerHeight) + 'px';
}

// подпись горизонтального ствола — у носка лежачей части
function обновитьГоризонт(){
  const г = zones.skv && zones.skv.горизонт;
  const видно = г && !state.openId && ((zones.skv.mixH || 0) > 0.35);
  elГориз.classList.toggle('on', !!видно);
  if(!видно) return;
  г.якорь.getWorldPosition(_вект);
  _вект.project(camera);
  if(_вект.z > 1){ elГориз.classList.remove('on'); return; }
  elГориз.style.left = ((_вект.x * 0.5 + 0.5) * innerWidth) + 'px';
  elГориз.style.top  = ((-_вект.y * 0.5 + 0.5) * innerHeight) + 'px';
}
function обновитьМеткиТЭО(){
  const показывать = меткиТЭО.length && !state.openId && (
    (state.locked === 'plast' && panelState.sub === 2) ||
    (state.hover === 'plast' && state.hoverSub === 2));
  elTeo.classList.toggle('on', !!показывать);
  if(!показывать) return;
  if(!подписиТЭО.length) создатьМеткиТЭО();
  const W = innerWidth, H = innerHeight;
  const низы = [];
  for(const м of подписиТЭО){
    м.узел.getWorldPosition(_вект);
    _вект.project(camera);
    const за = _вект.z > 1;
    м.div.style.display = за ? 'none' : '';
    if(за){ низы.push(null); continue; }
    низы.push({ м, x:(_вект.x * 0.5 + 0.5) * W, y:(-_вект.y * 0.5 + 0.5) * H });
  }

  /* Развод по высоте. Полосы высот разносят столбы в сцене, но на пологом
     ракурсе разница в мировых координатах съедается проекцией, и плашки всё
     равно сходятся — так и было видно на показе. Поэтому нижнюю дожимаем уже
     в экранных пикселях, и правило одностороннее: она только опускается, и
     ровно до порога. Двустороннее «разойтись друг от друга» дало бы дрожь —
     на каждом кадре обе плашки прыгали бы вокруг границы. */
  const ЗАЗОР = 66;
  const [верхняя, нижняя] = низы;          // порядок задан в `создатьМеткиТЭО`
  if(верхняя && нижняя && нижняя.y - верхняя.y < ЗАЗОР) нижняя.y = верхняя.y + ЗАЗОР;

  for(const п of низы){
    if(!п) continue;
    п.м.div.style.left = п.x + 'px';
    п.м.div.style.top  = п.y + 'px';
  }
}

const clock = new THREE.Clock();

/* Спящий режим для встроенного показа.

   demo_with_map.html держит слайд в скрытом iframe всю подводку, чтобы к финалу
   сцена была готова. Но скрытый — не значит бесплатный: кадровый цикл крутится
   на полной частоте и на каждом кадре стреляет лучом по геометрии, и лента
   поверх начинает заикаться.

   Пока родитель не сказал «показываю», рендерим редко — только чтобы кадр
   появился по мере подгрузки моделей — и не трассируем вовсе. */
const ВСТРОЕН = window.self !== window.top;
let живой = !ВСТРОЕН, последнийСон = 0;
addEventListener('message', e => {
  if(e.data !== 'слайд:показать') return;
  живой = true;
  // в скрытом iframe плотность могла определиться неверно — пересматриваем
  подогнатьПлотность();
  renderer.setSize(innerWidth, innerHeight);
});

function animate(){
  requestAnimationFrame(animate);

  if(!живой){
    const now = performance.now();
    if(now - последнийСон < 250) return;
    последнийСон = now;
    clock.getDelta();                 // не копим дельту к пробуждению
    controls.update();
    renderer.render(scene, camera);
    return;
  }

  const dt = Math.min(clock.getDelta(), 0.1);
  const t = clock.elapsedTime;
  const k = 1 - Math.exp(-dt*8);

  // В новой наземной GLB три станка и их PumpCycle уже собраны автором модели.
  // Миксер двигает исходные узлы; вложенный wireframe повторяет движение.
  if(zones.naz && zones.naz.mixer) zones.naz.mixer.update(dt);

  let hitZone = null, hitSub = null;
  /* Пока ничего не нажато, раскладка сама реагирует на наведение (лёгкая
     раздвижка) — трассировка по живым хитбоксам в этом режиме гонялась бы
     сама за собой (см. комментарий у restPickMeshes). Нажатый слой раскладку
     наведением не двигает, поэтому там живые хитбоксы безопасны и точнее. */
  const пикМеши = state.locked ? pickMeshes : restPickMeshes;
  if(Math.abs(ptr.x) <= 1 && Math.abs(ptr.y) <= 1 && пикМеши.length){
    raycaster.setFromCamera(ptr, camera);
    const hits = raycaster.intersectObjects(пикМеши, false);
    if(hits.length){
      hitZone = hits[0].object.userData.zone;
      hitSub = hits[0].object.userData.sub ?? null;
    }
  }
  /* `заморожен` ставит только служебный вход `?наведение=1`: мыши там нет,
     трассировка каждый кадр не находит ничего и сбрасывала бы выставленное
     наведение обратно в ноль. На показе флаг не поднимается никогда. */
  if(!state.заморожен && !state.launching && !state.closing && (hitZone !== state.hover || hitSub !== state.hoverSub)){
    const overUI = document.querySelector('#stack:hover, #panel:hover, #project-content:hover');
    if(overUI){
      if(state.openId && state.hover !== null){ state.hover = null; state.hoverSub = null; refresh(); }
    } else {
      state.hover = hitZone; state.hoverSub = hitSub; refresh();
    }
  }
  const isDisabledGgdm = hitZone === 'plast' && hitSub === 0;
  const canClick = hitZone && !isDisabledGgdm && (
    !state.openId || hitZone !== state.openId || (hitZone === 'plast' && hitSub !== null)
  );
  renderer.domElement.style.cursor = canClick ? 'pointer' : '';

  if(canClick && state.openId){
    // при открытом контенте подсказка — только название слоя под курсором
    chip.style.display = 'block';
    chip.style.left = (mouseXY[0]+16)+'px';
    chip.style.top = (mouseXY[1]+14)+'px';
    chip.style.setProperty('--cc', ZONES[hitZone].color);
    chip.textContent = ZONES[hitZone].short;
  } else if(hitZone && !state.locked){
    chip.style.display = 'block';
    chip.style.left = (mouseXY[0]+16)+'px';
    chip.style.top = (mouseXY[1]+14)+'px';
    if(hitZone === 'plast' && hitSub !== null){
      const s = ZONES.plast.subs[hitSub];
      chip.style.setProperty('--cc', s.color || ZONES.plast.color);
      chip.textContent = s.shortT;
    } else {
      chip.style.setProperty('--cc', ZONES[hitZone].color);
      chip.textContent = ZONES[hitZone].short;
    }
  } else chip.style.display = 'none';

  // стек финальных позиций — слои не перекрываются при любом выборе
  const act = active();
  const VIEW_Y = 0;   // локальный центр (world уже смещён к цели камеры)
  const offsets = { grr:0, plast:0, skv:0, naz:0 };
  /* В исходном состоянии три основных 3D-слоя всегда разнесены по вертикали.
     После выбора они собираются в компактную миниатюру слева. */
  if(!act && pickMeshes.length){
    const GAP = 24;
    let total = GAP * (RANK_UP.length - 1);
    for(const id of RANK_UP) total += (zones[id].yt - zones[id].yb) * 1.06;
    let bot = VIEW_Y - total/2;
    for(const id of RANK_UP){
      const z = zones[id], h = (z.yt - z.yb) * 1.06, c = bot + h/2;
      offsets[id] = c - (z.yb + z.yt)/2;
      bot = c + h/2 + GAP;
    }
  }
  if(state.openId && pickMeshes.length){
    const BASE_GAP = 22;
    const HOVER_GAP = 48;
    const miniHoverId = state.hover;
    const gapAfter = index => {
      const current = RANK_UP[index], next = RANK_UP[index + 1];
      return miniHoverId && (current === miniHoverId || next === miniHoverId) ? HOVER_GAP : BASE_GAP;
    };
    let total = 0;
    for(const id of RANK_UP) total += (zones[id].yt - zones[id].yb) * MINI_SCALE;
    for(let i = 0; i < RANK_UP.length - 1; i++) total += gapAfter(i);
    let bot = VIEW_Y - total/2;
    for(let i = 0; i < RANK_UP.length; i++){
      const id = RANK_UP[i];
      const z = zones[id];
      const h = (z.yt - z.yb) * MINI_SCALE;
      const c = bot + h/2;
      offsets[id] = c - (z.yb + z.yt)/2 * MINI_SCALE;
      bot = c + h/2 + (i < RANK_UP.length - 1 ? gapAfter(i) : 0);
    }
  }
  if(act && pickMeshes.length && !state.openId){
    const locked = !!state.locked;
    const GAP = locked ? 34 : 14;
    const za = zones[act];
    const cA = (za.yb + za.yt)/2;
    const anchor = locked ? VIEW_Y : cA;
    offsets[act] = anchor - cA;
    const ai = RANK_UP.indexOf(act);
    // разлетевшиеся составляющие пласта выходят за габарит слоя — соседние контуры
    // должны отступить на эту же величину, иначе верхняя полоса въедет в ЦД скважины
    const spread = subSpread(act);
    let topEdge = anchor + (za.yt - za.yb)/2 * 1.06 + spread.up;
    for(let i = ai+1; i < RANK_UP.length; i++){
      const z = zones[RANK_UP[i]], h = z.yt - z.yb;
      const c = topEdge + GAP + h/2;
      offsets[RANK_UP[i]] = c - (z.yb + z.yt)/2;
      topEdge = c + h/2;
    }
    let botEdge = anchor - (za.yt - za.yb)/2 * 1.06 - spread.down;
    for(let i = ai-1; i >= 0; i--){
      const z = zones[RANK_UP[i]], h = z.yt - z.yb;
      const c = botEdge - GAP - h/2;
      offsets[RANK_UP[i]] = c - (z.yb + z.yt)/2;
      botEdge = c - h/2;
    }
  }

  const pulse = 0.72 + 0.28*Math.sin(t*3.1);
  // мс с момента второго клика — общий таймер на раздвижку соседей и вспышку выбранного
  const launchElapsed = state.launching ? performance.now() - state.launchAt : 0;
  // прогресс перелёта стопки в угол и обратно (0..1) и сдвиг миниатюры — один на все слои
  const transitionProgress = (state.openId || state.closing) ? Math.min(1, (performance.now() - state.переходАт)/MINI_TRANSITION_MS) : 1;
  const easedTransition = плавно(transitionProgress);
  if(state.openId) getMiniStackOffset(_miniOffset);
  for(const id in zones){
    const z = zones[id];

    /* Пока контент раскрыт, вся стопка — миниатюра в левом нижнем углу: три слоя
       остаются вместе, одним куском, и никуда не исчезают — по ним можно нажать,
       чтобы открыть контент другого слоя. Сам перелёт (туда и обратно) идёт по
       времени с плавным стартом, см. запомнитьОткуда; после него значения просто
       держатся тем же лерпом, что и остальное. КУДА лететь — считаем каждый кадр
       (getMiniStackOffset, offsets выше), а откуда — z.от: слой мог быть и в покое, и на
       наведении, и посреди прошлого перелёта.

       Прежняя раскладка раскрытия (соседи уезжают в угол и сжимаются в точку,
       выбранная плита разворачивается лицом и растёт) осталась только под
       state.launching, который сейчас никто не включает: открытие идёт с одного
       клика сразу в openProject. Отдельной анимации «плита на весь кадр» нет —
       контент раскрывается справа. */
    const далеко = дальностьОтСтопки(id, state.launching);
    const рангСвой = RANK_UP.indexOf(id);
    let ушёл = false;
    if(state.launching && id !== state.launching){
      ушёл = launchElapsed > ВОЗВРАТ_МС + далеко*СТУПЕНЬ_МС;
    }
    if(z.offsetYExit === undefined){ z.offsetYExit = 0; z.offsetZ = 0; z.tilt = 0; z.exitScale = 1; }
    const isMini = state.openId !== null;
    const tL = ушёл ? 0 : offsets[id];
    const tX = isMini ? _miniOffset.x : ушёл ? -УХОД_ВЛЕВО - рангСвой*ШАГ_УХОДА_X : 0;
    const tY = isMini ? _miniOffset.y : ушёл ? -УХОД_ВНИЗ - рангСвой*ШАГ_УХОДА_Y : 0;
    const tZ = isMini ? _miniOffset.z : 0;
    const tS = isMini ? MINI_SCALE : ушёл ? 0 : 1;
    /* 25.09 (Адиль, третья волна по пирогу): «стоял ровно снизу без наклона,
       как квадрат или куб, и чтобы могли кликать на слои». Вернул компенсацию
       yaw к азимуту камеры — плиты всегда обращены к экрану фронтом, а не
       под углом. Дополнительно (см. ниже) в мини-режиме сжимаем полярный
       угол камеры к ~50° (изометрия) — за счёт этого стопка читается как
       ровный куб слоёв, а не «наклонный тортик». */
    const targetMiniYaw = isMini ? camAzimuth() : 0;
    if(z.miniYaw === undefined) z.miniYaw = 0;
    if(transitionProgress < 1 && z.от){
      z.offset = z.от.offset + (tL - z.от.offset)*easedTransition;
      z.offsetX = z.от.x + (tX - z.от.x)*easedTransition;
      z.offsetYExit = z.от.y + (tY - z.от.y)*easedTransition;
      z.offsetZ = z.от.z + (tZ - z.от.z)*easedTransition;
      z.exitScale = z.от.s + (tS - z.от.s)*easedTransition;
      z.miniYaw = z.от.yaw + углаРазница(z.от.yaw, targetMiniYaw)*easedTransition;
    } else {
      z.offset += (tL - z.offset)*k;
      z.offsetX += (tX - z.offsetX)*k;
      z.offsetYExit += (tY - z.offsetYExit)*k;
      z.offsetZ += (tZ - z.offsetZ)*k;
      z.exitScale += (tS - z.exitScale)*k;
      z.miniYaw += углаРазница(z.miniYaw, targetMiniYaw)*k;
    }
    z.targetTilt = ушёл ? ОТЪЕЗД_НАКЛОН : 0;
    z.tilt += (z.targetTilt - z.tilt)*k;
    z.scaleG.position.set(z.offsetX, z.offset + z.offsetYExit, z.offsetZ);
    /* Хитбокс живёт в мире, а не в группе слоя (см. build), и сам масштаба и
       сдвига группы не наследует — повторяем их руками, иначе по миниатюре
       нельзя было бы попасть: луч искал бы слой там, где он стоял раньше. */
    const sГ = Math.max(z.exitScale, 0.001);
    if(z.hit){
      z.hit.position.set(z.offsetX, (z.yb+z.yt)/2*sГ + z.offset + z.offsetYExit, z.offsetZ);
      z.hit.scale.setScalar(sГ);
      z.hit.rotation.y = z.miniYaw;
    }
    /* Доворот лицом к экрану — только у самого выбранного слоя, вокруг ОСЬ_ЛИЦОМ,
       и только после ПОВОРОТ_МС: пока соседи ещё в кадре, доворот плиты вместе
       с их уходом читался бы кашей, а не жестом «встречает лицом». Пока слой
       раскрыт (state.openId) — доворот безусловный, держится сам. Крен уходящих
       соседей — вокруг ОСЬ_КРЕНА (мировой Z). Оба считаются от своих независимых
       значений и собираются в один кватернион, а не через object.rotation.z += ...:
       два поворота вокруг разных осей через Euler XYZ друг на друга наслаивались
       бы неверно (порядок осей и то, что у объекта в любой момент реально
       накапливается только один из двух). */
    const раскрыт = state.launching === id && launchElapsed > ПОВОРОТ_МС;
    z.targetFaceTilt = раскрыт ? ЛИЦОМ_НАКЛОН : 0;
    z.faceTilt = state.openId ? 0
      : (z.faceTilt === undefined ? 0 : z.faceTilt) + (z.targetFaceTilt - (z.faceTilt === undefined ? 0 : z.faceTilt))*k;
    const qЛицо = z.faceTilt > 0.0004
      ? new THREE.Quaternion().setFromAxisAngle(ОСЬ_ЛИЦОМ, z.faceTilt) : null;
    const qКрен = z.tilt > 0.0004
      ? new THREE.Quaternion().setFromAxisAngle(ОСЬ_КРЕНА, z.tilt) : null;
    const miniFacing = Math.abs(z.miniYaw) > 0.0004
      ? new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), z.miniYaw)
      : null;
    z.scaleG.quaternion.identity();
    if(miniFacing) z.scaleG.quaternion.premultiply(miniFacing);
    if(qЛицо) z.scaleG.quaternion.premultiply(qЛицо);
    if(qКрен) z.scaleG.quaternion.premultiply(qКрен);
    // Вспышка — сразу с клика, не дожидаясь ухода соседей: мгновенное подтверждение выбора.
    const вспышка = (state.launching === id)
      ? Math.sin(Math.min(1, launchElapsed/ВСПЫШКА_МС) * Math.PI)
      : 0;
    z.launchFlash = вспышка * 0.09;
    /* Раскрытие масштаба — тем же тактом, что и поворот лицом: слой не просто
       разворачивается, а ещё и заметно растёт, как будто раскрывается на весь
       кадр. Вспышка — короткий щелчок-подтверждение в момент клика, это —
       плавный, растянутый рост следом за поворотом; разные по характеру,
       поэтому и не одно и то же значение. */
    z.targetLaunchGrow = раскрыт ? ОТКРЫТИЕ_МАСШТАБ : 0;
    z.launchGrow = state.openId ? 0
      : (z.launchGrow === undefined ? 0 : z.launchGrow) + (z.targetLaunchGrow - (z.launchGrow === undefined ? 0 : z.launchGrow))*k;

    /* Оцифровка идёт только по нажатию. Наведение раньше тоже запускало
       голограмму, и от беглого движения мышью слайд мерцал; теперь на наведение
       остаётся только выделение и лёгкая раздвижка. */
    // В миниатюре выбранный слой остаётся holo box,
    // остальные слои показываются в обычном физическом виде.
    z.target  = state.openId ? (id === state.openId ? 1 : 0) : (id === state.locked ? 1 : 0);
    z.targetH = state.openId ? (id === state.hover ? 1 : 0) : (id === act ? 1 : 0);
    z.mix += (z.target - z.mix)*k;
    z.mixH = state.openId && !state.hover
      ? 0
      : (z.mixH === undefined ? 0 : z.mixH) + (z.targetH - (z.mixH === undefined ? 0 : z.mixH))*k;
    const m = z.mix;
    /* Стволы и долота живут не по оцифровке, а по наведению: `mixH` поднимается
       и на курсоре, и на нажатии, тогда как `m` — только на нажатии. Раньше
       наведение на слой скважины не показывало ничего, и докладчику приходилось
       нажимать, чтобы просто указать на бурение; при этом весь слой уходил в
       голограмму, а это отдельный шаг рассказа. */
    const mh = z.mixH;
    // глушь < 1, пока активен акцент трубопровода: сетка уступает потоку
    const глушь = z.глушь === undefined ? 1 : z.глушь;
    for(const pm of z.physMats) pm.opacity = 1 - m*0.9;
    for(const wm of z.wireMats) wm.opacity = 0.5*m*pulse*глушь;
    for(const p of z.holo){
      p.fill.material.opacity = 0.28*m;
      p.grid.material.opacity = 0.6*m*pulse;
      p.grid.material.map.offset.x = ((p.grid.material.map.offset.x - dt*0.05*m) % 1 + 1) % 1;   // обёрнута — не копим float
      p.edge.material.opacity = 0.9*m;
      if(p.corners) p.corners.material.opacity = m;
    }
    // стволы скважин: не гаснут со слоем, а загораются фиолетовым
    if(z.wellMats) for(const wm of z.wellMats){
      wm.opacity = mh * 0.85;
      wm.emissiveIntensity = mh * (2.2 + 0.8*Math.sin(t*3.4));
    }
    /* Долота на забоях: крутятся и поднимают шлам, пока слой скважины раскрыт.
       Их два — вертикальное в центре и второе на конце горизонтали. Второе
       живёт по тем же правилам, только развёрнуто по ходу ствола, и шлам у
       него уходит назад к устью, а не вверх. */
    if(z.бурение || z.бурениеГ){
      if(z.бурМаты) for(const мат of z.бурМаты) мат.opacity = mh * 0.7;   // обсадка без фиолета
      for(const б of [z.бурение, z.бурениеГ]){
        if(!б) continue;
        for(const мат of б.маты) мат.opacity = mh;
        б.вращ.rotation.y = t * 2.6;
        const P = б.пыль, attr = P.гео.attributes.position;
        for(let i=0;i<P.n;i++) attr.setY(i, (P.seed[i] + t*7) % P.H);
        attr.needsUpdate = true;
        P.мат.opacity = mh * 0.6;
      }
    }
    // подслои пласта: свой цвет, лёгкое разделение, клипы следуют за слоем и масштабом
    if(z.subs3d){
      const plastActive = state.openId ? state.hover === 'plast' : act === 'plast';
      const aSub = state.openId
        ? (state.hover === 'plast' ? state.hoverSub : null)
        : (state.locked === 'plast' ? panelState.sub : (state.hover === 'plast' ? state.hoverSub : null));
      // столбы ранжирования выходят вместе со слоем оценки
      if(z.столбы){
        const вид = (aSub === 2 && !state.openId) ? 1 : 0;   // столбы ранжирования без подписей (см. обновитьМеткиТЭО) в миниатюре — просто палки
        z.видСтолбов = (z.видСтолбов === undefined ? 0 : z.видСтолбов) + (вид - (z.видСтолбов === undefined ? 0 : z.видСтолбов))*k;
        // погашенные столбы убираем из рендера целиком — иначе они всё равно
        // участвуют в проходе прозрачности и мажут соседние слои
        const виден = z.видСтолбов > 0.02;
        for(const узел of z.узлыСтолбов) узел.visible = виден;
        if(виден) for(const мат of z.столбы){
          const сквозной = (мат.depthTest === false);   // бледный дубль, идущий внутри породы
          мат.opacity = (сквозной ? 0.58 : 0.95) * z.видСтолбов;
          if(!сквозной) мат.emissiveIntensity = 0.45 + 0.3*Math.sin(t*3);
        }
      }
      const sc2 = 1 + 0.05*m;
      z.subs3d.forEach((s, si) => {
        // раздвижка: базовая при выборе пласта; при выборе конкретной составляющей
        // она встаёт в центр слоя, соседние разъезжаются заметно дальше
        let tOff = 0;
        if(plastActive){
          const base = (si === 0 ? -8 : si === 2 ? 8 : 0);   // si: 0 — нижняя, 2 — верхняя
          if(aSub === null) tOff = base;
          else if(si === aSub) tOff = base;                  // выбранная остаётся на месте
          else tOff = base + (si < aSub ? -1 : 1) * 34 * Math.abs(si - aSub);   // соседние уезжают
        }
        s.off += (tOff - s.off)*k;
        /* Любая наведённая составляющая, включая ТЭО, становится крупнее соседних. */
        const tScale = !plastActive || aSub === null ? 1 : (aSub === si ? 1.22 : 0.93);
        s.scl = (s.scl === undefined) ? 1 : s.scl + (tScale - s.scl)*k;
        const cy = (s.st + s.sb)/2;
        s.wrap.scale.set(s.scl, s.scl, s.scl);
        s.wrap.position.y = s.off + cy*(1 - s.scl);
        const tMix = plastActive ? ((aSub === null || aSub === si) ? 1 : 0.4) : 0;
        s.mix += (tMix - s.mix)*k;
        const sm = s.mix;
        // текстуры составляющих (сетка ГГДМ, карта заводнения, цели бурения) — сами контент:
        // гасим мягко, wireframe и рамка работают акцентом
        /* Карта на верхней грани — сам контент составляющей. У стратегии
           разработки она главное, что надо разглядеть, поэтому голограмму там
           приглушаем сильнее остальных. */
        const голо = (si === 1) ? 0.32 : 1;
        for(const pm of s.physMats) pm.opacity = 1 - sm*(si === 1 ? 0.18 : 0.45);
        for(const wm of s.wireMats) wm.opacity = 0.32*sm*pulse*голо;
        s.holo.fill.material.opacity = 0.12*sm*голо;
        s.holo.grid.material.opacity = 0.45*sm*pulse*голо;
        s.holo.grid.material.map.offset.x = ((s.holo.grid.material.map.offset.x - dt*0.05*sm) % 1 + 1) % 1;   // обёрнута — не копим float
        s.holo.edge.material.opacity = 0.9*sm*(si === 1 ? 0.6 : 1);
        if(s.holo.corners) s.holo.corners.material.opacity = sm*голо;
        if(s.clip){
          s.clip[0].constant =  s.st*sc2 + z.offset + s.off*sc2;
          s.clip[1].constant = -(s.sb*sc2 + z.offset + s.off*sc2);
        }
        // подслои пласта — отдельные хитбоксы; та же привязка к сдвигу и масштабу стопки, что у z.hit выше
        s.hit.position.set(z.offsetX, ((s.st+s.sb)/2 + s.off)*sГ + z.offset + z.offsetYExit, z.offsetZ);
        s.hit.scale.setScalar(sГ);
        s.hit.rotation.y = z.miniYaw;
      });
    }
    if(z.particles && m > 0.02){
      const P = z.particles, attr = P.geo.attributes.position, hgt = P.yt - P.yb;
      for(let i=0;i<P.n;i++){
        const y = P.yb + ((P.seed[i*2] + t*P.seed[i*2+1]) % hgt);
        attr.setY(i, y);
      }
      attr.needsUpdate = true;
      P.mat.opacity = 0.85*m;
    } else if(z.particles) z.particles.mat.opacity = 0;
    /* Станки качаются всегда — и в физическом виде, и в цифровом: промысел
       не замирает оттого, что на него посмотрели двойником. Каркасные копии
       лежат в тех же группах и едут следом. */
    /* Каркас станков идёт по наведению, а не только по нажатию: на наведении
       оцифровываются они одни, а плиты промысла остаются физическими — см.
       `обновитьАкцентыНаземки`. Отсюда max, а не m: нажатие поднимает и то и
       другое, наведение — только станки. */
    const мех = Math.max(m, mh);
    if(z.мехФиз) for(const pm of z.мехФиз) pm.opacity = 1 - мех*0.9;
    if(z.мехМат) z.мехМат.opacity = мех * КАЧАЛКИ.яркость * pulse * глушь;
    /* Резервуарный парк идёт по тому же правилу, что станки: оцифровывается на
       наведении, а не только на нажатии. Каркас у него общий с остальным слоем
       по цвету — это тот же объект слоя, просто взятый отдельно. */
    if(z.бакиФиз) for(const pm of z.бакиФиз) pm.opacity = 1 - мех*0.9;
    if(z.бакиКар) for(const wm of z.бакиКар) wm.opacity = 0.5 * мех * pulse * глушь;
    if(z.качалки) for(const к of z.качалки){
      const ф = МЕХ.ф0 + (t + к.сдвиг) * КАЧАЛКИ.ходов/60 * Math.PI*2;
      const п = положениеСтанка(ф);
      к.коромысло.rotation.z = п.б - МЕХ.б0;
      к.кривошип.rotation.z  = ф - МЕХ.ф0;
      к.шатун.position.set(п.cx, п.cy, 0);
      к.шатун.rotation.z = п.г - МЕХ.г0;
    }
    // укрупнение (наведение, вспышка, раскрытие) и сжатие в точку у уходящих соседей (exitScale)
    z.scaleG.scale.setScalar((1 + 0.05*z.mixH + (z.launchFlash||0) + (z.launchGrow||0)) * (z.exitScale === undefined ? 1 : z.exitScale));
  }

  /* Камера на раскрытии слоя — два отдельных, разнесённых по времени хода:

     азимут доворачивается к старту показа сразу, с самого клика, кратчайшим
     путём (см. `углаРазница`) — это первым делом убирает произвол
     автовращения, до этого «налево» у уходящих соседей смотрело бы туда,
     куда камеру занесло автовращением, а не туда, где реально левый край
     кадра (старый баг);
     радиус (наезд к ПРИБЛИЖЕНИЕ от того, что было на клике) трогается только
     после ПОВОРОТ_МС — тем же тактом, что и раскрытие самой плиты (см.
     `z.targetFaceTilt` выше), когда сцена уже расчищена от соседей. Пока слой
     раскрыт (state.openId) — камера держит тот же приближенный радиус.

     При закрытии (state.closing) — симметрично: азимут и так уже на месте
     (closeProject ставит его туда без анимации), а радиус сразу же отъезжает
     к ДЕФОЛТ_РАДИУС — тем же тактом, что и закрытие плиты, безо всякой
     задержки на ПОВОРОТ_МС: закрытие начинается сразу, а не после паузы.

     Наклон (полярный угол) не трогаем нигде — наезд не должен превращаться в
     облёт сверху. Ведём камеру вручную и не отдаём кадр `controls.update()`:
     OrbitControls при enabled:false не даёт новых смещений от пользователя, но
     с демпфированием мог бы доигрывать старый остаток инерции поверх нашего
     же движения. */
  if(state.launching){
    state.camAz += углаРазница(state.camAz, СТАРТ_АЗИМУТ)*k;
    if(launchElapsed > ПОВОРОТ_МС){
      state.camRadius += (state.launchRadius*ПРИБЛИЖЕНИЕ - state.camRadius)*k;
    }
  }
  // при открытом контенте и закрытии камера стоит там, где её застал клик (см. closeProject)
  if(state.launching || state.closing || state.openId){
    /* 25.09 (Адиль, четвёртая волна по пирогу): «мини-тортик должен стоять
       ровно по всем сторонам без каких-либо наклонов, как будто бы в 2D».
       Ставим камеру строго с фронта (polar = π/2): плиты видны сбоку, их
       горизонтальные грани выходят на экране строго горизонтальными линиями
       без сходов «сверху» и «снизу». Компенсация yaw через miniYaw =
       camAzimuth() (см. цикл zones) сохраняет плиты лицом к экрану.
       Пробовал уменьшать fov + увеличивать camRadius для полного
       ortho-подобия, но getMiniStackOffset при этом уводил стопку из
       кадра — отдельная реорганизация, откладываем. */
    if(state.openId){
      const МИНИ_ПОЛЯР = Math.PI * 0.5;
      state.launchPolar += (МИНИ_ПОЛЯР - state.launchPolar)*k;
    }
    const горизР = state.camRadius * Math.sin(state.launchPolar);
    camera.position.set(
      controls.target.x + горизР*Math.sin(state.camAz),
      controls.target.y + state.camRadius*Math.cos(state.launchPolar),
      controls.target.z + горизР*Math.cos(state.camAz)
    );
    camera.lookAt(controls.target);
  } else controls.update();
  // сдвиг окна проекции под коридор между панелями — тем же плавным ходом,
  // что и остальное (см. комментарий у fitBetweenPanels): раньше прыгал
  // разом в кадре, где openProject уже поставил классу .vis, и модель
  // заметно дёргалась ровно в момент появления контента.
  /* Пока идёт перелёт стопки, сдвиг кадра гасится тем же прогрессом, а не
     своим быстрым лерпом: иначе он успевал уйти в первые же 200 мс, и модель
     сперва дёргалась вправо (сдвиг снимался), а уже потом ехала в угол. */
  if(transitionProgress < 1) state.viewShiftX = state.viewShiftОт + (state.viewShiftTargetX - state.viewShiftОт)*easedTransition;
  else state.viewShiftX += (state.viewShiftTargetX - state.viewShiftX)*k;
  if(Math.abs(state.viewShiftX) > 0.4){
    camera.setViewOffset(innerWidth, innerHeight, state.viewShiftX, 0, innerWidth, innerHeight);
  } else {
    camera.clearViewOffset();
  }
  camera.updateProjectionMatrix();
  renderer.render(scene, camera);
  обновитьМеткиТЭО();
  обновитьБурение();
  обновитьГоризонт();
  обновитьАкцентыНаземки(k, t);
}
animate();

/* ── карточка пилотного актива ────────────────────────────────────────
   18.09 (Адиль): «по кнопке должна выходить карточка, но 3D остаётся». Данные —
   те же, что в справке финала подводки (demo_with_map.html, СПРАВКА); первое
   нажатие — паспорт актива, второе — «что уже сделано», третье убирает. Пока
   карточка открыта, панель контура справа не нужна — она бы легла под карточку. */
/* 21.09 (Адиль, фото стенда): не «пилот», а «первый актив» — пилот завершён, Восточный Молдабек
   идёт как первый актив программы ЦД; id кнопки и имена в коде оставлены */
const СПРАВКА = {
  шапка:'Первый актив',
  имя:'м/р «Восточный Молдабек»',
  под:'Атырауская область · АО «Эмбамунайгаз» · в разработке с 1999 года',
  /* 25.09 (Адиль): «36,7 % и 14,8 млн тонн должны подсвечиваться как-то» —
     третье поле строки задаёт CSS-класс (см. #справка .rw.акцент). */
  паспорт:{ шапка:'Справочная информация', строки:[
      ['Остаточные извл. запасы','14,8 млн тонн','акцент'], ['Извлечено','36,7 %','акцент'], ['Обводнённость','88,8 %'],
      ['Фонд добывающих','360 скважин действующих'], ['Фонд нагнетательных','61 скважина действующая'],
      ['Добыча с начала года','310,3 тыс. тонн'] ],
    сноска:'запасы и фонд — на 01.01.2026, НГДУ «Кайнармунайгаз»' },
  /* 23.09 (Адиль): «Выработанность» → «Добыто» — на показе за терминологией
     заказчика; «600 вариантов» вместо «тысяч за минуты» — говорим то число,
     под которым ЦРНС реально считалось на первом активе; строки про КИН и
     МРП добавлены к списку сделанного, а «Внедрение · октябрь 2026» ушло
     на дорожную карту финала подводки — во «что уже сделано» ему не место.
     25.09 (Адиль): «Добыто» → «Извлечено» — так называет заказчик; смысл
     тот же (доля запасов, поднятая на поверхность). */
  сделано:{ шапка:'Что уже сделано', строки:[
      ['ЦИО','ГГДМ переведена из статичной в постоянно действующую'],
      ['Расчёт сценариев','600 вариантов'],
      ['Выявленный потенциал','дополнительно 161 тыс. тонн добычи'],
      ['Оптимизация бурения','6 наклонно-направленных → 2 горизонтальные'],
      /* 25.09 (Адиль, замечание): «КИН до 30 %» и «550 → 700 суток» должны идти
         одним регистром с остальными строками (те же шрифты, та же структура
         «ключ · значение») — раньше они стояли отдельно как подсвеченные
         эффекты, но рядом с общей таблицей визуально выпадали. Класс «эффект»
         снят, стили в CSS обнулены. */
      ['КИН до 30 %','рост коэффициента извлечения нефти'],
      ['550 → 700','увеличение суток межремонтного периода'] ] },
};
let ярусСпр = 0;
(function карточкаПилота(){
  /* 24.09 (Адиль): кнопки «первый актив» больше нет — карточка живёт по
     умолчанию. Раньше при отсутствии кнопки IIFE возвращалась и справка
     вовсе не инициализировалась; теперь достаточно самой панели #справка,
     а обработчик кнопки крепим, только если она вдруг найдётся (в других
     сборках/подводке она осталась). */
  const кн = document.getElementById('pilot'), сп = document.getElementById('справка');
  if(!сп) return;
  function ярус(узел, я){
    узел.textContent = '';
    const ш = document.createElement('div'); ш.className = 'гр'; ш.textContent = я.шапка; узел.appendChild(ш);
    я.строки.forEach(([к, в, класс], i) => {
      const r = document.createElement('div');
      r.className = 'rw' + (класс ? ' ' + класс : '');
      r.style.transitionDelay = (0.08 + i*0.045) + 's';
      const кк = document.createElement('div'); кк.className = 'k'; кк.textContent = к;
      const вв = document.createElement('div'); вв.className = 'v'; вв.textContent = в;
      r.append(кк, вв); узел.appendChild(r);
    });
    if(я.сноска){ const с = document.createElement('div'); с.className = 'src'; с.textContent = я.сноска; узел.appendChild(с); }
  }
  sp_init: {
    сп.querySelector('.hd').textContent = СПРАВКА.шапка;
    сп.querySelector('.nm').textContent = СПРАВКА.имя;
    сп.querySelector('.sub').textContent = СПРАВКА.под;
    ярус(сп.querySelector('.паспорт'), СПРАВКА.паспорт);
    ярус(сп.querySelector('.сделано'), СПРАВКА.сделано);
  }
  function показать(n){
    ярусСпр = Math.max(0, Math.min(2, n));
    сп.classList.toggle('on', ярусСпр > 0);
    сп.querySelector('.паспорт').classList.toggle('on', ярусСпр >= 1);
    сп.querySelector('.сделано').classList.toggle('on', ярусСпр >= 2);
    if(кн) кн.classList.toggle('on', ярусСпр > 0);
    if(ярусСпр > 0){ state.locked = null; state.hover = null; refresh(); }
  }
  /* 25.09 (Адиль): кнопка «Первый актив» вернулась — одно нажатие показывает
     оба яруса паспорт+сделано, повторное убирает. Прежний трёхтактовый
     сценарий (0 → 1 → 2 → 0) с одинарным открытием остаётся под клавишей Esc
     для быстрого сброса. При возврате из слоя справка снова открывается
     сразу двумя ярусами (window.__открытьСправку → показать(2)). */
  if(кн) кн.addEventListener('click', e => {
    e.preventDefault(); e.stopPropagation();
    закрытьЭффекты();
    показать(ярусСпр > 0 ? 0 : 2);
  });
  addEventListener('keydown', e => { if(e.key === 'Escape'){ показать(0); закрытьЭффекты(); } });
  window.__закрытьСправку = () => показать(0);
  window.__открытьСправку = () => показать(2);
  /* `?справка=N` — карточка с N ярусами при загрузке (снимки/deep-link);
     без параметра справка стартует свёрнутой — открывается кнопкой. */
  const н = +(new URLSearchParams(location.search).get('справка') || 0);
  if(н > 0) setTimeout(() => показать(н), 400);
})();

/* ── карточка эффектов ────────────────────────────────────────────────
   Те же цифры, что на панели эффектов подводки (demo_with_map.html, такт «пилот»,
   эффекты) + блок пилота из сценария 18.09; одно нажатие — открыть, второе — убрать. */
const ЭФФЕКТЫ = {
  шапка:'Ожидаемые эффекты по контурам',
  контуры:[
    ['ЦД пласта',   [['−5%','снижение CAPEX']]],
    ['ЦД скважины', [['−3%','сроки вывода на режим']]],
    ['ЦД добычи и наземной инфраструктуры', [['−5%','управляемые потери добычи'],['−3%','CAPEX/OPEX инфраструктуры']]],
    /* 18.09 (Адиль): минимальная задача на В. Молдабек — +161 тыс. т за 5 лет, КИН до 30 %, МРП 550 → 700 */
    ['Первый актив · В. Молдабек', [['+161 тыс. т','дополнительной добычи за 5 лет'],['КИН до 30%','коэффициент извлечения нефти'],['550 → 700','суток межремонтный период']]],
  ],
  итоги:[['окт. 2026','внедрение на первом активе']],
};
let эффектыОткрыты = false;
function закрытьЭффекты(){
  эффектыОткрыты = false;
  const э = document.getElementById('эффекты'), кн = document.getElementById('demo2');
  if(э) э.classList.remove('on'); if(кн) кн.classList.remove('on');
}
(function карточкаЭффектов(){
  const кн = document.getElementById('demo2'), э = document.getElementById('эффекты');
  if(!кн || !э) return;
  э.querySelector('.hd').textContent = ЭФФЕКТЫ.шапка;
  const тело = э.querySelector('.body');
  ЭФФЕКТЫ.контуры.forEach(([имя, строки], i) => {
    const к = document.createElement('div'); к.className = 'ct'; к.style.transitionDelay = (i*0.09 + 0.05).toFixed(2) + 's';
    const н = document.createElement('div'); н.className = 'nm'; н.textContent = имя; к.appendChild(н);
    for(const [знач, подпись] of строки){
      const ф = document.createElement('div'); ф.className = 'fx';
      const v = document.createElement('span'); v.className = 'v'; v.textContent = знач;
      const l = document.createElement('span'); l.className = 'l'; l.textContent = подпись;
      ф.append(v, l); к.appendChild(ф);
    }
    тело.appendChild(к);
  });
  const дорога = э.querySelector('.road');
  ЭФФЕКТЫ.итоги.forEach(([знач, подпись]) => {
    const р = document.createElement('div'); р.className = 'rd';
    const y = document.createElement('div'); y.className = 'y'; y.textContent = знач;
    const d = document.createElement('div'); d.className = 'd'; d.textContent = подпись;
    р.append(y, d); дорога.appendChild(р);
  });
  кн.addEventListener('click', e => {
    e.preventDefault(); e.stopPropagation();
    if(эффектыОткрыты){ закрытьЭффекты(); return; }
    if(window.__закрытьСправку) window.__закрытьСправку();
    эффектыОткрыты = true; э.classList.add('on'); кн.classList.add('on');
    state.locked = null; state.hover = null; refresh();
  });
  document.getElementById('далее').addEventListener('click', e => e.stopPropagation());
  // `?эффекты=1` — карточка при открытии (снимки)
  if(new URLSearchParams(location.search).get('эффекты') === '1') setTimeout(() => кн.click(), 1200);
})();

/* ── вход по адресу: раскрыть слой без мыши ───────────────────────────
   `?слой=plast|skv|naz` раскрывает контур, `&шаг=N` — его подшаг (с нуля),
   `&угол=45` доворачивает модель и останавливает автоповорот, `&ждать=1`
   ставит съёмку на паузу до готовности.

   Нужно для снимков экрана: страницу открывает Chrome в фоновом режиме, мышью
   там кликать некому. На показ не влияет — без параметров всё как было. */
(function входПоАдресу(){
  const п = new URLSearchParams(location.search);
  const слой = п.get('слой') ?? п.get('layer');
  const шаг = п.get('шаг') ?? п.get('step');
  const наведение = п.get('наведение') ?? п.get('hover');   // курсор на слое вместо нажатия
  const угол = parseFloat(п.get('угол') ?? п.get('angle'));
  if((!слой || !ZONES[слой]) && !Number.isFinite(угол)) return;
  /* Состояние переставляем несколько раз подряд, а не однократно: слои
     догружаются вразнобой, и первый же `refresh` после последнего .glb сбрасывал
     выставленный контур обратно на обзорную панель — снимок уходил пустым. */
  const поставить = () => {
    if(слой && ZONES[слой]){
      if(наведение){ state.hover = слой; state.locked = null; state.hoverSub = null;
                     state.заморожен = true; }
      else { state.locked = слой; state.hover = null; }
      refresh();
    }
    if(слой && ZONES[слой] && шаг !== null && шаг !== undefined && шаг !== ''){
      panelState.zone = слой; panelState.sub = +шаг;
      refresh();
    }
    if(Number.isFinite(угол)){
      controls.autoRotate = false;
      const р = Math.hypot(camera.position.x, camera.position.z);
      const а = угол * Math.PI/180;
      camera.position.x = Math.sin(а)*р;
      camera.position.z = Math.cos(а)*р;
      camera.lookAt(controls.target);
    }
  };
  // первый заход — когда слои встали в стопку, дальше держим ещё восемь секунд
  for(let мс = 400; мс <= 8400; мс += 800) setTimeout(поставить, мс);
})();

/* Модель центрируется в свободном коридоре между панелями: сдвигаем не сцену,
   а окно проекции — орбита и клики остаются на своих местах.

   Сам сдвиг сюда не применяется мгновенно — только пересчитывает цель
   (state.viewShiftTargetX), а к камере её каждый кадр подводит плавным
   ходом animate() (тем же k, что и остальные лерпы). Раньше здесь стоял
   прямой camera.setViewOffset()/clearViewOffset(): при раскрытии слоя
   fitBetweenPanels зовётся из openProject синхронно с тем же кликом, что
   добавляет контенту класс .vis — сдвиг обнулялся мгновенно, в тот же кадр,
   что и начало CSS-перехода контента, и картинка заметно дёргалась именно
   «когда контент выходит» (замеченный баг). Плавный лерп это убирает. */
function fitBetweenPanels(){
  const W = innerWidth, H = innerHeight;
  // аспект — сразу, а не лерпом: это настоящий ресайз, а не стилистический
  // сдвиг кадра, и он должен быть в силе, даже пока рендер спит во встроенном
  // iframe (см. animate(): ветка сна не подводит матрицу проекции сама).
  camera.aspect = W/H;
  camera.updateProjectionMatrix();
  if(state.openId){
    /* Слой раскрыт: панель контура (34vw) слева и контент слоя (70vw) справа
       в сумме шире экрана — настоящего коридора между ними физически нет, в
       отличие от обычного режима ниже. Пытаться сдвинуть камеру в
       несуществующий зазор только уводило бы её в произвольную сторону.
       Плита к этому моменту уже сама заметно подросла и развёрнута лицом —
       сцену просто центрируем как обычно, без сдвига, и панели ложатся
       сверху своим стеклом. */
    state.viewShiftTargetX = 0;
    return;
  }
  const panel = document.getElementById('panel');
  if(state.locked){
    // Выбранная панель теперь слева: центрируем модель в свободном коридоре справа.
    const left = panel.getBoundingClientRect().right + 24;
    const right = W - 26;
    state.viewShiftTargetX = -((left + right)/2 - W/2);
    return;
  }
  const left = document.getElementById('stack').getBoundingClientRect().right + 24;
  /* Место под панель держим всегда, показана она или нет. Считать коридор по
     видимой панели нельзя: пока ничего не выбрано, её нет, модель встаёт по
     центру всего кадра, а на первом же наведении панель выходит, коридор
     сужается — и картинка дёргается влево ровно в тот момент, когда на неё
     смотрят. Место пустует, зато модель стоит неподвижно.

     Ширину и отступ берём из вёрстки, а не из положения на экране: скрытая
     панель отодвинута переходом на свои тридцать пикселей, и её `rect` соврал
     бы ровно на них. */
  const поле = parseFloat(getComputedStyle(panel).right) || 0;
  const right = W - поле - panel.offsetWidth - 24;
  const shift = (left + right)/2 - W/2;          // куда уехал центр коридора
  /* Дополнительный сдвиг влево. Список слева узкий, и по одному коридору
     модель садилась в кадре правее, чем нужно, подходя вплотную к панели.
     Положительный x у setViewOffset сдвигает картинку влево. */
  const ВЛЕВО = 34;
  state.viewShiftTargetX = -shift + ВЛЕВО;
}

/* Плотность пикселей нельзя выставлять один раз при загрузке: слайд стартует и
   в скрытом iframe, и в окне, которое потом переезжает на другой монитор или
   меняет масштаб — devicePixelRatio при этом меняется, а рендер остаётся в
   старой плотности и картинка выглядит мылом. Пересматриваем на каждый resize
   и при пробуждении. */
function подогнатьПлотность(){
  const нужно = Math.min(devicePixelRatio || 1, 1.6);
  if (Math.abs(renderer.getPixelRatio() - нужно) > 0.01) renderer.setPixelRatio(нужно);
}

addEventListener('resize', () => {
  подогнатьПлотность();
  renderer.setSize(innerWidth, innerHeight);
  positionEffectsOverview();
  fitBetweenPanels();
  updateNavLine();
});

window.__dbg = { renderer, scene, camera, state, zones, refresh, world,
  get pickCount(){ return pickMeshes.length; },
  get спит(){ return !живой; },
  get точекТЭО(){ return меткиТЭО.length; }, обновитьПодписи: обновитьМеткиТЭО,
  обновитьБурение, обновитьГоризонт, get проходка(){ return проходка; },
  get подписьВидна(){ return elTeo.classList.contains('on'); } };
</script>
