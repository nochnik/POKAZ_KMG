<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Цифровой двойник с применением ИИ · первый слайд</title>
<style>
:root{
  --cyan:#4FE3FF; --amber:#F0AE4A; --blue:#8FBAF0; --teal:#35D0C2; --viol:#9B7BE8;
  --bg0:#050810; --bg1:#0C1626; --line:rgba(140,170,210,.22);
  --glass:rgba(10,18,32,.82); --txt:#D7E2F2; --dim:#7C8DA6;
  --mono:Consolas,"Courier New",monospace; --serif:Cambria,Georgia,serif;
  --ui:"Segoe UI",Calibri,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:var(--ui);color:var(--txt);
  background:radial-gradient(ellipse at 50% 30%,#0C1626 0%,#050810 70%)}
#scene{position:fixed;inset:0}

/* Шапка кадра: живёт над всеми панелями (z-index 15 — выше #project-content
   с его 14), чтобы название кадра оставалось на экране, даже когда справа
   стоит система (24.09, Адиль — «заголовок остаётся тем же, не меняется»).
   Ни ширина, ни шрифт при раскрытии слоя больше не подстраиваются: H1 держит
   свою полную длину, ложится поверх системного контента, а на видео его
   читаемым делает тень + сдвинутый вниз заголовок системы (см. .с-видео
   padding-top ниже — pc-name уезжает под H1 и не сталкивается с ним). */
#hdr{position:fixed;top:22px;left:26px;z-index:15;pointer-events:none}
#hdr h1{font-family:var(--serif);font-size:32.5px;font-weight:600;line-height:1.2;
  text-shadow:0 2px 12px rgba(5,8,16,.9),0 0 22px rgba(5,8,16,.7),0 0 36px rgba(5,8,16,.5)}
#hdr .sub{font-family:var(--mono);font-size:18px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);margin-top:6px}
#hdr .sub b{color:var(--cyan);font-weight:700}

/* Навигация по контурам по умолчанию остаётся колонкой слева. */
#stack{position:fixed;left:26px;top:50%;transform:translateY(-50%);z-index:10;display:flex;flex-direction:column;
  gap:6px;width:360px;padding-left:24px;transition:opacity .28s ease,transform .42s cubic-bezier(.2,.8,.2,1)}
#stack.выбран{top:46%;gap:4px}
#stack.выбран .lay{padding:7px 11px}
#stack.выбран .lay .t{font-size:19px;line-height:1.2}
#stack.выбран .lay .n{font-size:17px}
#stack.выбран .lay.step{padding:5px 9px}
#stack.выбран .lay.step .t{font-size:16.5px;line-height:1.25}
#stack.выбран .lay.step .n{font-size:16px}
#stack.выбран #navdot{box-shadow:0 0 0 3px rgba(5,8,16,.9);transition:none}
#stack.выбран #navfill{transition:none}
#stack.скрыт{opacity:0;pointer-events:none;transform:translateY(calc(-50% - 14px))}
/* линия процесса: связывает все контуры и шаги в одну цепочку */
#navline{position:absolute;left:12px;top:20px;bottom:20px;width:2px;background:rgba(140,170,210,.22);border-radius:2px}
#navline::after{content:'';position:absolute;left:-4px;bottom:-10px;
  border-left:5px solid transparent;border-right:5px solid transparent;border-top:10px solid rgba(140,170,210,.4)}
#navfill{position:absolute;left:0;top:0;width:100%;height:0;border-radius:2px;
  background:linear-gradient(180deg,rgba(79,227,255,.5),var(--nc,#F0AE4A));
  transition:height .45s cubic-bezier(.4,0,.2,1)}
/* позиционируется через transform: у растянутого контейнера (top+bottom) свойство
   top на потомке не отрабатывает, а translateY ещё и анимируется плавнее */
#navdot{position:absolute;left:-5px;top:0;width:12px;height:12px;margin-top:-6px;border-radius:50%;
  background:var(--nc,#F0AE4A);box-shadow:0 0 0 3px rgba(5,8,16,.9),0 0 16px var(--nc,#F0AE4A);
  opacity:0;transition:transform .45s cubic-bezier(.4,0,.2,1),opacity .3s}
#navdot.on{opacity:1}
.lay{position:relative;cursor:pointer;text-align:left;background:var(--glass);border:1px solid var(--line);
  border-left:3px solid var(--lc);padding:9px 13px;color:var(--txt);font-family:var(--ui);
  transition:background .2s,border-color .2s,transform .2s;backdrop-filter:blur(8px)}
.lay::before{content:'';position:absolute;left:-18px;top:50%;margin-top:-5px;width:10px;height:10px;border-radius:50%;
  background:var(--bg0);border:2px solid var(--line);transition:border-color .25s,background .25s;z-index:1}
.lay.done::before{border-color:var(--lc)}
.lay.hot::before{border-color:var(--lc);background:var(--lc)}
/* Номер стоит слева от названия, а не над ним: сетка держит подписи в одну
   колонку, и «1.2» рядом с «1» читается как вложенность, а не как новый пункт. */
.lay{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:baseline;column-gap:9px}
.lay .n{font-family:var(--mono);font-size:19px;letter-spacing:.04em;color:var(--dim);
  font-weight:700;min-width:1.6em}
.lay.hot .n{color:var(--lc)}
.lay .t{font-size:21.5px;font-weight:600;line-height:1.25}
/* стрелка раскрытия: показывает, что за контуром прячутся его шаги */
.lay .ch{position:absolute;right:11px;top:50%;margin-top:-4px;width:7px;height:7px;
  border-right:1.5px solid var(--dim);border-bottom:1.5px solid var(--dim);
  transform:rotate(45deg);transition:transform .25s,border-color .25s}
.lay.open .ch{transform:rotate(-135deg);margin-top:-1px;border-color:var(--lc)}
.lay:hover,.lay.hot{background:rgba(79,227,255,.08);border-color:var(--lc)}
.lay.hot .n{color:var(--lc)}
.lay .tag{display:inline-block;font-family:var(--mono);font-size:14.5px;letter-spacing:.12em;color:var(--dim);
  border:1px solid var(--line);padding:1px 5px;margin-top:4px;text-transform:uppercase}
/* шаги — вложенные узлы той же цепочки: сдвинуты вправо и связаны с линией отводом.
   Показываются только у раскрытого контура: все девять сразу давали стену текста
   выше самой модели, а на экране должен быть один смысловой уровень. */
.lay.step{margin-left:16px;width:calc(100% - 16px);padding:6px 10px;
  background:rgba(10,18,32,.5);border-left-width:2px;display:none}
.lay.step.show{display:block}
.lay.step::before{width:7px;height:7px;margin-top:-3.5px;left:-32px}  /* −32 + 3 + 16 = −13 → центр на линии */
.lay.step::after{content:'';position:absolute;left:-25px;top:50%;width:25px;height:1px;
  background:var(--line);opacity:.7}
.lay.step .t{font-size:18.5px;font-weight:600;color:var(--txt);line-height:1.35}
.lay.step .n{font-size:18px;min-width:2.2em}
.lay.step.hot{background:rgba(255,255,255,.07)}
.lay.step.hot::after{background:var(--lc);opacity:1}

#panel{position:fixed;right:26px;top:50%;
  transform:translateY(-50%) translateX(30px);z-index:10;
  /* Шире и, как следствие, ниже: узкая колонка гнала текст в столбик и панель
     казалась башней во весь кадр при том же объёме содержимого. */
  width:34vw;min-width:420px;max-width:660px;   /* 18.09: под крупные шрифты */
  max-height:86vh;overflow-y:auto;background:var(--glass);border:1px solid var(--line);
  border-top:2px solid var(--pc,#4FE3FF);backdrop-filter:blur(12px);padding:20px 22px;
  opacity:0;pointer-events:none;transition:opacity .35s ease,transform .6s cubic-bezier(.2,.8,.2,1)}
#panel.vis{opacity:1;pointer-events:auto;transform:translateY(-50%) translateX(0)}
/* Панель выбранного слоя занимает место исчезнувшего #stack. Сидит под шапкой,
   а не по центру: низ левой колонки отдан миниатюре стопки (--мини-высота
   задаёт JS, см. MINI_HEIGHT_RATIO), и панель не должна на неё заезжать. Если
   содержимое выше остатка (низкое окно) — прокручивается внутри, как и раньше.
   Стартует чуть ниже и выезжает вверх. */
#panel.вместо-стека,#panel.раскрыт{display:none;top:124px;bottom:auto;left:26px;right:auto;
  max-height:calc(100vh - 124px - var(--мини-высота,21.5vh) - 26px - 10px);
  transform:translateY(22px)}
#panel.вместо-стека.vis,#panel.раскрыт.vis{transform:none}
#panel::-webkit-scrollbar{width:5px}
#panel::-webkit-scrollbar-thumb{background:rgba(140,170,210,.3)}
#p-kick{font-family:var(--mono);font-size:17px;letter-spacing:.24em;text-transform:uppercase;color:var(--pc,#4FE3FF)}
#p-name{font-family:var(--serif);font-size:29px;font-weight:600;margin-top:5px;line-height:1.2}
#p-claim{font-size:21.5px;color:var(--dim);margin-top:8px;line-height:1.5}
.p-h{font-family:var(--mono);font-size:16px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);
  margin:14px 0 8px;border-bottom:1px solid var(--line);padding-bottom:5px}
#p-fx{display:flex;flex-wrap:wrap;gap:6px}
.fx{border:1px solid var(--pc,#4FE3FF);padding:7px 11px;min-width:88px}
.fx .v{font-family:var(--mono);font-size:29px;font-weight:700;color:var(--pc,#4FE3FF)}
.fx .l{font-size:18px;color:var(--dim);margin-top:2px;line-height:1.3}
#p-blocks .bl{margin-bottom:9px}
#p-blocks .bt{font-size:21px;font-weight:600}
#p-blocks .bi{font-size:19px;color:var(--dim);line-height:1.5}
#p-mods{display:flex;flex-wrap:wrap;gap:6px}
.mod{font-family:var(--mono);font-size:18.5px;letter-spacing:.08em;text-transform:uppercase;
  border:1px solid var(--line);color:var(--txt);padding:4px 10px}
#p-note{font-size:20px;color:var(--dim);margin-top:16px;line-height:1.55;border-left:2px solid var(--pc,#4FE3FF);padding-left:11px}
.sub{cursor:pointer;border:1px solid var(--line);border-left:3px solid var(--pc,#F0AE4A);
  padding:10px 12px;margin-bottom:8px;transition:background .2s,transform .2s}
.sub:hover{background:rgba(240,174,74,.08);transform:translateX(3px)}
.sub .sn{font-family:var(--mono);font-size:15.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--pc,#F0AE4A)}
.sub .st{font-size:21.5px;font-weight:600;margin-top:3px}
.sub .sd{font-size:18.5px;color:var(--dim);margin-top:4px;line-height:1.45}
.sub .more{font-family:var(--mono);font-size:17px;letter-spacing:.14em;color:var(--pc,#F0AE4A);margin-top:6px;text-transform:uppercase}
#p-back{cursor:pointer;background:none;border:1px solid var(--line);color:var(--dim);
  font-family:var(--mono);font-size:17px;letter-spacing:.16em;text-transform:uppercase;padding:6px 10px;margin-bottom:12px}
#p-back:hover{color:var(--txt);border-color:var(--txt)}
#p-close{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--dim);
  font-size:26px;cursor:pointer;line-height:1}
#p-close:hover{color:var(--txt)}

/* Верхняя лента ключевых эффектов: три карточки под H1, циан-акцентом слева.
   Подзаголовка нет — сам H1 работает как заголовок кадра (23.09, Адиль).
   Держим ленту в коридоре между стопкой контуров (слева) и справкой о В.
   Молдабеке (справа): справка сама шириной до 660px, отступ 26 от края,
   +14 воздуха — итого 700 справа; слева хватает и голого края экрана. */
#effects-overview{position:fixed;top:112px;left:26px;right:calc(min(660px,34vw) + 40px);
  z-index:9;padding:0;pointer-events:none;
  transition:opacity .28s ease,transform .42s cubic-bezier(.2,.8,.2,1)}
#effects-overview.скрыт{opacity:0;transform:translateY(-12px)}
/* «У стека» — то же три эффекта, но вертикальной колонкой над раскрывашками
   контуров слева. Позиционирует JS (`positionEffectsOverview`), а сеткой
   переключаемся здесь: у-стека → 1 столбец, идут одной колонкой сверху вниз. */
#effects-overview.у-стека{padding:0;transform:none;left:auto;right:auto;top:auto}
#effects-overview .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
#effects-overview .effect-col{padding:13px 17px;background:var(--glass);border:1px solid var(--line);
  border-left:3px solid var(--ec);backdrop-filter:blur(8px)}
#effects-overview .items{display:block}
/* В карточке может стоять один пункт или несколько. Пункты идут строкой
   вниз (`.items` = block). Внутри пункта значение и подпись — на одной
   строке (`.item` = flex row): «2 864 тыс. тонн» с подписью «доп. добычи»
   справа, а «326 млрд ₸» — без подписи, отдельной строкой ниже. */
#effects-overview .items{display:block}
#effects-overview .item{display:flex;align-items:baseline;gap:12px;min-width:0;flex-wrap:wrap}
#effects-overview .item + .item{margin-top:5px}
/* 24.09 (Адиль): три ключевых эффекта сверху были 24 px — терялись рядом с
   карточкой «Первый актив». Подняли до 40 px, справку ужали.
   25.09 (Адиль, «пусть чуть меньше, наезжает на 3D»): 40 → 32 px — плашки
   стали ниже, «тортик» под ними снова читается целиком.
   25.09 (Адиль, вторая правка): плашки оставить того же размера (padding
   13/17), но шрифт внутри поднять и уйти с cyan на белый — цвет плашек
   сливается с фоном стенда. 32 → 36 у цифры, 17 → 18 у подписи,
   color: --ec (cyan) → #F2F7FF (белый), font-weight 700 остался.
   Акцент удерживается синей полосой слева у .effect-col — сам текст
   больше не борется с фоном за читаемость. */
#effects-overview .v{font-family:var(--mono);font-size:36px;font-weight:700;line-height:1.05;color:#F2F7FF;
  flex:0 0 auto;white-space:nowrap}
#effects-overview .l{font-size:18px;line-height:1.3;color:var(--dim)}
/* Вертикальная колонка у стопки: чуть крупнее самих раскрывашек (у них .t = 21.5px),
   чтобы главные эффекты вылавливались с зала раньше названий контуров. */
#effects-overview.у-стека .cols{grid-template-columns:1fr;gap:8px}
#effects-overview.у-стека .effect-col{padding:11px 13px;border-left-width:3px;
  background:linear-gradient(180deg,rgba(14,25,43,.95),rgba(8,15,27,.92));box-shadow:0 10px 26px rgba(0,0,0,.18)}
#effects-overview.у-стека .item{gap:12px}
#effects-overview.у-стека .v{font-size:23px}
#effects-overview.у-стека .l{font-size:16px}

/* дорожная карта скрыта по решению от 12.08 — вернуть: display:flex вместо none */
#road{display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:10;align-items:center;gap:0;
  background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(8px);padding:10px 22px}
.rd{text-align:center;padding:0 18px}
.rd .y{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--cyan)}
.rd .d{font-size:18px;color:var(--dim);margin-top:2px;white-space:nowrap}
.rsep{width:34px;height:1px;background:var(--line);position:relative}
.rsep::after{content:'';position:absolute;right:0;top:-2.5px;border-left:5px solid var(--line);
  border-top:3px solid transparent;border-bottom:3px solid transparent}

/* переходы наружу — неприметные, в том же окне */
#next,#demo2,#demo2full,#pilot,#далее{position:fixed;z-index:12;display:inline-flex;align-items:center;gap:8px;
  font-family:var(--mono);font-size:17px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--dim);text-decoration:none;border:1px solid var(--line);padding:8px 13px;
  background:rgba(10,18,32,.45);backdrop-filter:blur(6px);opacity:.42;
  transition:opacity .25s,color .25s,border-color .25s,background .25s}
#next:hover,#next:focus-visible,#pilot:hover,#pilot:focus-visible,#pilot.on,#demo2.on,#далее:hover,#далее:focus-visible,#demo2full:hover,#demo2full:focus-visible,
#demo2:hover,#demo2:focus-visible{opacity:1;color:var(--cyan);border-color:var(--cyan);background:rgba(79,227,255,.08)}
#next .arw,#demo2 .arw,#demo2full .arw,#pilot .arw,#далее .arw{font-size:19px;line-height:1}
#top-actions{position:fixed;z-index:12;right:150px;top:20px;display:flex;align-items:center;gap:10px}
#top-actions #demo2full,#top-actions #pilot{position:static}
#далее{right:26px;bottom:22px;font-size:14px;padding:6px 11px;opacity:.35}
/* карточка эффектов — та же вёрстка, что панель эффектов подводки (demo_with_map.html) */
#эффекты{position:fixed;right:26px;top:50%;transform:translateY(-50%) translateX(40px);width:34vw;min-width:420px;max-width:660px;
  max-height:86vh;z-index:11;padding:22px 26px 20px;overflow:hidden auto;
  background:linear-gradient(180deg,rgba(6,11,20,.96),rgba(4,8,15,.985));border:1px solid rgba(140,170,210,.16);
  opacity:0;transition:opacity .5s,transform .6s cubic-bezier(.22,.61,.36,1);pointer-events:none}
#эффекты.on{opacity:1;transform:translateY(-50%);pointer-events:auto}
#эффекты .hd{font-family:var(--mono);font-size:19px;letter-spacing:.24em;text-transform:uppercase;color:var(--amber,#F0AE4A);margin-bottom:6px}
#эффекты .ct{margin-top:14px;padding-top:12px;border-top:1px solid rgba(140,170,210,.16);opacity:0;transform:translateY(10px);transition:opacity .5s,transform .5s}
#эффекты.on .ct{opacity:1;transform:none}
#эффекты .ct .nm{font-family:var(--mono);font-size:16.5px;letter-spacing:.14em;text-transform:uppercase;color:#DCE7F5;margin-bottom:6px}
#эффекты .fx{display:flex;align-items:baseline;gap:12px;padding:4px 0}
#эффекты .fx .v{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--teal,#35D0C2);flex:0 0 auto;line-height:1.05}
#эффекты .fx .l{font-size:19px;color:#9DB4CE;line-height:1.3}
#эффекты .road{margin-top:14px;padding-top:12px;border-top:1px solid rgba(140,170,210,.16)}
#эффекты .rd .y{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--amber,#F0AE4A)}
#эффекты .rd .d{font-size:17px;color:#9DB4CE;margin-top:2px}
#demo2{display:none}
/* карточка пилотного актива — та же, что в подводке (demo_with_map.html), тем же слотом справа */
/* 24.09 (Адиль, замечание после выкладки): справочная карточка была шире и
   крупнее, чем главные эффекты сверху, — акцент смещался на актив.
   max-width 660 → 560, шрифты немного ужаты. */
#справка{position:fixed;right:26px;top:50%;transform:translateY(-50%) translateX(40px);width:30vw;min-width:400px;max-width:560px;
  max-height:86vh;z-index:11;padding:18px 22px 18px;overflow:hidden auto;
  background:linear-gradient(180deg,rgba(6,11,20,.96),rgba(4,8,15,.985));border:1px solid rgba(140,170,210,.16);
  opacity:0;transition:opacity .5s,transform .6s cubic-bezier(.22,.61,.36,1);pointer-events:none}
#справка.on{opacity:1;transform:translateY(-50%);pointer-events:auto}
#справка .hd{font-family:var(--mono);font-size:16.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--cyan);margin-bottom:12px}
#справка .nm{font-family:var(--serif);font-size:25px;color:#F2F7FF;line-height:1.15;border-top:2px solid var(--cyan);padding-top:12px}
#справка .sub{font-size:17px;color:#9DB4CE;margin-top:6px;line-height:1.35}
#справка .ярус{margin-top:12px;padding-top:10px;border-top:1px solid rgba(140,170,210,.16);opacity:0;transform:translateY(10px);
  transition:opacity .5s cubic-bezier(.22,.61,.36,1),transform .5s cubic-bezier(.22,.61,.36,1)}
#справка .ярус.on{opacity:1;transform:none}
#справка .ярус:empty{display:none}
#справка .rw{display:flex;gap:12px;padding:5px 0;border-bottom:1px solid rgba(140,170,210,.09);opacity:0;transform:translateY(10px);transition:opacity .4s ease-out,transform .4s ease-out}
#справка .ярус.on .rw{opacity:1;transform:none}
#справка .rw:last-child{border-bottom:0}
#справка .rw .k{font-family:var(--mono);font-size:14.5px;letter-spacing:.08em;text-transform:uppercase;color:#7C8DA6;flex:0 0 40%;line-height:1.35}
#справка .rw .v{font-size:17px;color:#DCE7F5;line-height:1.35}
/* 25.09 (Адиль, замечание): КИН и МРП стояли особняком с бирюзовой рамкой и
   serif-цифрой — рядом с остальными строками смотрелись как «отдельная секция»,
   хотя это те же данные пилота. Возвращаем их в общий регистр: тот же mono ключ,
   та же подпись справа. Класс «эффект» с данных снят, стили ниже больше не
   применяются, но оставляем как ноль-специфик — если снова понадобится подсветить. */
#справка .rw.эффект{padding:5px 0;border-left:0;background:none;margin-left:0}
#справка .rw.эффект .k{font-family:var(--mono);font-size:14.5px;letter-spacing:.08em;
  text-transform:uppercase;color:#7C8DA6;font-weight:400;line-height:1.35}
#справка .rw.эффект .v{font-size:17px;color:#DCE7F5;align-self:auto;line-height:1.35}
#справка .гр{padding:0 0 6px;font-family:var(--mono);font-size:14px;letter-spacing:.24em;text-transform:uppercase;color:var(--cyan)}
#справка .src{margin-top:10px;font-family:var(--mono);font-size:14px;letter-spacing:.08em;color:#5E7089}
/* ко второй части показа — скрыта по решению от 14.08; вернуть: убрать display:none */
#next{display:none;left:26px;bottom:22px}
/* 25.09: кнопка возвращена — справа-сверху, чтобы не спорить с блоком
   ключевых эффектов слева и не наезжать на карточку «Первый актив» справа
   в раскрытом виде. */
#pilot{right:26px;top:22px}
/* 25.09: подсветка ключевых цифр в паспорте актива (36,7 % и 14,8 млн тонн)
   — заказчик просил «как-то выделить». Тот же циан, что у главных эффектов
   и линии процесса, чтобы не изобретать своего цвета. */
#справка .rw.акцент .v{color:var(--cyan);font-family:var(--mono);font-weight:700;font-size:19px;
  /* 25.09 (Адиль, «добавь эффект/анимацию, чтоб цифры подсвечивались при
     рассказе»): мягкий пульс свечения — глаз ловит цифру, но она не мигает
     резко и не отвлекает во время речи. Останавливаем анимацию при
     reduced-motion, чтобы не мешать зрителям с настройкой доступности. */
  padding:0 6px;border-radius:6px;
  animation:пульс_цифры 2.4s ease-in-out infinite}
#справка .rw.акцент .k{color:#B8CEE8}
@keyframes пульс_цифры{
  0%,100%{background:rgba(79,227,255,0);   text-shadow:0 0 0 rgba(79,227,255,0)}
  50%    {background:rgba(79,227,255,.14); text-shadow:0 0 14px rgba(79,227,255,.65)}
}
@media (prefers-reduced-motion:reduce){
  #справка .rw.акцент .v{animation:none;background:rgba(79,227,255,.12)}
}
/* к сборке с гео-подводкой — сверху справа, над панелью контура */

/* подписи точек бурения в слое технико-экономической оценки */
#teo{position:fixed;inset:0;z-index:11;pointer-events:none;opacity:0;transition:opacity .3s}
#teo.on{opacity:1}
/* `--ств` — цвет ствола, ставится при сборке подписи: отбивка и строка номера
   идут им же, и плашка читается как принадлежащая своему столбу. */
.tm{position:absolute;transform:translate(10px,-50%);white-space:nowrap;--ств:var(--amber);
  background:rgba(8,14,26,.82);border:1px solid var(--line);border-left:2px solid var(--ств);
  padding:3px 7px;backdrop-filter:blur(4px)}
.tm .no{font-family:var(--mono);font-size:17px;letter-spacing:.1em;color:var(--ств)}
.tm .ec{font-family:var(--mono);font-size:15.5px;letter-spacing:.06em;color:var(--dim);margin-top:1px}
/* сами цифры — зелёным, единицы и подписи остаются приглушёнными: на показе
   спрашивают именно числа, и они должны вылавливаться взглядом сразу */
.tm .ec b{color:#4FE08A;font-weight:600}
/* Нижняя плашка растёт влево от своего столба: с верхней они тогда расходятся
   и по высоте, и по стороне, и ни на одном ракурсе не накладываются. Отбивка
   переезжает на правый край — она обязана смотреть в сторону столба. */
.tm.влево{transform:translate(calc(-100% - 10px),-50%);
  border-left:1px solid var(--line);border-right:2px solid var(--ств)}

/* подпись оцифрованного объекта наземки */
#naz-lbl{position:fixed;z-index:11;pointer-events:none;opacity:0;transition:opacity .3s;
  transform:translate(-50%,-100%);white-space:nowrap;
  font-family:var(--mono);font-size:17px;letter-spacing:.14em;text-transform:uppercase;
  color:#FFE6BF;background:rgba(8,14,26,.88);border:1px solid #FFB020;
  border-bottom:2px solid #FFB020;padding:4px 10px;backdrop-filter:blur(4px)}
#naz-lbl.on{opacity:1}

/* отметка бурящейся скважины */
#drill{position:fixed;z-index:11;pointer-events:none;opacity:0;transition:opacity .3s;
  transform:translate(12px,-50%);display:flex;align-items:center;gap:7px;
  font-family:var(--mono);font-size:17px;letter-spacing:.14em;text-transform:uppercase;
  color:#EAF2FF;background:rgba(8,14,26,.85);border:1px solid var(--viol);
  border-left:3px solid var(--viol);padding:4px 9px;backdrop-filter:blur(4px);white-space:nowrap}
#drill.on{opacity:1}
#drill .pt{width:6px;height:6px;border-radius:50%;background:var(--viol);
  animation:бур 1.1s ease-in-out infinite}
/* проходка: моноширинные цифры, иначе счётчик дёргает подпись при каждом тике */
#drill .m{font-weight:600;color:#fff;font-variant-numeric:tabular-nums;
  border-left:1px solid rgba(155,123,232,.5);padding-left:7px;margin-left:1px}

/* отметка горизонтального бурения — тот же язык, но подпись под носком ствола.
   Рамка стальная, а не фиолетовая: фиолет в слое означает действующий фонд, а
   тут идёт та же стройка, что и в центре. */
#horiz{position:fixed;z-index:11;pointer-events:none;opacity:0;transition:opacity .3s;
  transform:translate(-50%,16px);display:flex;align-items:center;gap:7px;
  font-family:var(--mono);font-size:17px;letter-spacing:.14em;text-transform:uppercase;
  color:#EAF2FF;background:rgba(8,14,26,.85);border:1px solid #9AA5B4;
  border-bottom:2px solid #9AA5B4;padding:4px 9px;backdrop-filter:blur(4px);white-space:nowrap}
#horiz.on{opacity:1}
#horiz .pt{width:6px;height:6px;border-radius:50%;background:#9AA5B4;
  animation:бур 1.1s ease-in-out infinite}
@keyframes бур{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.25)}}

#chip{position:fixed;z-index:20;pointer-events:none;font-family:var(--mono);font-size:18px;
  letter-spacing:.14em;text-transform:uppercase;color:#EAF2FF;background:rgba(8,14,26,.9);
  border:1px solid var(--cc,#4FE3FF);border-left:3px solid var(--cc,#4FE3FF);padding:4px 9px;display:none;white-space:nowrap}

#loader{position:fixed;inset:0;z-index:50;background:radial-gradient(ellipse at 50% 30%,#0C1626 0%,#050810 70%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .6s}
#loader.done{opacity:0;pointer-events:none}
#loader .t{font-family:var(--serif);font-size:29px}
#loader .m{font-family:var(--mono);font-size:17px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}

@media (max-width:1280px){ #stack{width:290px} .lay .t{font-size:22.5px} #panel{width:32vw;min-width:300px} }
/* невысокий экран: цепочка из 10 узлов должна помещаться целиком */
@media (max-height:760px){
  #stack{gap:5px}
  .lay{padding:10px 14px}
  .lay .t{font-size:22.5px}
  .lay.step{padding:5px 11px}
  .lay.step .t{font-size:18.5px}
}

/* ── водяной знак ──────────────────────────────────────────────────────
   Справа сверху, ровно под кнопкой «Демо показа v2» и по её правому краю.
   Слой выше загрузочного экрана — знак виден и пока грузятся слои модели.
   В показе этот файл идёт в <iframe>, и знак оттуда снимается: там его
   рисует сам показ. Тень держит белые буквы читаемыми на светлом. */
#знак{position:fixed;right:26px;top:64px;z-index:60;pointer-events:none;
  height:50px;opacity:.32;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
#знак svg{display:block;height:100%;width:auto}

/* Контент слоя: правая панель на 70% экрана, приходит на смену уходу на
   отдельную страницу — навигацию убрали, второй клик по уже открытому слою
   больше никуда не переводит. То же стекло, что у #panel, — один язык, а не
   новый слой поверх показа. Выходит последним тактом раскрытия, когда плита
   уже развёрнута лицом и подросла (см. openProject), поэтому и стартует не
   с нуля, а с небольшим сдвигом — довершает движение, которое уже идёт. */
#project-content{position:fixed;top:0;right:0;bottom:0;width:70vw;z-index:14;
  background:var(--glass);backdrop-filter:blur(18px);border-left:1px solid var(--line);
  border-top:3px solid var(--pc,#4FE3FF);
  display:flex;flex-direction:column;justify-content:center;gap:16px;
  padding:64px 72px;overflow-y:auto;
  opacity:0;transform:translateX(48px);pointer-events:none;
  transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.2,1)}
#project-content.vis{opacity:1;transform:translateX(0);pointer-events:auto}
#pc-back{align-self:flex-start;cursor:pointer;background:none;border:1px solid var(--line);color:var(--dim);
  font-family:var(--mono);font-size:16px;letter-spacing:.16em;text-transform:uppercase;
  padding:8px 14px;margin-bottom:10px;transition:color .2s,border-color .2s}
#pc-back:hover{color:var(--txt);border-color:var(--txt)}
#pc-kick{font-family:var(--mono);font-size:18px;letter-spacing:.3em;text-transform:uppercase;color:var(--pc,#4FE3FF)}
#pc-name{font-family:var(--serif);font-size:52px;font-weight:600;line-height:1.2;max-width:26ch}
#pc-claim{font-size:23px;color:var(--dim);line-height:1.6;max-width:52ch}
#pc-video{display:none;width:100%;max-height:62vh;object-fit:contain;background:#02040A;
  border:1px solid var(--line);border-top:2px solid var(--pc,#4FE3FF);box-shadow:0 18px 46px rgba(0,0,0,.32)}
/* padding-top отведён под шапку кадра (см. #hdr: top:22, ~54 высоты + запас):
   H1 постоянно висит в левом верхнем углу и, если бы pc-name стартовал по
   умолчанию с 64px, они сталкивались бы в углу — теперь заголовок системы
   уезжает под H1 и не наезжает на него. */
#project-content.с-видео{padding-top:96px;padding-bottom:42px;gap:12px}
#project-content.с-видео #pc-name{font-size:38px}
/* 24.09 (Адиль): убраны кнопка «← к цифровому двойнику» и жёлтый кикер
   «ЦД … · проект NN» на карточке системы. Возврат идёт единственной
   кнопкой в нижнем левом углу у миниатюры 3D (см. #mini-reset). Разметка
   и обработчик закрытия по #pc-back оставлены — при возврате вида можно
   просто снять эти два display:none и всё поедет обратно. */
#project-content.с-видео #pc-claim,#project-content.с-видео #pc-badge,
#project-content.с-видео #pc-back,#project-content.с-видео #pc-kick{display:none}
#project-content.с-видео #pc-video{display:block}
/* Кнопка возврата к первому кадру. Стоит у 3D-модели в нижнем левом углу:
   миниатюра занимает `--mini-width × --мини-высота` от MINI_MARGIN, кнопка
   ложится сразу справа от миниатюры (23.09, Адиль — «возврат у 3D-модели»).
   Прежние 25vw уводили её то внутрь миниатюры на узком мониторе, то далеко
   от неё на широком: считаем от габарита самой миниатюры, а не от окна. */
#mini-reset{position:fixed;z-index:16;
  left:calc(var(--mini-margin,34px) + var(--mini-width,35.1vh) + 12px);
  bottom:var(--mini-margin,34px);
  width:44px;height:44px;display:grid;place-items:center;transform:translateX(32px);
  border:1px solid var(--line);border-left:2px solid var(--cyan);background:rgba(10,18,32,.88);
  color:var(--txt);font-family:var(--mono);font-size:22px;cursor:pointer;backdrop-filter:blur(8px);
  opacity:0;pointer-events:none;transition:opacity .3s ease,transform .4s cubic-bezier(.2,.8,.2,1),border-color .2s,color .2s}
#mini-reset.visible{opacity:1;pointer-events:auto;transform:translateX(0)}
#mini-reset:hover,#mini-reset:focus-visible{color:var(--cyan);border-color:var(--cyan);outline:none}
#pc-badge{align-self:flex-start;font-family:var(--mono);font-size:15px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--amber);border:1px solid rgba(240,174,74,.5);padding:7px 14px;margin-top:8px}
</style>
</head>

function gridTexture(hex, nx, ny){
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 256;
  const c = cv.getContext('2d');
  c.strokeStyle = hex; c.lineWidth = 1.6; c.globalAlpha = 0.85;
  for(let i=0;i<=nx;i++){ const x=i/nx*254+1; c.beginPath(); c.moveTo(x,0); c.lineTo(x,256); c.stroke(); }
  for(let j=0;j<=ny;j++){ const y=j/ny*254+1; c.beginPath(); c.moveTo(0,y); c.lineTo(256,y); c.stroke(); }
  c.lineWidth = 0.6; c.globalAlpha = 0.35;
  for(let i=0;i<=nx*4;i++){ const x=i/(nx*4)*254+1; c.beginPath(); c.moveTo(x,0); c.lineTo(x,256); c.stroke(); }
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
function cornerLines(w, h, d, hex){
  const L = Math.min(w, d)*0.07, Lh = Math.min(L, h*0.45);
  const p = [];
  for(const a of [1,-1]) for(const b of [1,-1]) for(const c of [1,-1]){
    const x=a*w/2, y=b*h/2, z=c*d/2;
    p.push(x,y,z, x-a*L,y,z,  x,y,z, x,y-b*Lh,z,  x,y,z, x,y,z-c*L);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
  return new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color:hex, transparent:true, opacity:0 }));
}

// Основание слоя оценки: сами столбы живут уровнем выше — они общие для стопки
function собратьТЭО(g, physMats, wireMats, sb, st, col, FOOT, DEPTH){

  база.position.y = (sb + st)/2;
  g.add(база); physMats.push(базаМат);
}

/* Столбы ранжирования точек бурения. Стоят не в слое оценки, а в группе всего
   пласта: начинаются в геолого-гидродинамической модели — там, где по карте
   насыщенности лежат красные и зелёные зоны, — и проходят сквозь все три
   составляющие вверх. Поэтому при раздвижке слоёв они остаются на месте и
   прошивают стопку насквозь, показывая связь «запасы → мероприятие → эффект». */
/* Ствол одной точки. Вертикальная — отрезок. Горизонтальная — вертикаль,
   четверть окружности заворота и горизонталь по пласту; заворот кладём в
   нижнюю составляющую (ГГДМ), потому что уходить в горизонт ствол обязан
   ровно там, где по карте насыщенности лежит цель. `гориз` — азимут в
   радианах, им же разводим лежачие стволы, чтобы не легли друг на друга. */
function стволТочки(т, x, z, низ, верх, R = 34, L = 46){
  const P = [new THREE.Vector3(x, верх, z)];
  if(т.гориз === undefined){
    P.push(new THREE.Vector3(x, низ, z));
    return new THREE.CatmullRomCurve3(P);
  }
  const dx = Math.cos(т.гориз), dz = Math.sin(т.гориз);
  const кровля = низ + R;                        // выше — вертикаль, ниже — заворот
  P.push(new THREE.Vector3(x, кровля, z));
  /* Радиус берём заведомо большим: на малом дуга читается как колено, а
     заворот на промысле идёт метрами набора угла — на референсе это длинная
     мягкая кривая, а не угол. Шагов по дуге двадцать: на десяти на просвет
     видна огранка. */
  for(let i = 1; i <= 20; i++){
    const a = (Math.PI/2) * (i/20);
    P.push(new THREE.Vector3(x + dx*R*(1 - Math.cos(a)),
                             кровля - R*Math.sin(a),
                             z + dz*R*(1 - Math.cos(a))));
  }
  /* Горизонталь кладём не одной дальней точкой, а четырьмя: Catmull-Rom тянет
     кривую через опорные точки, и на стыке плотной дуги с одиночным дальним
     концом лежачая часть выгибалась горбом. */
  for(let i = 1; i <= 4; i++){
    const s = R + L*i/4;
    P.push(new THREE.Vector3(x + dx*s, низ, z + dz*s));
  }
  return new THREE.CatmullRomCurve3(P);
}

/* Две полосы высот вместо одной общей лесенки.

   Раньше все восемь столбов шли ровным шагом в 4 единицы. На таком шаге при
   вращении соседние макушки то и дело сходились в одну точку экрана, и столб
   прятался за столбом — на изометрии это читалось как ошибка сборки, а не как
   ранжирование. Теперь горизонтали занимают верхнюю полосу, наклонно-
   направленные — нижнюю, между полосами зазор, и внутри нижней шаг вырос
   вдвое: пересечься макушкам стало заметно труднее.

   Порядок высот по-прежнему говорит про отдачу, просто шкала разнесена по типу
   ствола. Соседство полос и есть высказывание слоя: горизонтальное бурение —
   не «чуть лучше», а другое решение.

   ПРИВЯЗКА — К СОСТАВЛЯЮЩЕЙ ТЭО, а не к слою целиком. Она занимает верхнюю
   треть пласта, то есть доли 0,67–1,0 его высоты, и столбы стоят вокруг неё:
   самый высокий чуть выступает над её кровлей, самый низкий чуть уходит под
   подошву, остальные внутри. Столб тогда читается как принадлежащий именно
   технико-экономической оценке.

   Сначала столбы поднимались много выше слоя и в разъехавшейся стопке лезли на
   контур скважины — чужой; потом, наоборот, утонули в пласте целиком. Отсюда
   узкая полоса вокруг составляющей.

   Доли, а не абсолютные единицы: высота модели поменяется — привязка устоит. */
const ВЫСОТЫ = {
  гориз:  { низ:1.03, размах:0.07 },   // верхняя полоса: чуть выше кровли ТЭО
  наклон: { низ:0.67, размах:0.28 },   // нижняя: от подошвы составляющей и внутрь
};

function собратьСтолбы(zoneG, yb, yt, FOOT, DEPTH, col, столбы, узлыСтолбов){
  const h3 = (yt - yb)/3;
  const низ = yb + h3*0.28 - 8;          // внутри слоя ГГДМ (он смещён вниз на 8), у зон насыщенности
  // границы рангов считаем внутри каждой полосы, иначе правка данных сдвинет шкалу
  const полоса = т => т.гориз === undefined ? 'наклон' : 'гориз';
  const края = {};
  for(const т of ТОЧКИ){
    const п = полоса(т), к = края[п] || (края[п] = { мин:т.ранг, макс:т.ранг });
    к.мин = Math.min(к.мин, т.ранг); к.макс = Math.max(к.макс, т.ранг);
  }

  for(const т of ТОЧКИ){
    const п = полоса(т), к = края[п], В = ВЫСОТЫ[п];
    const доля = 1 - (т.ранг - к.мин) / Math.max(1, к.макс - к.мин);   // 1 — лучшая в полосе
    const верх = yb + (yt - yb)*(В.низ + В.размах*доля);               // отдача читается высотой
    const L = верх - низ;
    // цвет — про тип ствола: зелёный у горизонтальных, красный у вертикальных
    const цвет = new THREE.Color(т.гориз === undefined ? '#F03A2E' : '#2FBF5B');
    const x = т.x * FOOT, z = т.z * DEPTH;

    /* Столб рисуем дважды. Плотный проход идёт с обычной глубиной: плиты его
       перекрывают, и в изометрии видно, что он именно входит в слой. Поверх —
       бледный «просвечивающий» дубль, чтобы путь читался и внутри стопки.
       Одним проходом поверх всего столб выглядел наклейкой сверху. */
    /* depthWrite обязательно снять: у прозрачного материала он включён по
       умолчанию, и при нулевой непрозрачности столб продолжал писать глубину —
       на соседних составляющих проступали чёрные полосы будущих столбов. */
    const мкА = new THREE.MeshStandardMaterial({ color:цвет, roughness:0.3, metalness:0.3,
      transparent:true, opacity:0, emissive:цвет, emissiveIntensity:0.45, depthWrite:false });
    const мкБ = new THREE.MeshBasicMaterial({ color:цвет, transparent:true, opacity:0,
      depthTest:false, depthWrite:false });

    /* Ствол ведём трубой по кривой, а не цилиндром: у горизонтальных точек он
       не прямой, и один и тот же путь должен отработать в обоих проходах. */
    const путь = стволТочки(т, x, z, низ, верх);
    const плотный = new THREE.Mesh(new THREE.TubeGeometry(путь, 64, 1.7, 10, false), мкА);
    zoneG.add(плотный);

    // чуть тоньше плотного — читается как след внутри породы
    const сквозь = new THREE.Mesh(new THREE.TubeGeometry(путь, 64, 1.36, 10, false), мкБ);
    сквозь.renderOrder = 5;
    zoneG.add(сквозь);

    /* Башмак на конце и шар на устье. Каждый — тоже в два прохода, как ствол.
       Одним плотным проходом их не видно: макушка стоит внутри составляющей, и
       плита закрывает шар целиком. Зелёные казались исключением только потому,
       что торчат выше остальных и их шар выходил над плитой. */
    const конец = путь.getPoint(1), касат = путь.getTangent(1).normalize();
    const наконечник = (гео, где, кват) => {
      const плотн = new THREE.Mesh(гео, мкА);
      плотн.position.copy(где);
      if(кват) плотн.quaternion.copy(кват);
      zoneG.add(плотн);
      const скв = new THREE.Mesh(гео, мкБ);     // геометрию делят, материал разный
      скв.position.copy(где);
      if(кват) скв.quaternion.copy(кват);
      скв.renderOrder = 6;                      // после ствола, чтобы концы читались на нём
      zoneG.add(скв);
      return [плотн, скв];
    };
    const поворот = new THREE.Quaternion()
      .setFromUnitVectors(new THREE.Vector3(0, 1, 0), касат);
    const башмаки = наконечник(new THREE.ConeGeometry(3.6, 7, 14), конец, поворот);
    const шары = наконечник(new THREE.SphereGeometry(2.8, 14, 12),
                            new THREE.Vector3(x, верх, z), null);

    const якорь = new THREE.Object3D();
    якорь.position.set(x, верх, z);
    zoneG.add(якорь);

    столбы.push(мкА, мкБ);
    узлыСтолбов.push(плотный, сквозь, ...башмаки, ...шары);
    меткиТЭО.push({ точка:т, узел:якорь });
  }
}

/* ── Акценты на наземке ────────────────────────────────────────────────────
   Модель наземного комплекса — один меш, отдельные объекты в нём не выделить.
   Поэтому обводим их сверху: кольца и линии по координатам, снятым с вида
   сверху, плюс HTML-подписи. Так видно, что именно оцифровано на каждом шаге. */
const НАЗ_ОБЪЕКТЫ = {
  инфра: {
    подпись: 'Резервуарный парк и трубопровод',
    кольца: [[54, -55, 34]],                       // x, z, радиус
    // трассу больше не рисуем полосой: вместо неё объёмный трубопровод с
    // бегущим потоком — см. собратьТрубопровод
    линии: [],
    метка: [54, -55],
  },
  добыча: {
    подпись: 'Фонд скважин под контролем',
    кольца: [[-64, 41, 24], [0, 41, 24], [64, 41, 24]],
    линии: [],

function собратьАкцентыНаземки(zoneG, yb, yt, col){
  const итог = {};
  /* Верх полосы — это макушка факела, а не земля: модель включает высокие
     объекты. Обводку кладём на поверхность промысла, иначе кольца висят в
     воздухе и в изометрии выглядят сдвинутыми относительно объектов. */
  const земля = yb + (yt - yb)*0.34;
  for(const ключ in НАЗ_ОБЪЕКТЫ){
    const набор = НАЗ_ОБЪЕКТЫ[ключ];
    const маты = [], узлы = [];
    const y = земля + 2;
    const мат = new THREE.MeshBasicMaterial({ color:col, transparent:true, opacity:0,
      depthTest:false, depthWrite:false });
    маты.push(мат);

    for(const [x, z, r] of набор.кольца){
      const кольцо = new THREE.Mesh(new THREE.TorusGeometry(r, 1.1, 8, 40), мат);
      кольцо.rotation.x = Math.PI/2;
      кольцо.position.set(x, y, z);
      кольцо.renderOrder = 7;
      zoneG.add(кольцо); узлы.push(кольцо);
      // засечки по кольцу — читается как «объект взят под контроль»
      for(let i=0;i<4;i++){
        const a = i/4*Math.PI*2 + Math.PI/4;
        const з = new THREE.Mesh(new THREE.BoxGeometry(r*0.22, 1.1, 2.2), мат);
        з.position.set(x + Math.cos(a)*r, y, z + Math.sin(a)*r);
        з.rotation.y = -a;
        з.renderOrder = 7;
        zoneG.add(з); узлы.push(з);
      }
    }
    for(const [[x1,z1],[x2,z2]] of набор.линии){
      const L = Math.hypot(x2-x1, z2-z1);
      const л = new THREE.Mesh(new THREE.BoxGeometry(L, 1.1, 2.6), мат);
      л.position.set((x1+x2)/2, y, (z1+z2)/2);
      л.rotation.y = -Math.atan2(z2-z1, x2-x1);
      л.renderOrder = 7;
      zoneG.add(л); узлы.push(л);
    }
    const якорь = new THREE.Object3D();
    якорь.position.set(набор.метка[0], y + 16, набор.метка[1]);
    zoneG.add(якорь);
    итог[ключ] = { маты, узлы, якорь, подпись:набор.подпись };
  }
  return итог;
}

/* ── трубопровод с бегущим потоком ────────────────────────────────────
   Показывается вместе с акцентом «Резервуарный парк и трубопровод»: от
   каждой станции ветка выходит к дорожному коридору (z = −2, там в модели
   и лежит трасса), магистраль собирает их и отводом уходит в резервуарный
   парк. По трубам бегут янтарные сгустки — направление всюду от устьев к
   хранилищу, у сгустка яркая голова по ходу движения.

   Поток сделан текстурой, а не частицами: тот же приём, что бегущая сетка
   голограмм, — сдвиг offset.x каждый кадр. Повтор узора пропорционален
   длине сегмента, поэтому скорость сгустков в единицах сцены одинакова на
   ветках и магистрали. */
function собратьТрубопровод(zoneG, y){
  // сегменты [от] → [к], по направлению потока; врезки без перекрытий
  const СЕГМЕНТЫ = [
    [[-74.8, 40], [-74.8, -2]],       // ветки от трёх станций
    [[  2.5, 40], [  2.5, -2]],
    [[ 74.4, 40], [ 74.4, -2]],
    [[-74.8, -2], [ 54,   -2]],       // магистраль с двух сторон к отводу
    [[ 74.4, -2], [ 54,   -2]],
    [[ 54,   -2], [ 54,  -24]],       // отвод в резервуарный парк
  ];
  const ШТРИХ = 20;                   // период сгустков, единицы сцены

  /* Корпус — тёмный и непрозрачный, а не светящийся: он перекрывает каркас
     слоя позади себя, и бегущие сгустки читаются на нём, а не тонут в сетке. */
  const корпусМат = new THREE.MeshBasicMaterial({ color:'#1A1006',
    transparent:true, opacity:0, depthTest:false, depthWrite:false });

  // сгусток: прозрачный хвост, раскалённая голова по ходу движения (+u текстуры)
  const cv = document.createElement('canvas'); cv.width = 128; cv.height = 16;
  const c = cv.getContext('2d');
  const гр = c.createLinearGradient(6, 0, 78, 0);
  гр.addColorStop(0, 'rgba(255,176,32,0)');
  гр.addColorStop(0.55, 'rgba(255,178,32,0.9)');
  гр.addColorStop(0.9, '#FFD87A');
  гр.addColorStop(1, '#FFF4D6');
  c.fillStyle = гр; c.fillRect(6, 2, 72, 12);

  const узлы = [], потокМаты = [], тексты = [];
  for(const [[x1, z1], [x2, z2]] of СЕГМЕНТЫ){
    const L = Math.hypot(x2 - x1, z2 - z1);
    const кривая = new THREE.LineCurve3(new THREE.Vector3(x1, y, z1),
                                        new THREE.Vector3(x2, y, z2));
    const корпус = new THREE.Mesh(new THREE.TubeGeometry(кривая, 1, 2.2, 10, false), корпусМат);
    корпус.renderOrder = 7;
    zoneG.add(корпус); узлы.push(корпус);

    const тек = new THREE.CanvasTexture(cv);
    тек.wrapS = тек.wrapT = THREE.RepeatWrapping;
    тек.repeat.set(Math.max(1, Math.round(L / ШТРИХ)), 1);
    const мп = new THREE.MeshBasicMaterial({ map:тек, transparent:true, opacity:0,
      blending:THREE.AdditiveBlending, depthTest:false, depthWrite:false });
    const поток = new THREE.Mesh(new THREE.TubeGeometry(кривая, 1, 2.45, 10, false), мп);
    поток.renderOrder = 8;
    zoneG.add(поток); узлы.push(поток);
    потокМаты.push(мп); тексты.push(тек);
  }
  return { узлы, корпусМат, потокМаты, тексты };
}

/* Шарошечное долото на забое одной из скважин: показываем, что бурение идёт
   прямо сейчас. Собрано геометрией, а не моделью — так оно вращается и
   встаёт точно по оси ствола. */
/* `ось` — куда долото бурит. По умолчанию вниз; на горизонтальном стволе
   передаётся касательная к забою, и группа разворачивается целиком. Шлам при
   этом уходит не «вверх», а назад по стволу — ровно как на промысле, где
   выбуренную породу выносит обратно к устью. */
function собратьДолото(zoneG, x, y, z, R, Hшлама, ось, безШтанги){
  const g = new THREE.Group();
  g.position.set(x, y, z);
  if(ось) g.quaternion.setFromUnitVectors(new THREE.Vector3(0, -1, 0), ось.clone().normalize());
  zoneG.add(g);

  // рисуем поверх плит: забой прячется внутри стопки, а показать надо именно его
  /* Металличность держим низкой: карты окружения в сцене нет, и при высокой
     металличности сталь отражать нечего — деталь уходит в чёрный силуэт. */
  const сталь = new THREE.MeshStandardMaterial({ color:'#AEB8C6', roughness:0.45, metalness:0.25,
    transparent:true, opacity:0, emissive:new THREE.Color('#3A4658'), emissiveIntensity:0.5,
    depthTest:false, depthWrite:false });
  const зуб = new THREE.MeshStandardMaterial({ color:'#E8C87A', roughness:0.3, metalness:0.7,
    transparent:true, opacity:0, emissive:new THREE.Color('#8A6A20'), emissiveIntensity:0.35,
    depthTest:false, depthWrite:false });

  const корпус = new THREE.Mesh(new THREE.CylinderGeometry(R*0.86, R*0.98, R*1.5, 16), сталь);
  корпус.position.y = R*1.5;
  корпус.renderOrder = 6;
  g.add(корпус);

  /* Бурильная штанга вверх по стволу — видно, что долото на конце колонны.
     На горизонтали её не рисуем: там колонну уже изображает сама труба ствола,
     а штанга длиннее лежачей части и торчала из неё палкой в пустоту. */
  if(!безШтанги){
    const штанга = new THREE.Mesh(new THREE.CylinderGeometry(R*0.34, R*0.34, R*7, 12), сталь);
    штанга.position.y = R*5.5;
    штанга.renderOrder = 6;
    g.add(штанга);
  }

  // три шарошки по окружности — узнаваемый силуэт трёхшарошечного долота
  const вращ = new THREE.Group();
  g.add(вращ);
  for(let i=0;i<3;i++){
    const a = i/3*Math.PI*2;
    const ш = new THREE.Mesh(new THREE.ConeGeometry(R*0.5, R*1.15, 12), сталь);
    ш.position.set(Math.cos(a)*R*0.52, R*0.55, Math.sin(a)*R*0.52);
    ш.rotation.set(Math.cos(a)*0.42, 0, -Math.sin(a)*0.42);
    ш.renderOrder = 6;
    вращ.add(ш);
    for(let k=0;k<7;k++){                       // зубья по шарошке
      const t = new THREE.Mesh(new THREE.SphereGeometry(R*0.11, 6, 5), зуб);
      const ang = k/7*Math.PI*2, r = R*0.3;
      t.position.set(ш.position.x + Math.cos(ang)*r, R*0.34 + (k%2)*R*0.22, ш.position.z + Math.sin(ang)*r);
      вращ.add(t);
    }
  }
  /* Шлам идёт от забоя вверх по всей высоте слоя — так видно, что порода
     выносится на поверхность, а не клубится у долота. */
  const H = Hшлама || R*3;
  const пыльМат = new THREE.PointsMaterial({ color:'#C7B48A', size:2.4, transparent:true,
    opacity:0, depthWrite:false, depthTest:false });
  const pg = new THREE.BufferGeometry();
  const N = 90, pos = new Float32Array(N*3), seed = new Float32Array(N);
  for(let i=0;i<N;i++){
    const a = Math.random()*Math.PI*2, r = R*(0.18 + Math.random()*0.55);
    pos[i*3] = Math.cos(a)*r; pos[i*3+2] = Math.sin(a)*r; pos[i*3+1] = Math.random()*H;
    seed[i] = Math.random()*H;
  }
  pg.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  const точки = new THREE.Points(pg, пыльМат);
  точки.renderOrder = 6;
  g.add(точки);

  const якорь = new THREE.Object3D();
  якорь.position.y = R*2.4;
  g.add(якорь);

  return { группа:g, вращ, маты:[сталь, зуб], пыль:{ гео:pg, мат:пыльМат, seed, n:N, H }, якорь };
}

function holoBox(w, h, d, cy, hex, cells=8, fillHex=0x0A2E3E){
  const g = new THREE.Group();
  const fill = new THREE.Mesh(new THREE.BoxGeometry(w, h, d),
    new THREE.MeshBasicMaterial({ color:fillHex, transparent:true, opacity:0, depthWrite:false }));
  const grid = new THREE.Mesh(new THREE.BoxGeometry(w+0.4, h+0.4, d+0.4),
    new THREE.MeshBasicMaterial({ map:gridTexture(hex, cells, Math.max(2, Math.round(cells*h/w))),
      transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide }));
  const edge = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(w+0.6, h+0.6, d+0.6)),
    new THREE.LineBasicMaterial({ color:hex, transparent:true, opacity:0 }));
  const corners = cornerLines(w+3.5, h+3.5, d+3.5, '#FFFFFF');
  g.add(fill, grid, edge, corners);
  g.position.y = cy;
  g.userData.parts = { fill, grid, edge, corners };
  return g;
}
