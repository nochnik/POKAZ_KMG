/* Физическая модель и её цифровой каркас живут в одной иерархии. Каркас
   добавляется ребёнком к исходному mesh: так трансформации отдельных деталей
   и анимация PumpCycle автоматически применяются к обеим версиям. Старый
   способ создавал новые Mesh только из geometry и терял node transforms — у
   составных GLB все детали оказывались бы в начале координат. */
function подготовитьМодель(root, цвет, физМаты, каркасМаты){
  const meshes = [];
  root.traverse(n => { if(n.isMesh) meshes.push(n); });
  for(const mesh of meshes){
    const исходные = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
    const физ = исходные.map(m => {
      const копия = m.clone();
      копия.transparent = true;
      физМаты.push(копия);
      return копия;
    });
    mesh.material = Array.isArray(mesh.material) ? физ : физ[0];

    const карМат = new THREE.MeshBasicMaterial({ color:цвет, wireframe:true,
      transparent:true, opacity:0, blending:THREE.AdditiveBlending,
      depthWrite:false });
    const каркас = new THREE.Mesh(mesh.geometry, карМат);
    каркас.renderOrder = 1;
    mesh.add(каркас);
    каркасМаты.push(карМат);
  }
  return root;
}

/* ── станки-качалки ───────────────────────────────────────────────────
   В модели наземки они есть, но качать в ней нечего: слой приходит одной
   сплошной сеткой на 49 439 вершин, без анимаций, и объекты в ней не
   разделены — разбор файла даёт всего семь связных кусков, крупнейший из
   которых вся плита вместе со станками. Отдельного узла у коромысла не
   существует, и появиться ему неоткуда.

   Поэтому три станка вырезаются из сетки коробкой и собираются заново из
   примитивов — тогда у коромысла есть свой узел и его можно качать.
   Геометрия взята с прототипа `первый_слайд_макет.html`, где станки качались
   до перехода на glb; там же и период хода.

   Координаты — в системе самой модели, замерены по её геометрии: центры трёх
   кластеров вершин, стоящих над площадками. Коробка режет от верха площадки
   (0,030) и выше: сама площадка и устьевой блок перед станком остаются на
   месте. Файл модели не трогается — вырезание идёт на загрузке, и чтобы всё
   вернуть, достаточно убрать этот блок.
   ──────────────────────────────────────────────────────────────────── */
const КАЧАЛКИ = {
  места: [ { x:-0.569, z:0.602 }, { x:0.018, z:0.608 }, { x:0.564, z:0.605 } ],
  /* Коробка реза, в осях модели наземки. Снимается вся станция вместе с
     насыпной площадкой: замер поля высот дал площадку 0,13 × 0,55 при уровне
     грунта между площадками −0,219, и станок на ней стоял как на постаменте.
     Режем от −0,21 — то есть всё, что поднимается над грунтом. */
  пх:0.075, дz0:-0.375, дz1:0.20,
  низ:-0.210, верх:0.30,
  /* Масштаб подобран по следу вырезанной станции: она 0,105 модели в ширину
     (14 единиц сцены) и 0,48 в длину (48). Присланный станок относительно
     шире и короче, поэтому берётся масштаб по ширине — по нему модель точно
     заходит в след, а высота остаётся свободной. */
  масштаб:31.5,                // единицы модели станка → единицы сцены
  ходов:14,                    // ходов в минуту — темп утверждён на пробной странице
  /* Плита заменяет снятую площадку. Она толстая не для вида: под срезанной
     площадкой в модели нет поверхности, и плита затыкает дыру — сверху видно
     только её верхнюю грань, вровень с грунтом. */
  плита:9,
  утопить:7.5,                 // на сколько станок сидит в плите, а не стоит на ней
  /* Плита шире реза на этот запас с каждой стороны: станок крупнее следа
     вырезанной площадки и свисал бы за её край. Лишнее уходит в грунт —
     верх плиты стоит с ним почти вровень, а вниз она уходит на всю толщину. */
  запас:5.5,
  /* Оцифровка станков — wireframe промежуточной плотности (~26 тыс.
     треугольников на станок): полная сетка в аддитивном смешении выгорала в
     белый при любом цвете, грубая читалась клеткой. Цвет свой — фиолетовый из
     палитры показа; цвет и яркость подбираются по одному числу. */
  цвет:'#9B7BE8',
  яркость:0.34,
};

/* Отладочный ключ `?станки=0` (или `?jacks=0`) собирает слой без станков —
   видно голые площадки после реза. На показ не влияет: без ключа всё как есть. */
const СТАНКИ_ВКЛ = (() => {
  const п = new URLSearchParams(location.search);
  const в = п.get('станки') ?? п.get('jacks');
  return !(в === '0' || в === 'нет' || в === 'no');
})();

/* ── механизм станка ──────────────────────────────────────────────────
   Станок приходит файлом `качалка_части.glb`: тот же присланный станок,
   разрезанный на раму, коромысло, кривошип и шатун и облегчённый с 1,6 млн
   треугольников до 308 тысяч (инструмент `качалка_на_части.js`). Оси взяты
   с самой модели и должны совпадать с теми, по которым шёл рез.

   Коромысло не качается по синусу: его ведёт шатун от кривошипа, и угол
   считается из треугольника «опора — палец коромысла — палец кривошипа».
   Отсюда несимметричный ход, которым настоящая качалка и отличается от
   игрушечной.

   Радиус кривошипа задан, а не взят из модели: в ней палец стоит в 0,086 от
   вала, при таком плече размах вышел бы едва заметным. 0,160 даёт 35° —
   как у настоящей. Вал стоит по центру тяжести противовесов, поэтому они
   вращаются вокруг себя. */
const МЕХ = {
  ось:  { x:-0.280, y: 0.560 },     // опора коромысла на стойке
  вал:  { x: 0.450, y:-0.148 },     // вал кривошипа
  палец:{ x: 0.484, y:-0.069 },     // палец кривошипа в исходной позе модели
  верх: { x: 0.250, y: 0.673 },     // палец на коромысле
  радиус: 0.160,
};
МЕХ.шатун = Math.hypot(МЕХ.верх.x-МЕХ.палец.x, МЕХ.верх.y-МЕХ.палец.y);
МЕХ.плечо = Math.hypot(МЕХ.верх.x-МЕХ.ось.x,   МЕХ.верх.y-МЕХ.ось.y);
МЕХ.ф0 = Math.atan2(МЕХ.палец.y-МЕХ.вал.y,  МЕХ.палец.x-МЕХ.вал.x);
МЕХ.б0 = Math.atan2(МЕХ.верх.y-МЕХ.ось.y,   МЕХ.верх.x-МЕХ.ось.x);
МЕХ.г0 = Math.atan2(МЕХ.верх.y-МЕХ.палец.y, МЕХ.верх.x-МЕХ.палец.x);

function положениеСтанка(ф){
  const cx = МЕХ.вал.x + МЕХ.радиус*Math.cos(ф);
  const cy = МЕХ.вал.y + МЕХ.радиус*Math.sin(ф);
  const dx = cx - МЕХ.ось.x, dy = cy - МЕХ.ось.y;
  const D = Math.hypot(dx, dy);
  const кос = Math.max(-1, Math.min(1,
    (МЕХ.плечо*МЕХ.плечо + D*D - МЕХ.шатун*МЕХ.шатун) / (2*МЕХ.плечо*D)));
  const б = Math.atan2(dy, dx) + Math.acos(кос);
  const bx = МЕХ.ось.x + МЕХ.плечо*Math.cos(б);
  const by = МЕХ.ось.y + МЕХ.плечо*Math.sin(б);
  return { б, cx, cy, г: Math.atan2(by-cy, bx-cx) };
}

/* Копия геометрии без треугольников, попавших в коробки станков. Режем по
   центру треугольника: по вершинам срез рвал бы соседние грани площадки. */
/* ── резервуарный парк ────────────────────────────────────────────────
   Коробка снята с самой сетки, а не подобрана на глаз: `где_баки.js` собирает
   занятость по XZ и выдаёт связные области высоких клеток, `высоты_баков.js`
   показывает распределение высот внутри коробки. Оттуда и числа.

   Нижняя граница по высоте важнее прочих: под баками лежит грунт, и без неё в
   выборку попадает плита промысла — каркас тогда рисуется по всей площадке, а
   не по резервуарам. Грунт здесь стоит на −0,22…−0,14, баки начинаются с
   −0,10 и кончаются крышами на 0,07. */
/* ── факел ────────────────────────────────────────────────────────────
   Снят с показа по просьбе заказчика: горящий факел на макете читается как
   сжигание попутного газа, а разговор идёт про цифровизацию. Убран и с ленты
   подводки, и отсюда — иначе он возвращался бы ровно в тот момент, когда живой
   слайд перехватывает картинку у видео, и стык бросался бы в глаза.

   Ствол стоит отдельно, между установкой подготовки и резервуарным парком;
   координаты сняты с сетки и сверены с указанием на скриншоте. Режем всё выше
   грунта: сам грунт в этой коробке лежит на −0,22…−0,14, площадка под факелом
   остаётся на месте, и дыры, в отличие от выреза станков, не образуется. */
const ФАКЕЛ = { x0:-0.05, x1:0.09, z0:-0.83, z1:-0.70, y:-0.13 };
const вФакеле = (x, y, z) =>
  x > ФАКЕЛ.x0 && x < ФАКЕЛ.x1 && z > ФАКЕЛ.z0 && z < ФАКЕЛ.z1 && y > ФАКЕЛ.y;

const ХРАНИЛИЩЕ = { x0:0.10, x1:0.78, z0:-0.88, z1:-0.28, y0:-0.12, y1:0.12 };
const вХранилище = (x, y, z) =>
  x > ХРАНИЛИЩЕ.x0 && x < ХРАНИЛИЩЕ.x1 &&
  z > ХРАНИЛИЩЕ.z0 && z < ХРАНИЛИЩЕ.z1 &&
  y > ХРАНИЛИЩЕ.y0 && y < ХРАНИЛИЩЕ.y1;

/* Разбор сетки на две по признаку: треугольник уходит туда, где его центр.
   Вершинный буфер общий, меняется только набор индексов — памяти это почти не
   стоит, а объект получает свою пару материалов и живёт своей жизнью. */
function частьСетки(geo, годится){
  const поз = geo.getAttribute('position');
  const инд = geo.getIndex();
  const всего = инд ? инд.count : поз.count;
  const свои = [];
  for(let t = 0; t < всего; t += 3){
    const a = инд ? инд.getX(t) : t, b = инд ? инд.getX(t+1) : t+1, c = инд ? инд.getX(t+2) : t+2;
    if(годится((поз.getX(a)+поз.getX(b)+поз.getX(c))/3,
               (поз.getY(a)+поз.getY(b)+поз.getY(c))/3,
               (поз.getZ(a)+поз.getZ(b)+поз.getZ(c))/3)) свои.push(a, b, c);
  }
  if(!свои.length) return null;
  const g = geo.clone();
  g.setIndex(свои);
  return g;
}

function безКачалок(geo){
  const поз = geo.getAttribute('position');
  const инд = geo.getIndex();
  const всего = инд ? инд.count : поз.count;
  const внутри = (x, y, z) => y >= КАЧАЛКИ.низ && y <= КАЧАЛКИ.верх &&
    КАЧАЛКИ.места.some(м => Math.abs(x - м.x) < КАЧАЛКИ.пх &&
                            z > м.z + КАЧАЛКИ.дz0 && z < м.z + КАЧАЛКИ.дz1);
  const оставить = [];
  for(let t = 0; t < всего; t += 3){
    const a = инд ? инд.getX(t) : t, b = инд ? инд.getX(t+1) : t+1, c = инд ? инд.getX(t+2) : t+2;
    if(внутри((поз.getX(a)+поз.getX(b)+поз.getX(c))/3,
              (поз.getY(a)+поз.getY(b)+поз.getY(c))/3,
              (поз.getZ(a)+поз.getZ(b)+поз.getZ(c))/3)) continue;
    оставить.push(a, b, c);
  }
  const g = geo.clone();
  g.setIndex(оставить);
  return g;
}

/* Один станок из загруженных частей. Каждая подвижная часть садится в свою
   группу, поставленную на ось вращения, а сама сетка внутри сдвигается на ту
   же ось назад — тогда вращение идёт вокруг настоящего шарнира, а не вокруг
   начала координат модели.

   Каркасная копия кладётся соседом в ту же группу: она качается вместе с
   железом, и отдельной анимации ей не нужно. */
function собратьСтанок(части, мат, кмат){
  const узел = (имя, ось) => {
    const г = new THREE.Group();
    if(ось) г.position.set(ось.x, ось.y, 0);
    // каркас берётся с огрублённой копии: на полной сетке wireframe сливается
    // в сплошное белое пятно, линий там в тысячу раз больше, чем у плит слоёв
    const сетки = [new THREE.Mesh(части[имя], мат),
                   new THREE.Mesh(части[имя + '_каркас'] || части[имя], кмат)];
    сетки[1].renderOrder = 1;         // каркас рисуется после железа своей же части
    for(const м of сетки){
      if(ось) м.position.set(-ось.x, -ось.y, 0);
      г.add(м);
    }
    return г;
  };
  const j = new THREE.Group();
  const коромысло = узел('коромысло', МЕХ.ось);
  const кривошип  = узел('кривошип',  МЕХ.вал);
  const шатун     = узел('шатун',     МЕХ.палец);
  j.add(узел('рама', null), коромысло, кривошип, шатун);
  return { группа:j, коромысло, кривошип, шатун };
}

/* Ставим станки на те же места, откуда вырезаны. Кладём их в `scaleG`, а не в
   группу модели: та растянута по осям неодинаково (ширина к глубине как
   1,32 к 1), и станок в ней поехал бы вслед за растяжением.

   Под каждым — своя плита. Она не украшение: под вырезанным станком в модели
   нет поверхности (корпус стоял прямо на грунте, настила под ним не сделано),
   и без плиты на месте реза осталась бы сквозная дыра. Плита повторяет след
   коробки реза, поэтому закрывает его целиком. */
function собратьКачалки(z, M, yb, части){
  const центр = M.box.getCenter(new THREE.Vector3());
  /* Сдвиг полигонов отодвигает железо на волос назад, чтобы каркас, снятый с
     огрублённой копии, не тонул в поверхности и не мерцал. У запечённых
     станков этой проблемы не было: там каркас был той же геометрией. */
  const мат = new THREE.MeshStandardMaterial({ color:'#3C4149', roughness:0.62,
    metalness:0.42, transparent:true,
    polygonOffset:true, polygonOffsetFactor:1, polygonOffsetUnits:1 });
  // плита под цвет грунта, а не чёрная: иначе под станком чёрный ящик
  const матПлиты = new THREE.MeshStandardMaterial({ color:'#93866D', roughness:0.97,
    metalness:0.03, transparent:true });
  /* Тот же приём, что у запечённых объектов слоя: wireframe ровно той же
     геометрии, что и железо, — линии лежат на поверхности, задние прячутся за
     корпусом. Огрублённые каркасы из файла не используются: пробовали и
     крупную сетку, и чертёж по рёбрам — на этой детали и то и другое выпадало
     из общей манеры. Цвет и яркость свои, см. КАЧАЛКИ. */
  const кмат = new THREE.MeshBasicMaterial({ color:КАЧАЛКИ.цвет, wireframe:true,
    transparent:true, opacity:0, blending:THREE.AdditiveBlending,
    depthWrite:false });
  /* Плита гаснет вместе со слоем, а сталь станка — нет: она уходит в двойник
     уже на наведении, вместе со своим каркасом. Иначе на наведении каркас лёг
     бы поверх целого железа и станок читался бы просто подсвеченным, а не
     оцифрованным. Плиту так гасить нельзя: под ней вырез в модели, и на
     физическом слое сквозь неё стала бы видна дыра. */
  z.physMats.push(матПлиты);
  z.мехФиз = [мат];
  // у каркаса станков своя кривая яркости: на плотной сетке общая выгорает в белый
  z.мехМат = кмат;
  z.качалки = [];

  const верхПлиты = yb + (КАЧАЛКИ.низ - M.box.min.y) * M.sY;
  const шПлиты = 2 * КАЧАЛКИ.пх * M.sX + 2 * КАЧАЛКИ.запас;
  const дПлиты = (КАЧАЛКИ.дz1 - КАЧАЛКИ.дz0) * M.sZ + 2 * КАЧАЛКИ.запас;
  const дцентр = (КАЧАЛКИ.дz1 + КАЧАЛКИ.дz0) / 2 * M.sZ;   // рез несимметричен по Z

  КАЧАЛКИ.места.forEach((место, i) => {
    const узел = new THREE.Group();
    узел.position.set((место.x - центр.x) * M.sX, верхПлиты, (место.z - центр.z) * M.sZ);
    z.scaleG.add(узел);

    const плита = new THREE.Mesh(new THREE.BoxGeometry(шПлиты, КАЧАЛКИ.плита, дПлиты), матПлиты);
    плита.position.set(0, -КАЧАЛКИ.плита/2, дцентр);
    узел.add(плита);

    const с = собратьСтанок(части, мат, кмат);
    с.группа.scale.setScalar(КАЧАЛКИ.масштаб);
    // коромысло идёт вдоль Z, как у вырезанных; разворот — головкой от зрителя
    с.группа.rotation.y = Math.PI/2;
    /* Низ рамы модели (−0,951) садится на верх плиты и уходит в неё на
       `утопить`: рама у станка толстая, и стоя на площадке он смотрится
       взгромождённым. Плита при этом остаётся на уровне настила — она закрывает
       дыру от реза, и опускать её вместе со станком нельзя. */
    с.группа.position.set(0, 0.951 * КАЧАЛКИ.масштаб - КАЧАЛКИ.утопить, дцентр);
    узел.add(с.группа);

    // сдвиг фазы: три станка, качающихся в такт, читаются как механизм, а не промысел
    z.качалки.push({ ...с, сдвиг:i * 60/КАЧАЛКИ.ходов/3 });
  });
}

async function build(){
  const roots = {};
  const animations = {};
  // верхняя составляющая пласта (ТЭО) собирается кодом — модель для неё не грузим
  const LOAD_IDS = ['plast1','plast2','skv','naz'];
  // грузим параллельно — общее время ≈ самый долгий файл, а не сумма всех
  let loaded = 0;
  await Promise.all(
    LOAD_IDS.map(id => loadLayer(id).then(g => {
      roots[id] = g.scene;
      animations[id] = g.animations || [];
      ++loaded;   // 18.09 (Адиль): служебные надписи загрузки убраны
    }))
  );

  // размеры и стек: ширина и глубина всех плит приводятся к одному футпринту
  const DEPTH = 190;
  const H_PLAST = 62;                       // суммарная высота трёх составляющих пласта
  const meta = {};
  for(const id of LOAD_IDS){
    const r = roots[id];
    r.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(r);
    const size = box.getSize(new THREE.Vector3());
    const sX = FOOT / size.x;
    const sZ = DEPTH / size.z;
    const sY = (id === 'naz') ? (sX+sZ)/2 : (TARGET_H[id] ? TARGET_H[id]/size.y : 1);
    meta[id] = { r, box, size, sX, sZ, sY, h: (id==='naz' ? size.y*sY : (TARGET_H[id] || 0)) };
  }
  // границы полос: наземка от 0 вверх, остальные вниз; лёгкий нахлёст убирает щели стыков
  const bands = {};
  bands.naz = [0, meta.naz.h];
  bands.skv = [-meta.skv.h, 0];
  bands.plast = [bands.skv[0]-H_PLAST, bands.skv[0]];
  let acc = 0;
  for(const [id, up] of [['skv',5],['plast',3]]){
    acc += up;
    bands[id][0] += acc; bands[id][1] += acc;
  }
  REST_OFFSET = вычислитьОтдых(bands);

  for(const id of RANK_UP){
    const M = meta[id];
    const [yb, yt] = bands[id];
    const z = zones[id] = { id, yb, yt, physMats:[], wireMats:[], holo:[], mix:0, target:0,
      offset:0, targetOffset:0, offsetX:0, targetOffsetX:0, scaleG:new THREE.Group() };
    world.add(z.scaleG);

    const place = mesh => {
      const center = M.box.getCenter(new THREE.Vector3());
      mesh.scale.set(M.sX, M.sY, M.sZ);
      mesh.position.set(-center.x*M.sX, yb - M.box.min.y*M.sY, -center.z*M.sZ);
    };

    // физическая версия (пласт собирается из 3 подслоёв ниже)
    if(id !== 'plast'){
      const physG = подготовитьМодель(M.r, holoColors[id][0], z.physMats, z.wireMats);
      if(id === 'skv'){
        // слой скважин повёрнут на −90°: штатные чёрные трубы встают рядом под качалками
        const center = M.box.getCenter(new THREE.Vector3());
        const inner = new THREE.Group();
        inner.position.set(-center.x, 0, -center.z);
        while(physG.children.length) inner.add(physG.children[0]);
        const rot = new THREE.Group();
        rot.rotation.y = -Math.PI/2;
        rot.add(inner);
        const outer = new THREE.Group();
        outer.add(rot);
        // Оси меняются местами из-за поворота, поэтому ширина считается по
        // size.z, а глубина по size.x. Множителя тут быть не должно: слой
        // вылезал на 5% за собственную голограмму и за соседние плиты.
        outer.scale.set(FOOT/M.size.z, M.sY, DEPTH/M.size.x);
        outer.position.set(0, yb - M.box.min.y*M.sY, 0);
        z.scaleG.add(outer);
      } else {
        place(physG);
        z.scaleG.add(physG);
        if(id === 'naz' && animations.naz.length){
          z.mixer = new THREE.AnimationMixer(M.r);
          animations.naz.forEach(clip => z.mixer.clipAction(clip).play());
        }
      }
    } else {
      // ЦД пласта: нижние две составляющие — модели, верхняя собирается кодом
      z.subs3d = [];
      const subIds = ['plast1','plast2','plast3'];
      const h3 = (yt-yb)/3;
      for(let si=0; si<3; si++){
        const col = ZONES.plast.subs[si].color || ZONES.plast.color;
        // составляющие идут снизу вверх: 01.1 — нижняя полоса, 01.3 — верхняя
        const sb = yb + h3*si, st = sb + h3;
        const wrap = new THREE.Group();
        const g = new THREE.Group();
        const physMats = [], wireMats = [];

        if(si === 2){
          /* Технико-экономическая оценка — не генерированная плита, а расчётный
             слой: от каждой точки бурения вверх идёт ствол, рядом цифры расчёта.
             Модель тут не нужна — считать и подписывать точнее в коде, и текст
             остаётся чётким (генератор кириллицу не выговаривает). */
          собратьТЭО(g, physMats, wireMats, sb, st, col, FOOT, DEPTH);
        } else {
          const Ms = meta[subIds[si]];
          const cS = Ms.box.getCenter(new THREE.Vector3());
          const sX = FOOT/Ms.size.x, sZ = DEPTH/Ms.size.z, sY = (h3-3)/Ms.size.y;
          Ms.r.traverse(n => {
            if(!n.isMesh) return;
            const pm = n.material.clone(); pm.transparent = true;
            g.add(new THREE.Mesh(n.geometry, pm)); physMats.push(pm);
            const wm = new THREE.MeshBasicMaterial({ color:col, wireframe:true, transparent:true,
              opacity:0, blending:THREE.AdditiveBlending, depthWrite:false });
            g.add(new THREE.Mesh(n.geometry, wm)); wireMats.push(wm);
          });
          g.scale.set(sX, sY, sZ);
          g.position.set(-cS.x*sX, sb - Ms.box.min.y*sY + 1.5, -cS.z*sZ);
        }
        wrap.add(g);
        const hb = holoBox(FOOT, h3-2.5, DEPTH, (st+sb)/2, col, 9, 0x3A280C);
        wrap.add(hb);
        z.scaleG.add(wrap);
        const hit = new THREE.Mesh(new THREE.BoxGeometry(FOOT, h3, DEPTH),
          new THREE.MeshBasicMaterial({ visible:false }));
        hit.position.y = (st+sb)/2;
        hit.userData.zone = 'plast'; hit.userData.sub = si;
        world.add(hit);
        pickMeshes.push(hit);
        // неподвижный близнец — наведение при незажатом слое проверяется по нему, см. restPickMeshes выше
        const restHit = hit.clone();
        restHit.position.y = (st+sb)/2 + REST_OFFSET.plast;
        world.add(restHit);
        restPickMeshes.push(restHit);
        z.subs3d.push({ wrap, physMats, wireMats, holo:hb.userData.parts, st, sb, hit, off:0, mix:0 });
      }
      z.столбы = []; z.узлыСтолбов = [];
      собратьСтолбы(z.scaleG, yb, yt, FOOT, DEPTH, ZONES.plast.color, z.столбы, z.узлыСтолбов);
    }

    // голограмма-обёртка (для наземки — только нижняя плита; пласт — 3 составляющие)
    const D2 = DEPTH;
    if(id === 'naz'){
      const hb = holoBox(FOOT, (yt-yb)*0.30, D2, yb + (yt-yb)*0.10, holoColors[id][0], 10, holoColors[id][1]);
      z.scaleG.add(hb); z.holo.push(hb.userData.parts);
      // обводка идёт янтарём, а не бирюзой контура: на бирюзовой голограмме
      // одноцветная разметка сливалась и объект переставал читаться
      z.акценты = собратьАкцентыНаземки(z.scaleG, yb, yt, '#FFB020');
      /* Трубопровод принадлежит акценту «инфра», но включается своим уровнем, а
         не вместе с кольцами: на шаге «Резервуарный парк и трубопровод» он
         выходит целиком, а на голом наведении на слой — приглушённым и один,
         без обводки и подписи. Поэтому его узлы в `н.узлы` не кладём. */
      z.труба = собратьТрубопровод(z.scaleG, yb + (yt - yb)*0.34 - 5);
    } else if(id === 'plast'){
      // голограммы подслоёв уже созданы вместе с клип-полосами выше
    } else {
      const hb = holoBox(FOOT, yt-yb, D2, (yb+yt)/2, holoColors[id][0], 9, holoColors[id][1]);
      z.scaleG.add(hb); z.holo.push(hb.userData.parts);
    }

    // ЦД скважины: бурение привязано к узлам обсадных труб новой GLB.
    if(id === 'skv'){
      /* В wells.glb каждая обсадная труба — отдельный узел. Берём их реальные
         границы после центровки, поворота и масштаба слоя. Прежние жёсткие
         координаты относились к старой модели, поэтому светлые трубы стояли
         рядом с чёрными. Теперь полная светлая оболочка ниже строится ровно
         по фактическому box каждой обсадной трубы. */
      z.scaleG.updateMatrixWorld(true);
      let WELLS = ['Well_01_hollow_casing','Well_02_hollow_casing','Well_03_hollow_casing']
        .map(name => {
          const узел = M.r.getObjectByName(name);
          if(!узел) return null;
          const box = new THREE.Box3().setFromObject(узел);
          const p = box.getCenter(new THREE.Vector3());
          const size = box.getSize(new THREE.Vector3());
          return { x:p.x, z:p.z, y0:box.min.y, y1:box.max.y,
                   rx:size.x/2, rz:size.z/2 };
        })
        .filter(Boolean);
      /* Некоторые экспортёры переименовывают повторно используемые GLTF-узлы.
         Запасные координаты вычислены из bounds новой wells.glb после того же
         поворота и масштаба, поэтому бурение не исчезнет при таком экспорте. */
      if(WELLS.length !== 3) WELLS = [
        {x:-77.5, z:92.3, y0:yb, y1:yt, rx:4.87, rz:2.68},
        {x:  0.2, z:92.3, y0:yb, y1:yt, rx:4.87, rz:2.68},
        {x: 78.0, z:92.3, y0:yb, y1:yt, rx:4.87, rz:2.68},
      ];
      WELLS.sort((a, b) => a.x - b.x);
      const R_PIPE = 4.2;
      const БУРИТСЯ = 1;                       // средняя скважина — в бурении
      const ГОРИЗОНТ = 2;                      // правая — горизонтальный ствол
      z.wellMats = [];
      WELLS.forEach((скв, wi) => {
        const {x:wx, z:wz, y0, y1, rx, rz} = скв;
        const вБурении = (wi === БУРИТСЯ || wi === ГОРИЗОНТ);
        const wm = вБурении
          ? new THREE.MeshStandardMaterial({ color:'#9AA5B4', roughness:0.5, metalness:0.25,
              transparent:true, opacity:0, emissive:new THREE.Color('#38414F'), emissiveIntensity:0.4,
              depthTest:false, depthWrite:false })
          : new THREE.MeshStandardMaterial({ color:'#9B7BE8', roughness:0.35, metalness:0.2,
              transparent:true, opacity:0, emissive:new THREE.Color('#9B7BE8'), emissiveIntensity:0,
              depthTest:false, depthWrite:false });
        (вБурении ? (z.бурМаты = z.бурМаты || []) : z.wellMats).push(wm);

        /* Полная светлая обсадка поверх чёрной. Размер и положение берутся из
           фактического world-box узла GLB, поэтому совпадают после любого
           поворота и неравномерного масштаба слоя. */
        const tube = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, y1-y0, 20), wm);
        /* Небольшой одинаковый допуск по X/Z выводит светлую оболочку поверх
           чёрной без z-fighting, не меняя её центр и пропорции эллипса. */
        tube.scale.set(rx*1.18, 1, rz*1.18);
        tube.position.set(wx, (y0+y1)/2, wz);
        tube.renderOrder = 6;
        z.scaleG.add(tube);
        for(const q of [0.25, 0.6]){
          const ring = new THREE.Mesh(new THREE.TorusGeometry(rx*1.28, Math.max(.55, rx*.13), 8, 22), wm);
          ring.scale.z = rz/rx;
          ring.rotation.x = Math.PI/2;
          ring.position.set(wx, y0 + (y1-y0)*q, wz);
          z.scaleG.add(ring);
        }

        // долото на забой — чуть ниже подошвы слоя, в просвет: там его видно;
        // шлам поднимается по стволу до кровли слоя
        if(wi === БУРИТСЯ){
          /* Продолжение идёт от нижнего торца обсадки до корпуса долота.
             Раньше корпус начинался сразу под основной трубой и давал форму
             «гриба»; ещё более старая длинная штанга, наоборот, торчала выше
             слоя. Здесь отдельный прямой участок соединяет их без обоих
             дефектов и остаётся строго на оси фактического GLB-узла. */
          const ПРОДОЛЖЕНИЕ = 22;
          const продолжение = new THREE.Mesh(
            new THREE.CylinderGeometry(1, 1, ПРОДОЛЖЕНИЕ, 20), wm);
          продолжение.scale.set(rx*1.18, 1, rz*1.18);
          продолжение.position.set(wx, y0 - ПРОДОЛЖЕНИЕ/2, wz);
          продолжение.renderOrder = 6;
          z.scaleG.add(продолжение);

          const R_ДОЛОТА = R_PIPE*2.3;
          // верх корпуса долота = 2,25R от начала его локальной группы
          const yДолота = y0 - ПРОДОЛЖЕНИЕ - R_ДОЛОТА*2.25 + 1;
          z.бурение = собратьДолото(z.scaleG, wx, yДолота, wz,
                                   R_ДОЛОТА, (yt - yb) + 12, null, true);
        }

        /* Горизонтальный ствол — вторая бурящаяся скважина. Одной кривой от
           кровли слоя: вертикаль, длинный набор угла и лежачая часть со своим
           долотом на забое.

           Всё держится внутри полосы слоя. Первая версия уводила заворот на
           сорок с лишним единиц под подошву — ствол проваливался в плиту
           пласта, там его съедала её геометрия, и на раздвижке слоёв он висел
           в пустоте.

           Азимут — ровно вдоль передней грани блока (−X). Разворот «в глубину»
           выглядел коротким огрызком: горизонталь уходила от камеры и вся
           длина съедалась ракурсом. Вдоль грани она видна в профиль, как на
           разрезах, и не налезает на соседние стволы. */
        if(wi === ГОРИЗОНТ){
          const гм = new THREE.MeshStandardMaterial({ color:'#9AA5B4', roughness:0.5, metalness:0.25,
            transparent:true, opacity:0, emissive:new THREE.Color('#38414F'), emissiveIntensity:0.45,
            depthWrite:false });
          (z.бурМаты = z.бурМаты || []).push(гм);
          /* Вертикальная часть уже восстановлена полной трубой выше. Изгиб
             начинается точно от её нижнего торца и продолжается в пласт. */
          const путь = стволТочки({ гориз:Math.PI }, wx, wz,
                                  y0 - 28, y0, 28, 30);
          const ствол = new THREE.Mesh(new THREE.TubeGeometry(путь, 96, R_PIPE*1.18, 12, false), гм);
          z.scaleG.add(ствол);

          // долото на забое горизонтали: разворачиваем по касательной, чтобы оно
          // именно уходило в пласт, а не висело поперёк ствола
          const конец = путь.getPoint(1), ход = путь.getTangent(1).normalize();
          z.бурениеГ = собратьДолото(z.scaleG, конец.x, конец.y, конец.z, R_PIPE*2.1, 46, ход, true);

          // якорь подписи — на середине лежачей части, там её ни с чем не спутать
          const якорь = new THREE.Object3D();
          якорь.position.copy(путь.getPoint(0.82));
          z.scaleG.add(якорь);
          z.горизонт = { якорь };
        }
      });
    }

    // частицы данных
    {
      const N = 130;
      const pos = new Float32Array(N*3), seed = new Float32Array(N*2);
      for(let i=0;i<N;i++){
        pos[i*3]   = (Math.random()-0.5)*FOOT*0.96;
        pos[i*3+1] = yb + Math.random()*(yt-yb);
        pos[i*3+2] = (Math.random()-0.5)*D2*0.96;
        seed[i*2] = Math.random()*(yt-yb);
        seed[i*2+1] = 4 + Math.random()*10;
      }
      const pg = new THREE.BufferGeometry();
      pg.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      const pmT = new THREE.PointsMaterial({ color:holoColors[id][0], size:2.4,
        transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false });
      const pts = new THREE.Points(pg, pmT);
      z.scaleG.add(pts);
      z.particles = { geo:pg, mat:pmT, seed, yb, yt, n:N };
    }

    // хитбокс (у пласта — свои по подслоям)
    if(id !== 'plast'){
      const hit = new THREE.Mesh(new THREE.BoxGeometry(FOOT, yt-yb, D2),
        new THREE.MeshBasicMaterial({ visible:false }));
      hit.position.y = (yb+yt)/2;
      hit.userData.zone = id;
      world.add(hit);
      pickMeshes.push(hit);
      z.hit = hit;
      // неподвижный близнец — наведение при незажатом слое проверяется по нему, см. restPickMeshes выше
      const restHit = hit.clone();
      restHit.position.y = (yb+yt)/2 + REST_OFFSET[id];
      world.add(restHit);
      restPickMeshes.push(restHit);
    }
  }

  // сместить весь стек так, чтобы центр масс был около цели камеры
  const stackTop = bands.naz[1], stackBot = bands.plast[0];
  const shift = -40 - (stackTop + stackBot)/2;
  world.position.y = shift;   // хитбоксы уже в world — двигаются вместе со стеком

  document.getElementById('loader').classList.add('done');
}
build().catch(e => { document.getElementById('loadmsg').textContent = 'Ошибка: ' + e.message; });

/* ================================================================
   ИНТЕРАКЦИЯ
   ================================================================ */
const state = { hover:null, hoverSub:null, locked:null, launching:null, closing:null, openId:null, camAz:0, camRadius:0, launchRadius:0, launchPolar:0, launchAt:0, closeAt:0, viewShiftX:0, viewShiftTargetX:0, viewShiftОт:0, переходАт:0 };
// РАСКРЫТА объявлена выше, у pickMeshes: она нужна ещё в build() для вычисляемых там restPickMeshes
const panelState = { zone:null, sub:null };
const active = () => state.locked || state.hover;

/* ── раскрытие слоя ───────────────────────────────────────────────────
   Второй клик по уже выбранному слою — по решению отказались от перехода на
   отдельную страницу; теперь это раскрытие в том же кадре: соседние контуры
   уезжают в левый нижний угол и пропадают там, список слева отпускает своё
   место панели контура (#panel переезжает туда же), а справа въезжает
   контент слоя на 70% экрана.

   «Налево» — это мировой −X, а не «влево от текущей камеры»: автовращение
   к моменту второго клика могло увести камеру куда угодно, и если крутить
   при этом только сам слой (как было раньше), соседи уезжают в мировом −X,
   который в этот момент может смотреть куда угодно на экране — визуально
   «непонятно куда». Поэтому вместо поворота слоя разворачиваем камеру: она
   плавно возвращается к азимуту старта показа (тому, под которым модель
   стоит «лицом» и «налево» на экране совпадает с мировым −X), а соседи тем
   же ходом уезжают за левый край и вниз. Радиус и высота обзора (наклон) при
   этом не трогаются — только азимут, чтобы не менять приближение и ракурс,
   который выставил себе докладчик. */
const СТАРТ_АЗИМУТ = Math.atan2(camera.position.x, camera.position.z);
// Радиус и наклон той же стартовой точки — нужны при закрытии (closeProject),
// куда возвращаемся не от клика, а от уже устоявшегося раскрытого состояния.
const ДЕФОЛТ_РАДИУС = camera.position.length();
const ДЕФОЛТ_ПОЛЯР = Math.acos(THREE.MathUtils.clamp(camera.position.y / ДЕФОЛТ_РАДИУС, -1, 1));
const УХОД_ВЛЕВО = 580;         // за габарит стопки и панели слева — с запасом
const УХОД_ВНИЗ = 260;          // и вниз, в тот же угол — «левый нижний», а не просто «налево»
/* Стопка при открытом контенте — миниатюра в левом нижнем углу ЭКРАНА. Место
   задано в долях высоты окна, а не мировыми числами: прежние −260/−150 в
   единицах сцены зависели от того, где стоит камера, и на другом размере окна
   миниатюра оказывалась то под панелью, то за краем кадра. Всё измеряется от
   высоты окна, потому что и сама модель на экране растёт вместе с ней.
   MINI_HEIGHT_RATIO ещё и отдана панели через CSS-переменную: панель не
   должна заезжать в угол, поэтому её max-height считается от неё же. */
const MINI_SCALE = 0.50;
const MINI_HEIGHT_RATIO = 0.39;
const MINI_ASPECT_RATIO = 0.90;
const MINI_MARGIN = 34;
const MINI_TRANSITION_MS = 900;
document.documentElement.style.setProperty('--мини-высота', (MINI_HEIGHT_RATIO*100) + 'vh');
document.documentElement.style.setProperty('--mini-width', (MINI_HEIGHT_RATIO*MINI_ASPECT_RATIO*100) + 'vh');
document.documentElement.style.setProperty('--mini-half-height', (MINI_HEIGHT_RATIO*50) + 'vh');
document.documentElement.style.setProperty('--mini-margin', MINI_MARGIN + 'px');
const _forward = new THREE.Vector3(), _right = new THREE.Vector3(), _up = new THREE.Vector3(), _cameraToStack = new THREE.Vector3();
/* Куда сдвинуть стопку в мире, чтобы её центр встал в центр углового места.
   Сдвиг идёт строго в плоскости, перпендикулярной взгляду камеры (вправо и
   вверх от неё, а не по мировым X/Y): глубина центра при этом не меняется и
   пиксели переводятся в мировые единицы одним множителем. Через мировой X
   «влево» на экране было бы зависимо от азимута, на котором камеру остановило
   автовращение, — то же, из-за чего раньше разворачивали камеру (см. выше). */
function getMiniStackOffset(out){
  const W = innerWidth, H = innerHeight;
  const boxHeight = H*MINI_HEIGHT_RATIO, boxWidth = boxHeight*MINI_ASPECT_RATIO;
  const centerX = MINI_MARGIN + boxWidth/2, centerY = H - MINI_MARGIN - boxHeight/2;
  camera.getWorldDirection(_forward);
  _right.crossVectors(_forward, camera.up).normalize();
  _up.crossVectors(_right, _forward);
  _cameraToStack.set(0, world.position.y, 0).sub(camera.position);
  const depth = _cameraToStack.dot(_forward);
  const worldUnitsPerPixel = depth*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)) / (H/2);

const ОТКРЫТИЕ_МАСШТАБ = 0.3;   // насколько плита подрастает сверх обычного укрупнения — эффект раскрытия
const ВОЗВРАТ_МС = 350;         // сколько отведено камере, чтобы довернуть азимут — соло, до всего остального

let launchT1 = null;
function launchProject(id, isSwitch = false){
  if(state.launching || state.closing) return;
  if(state.openId && !isSwitch) return;
  // Один клик — сразу выбор слоя и открытие его контента, без промежуточного
  // состояния и без таймера второго нажатия.
  if(isSwitch && state.openId === 'plast' && state.plastSubПреждеПерехода !== undefined){
    panelState.sub = state.plastSubПреждеПерехода;   // уходим с пласта — его прежний выбор возвращаем
  }
  state.locked = id;
  state.hover = null; state.hoverSub = null;
  controls.autoRotate = false;
  controls.enabled = false;
  // камера при переключении уже стоит на месте и ведётся вручную — заново её не снимаем
  if(!isSwitch){
    const off = new THREE.Vector3().copy(camera.position).sub(controls.target);
    state.launchRadius = off.length();
    state.launchPolar = Math.acos(THREE.MathUtils.clamp(off.y / state.launchRadius, -1, 1));
    state.camAz = camAzimuth();
    state.camRadius = state.launchRadius;
  }
  /* ЦД пласта по клику на общий контур раскрывается сразу на «Стратегию»
     (сцена «01.2»): у ГГДМ нет своего внешнего инструмента (23.09 — «нижний
     слой без ссылки»), а раскрытие с недоступной ссылки читалось бы как
     заглушка. Прежний выбор запоминаем — при отмене раскрытия (Esc)
     возвращаем как было, а не оставляем «Стратегию» навязанной. */
  if(id === 'plast'){
    state.plastSubПреждеПерехода = panelState.sub;
    const hasSelectedStep = panelState.zone === 'plast' && panelState.sub !== null && panelState.sub !== 0;
    panelState.zone = 'plast';
    if(!hasSelectedStep) panelState.sub = 1;
  }
  openProject(id);
}
// Esc посреди раскрытия: анимация отменяется, слои возвращаются как были —
// возможность передумать важнее строгой одноразовости перехода.

function openProject(id){
  const isSwitch = state.openId !== null;   // слой уже раскрыт: стопка стоит в углу, меняется только содержимое

let contentSwapTimer = null;

/* Ставит компактную панель контура ровно под текущим списком — высота списка
   зависит от того, сколько шагов у раскрытого контура (у пласта три, у
   остальных по два), и подгонять её числом в CSS означало бы либо наезжать
   на список при длинном варианте, либо зря пустовать при коротком. max-height
   тоже пересчитывается — чтобы панель не заехала за нижний край экрана. */
function позиционироватьПанель(){
  const panel = $('panel');
  if(!panel.classList.contains('раскрыт')) return;
  const отступ = 24, поле = 26;
  const верх = $('stack').getBoundingClientRect().bottom + отступ;
  panel.style.top = верх + 'px';
  /* Нижняя граница безусловная: показ важнее — пусть панель станет тесной и
     потребует внутренней прокрутки (overflow-y:auto), но не выйдет ниже края
     экрана. Пол в 80px раньше стоял и на узком экране с длинным (у пласта —
     трёхшаговым) списком верх съедал почти всю высоту — пол пересиливал
     остаток места и панель на ~40px вылезала за низ окна (замеченный баг).
     Доступного места может не хватить и на 80px — тогда просто отдаём то,
     что осталось, вплоть до нуля, а не гарантированный минимум. */
  const доступно = Math.max(0, innerHeight - верх - поле);
  panel.style.maxHeight = Math.min(innerHeight*0.34, доступно) + 'px';

/* Переключение на другой слой, пока один уже раскрыт (клик по миниатюре в
