<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>КМГ — цифровая цепочка</title>
<style>
/* Палитра и шрифты перенесены из ЦД через AIAN: заказчик просил у всех показов
   один стиль. Собственного набора цветов здесь нет намеренно — показы стоят
   рядом на одном стенде, и разнобой читается как разные продукты.
   Фирменный синий КМГ добавлен отдельно: он замерен по логотипу подсчётом
   пикселей, а не подобран на глаз. */
:root{
  --кмг:#02AEF0; --кмг_свет:#90D6F7;
  --циан:#4FE3FF; --мята:#3EE6B8; --янтарь:#F0AE4A; --зелёный:#3ED598; --красный:#FF5A4F;
  /* сквозные слои: голубой и фиолетовый из палитры ЦД. Зелёный сюда не взят —
     он уже занят готовностью материала, а один цвет не может значить двух вещей */
  --голубой:#8FBAF0; --виолет:#9B7BE8;
  --фон0:#050810; --фон1:#0C1626;
  --грань:#1B2E48; --грань_мягкая:#142338;
  --текст:#D7E2F2; --текст2:#AFC0D8; --приглуш:#7C8DA6;
  /* Ширина узла веера. Держится здесь, потому что от неё зависит и раскладка
     узлов, и масштаб наезда: JS читает её у настоящего элемента. */
  --узел-ширина:min(26vw,300px);
}
/* Шрифты самохостятся: в зале может не быть интернета, а показ обязан
   открыться. Фоллбек на системные — если woff2 не дойдёт, экран живёт. */
@font-face{font-family:'Unbounded';font-weight:500 700;font-display:swap;
  src:url('медиа/шрифты/унб_700_cyrillic.woff2') format('woff2');
  unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Unbounded';font-weight:500 700;font-display:swap;
  src:url('медиа/шрифты/унб_700_latin.woff2') format('woff2');
  unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:'Golos Text';font-weight:400 600;font-display:swap;
  src:url('медиа/шрифты/голос_400_cyrillic.woff2') format('woff2');
  unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Golos Text';font-weight:400 600;font-display:swap;
  src:url('медиа/шрифты/голос_400_latin.woff2') format('woff2');
  unicode-range:U+0000-00FF,U+2000-206F}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  /* Фон страницы чёрный, а свет стола лежит внутри сцены (.подложка).
     Причина не косметическая: .сцена создаёт свой контекст наложения из-за
     transform, и площадки в режиме screen смешивались не с градиентом
     страницы, а с прозрачностью внутри контекста — из-за чего вокруг каждой
     площадки стоял чёрный прямоугольник. Проверено подменой режима на normal:
     прямоугольники становились явными, на чёрном фоне исчезали совсем. */
  background:#000;
  color:var(--текст);
  font-family:'Golos Text',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.55;overflow:hidden;touch-action:manipulation;
  -webkit-font-smoothing:antialiased;
}
/* дисплейный шрифт — только знаковым вещам: имя экрана, названия переделов,
   имя проекта. Подписи остаются в Golos: Unbounded широкий, строки не влезут */
.дисплей{font-family:'Unbounded',system-ui,sans-serif;letter-spacing:.01em}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--кмг);outline-offset:4px;border-radius:4px}
.надпись{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--приглуш)}

/* ================= шапка и путь ================= */
.шапка{position:fixed;inset:0 0 auto 0;z-index:40;padding:20px 34px 0;
  display:flex;justify-content:space-between;align-items:flex-start;gap:20px;
  pointer-events:none}
.шапка > *{pointer-events:auto}
h1{font-size:clamp(19px,2vw,27px);font-weight:700;margin-top:5px}
/* Трёхточечный градиент на коротком слове читался пятном: светлый край,
   тёмная середина, светлый край — заказчик это и заметил. Он предложил либо
   убрать градиент, либо оживить его. Оживляю: блик медленно проходит по слову,
   и то, что было пятном, читается как движение света.

   Полотно втрое шире слова, поэтому блик успевает уйти и вернуться, а не
   дёргается на месте. Двенадцать секунд — на грани заметности: докладчик
   говорит, а не смотрит на заголовок.

   Перелив идёт только на уровне 0. Внутри передела и на экране системы
   заголовок остаётся, и мерцающая строка там отвлекала бы от того, ради чего
   туда провалились. */
h1 .град{background:linear-gradient(100deg,
    var(--кмг) 0%, var(--кмг) 30%, #EAF9FF 42%, var(--кмг_свет) 54%, var(--кмг) 70%, var(--кмг) 100%);
  background-size:300% 100%;background-position:100% 0;
  -webkit-background-clip:text;background-clip:text;color:transparent}
body:not(.вглубь) h1 .град{animation:перелив 12s ease-in-out infinite}
@keyframes перелив{0%{background-position:100% 0}
  55%{background-position:0% 0}100%{background-position:100% 0}}
.шапка_п{display:flex;align-items:center;gap:14px}
/* Логотип заказчика тёмный и на чёрном не читается: выбеливаем фильтром,
   исходный файл остаётся как был. Инверсную версию надо запросить у
   пресс-службы — перекраска фирменного знака это временная мера. */
#лого{height:40px;filter:brightness(0) invert(1);opacity:.9}
.метка_драфт{font-size:10px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--янтарь);border:1px solid var(--янтарь);border-radius:999px;
  padding:5px 11px;opacity:.85}

/* Отступ пересчитан после того, как из шапки убрали строку форумов: она
   держала высоту, и без неё между заголовком и строкой возврата зияла дыра. */
.путь{position:fixed;left:34px;top:82px;z-index:40;display:flex;align-items:center;gap:12px;
  opacity:0;pointer-events:none;transition:opacity .3s}
body.вглубь .путь{opacity:1;pointer-events:auto}
.путь button{display:inline-flex;align-items:center;gap:8px;color:var(--текст2);
  border:1px solid var(--грань);border-radius:8px;padding:7px 13px;font-size:11.5px;
  transition:border-color .2s,color .2s,background .2s}
.путь button:hover{border-color:var(--кмг);color:var(--кмг);background:rgba(2,174,240,.08)}
.путь .где{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--приглуш)}

/* ================= стол и сцена ================= */
.стол{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}
.сцена{position:relative;width:min(100vw, calc(100vh * 2560 / 1098));
  aspect-ratio:2560/1098;transform-origin:0 0;
  transition:transform 900ms cubic-bezier(.22,.7,.24,1)}

/* Свет стола. Растянут далеко за пределы сцены, чтобы его край не влез в кадр,
   и намеренно оставлен внутри .сцены: при наезде он едет вместе с макетом, как
   и положено свету, падающему на стол. */
.подложка{position:absolute;inset:-60%;pointer-events:none;
  background:radial-gradient(46% 40% at 50% 62%, var(--фон1) 0%, var(--фон0) 46%, #000 76%);
  animation:дыхание 19s ease-in-out infinite}
@keyframes дыхание{0%,100%{opacity:.86}50%{opacity:1}}

/* Линия связи рисуется кодом, а не лежит в картинке: она обязана тянуться
   между площадками при любом их сдвиге, а нарисованную пришлось бы
   перегенерировать после каждой правки раскладки. */
.линия{position:absolute;left:0;right:0;top:var(--низ,66%);height:2px;
  background:linear-gradient(90deg,transparent 0%,var(--кмг) 6%,var(--кмг) 94%,transparent 100%);
  box-shadow:0 0 14px rgba(2,174,240,.75);opacity:.9}
/* Импульсы по линии — единственное движение, которое честно означает смысл:
   по цепочке идёт поток. Остальная фоновая анимация только оживляет кадр. */
.импульс{position:absolute;top:-3px;width:64px;height:8px;border-radius:4px;
  background:linear-gradient(90deg,transparent,var(--кмг_свет),transparent);
  filter:blur(1px);animation:бег 7s linear infinite}
@keyframes бег{0%{left:-6%;opacity:0}8%{opacity:1}92%{opacity:1}100%{left:102%;opacity:0}}

/* Площадки лежат на чёрном фоне до нуля по яркости (замерено: углы 0,1–0,3 из
   255), поэтому кладутся режимом screen — чёрное ничего не добавляет. Вырезать
   их порогом не нужно: на прошлой сборке порог съедал грунт по контуру. */
.площадка{position:absolute;mix-blend-mode:screen;
  transition:opacity .42s ease;
  animation:парение var(--период,9s) ease-in-out var(--сдвиг,0s) infinite;
  will-change:transform}
.площадка img,.площадка video{width:100%;height:100%;display:block}
/* Периоды у площадок разные и не кратные друг другу: с одинаковым периодом
   ряд начинает дышать как один предмет, и макет читается картинкой, а не
   набором объектов. */
/* Размах замерен, а не подобран: при 0,9% высоты слоя смещение выходило
   2,6 px на экране 1600 px — движения не видно вовсе. 1,8% дают около 5 px:
   боковым зрением читается, речи докладчика не мешает. */
@keyframes парение{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.8%)}}

/* Ореол под основанием: пульсирует в том же ритме, что и парение своей
   площадки, поэтому свет читается принадлежащим объекту, а не фону. */
.ореол{position:absolute;pointer-events:none;border-radius:50%;
  background:radial-gradient(closest-side, rgba(2,174,240,.30), transparent 72%);
  animation:тление var(--период,9s) ease-in-out var(--сдвиг,0s) infinite}
@keyframes тление{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}

/* Зона клика невидима совсем. Раньше при наведении она подсвечивалась
   прямоугольником — заказчику это не понравилось, и по делу: модуль
   восьмиугольный, стоит на чёрном столе, а вокруг него загоралась
   прямоугольная плашка. Она выдавала разметку интерфейса там, где зритель
   видит предмет на столе.

   Вместо подсветки предмет РЕАГИРУЕТ: приподнимается и ярче светится ореол под
   ним. Это то же самое, что сделал бы человек, беря макет в руки, и не требует
   рисовать ни одной новой фигуры. */
.зона{position:absolute;cursor:pointer}
body.вглубь .зона{pointer-events:none}

/* Подъём вешается на картинку внутри площадки, а не на саму площадку: у
   площадки уже занят transform анимацией парения, и второй transform на том же
   элементе её бы перебил. */
.площадка img,.площадка video{transition:transform .34s cubic-bezier(.34,1.4,.5,1)}
.площадка.поднята img,.площадка.поднята video{transform:translateY(-2.2%) scale(1.02)}
/* Ореол ярчает фильтром, а не прозрачностью: прозрачность и масштаб у него
   заняты анимацией тления. */
.ореол{transition:filter .34s ease}
.ореол.ярче{filter:brightness(2.1) saturate(1.15)}

.бирка{position:absolute;transform:translate(-50%,0);text-align:center;
  white-space:nowrap;pointer-events:none;transition:opacity .32s ease}
.бирка.сверху{transform:translate(-50%,-100%)}
.бирка .номер{font-size:9.5px;letter-spacing:.24em;color:var(--кмг);opacity:.8}
.бирка .имя{font-size:13.5px;font-weight:700;margin-top:2px;text-shadow:0 2px 14px #000}
.бирка .счёт{font-size:10.5px;color:var(--приглуш);margin-top:1px}

/* Скобки стадий. Подписаны над цепочкой, а не в легенде: докладчик показывает
   рукой на группу объектов, и надпись должна быть там же, где рука. */
.скоба{position:absolute;text-align:center;pointer-events:none;transition:opacity .32s}
.скоба .черта{height:1px;width:100%;opacity:.4}
/* Крупнее по просьбе заказчика: стадия — это то, что докладчик называет
   первым, и с расстояния она читалась хуже подписей переделов под ней. */
.скоба .имя{font-family:'Unbounded',system-ui,sans-serif;font-size:15px;letter-spacing:.24em;
  text-transform:uppercase;margin-bottom:8px}
body.вглубь .скоба{opacity:0}

/* ================= сквозные слои ================= */
/* Мысль сценария v2 прежняя: эти продукты работают не на одной стадии, а на
   всех сразу. Менялся способ показать это.

   Полоса во всю ширину под цепочкой отклонена заказчиком: две широкие плашки
   с текстом перетягивали внимание на себя и читались как ещё два передела, а
   не как слой под ними. Теперь слой — такой же значок, как система, но стоит
   на ОТДЕЛЬНОЙ ЛИНИИ ниже цепочки, а от каждого передела к этой линии идёт
   тонкая связка. Связки и говорят то, ради чего всё затевалось: слой лежит
   под всеми шестью, а не рядом с ними. */
/* Вторая линия и связки к ней. Рисуются кодом по тем же причинам, что и линия
   связи: раскладка правится числом, а нарисованное пришлось бы перегенерировать. */
.линия2{position:absolute;left:6%;right:6%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(143,186,240,.55) 12%,
    rgba(155,123,232,.55) 88%,transparent);opacity:.8}
.связка{position:absolute;width:1px;
  background:linear-gradient(180deg,rgba(2,174,240,.45),rgba(143,186,240,.18));
  opacity:.55;pointer-events:none}
body.вглубь .линия2,body.вглубь .связка{opacity:0;transition:opacity .42s}

/* ================= узлы систем ================= */
/* Узлы живут в экранных координатах, а не внутри .сцены: сцена при наезде
   масштабируется в 2,4 раза, и подписи узлов уехали бы вместе с ней в палец
   высотой. Место веера считается числом, а не замеряется у элемента — во
   время перехода замер отдаёт промежуточные значения. */
.веер{position:fixed;inset:0;z-index:12;pointer-events:none}
.узел{position:absolute;transform:translate(-50%,-50%);text-align:center;
  cursor:pointer;opacity:0;pointer-events:none;transition:opacity .45s ease;
  width:var(--узел-ширина)}
.узел.виден{opacity:1;pointer-events:auto}
.узел.ушёл{opacity:0;pointer-events:none}
/* Размер знака рос дважды по замечаниям заказчика: 52 → 72 → 110. Правая
   половина кадра под веер всё равно оставалась полупустой, а иконка с рисунком
   при 72 px читалась хуже подписи под ней — знак должен опознаваться раньше,
   чем прочитано имя, иначе он лишний. Ограничение сверху — просвет между
   подписью передела и веером: он меряется в наездПодПросвет(), и слишком
   широкий узел начинает сдавливать саму площадку. */
.узел .кружок{width:110px;height:110px;margin:0 auto;border-radius:50%;position:relative;
  display:grid;place-items:center;transition:transform .2s}
.узел:hover .кружок{transform:scale(1.1)}
/* Ядро осталось запасным видом: если иконка для системы не найдена, узел
   рисуется точкой, а не пустым кружком. Молча ломаться он не должен. */
.узел .ядро{width:32px;height:32px;border-radius:50%;background:currentColor}
/* Знак сохраняет собственный фирменный синий и не красится в цвет стадии:
   цвет стадии несут волна под ним, подпись передела и строка возврата, а
   иконка отвечает за узнавание продукта. Один цвет не может значить двух
   вещей — стадию и систему. */
.узел .знак{width:100%;height:100%;display:block;object-fit:contain;
  filter:drop-shadow(0 0 12px rgba(2,174,240,.55))}
.узел .волна{position:absolute;inset:0;border-radius:50%;background:currentColor;
  animation:пульс 3.2s ease-in-out infinite}
@keyframes пульс{0%,100%{transform:scale(1);opacity:.26}50%{transform:scale(1.5);opacity:.05}}
/* Кегль подписи против размера значка. При значке 110 px подпись в 15 px
   занимала около 14% его высоты и читалась приписью к картинке, а не именем
   системы — заказчик это и заметил. 20 px дают примерно 18%: имя весит
   наравне со значком, но не спорит с ним.

   Плашка состояния поднята следом. Она служебная и должна оставаться мельче
   имени, но на 9,5 px рядом с двадцатым кеглем читалась случайной крошкой. */
.узел .подпись{font-family:'Unbounded',system-ui,sans-serif;font-size:20px;font-weight:700;
  color:var(--текст);margin-top:15px;line-height:1.25;text-shadow:0 2px 12px #000}
.узел .сост{margin-top:10px}

.сост{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;letter-spacing:.09em;
  text-transform:uppercase;padding:4px 10px;border-radius:5px;white-space:nowrap}
.сост::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.сост.готово{background:rgba(62,213,152,.13);color:var(--зелёный)}
.сост.демо{background:rgba(62,230,184,.13);color:var(--мята)}
.сост.делается{background:rgba(255,90,79,.13);color:var(--красный)}
.сост.слайды{background:rgba(124,141,166,.15);color:var(--приглуш)}

/* ================= подпись передела ================= */
#подпись_передела{position:fixed;z-index:14;left:34px;pointer-events:none;
  display:flex;flex-direction:column;gap:7px;max-width:min(34ch,30vw);
  opacity:0;transform:translateY(10px);
  transition:opacity .45s ease .1s,transform .45s ease .1s}
#подпись_передела.виден{opacity:1;transform:none}
#подпись_передела .стадия{font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:600}
#подпись_передела h2{font-family:'Unbounded',system-ui,sans-serif;font-weight:700;
  font-size:clamp(20px,2.4vw,30px);line-height:1.1}
#подпись_передела p{font-size:13px;color:var(--приглуш);line-height:1.45}
.хронометраж{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.хронометраж span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 8px;border-radius:5px;border:1px solid var(--грань);color:var(--текст2)}
.ответственный{font-size:11.5px;color:var(--приглуш);letter-spacing:.02em}
/* речь докладчика лежит свёрнутой: на стенде она мешает, на репетиции нужна */
.речь{pointer-events:auto;margin-top:4px}
.речь summary{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--кмг);
  cursor:pointer;list-style:none;padding:4px 0}
.речь summary::-webkit-details-marker{display:none}
.речь summary::before{content:"▸ ";display:inline-block}
.речь[open] summary::before{content:"▾ "}
.речь p{font-size:12.5px;color:var(--текст2);line-height:1.5;
  border-left:2px solid var(--грань);padding-left:10px;margin-top:4px}

/* ================= экран системы ================= */
/* Не окно, а конечное состояние перелёта: въезжает из точки узла, потому что
   пространственная связь между узлом и экраном рваться не должна. */
/* Слой выше шапки и строки возврата: экран системы это полный захват кадра,
   а не окно поверх показа. В прежнем файле он перекрывал их потому, что шапка
   лежала внутри общего блока; здесь она закреплена отдельно, поэтому порядок
   задаётся числом. */
/* Собственного въезда у экрана больше нет: его выводит морф, а экран просто
   проявляется поверх уже выросшего кадра. Прежний scale(.92) при этом дёргал
   картинку второй раз — кадр приезжал морфом и тут же ехал ещё раз. */
#экран_системы{position:fixed;inset:0;z-index:60;opacity:0;pointer-events:none;
  background:var(--фон0);overflow:hidden;transition:opacity .3s ease}
#экран_системы.открыт{opacity:1;pointer-events:auto}
.фон_системы{position:absolute;inset:0;background-size:cover;background-position:center;
  background-color:#0A1A2C}
.фон_системы video{width:100%;height:100%;object-fit:cover}
/* Шторка слева обеспечивает контраст текста. Кадр генеративный, его тон
   гарантировать нельзя, поэтому читаемость держится затемнением, а не
   надеждой на удачный кадр. */
/* Метки поверх ролика. Стиль перенесён из показа AIAN дословно: два показа
   КМГ стоят на одном стенде, и подпись, оформленная по-своему, читалась бы
   как чужая система.

   Текст держится в HTML, а не вжигается в ролик, по двум причинам. Правка
   формулировки не должна стоить перегенерации, а кириллицу генератор рисует
   нечитаемой псевдографикой — на роликах это уже проверено. */
.метка_видео{position:absolute;left:auto;right:clamp(28px,4vw,64px);bottom:14vh;
  display:flex;align-items:center;gap:9px;max-width:min(46ch,42vw);
  padding:10px 16px;border-radius:9px;
  background:linear-gradient(165deg,rgba(10,20,34,.9),rgba(6,12,22,.84));
  border:1px solid rgba(2,174,240,.38);border-top-color:rgba(215,226,242,.16);
  font-size:clamp(13px,1.5vw,20px);letter-spacing:.02em;color:var(--текст);
  opacity:0;transform:translateY(10px);transition:opacity .6s ease,transform .6s ease;
  pointer-events:none;backdrop-filter:blur(6px)}
.метка_видео::before{content:'';width:8px;height:8px;border-radius:50%;flex:0 0 auto;
  background:var(--кмг);box-shadow:0 0 10px var(--кмг)}
.метка_видео.горит{opacity:1;transform:none}

.шторка{position:absolute;inset:0;background:linear-gradient(100deg,
  rgba(5,8,16,.97) 0%, rgba(5,8,16,.92) 34%, rgba(5,8,16,.55) 62%, rgba(5,8,16,.35) 100%)}
.текст_системы{position:absolute;left:0;top:0;height:100%;width:min(52%,720px);
  padding:clamp(28px,5vh,72px) clamp(28px,4vw,64px);
  display:flex;flex-direction:column;justify-content:center;gap:14px}
.текст_системы .стадия{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;font-weight:600}
.текст_системы h2{font-family:'Unbounded',system-ui,sans-serif;font-weight:700;
  font-size:clamp(26px,3.8vw,52px);line-height:1.06;letter-spacing:-.01em;text-wrap:balance}
.сис_эффект{font-size:clamp(15px,1.5vw,21px);color:var(--кмг);line-height:1.35;
  border-left:2px solid var(--кмг);padding-left:14px}
.сис_суть{font-size:clamp(13px,1.15vw,16px);color:var(--текст2);line-height:1.55;max-width:56ch}
.сис_отв{font-size:12px;color:var(--приглуш);letter-spacing:.02em}
.сис_низ{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px}
.кнопка{padding:11px 20px;border-radius:8px;border:1px solid var(--грань);
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--текст2);
  text-decoration:none;display:inline-flex;align-items:center;cursor:pointer;
  transition:border-color .2s,color .2s,background .2s}
.кнопка:hover:not([disabled]){border-color:var(--кмг);color:var(--кмг);background:rgba(2,174,240,.08)}
.кнопка[disabled]{opacity:.4;cursor:default}
.кнопка[hidden]{display:none}
.назад_система{position:absolute;left:clamp(28px,4vw,64px);bottom:clamp(22px,4vh,44px);
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--текст2);
  border:1px solid var(--грань);border-radius:7px;padding:8px 14px;cursor:pointer;
  transition:border-color .2s,color .2s}
.назад_система:hover{border-color:var(--кмг);color:var(--кмг)}
@media (max-width:900px){ .текст_системы{width:100%} }

/* ================= морф ================= */
/* Кадр системы вырастает из кружка узла и садится обратно в него. Это не
   украшение: между уровнями показа не должно быть разрыва, иначе докладчик
   каждый раз объясняет, куда он попал. Расширенный узел и есть экран системы.

   Анимируется коробка (left/top/width/height), а не transform. Transform был
   бы дешевле, но он масштабирует кадр неравномерно — у кружка и у экрана
   разное отношение сторон, и кадр внутри плющило бы. Элемент один, 620 мс,
   ради этого можно потерпеть перерасчёт раскладки. */
.морф{position:fixed;z-index:55;pointer-events:none;opacity:0;
  background-size:cover;background-position:center;background-color:#0A1A2C;
  box-shadow:0 0 0 1px rgba(2,174,240,.5), 0 24px 80px rgba(0,0,0,.6);
  will-change:left,top,width,height,border-radius}
.морф.идёт{transition:left .62s cubic-bezier(.3,.02,.15,1),
  top .62s cubic-bezier(.3,.02,.15,1), width .62s cubic-bezier(.3,.02,.15,1),
  height .62s cubic-bezier(.3,.02,.15,1), border-radius .62s ease, opacity .2s ease}

.возврат{position:absolute;right:clamp(20px,3vw,40px);top:clamp(20px,3vh,36px);
  display:flex;gap:10px;z-index:3}

/* Встроенный показ ЦД занимает экран целиком: у него своя навигация, свои
   подписи и своя панель контура. Наша текстовая колонка рядом с ними читалась
   бы как второй интерфейс поверх первого, поэтому на этом экране она снимается,
   и остаются только кнопки возврата. */
#внешний_показ{position:absolute;inset:0;border:0;width:100%;height:100%;
  opacity:0;pointer-events:none;transition:opacity .4s ease;background:var(--фон0)}
#экран_системы.снаружи #внешний_показ{opacity:1;pointer-events:auto}
#экран_системы.снаружи .текст_системы,
#экран_системы.снаружи .шторка,
#экран_системы.снаружи #метки_ролика{opacity:0;pointer-events:none}

/* Чистый первый прогон. Ролик открывается на весь кадр: ни шторки, ни
   текстовой колонки. Заказчик смотрел показ и сказал прямо — при нажатии
   должно пойти видео, а не страница о видео.

   Так и по делу: докладчик в этот момент говорит сам, и колонка повторяет за
   ним теми же словами. Она нужна на стенде, где к экрану подходят без
   докладчика, — поэтому не убрана совсем, а выходит после первого круга.

   Подписи-метки остаются: они справа, ролика не закрывают и несут то, чего в
   кадре нет словами. Их заказчик как раз просил добавить.

   Отклонён вариант с кнопкой «показать описание». Ещё одна кнопка в кадре —
   ещё одно решение докладчику на сцене; строку «Все проекты / Только показ»
   сняли ровно по этой причине. */
#экран_системы.чисто .текст_системы,
#экран_системы.чисто .шторка{opacity:0;pointer-events:none}
.текст_системы,.шторка{transition:opacity .55s ease}

@media (prefers-reduced-motion:reduce){
  .площадка,.ореол,.подложка,.импульс,.узел .волна,h1 .град{animation:none}
  .морф.идёт{transition-duration:.01ms}
  .сцена,#подпись_передела,.узел{transition-duration:.01ms}
}
@media (max-width:900px){
  .шапка{padding:14px 16px 0;flex-direction:column;gap:10px}
  #подпись_передела{display:none}
}
</style>
</head>
<body>

<header class="шапка">
  <div>
    <h1 class="дисплей"><span class="град">Цифровая цепочка</span></h1>
  </div>
  <div class="шапка_п">
    <img id="лого" src="медиа/лого_кмг.png" alt="КазМунайГаз">
    <span class="метка_драфт дисплей">Драфт</span>
  </div>
</header>

<div class="путь">
  <button id="назад" type="button">← Вся цепочка</button>
  <span class="где" id="где"></span>
</div>

<div class="стол"><div class="сцена" id="сцена">
  <div class="подложка"></div>
  <div class="линия" id="линия"></div>
</div></div>

<div class="веер" id="веер"></div>
<div id="подпись_передела"></div>


<!-- Морф: кадр системы вырастает из самого узла, по которому кликнули.
     Лежит между веером и экраном системы, живёт только во время перехода. -->
<div class="морф" id="морф" aria-hidden="true"></div>

<!-- Экран системы — не окно, а конечное состояние перелёта. Фон и будущий
     ролик занимают один слот, поэтому согласованное видео ляжет сюда без
     правки разметки. -->
<div id="экран_системы" aria-hidden="true">
  <div class="фон_системы" id="фон_системы"></div>
  <!-- Слот под чужой показ: сюда встраивается ЦД. Пустой, пока не понадобится:
       iframe с адресом грузил бы 25 МБ моделей при каждом открытии экрана. -->
  <iframe id="внешний_показ" title="Цифровой двойник пласта" allow="fullscreen"></iframe>
  <div class="шторка"></div>
  <div id="метки_ролика"></div>
  <div class="текст_системы">
    <span class="стадия" id="сис_стадия">—</span>
    <h2 id="сис_имя">—</h2>
    <p class="сис_эффект" id="сис_эффект">—</p>
    <p class="сис_суть" id="сис_суть">—</p>
    <p class="сис_отв" id="сис_отв">—</p>
    <div class="сис_низ">
      <span class="сост" id="сис_состояние">—</span>
      <a class="кнопка" id="сис_демо" target="_blank" rel="noopener">Открыть демо</a>
      <button class="кнопка" id="сис_ролик" type="button" disabled>Ролик на согласовании</button>
    </div>
  </div>
  <!-- Возврат справа сверху по просьбе заказчика: докладчик стоит справа от
       экрана и тянется туда, а не в дальний нижний угол. Две ступени, потому
       что из системы одинаково часто нужно и к своему переделу, и сразу ко
       всей цепочке. -->
  <div class="возврат">
    <!-- Появляется только там, где после интерактивного показа есть ролик:
         сначала макет, потом ролик, потом назад — порядок задал заказчик. -->
    <button class="кнопка" id="сис_кролику" type="button" hidden>Дальше — ролик →</button>
    <button class="кнопка" id="сис_назад" type="button">← К переделу</button>
    <button class="кнопка" id="сис_вцепочку" type="button">Вся цепочка</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ================= данные показа ================= */
  /* Раскладка проектов по переделам — из рабочего файла «Показы КМГ.xlsx» и
     правок заказчика. Перенесена из «цепочки» дословно: состав правился шесть
     раз, и перепечатка вручную — самый дешёвый способ потерять одну правку. */
  var ПЕРЕДЕЛЫ = [
    { код:"разведка", номер:"01", имя:"Разведка", стадия:"верх",
      суть:"Более двадцати лет геологоразведочных данных: отчёты, керны, сейсмика.",
      форум:"12 сек", гос:"50 сек", ответственный:"Управление геологии и геофизики КМГ",
      рассказчик:"Начало цепочки — разведка и геология. У КМГ более двадцати лет геологоразведочных данных: отчёты, керны, сейсмика. Раньше — недели ручного поиска. GeoRAG работает в закрытом контуре и даёт не просто ссылку, а reasoning-вывод. Геолог получает ответ за секунды.",
      проекты:[
        /* Ролик черновой, сгенерирован под смысл продукта: тёмный архив
           геологических отчётов и кернов, луч сканирования по раскрытому тому,
           с бумаги поднимаются контуры и точки данных. Это «двадцать лет
           бумажной геологии становятся искомыми», а не интерфейс ассистента —
           интерфейс на стенде показывается живым демо, а не роликом. */
        { имя:"GeoRAG", состояние:"делается", хроно:"~0:50", эффект:"Скорость геоаналитики +30–60% · оценка", площадки:"Все площадки", ярлыки:["ИИ"],
          видео:"медиа/ролики/georag.mp4",
          /* Ролик пересобран под рассказ «проблема — решение — эффект»,
             который сформулировал заказчик, а не под метафору архива.

             Отклонён прежний вариант — тёмный подвал с полками отчётов. Он
             снимал проблему, а не продукт: пыль и спящие полки на стенде
             читаются как «у КМГ данные лежат в подвале». Разбор в РАСКАДРОВКЕ.

             Три акта. Облако тысяч разрозненных листов — десятки тысяч
             источников, из-за которых справка готовилась неделями. Волна
             света ставит каждый лист на место и сжимает решётку в ядро — это
             разбор и индексация, база знаний. Из ядра поднимается ответ, и от
             него уходит нить к одной конкретной карточке-источнику — это и
             есть «со ссылкой на первоисточник», показанное без единого слова.

             Букв в кадре нет намеренно: генератор рисует кириллицу нечитаемой
             псевдографикой, это ловилось дважды. Всё словесное несёт слой
             меток поверх ролика.

             Окна меток выставлены не по замыслу, а по готовому ролику: доля
             синих пикселей замерена посекундно и даёт границы актов — серый
             хаос 0–4,5 с, волна 5–6, решётка 6–18, сжатие в ядро 19–21,
             ответы с нитями 22–30. Написанные заранее окна разъезжались с
             картинкой на пять секунд: «недели, иногда месяцы» приходилось на
             уже собранную решётку, то есть подпись про проблему шла поверх
             решения. Проблема ужата в четыре секунды хаоса двумя короткими
             строками, длинный простой решётки закрыт строкой про базу
             знаний. */
          метки:[
            {от:0.8,  до:3.4,  текст:"Десятки тысяч геологических отчётов"},
            {от:3.6,  до:6.4,  текст:"Справка по месторождению — недели работы"},
            {от:7.0,  до:12.8, текст:"Все отчёты разобраны и проиндексированы"},
            {от:13.4, до:18.6, текст:"GeoRAG — единая база знаний геолога"},
            {от:19.4, до:25.0, текст:"Ответ со ссылкой на первоисточник, а не пересказ"},
            {от:25.6, до:29.8, текст:"И не только справки — наблюдения и рекомендации"}
          ],
          описание:"ИИ-ассистент по геоданным, обученный на реальных геологических отчётах. Работает в закрытом контуре — без рисков утечки. Выдаёт reasoning-вывод со ссылкой на первоисточник." },
        { имя:"Цифровая геология", состояние:"слайды", хроно:"—", эффект:"Закрытый контур — без утечки данных", площадки:"Все площадки", ярлыки:[],
          описание:"Цифровая база геологоразведочных данных: отчёты, керны, сейсмика за двадцать с лишним лет в едином хранилище." }
      ]},
    { код:"геология", номер:"02", имя:"Геология", стадия:"верх",
      суть:"Моделирование пласта и цифровой двойник актива на базе ABAI.",
      форум:"в блоке разведки", гос:"в блоке разведки", ответственный:"КМГ Инжиниринг · ЭМГ",
      рассказчик:"ABAI лежит в основе цифрового двойника месторождения, который мы уже строим на Эмбамунайгазе: постоянно действующая гидродинамическая модель и приоритизация мероприятий по экономике.",
      проекты:[
        /* ABAI — одна система из пяти модулей, и по цепочке она распадается
           надвое. Здесь, в геологии, — управление заводнением: это работа с
           пластом, поддержание давления закачкой. Остальные четыре модуля —
           работа со скважиной, и они стоят на добыче.

           Прежняя подпись «моделирование пласта» была шире, чем делает модуль,
           и не давала эффекта. Числа взяты из материалов заказчика, а не
           придуманы: срок модуля — июнь 2026. */
        { имя:"ABAI — управление заводнением", состояние:"слайды", хроно:"—", эффект:"+3% добычи на пилоте без бурения · оценка", площадки:"Все площадки", ярлыки:["ИИ"],
          описание:"Влияние нагнетательных скважин на добывающие считается не по радиусу, а по кросс-корреляции с временным лагом — геометрия ячеек не учитывала разломы. Матрица влияния идёт в уравнение материального баланса, и оптимизация подбирает режимы закачки на максимум нефти. Ячейки размечены светофором: красная проблемная, зелёная рабочая." },
        /* Единственная система, у которой есть готовый интерактивный показ.
           Открывается он сам, а не стоп-кадр: пересказывать 3D-макет картинкой
           бессмысленно, когда макет можно показать.

           `?слой=plast` уводит сразу в контур пласта, минуя обзорную панель, —
           заказчик просил «сразу с 3D». Ключ у показа ЦД уже был, заводить
           ничего не пришлось.

  var ШИРИНА_СЛОЯ   = 9.0;
  /* Цепочка поднята ещё выше: под ней теперь не две широкие полосы, а вторая
     линия со значками слоёв, и заказчик просил использовать пустоту внизу.
     54% оставляют под подписи переделов, связки и линию слоёв ровно столько,
     сколько им нужно, — проверено замером пересечений. */
  var НИЗ_МОДУЛЯ    = 54.0;   /* проценты высоты сцены */
  var ОТН_СЦЕНЫ     = 2560 / 1098;

  /* Файл ставится так, чтобы его модуль встал в заданное место заданной
     ширины: доля модуля в файле гуляет от 51 до 73 процентов, и по краям
     файлов модули вышли бы разного размера. */
  function раскладка(код){
    var г = ГАБАРИТЫ[код], м = МЕСТО[код];
    var шф = м.ширина / ((г.п - г.л) / 100);
    var вф = шф * ОТН_СЦЕНЫ / г.отн;
    return { лево: м.центр - м.ширина/2 - г.л/100*шф,
             верх: м.низ - г.н/100*вф,
             ширина: шф, высота: вф, центр: м.центр,
             ширинаМодуля: м.ширина, низМодуля: м.низ,
             высотаМодуля: (г.н - г.в)/100 * вф };
  }

  var ПАРЕНИЕ = { разведка:[8.4,0], геология:[10.6,1.3], добыча:[7.2,2.1],
                  транспорт:[9.8,0.7], переработка:[11.4,2.8], сбыт:[8.0,1.7],
                  безопасность:[9.2,3.4], корпоратив:[10.1,1.9] };

  /* Сквозные слои: место на второй линии, цвет и значок. Центры разведены
     так, чтобы каждый стоял под своей половиной цепочки, а не оба посередине. */
  var СКВОЗНЫЕ = {
    безопасность:{ центр:31, цвет:"var(--голубой)", значок:"слой_безопасность" },
    корпоратив:  { центр:69, цвет:"var(--виолет)",  значок:"слой_корпоратив" }
  };
  /* Линия слоёв опущена к самому низу сцены: между подписями переделов и
     модулями слоёв должен остаться просвет, иначе они наезжают друг на друга. */
  var ВТОРАЯ_ЛИНИЯ = 93;   /* проценты высоты сцены */

  /* МЕСТО собирается из ЦЕНТРЫ и двух наборов размеров: переделы стоят на
     НИЗ_МОДУЛЯ шириной ШИРИНА_МОДУЛЯ, слои — на второй линии и мельче. */
  var МЕСТО = {};
  ПЕРЕДЕЛЫ.forEach(function(п){
    МЕСТО[п.код] = { центр:ЦЕНТРЫ[п.код], ширина:ШИРИНА_МОДУЛЯ, низ:НИЗ_МОДУЛЯ };
  });
  СЛОИ.forEach(function(сл){
    МЕСТО[сл.код] = { центр:ЦЕНТРЫ[сл.код], ширина:ШИРИНА_СЛОЯ, низ:ВТОРАЯ_ЛИНИЯ };
  });

  var сцена     = document.getElementById("сцена");
  var веер      = document.getElementById("веер");
  var линия     = document.getElementById("линия");
  var подпись_передела = document.getElementById("подпись_передела");
  var экран_системы = document.getElementById("экран_системы");
  var текущий = null, системаОткрыта = false;

  сцена.style.setProperty("--низ", НИЗ_МОДУЛЯ + "%");

  function узел(тег, класс, родитель){
    var э = document.createElement(тег);
    if(класс) э.className = класс;
    if(родитель) родитель.appendChild(э);
    return э;
  }

  /* ================= постройка уровня 0 ================= */
  for(var и = 0; и < 3; и++){
    var имп = узел("div", "импульс", линия);
    имп.style.animationDelay = (и * 2.4) + "s";
  }

  /* Петли рисуются вместо картинки там, где они есть. Список остался списком,
     а не флагом «все петли готовы»: если ролик придётся снять с показа, он
     убирается одной строкой, и площадка возвращается к кадру.

     Габариты выше замерены по первому кадру петли, а не по картинке:
     кадрирование у ролика своё и отличается от исходной площадки на проценты. */
  var ПЕТЛИ = {
    безопасность:"медиа/петли/безопасность_петля.mp4",
    корпоратив:  "медиа/петли/корпоратив_петля.mp4",
    разведка:    "медиа/петли/разведка_петля.mp4",
    геология:    "медиа/петли/геология_петля.mp4",
    добыча:      "медиа/петли/добыча_петля.mp4",
    транспорт:   "медиа/петли/транспорт_петля.mp4",
    переработка: "медиа/петли/переработка_петля.mp4",
    сбыт:        "медиа/петли/сбыт_петля.mp4"
  };

  ВСЕ_БЛОКИ.forEach(function(п){
    var р = раскладка(п.код), пар = ПАРЕНИЕ[п.код];
    п._р = р;

    /* Ореол кладётся под площадку отдельным слоем, а не рисуется в картинке:
       он должен пульсировать, а нарисованный не умеет. */
    var ор = узел("div", "ореол", сцена);
    ор.style.left   = (р.центр - р.ширинаМодуля*0.72) + "%";
    ор.style.width  = (р.ширинаМодуля*1.44) + "%";
    ор.style.top    = (р.низМодуля - 7) + "%";
    ор.style.height = "16%";
    ор.style.setProperty("--период", пар[0] + "s");
    ор.style.setProperty("--сдвиг",  (-пар[1]) + "s");
    п._ореол = ор;

    var сл = узел("div", "площадка", сцена);
    сл.style.left   = р.лево + "%";
    сл.style.top    = р.верх + "%";
    сл.style.width  = р.ширина + "%";
    сл.style.height = р.высота + "%";
    сл.style.setProperty("--период", пар[0] + "s");
    сл.style.setProperty("--сдвиг",  (-пар[1]) + "s");
    сл.innerHTML = ПЕТЛИ[п.код]
      ? '<video src="' + ПЕТЛИ[п.код] + '" autoplay loop muted playsinline ' +
        'preload="auto" poster="медиа/сцена/блок_' + п.код + '.jpg"></video>'
      : '<img src="медиа/сцена/блок_' + п.код + '.jpg" alt="">';
    var ролик = сл.querySelector("video");
    if(ролик){
      /* Пауза у площадки всегда ошибка: её никто не ставит намеренно.
         Событие приходит раньше и точнее, чем срабатывает общий таймер. */
      ролик.addEventListener("pause", function(){
        var о = ролик.play();
        if(о && о.catch) о.catch(function(){});
      });
    }
    п._слой = сл;

    /* Зона клика совпадает с модулем, а не с файлом: у файла вокруг модуля
       чёрные поля, и по ним зоны соседних площадок перекрывались бы. */
    var з = узел("div", "зона", сцена);
    з.setAttribute("role", "button");
    з.setAttribute("tabindex", "0");
    з.setAttribute("aria-label", (п.слой ? "Сквозной слой " : "Передел ") + п.имя);
    з.style.left   = (р.центр - р.ширинаМодуля/2) + "%";
    з.style.width  = р.ширинаМодуля + "%";
    з.style.top    = (р.низМодуля - р.высотаМодуля - 2) + "%";
    з.style.height = (р.высотаМодуля + 4) + "%";
    function поднять(да){
      if(текущий) return;              /* внутри передела подъём не нужен */
      сл.classList.toggle("поднята", да);
      ор.classList.toggle("ярче", да);
    }
    з.addEventListener("mouseenter", function(){ поднять(true); });
    з.addEventListener("mouseleave", function(){ поднять(false); });
    з.addEventListener("focus", function(){ поднять(true); });
    з.addEventListener("blur", function(){ поднять(false); });
    з.addEventListener("click", function(){ поднять(false); открыть(п); });
    з.addEventListener("keydown", function(с){
      if(с.key === "Enter" || с.key === " "){ с.preventDefault(); поднять(false); открыть(п); }
    });
    п._зона = з;

    /* У слоя подпись ставится НАД модулем, а не под ним: модуль стоит у самого
       низа сцены, и снизу места не остаётся. Заодно подпись оказывается между
       цепочкой и слоем — там, где взгляд и идёт. */
    var б = узел("div", "бирка дисплей" + (п.слой ? " сверху" : ""), сцена);
    б.style.left = р.центр + "%";
    б.style.top  = п.слой ? (р.низМодуля - р.высотаМодуля - 1.5) + "%"
                          : (р.низМодуля + 2.5) + "%";
    /* У слоя нет номера в цепочке — он не стадия. Цвет имени берётся из слоя,
       чтобы два сквозных блока читались как другой род, а не как переделы 07 и 08. */
    б.innerHTML = (п.слой ? '' : '<div class="номер">' + п.номер + '</div>') +
                  '<div class="имя"' + (п.слой ? ' style="color:' + СКВОЗНЫЕ[п.код].цвет + '"' : '') +
                  '>' + п.имя + '</div>' +
                  '<div class="счёт"></div>';
    п._бирка = б;
    п._счётчик = б.querySelector(".счёт");
    if(п.слой) п._полоса = сл;   /* гашение и замеры завязаны на это поле */
  });

  /* Верх самого высокого модуля минус место под саму скобу. */
  function самыйВысокий(){
    var верх = 100;
    for(var код in ЦЕНТРЫ){
      var р = раскладка(код);
      верх = Math.min(верх, НИЗ_МОДУЛЯ - р.высотаМодуля);
    }
    return Math.max(2, верх - 7);
  }

  /* Скобки стадий. Границы считаются из центров и ширины модуля, а не
     вписываются числом: сдвинется раскладка — скобки поедут за ней. */
  [ { стадия:"верх",    от:"разведка", до:"добыча" },
    { стадия:"средний", от:"транспорт", до:"транспорт" },
    { стадия:"низ",     от:"переработка", до:"сбыт" } ].forEach(function(гр){
    /* Запас внутрь, а не наружу: с запасом наружу соседние скобки сходились
       краями — замер пересечений показал наложение 32 px. Между Upstream и
       Midstream остаётся 2% ширины сцены, и черта одной стадии не упирается
       в черту другой. */
    var л = ЦЕНТРЫ[гр.от] - ШИРИНА_МОДУЛЯ/2 + 0.5;
    var п = ЦЕНТРЫ[гр.до] + ШИРИНА_МОДУЛЯ/2 - 0.5;
    var с = узел("div", "скоба", сцена);
    с.style.left = л + "%";
    с.style.width = (п - л) + "%";
    /* Скобы ставятся над самым высоким модулем, а не на фиксированной высоте.
       Числом уже ошибся: поднял цепочку с 66% до 54%, скобы остались на 17%, и
       «UPSTREAM» легло на буровую вышку геологии — её модуль тянется до 11%.
       Теперь высота считается из тех же габаритов, из которых строится сама
       цепочка, и при следующем подъёме скобы поедут за ней. */
    с.style.top = самыйВысокий() + "%";
    с.innerHTML = '<div class="имя" style="color:' + СТАДИИ[гр.стадия].цвет + '">' +
                  СТАДИИ[гр.стадия].имя + '</div>' +
                  '<div class="черта" style="background:' + СТАДИИ[гр.стадия].цвет + '"></div>';
  });

  /* Вторая линия и связки от каждого передела вниз. Связки рисуются до узлов
     слоёв, чтобы значки лежали поверх линий, а не под ними. */
  var линия2 = узел("div", "линия2", сцена);
  линия2.style.top = ВТОРАЯ_ЛИНИЯ + "%";
  ПЕРЕДЕЛЫ.forEach(function(п){
    var св = узел("div", "связка", сцена);
    св.style.left = ЦЕНТРЫ[п.код] + "%";
    св.style.top = (НИЗ_МОДУЛЯ + 12) + "%";
    св.style.height = (ВТОРАЯ_ЛИНИЯ - НИЗ_МОДУЛЯ - 12) + "%";
    св.style.opacity = ".4";
  });

  /* Иконки систем. Ключ — имя проекта, потому что своего кода у проекта в
     данных нет: данные перенесены из «цепочки» дословно, и заводить там новое
     поле значит развести два файла. Имя переименуют — иконка исчезнет молча,
     поэтому совпадения считаются и выставлены в отладочный крючок. */
  var ИКОНКИ = {
    "GeoRAG":                          "georag",
    "Цифровая геология":               "цифровая_геология",
    "ABAI — управление заводнением":   "abai_гтм",
    "ЦД пласта":                       "цд_пласта",
    "ABAI — ЦРНС, ГТМ, ГНО, техрежим": "abai_пласт",
    "KMG Automation — ММГ":            "kmg_automation",
    "KMG.AIAN — мониторинг перевозки": "aian_перевозка",
    "Предиктивная аналитика АНПЗ":     "пкоп",
    "PME — энергомониторинг":          "pme",
    "OTS — тренажёры операторов":      "ots",
    "KMG.AIAN — баланс НП":            "aian_баланс",
    "TUMAR":                           "tumar",
    "Коргау":                          "коргау",
    "ЭНД":                             "энд",
    "ИИ в УТО — тепловая карта":       "ии_уто",
    "AI-Broker":                       "ai_broker",
    "ProcuPriceMetal":                 "procupricemetal",
    "KMG COWORK":                      "kmg_cowork"
  };

  /* ================= веер систем ================= */
  /* Места узлов задаются в процентах окна, а не считаются от экранной рамки
     площадки: во время наезда рамка отдаёт промежуточные значения, и веер
     раскрывался бы по позиции, которой уже нет. */
  function местаУзлов(б){
    var список = б.проекты, н = список.length, места = [];
    for(var и = 0; и < н; и++){
      /* Веер один на все восемь блоков. Раньше у сквозных слоёв была своя
         раскладка — строка во всю ширину под подписью, — потому что слой был
         полосой во всю сцену и вёл себя иначе. Слой стал такой же площадкой,
         и второй способ отпал.

         Веер раскрывается вправо по диагонали. Разброс вокруг неё пробовали и
         отклонили: заказчик сказал, что узлы стали смотреться обособленно друг
         от друга — связь между системами одного блока читалась хуже, чем
         выигрыш от «живой» раскладки. */
      /* Раскладка веера. Узлы держатся одной группой: шаг между соседями
         одинаков при любом их числе, а лишнее место остаётся по краям.

         Пока узлы влезают в один столбец — идут диагональю. Когда перестают,
         веер разворачивается в сетку. Это не украшение: после того как подпись
         подняли с 15 до 20 px, узел вырос со 168 до 211 px, и четыре системы
         безопасности перестали помещаться в отведённые 60% высоты — замер
         показал наложение до 18 px. Растягивать зону некуда, ужимать шаг
         нельзя, значит второй столбец.

         Разброс вокруг диагонали пробовали и отклонили: заказчик сказал, что
         узлы стали смотреться обособленно друг от друга. */
      var г = габаритУзла();
      var шагY = (г.в * 1.06) / window.innerHeight * 100;
      var шагX = (г.ш * 1.08) / window.innerWidth * 100;
      var зонаY = НИЗ_ВЕЕРА - ВЕРХ_ВЕЕРА;
      var влезает = Math.max(1, Math.floor(зонаY / шагY) + 1);
      var колонок = Math.ceil(н / влезает);
      var рядов = Math.ceil(н / колонок);
      var серединаY = (ВЕРХ_ВЕЕРА + НИЗ_ВЕЕРА) / 2;
      var серединаX = ВЕЕР_X + РАЗМАХ / 2;

      if(колонок > 1){
        /* Сетка: диагональ здесь только мешала бы — столбцы и так разводят
           узлы по горизонтали, а наклон рядов сделал бы группу кривой. */
        var кол = Math.floor(и / рядов), ряд = и % рядов;
        места.push({ проект:список[и],
                     x: серединаX + (кол - (колонок - 1) / 2) * шагX,
                     y: серединаY + (ряд - (рядов - 1) / 2) * шагY });
      } else {
        var шагYодин = н > 1 ? Math.min(зонаY / (н - 1), шагY) : 0;
        var шагXодин = шагYодин * (РАЗМАХ / зонаY);
        var сдвиг = и - (н - 1) / 2;
        места.push({ проект:список[и],
                     x: серединаX + сдвиг * шагXодин,
                     y: серединаY + сдвиг * шагYодин });
      }
    }
    return места;
  }

  function построитьУзлы(б){
    var цвет = б.слой ? (б.код === "безопасность" ? "var(--голубой)" : "var(--виолет)")
                      : СТАДИИ[б.стадия].цвет;
    б._узлы = местаУзлов(б).map(function(м){
      var г = узел("div", "узел", веер);
      г.style.left = м.x + "%";
      г.style.top  = м.y + "%";
      г.style.color = цвет;
      г.setAttribute("role", "button");
      г.setAttribute("tabindex", "-1");
      г.setAttribute("aria-label", "Система " + м.проект.имя);
      var с = СОСТОЯНИЯ[м.проект.состояние];
      var знак = ИКОНКИ[м.проект.имя];
      г.innerHTML =
        '<div class="кружок"><span class="волна"></span>' +
        (знак ? '<img class="знак" src="медиа/иконки/' + знак + '.png" alt="">'
              : '<span class="ядро"></span>') +
        '</div>' +
        '<div class="подпись">' + м.проект.имя + '</div>' +
        '<span class="сост ' + с.класс + '">' + с.имя + '</span>';
      г.addEventListener("click", function(с){ с.stopPropagation(); открытьСистему(б, м); });
      г.addEventListener("keydown", function(с){
        if(с.key === "Enter" || с.key === " "){ с.preventDefault(); открытьСистему(б, м); }
      });
      return { проект:м.проект, группа:г };
    });
  }

  /* Отложенные показы узлов держатся списком и снимаются при уходе с блока.

     Без этого на стенде вылезала настоящая ошибка, и её заметил заказчик.
     Узлы проявляются лесенкой через setTimeout; если докладчик кликнет на
     соседний передел раньше, чем лесенка доиграла, скрытьУзлы гасит всё, но
     отложенные показы предыдущего блока остаются в очереди и срабатывают уже
     после — чужие узлы проявляются поверх нового передела.

     Воспроизведено: клик по переработке через 200 мс после добычи давал шесть
     видимых узлов вместо трёх, три из них чужие. Я сначала списал это на
     застывший снимок панели, и это было неверно. */
  var отложенные = [];

  function показатьУзлы(б){
    скрытьУзлы();
    if(!б._узлы) построитьУзлы(б);
    б._узлы.forEach(function(у, и){
      /* фокус даётся в тот же такт, что и видимость: если выставить tabindex
         сразу, между кликом и появлением узла есть окно, когда Tab встаёт на
         невидимый узел */
      отложенные.push(setTimeout(function(){
        у.группа.classList.add("виден");
        у.группа.setAttribute("tabindex", "0");
      }, 260 + и*90));
    });
  }

  function скрытьУзлы(){
    отложенные.forEach(clearTimeout);
    отложенные = [];
    ВСЕ_БЛОКИ.forEach(function(б){
      if(!б._узлы) return;
      б._узлы.forEach(function(у){
        у.группа.classList.remove("виден", "ушёл");
        у.группа.setAttribute("tabindex", "-1");
      });
    });
  }

  /* ================= подпись передела ================= */
  function показатьПодпись(б){
    подпись_передела.innerHTML =
      '<span class="стадия" style="color:' + СТАДИИ[б.стадия].цвет + '">' + СТАДИИ[б.стадия].имя + '</span>' +
      '<h2>' + (б.слой ? б.имя : б.номер + ' · ' + б.имя) + '</h2>' +
      '<p>' + б.суть + '</p>' +
      '<p class="хронометраж"><span>Форум ' + б.форум + '</span><span>Правительство ' + б.гос + '</span></p>' +
      '<p class="ответственный">' + б.ответственный + '</p>' +
      '<details class="речь"><summary>Текст рассказчика</summary><p>' + б.рассказчик + '</p></details>';
    /* Верх подписи отсчитывается от нижнего края строки возврата, а не задаётся
       числом: в прошлый раз фиксированные 100 px налезали заголовком на строку
       возврата у сквозных слоёв, и это поймал заказчик, а не мой замер. */
    var подПутём = Math.round(document.querySelector(".путь").getBoundingClientRect().bottom) + 22;
    подпись_передела.style.top = подПутём + "px";
    requestAnimationFrame(function(){ подпись_передела.classList.add("виден"); });
  }

  /* ================= морф ================= */
  /* Кадр вырастает из кружка узла и садится обратно в него. Узел, из которого
     ушли, запоминается: при возврате кадр обязан сесть именно в него, иначе
     переход читается как две разные анимации, а не как одно движение. */
  var часыМеток = null;
  var часыЧистого = null;
  var морф = document.getElementById("морф");
  var откудаУзел = null;
  var МОРФ_МС = 620;
  /* Счётчик перелётов. Та же болезнь, что и у отложенных показов узлов:
     завершение морфа висит на setTimeout, и быстрый второй клик приводил бы к
     тому, что окончание первого перелёта срабатывает уже поверх второго —
     прячет кадр, который только начал расти. Считается поколение: сработавшее
     завершение проверяет, что оно ещё актуально. */
  var поколение = 0;

  function коробка(э){
    var р = э.getBoundingClientRect();
    return { л:р.left, в:р.top, ш:р.width, вы:р.height };
  }

  /* Морф прячется в два шага, и это не перестраховка. Замер поймал состояние,
     в котором инлайн opacity уже 0, а вычисленная застряла на 1: переход не
     доиграл, и кадр остался висеть поверх всего экрана. Полагаться на
     завершение перехода нельзя — сначала гасим плавно, затем снимаем класс с
     переходом, и записанный ноль применяется мгновенно и окончательно. */
  function спрятатьМорф(){
    морф.style.opacity = "0";
    setTimeout(function(){
      морф.classList.remove("идёт");
      /* Снятия класса мало. Переход, который успел стартовать, снятием
         transition-property не всегда обрывается, и с fill:backwards он
         продолжает показывать своё НАЧАЛЬНОЕ значение — то есть непрозрачный
         кадр поверх всего показа, хотя в стиле уже записан ноль.

         Поймано замером: инлайн 0, вычисленная 1, класс без перехода, а на
         элементе висят девять незавершённых переходов на currentTime 0.
         В той панели браузера не выдавались кадры вовсе, так что переходы
         не сэмплировались; на живом экране они бы доиграли. Но полагаться на
         то, что кадры выдаются, для конечного состояния нельзя. */
      морф.getAnimations().forEach(function(а){ а.cancel(); });
      морф.style.opacity = "0";
    }, 240);
  }

  function поставитьМорф(к, круглый){
    морф.style.left = к.л + "px";
    морф.style.top = к.в + "px";
    морф.style.width = к.ш + "px";
    морф.style.height = к.вы + "px";
    морф.style.borderRadius = круглый ? "50%" : "0px";
  }

  function вырастить(узелЭ, кадр, готово){
    var моё = ++поколение;
    откудаУзел = узелЭ;
    var кружок = узелЭ.querySelector(".кружок") || узелЭ;
    морф.style.backgroundImage = кадр ? 'url("' + кадр + '")' : "";
    морф.classList.remove("идёт");
    поставитьМорф(коробка(кружок), true);
    морф.style.opacity = "1";
    /* Чтение вынуждает браузер применить начальное положение до того, как
       включится переход. Без него анимации не будет вовсе: обе записи
       свернутся в одну, и кадр просто окажется на месте. */
    void морф.offsetWidth;
    морф.classList.add("идёт");
    поставитьМорф({ л:0, в:0, ш:window.innerWidth, вы:window.innerHeight }, false);
    setTimeout(function(){ if(моё === поколение) готово(); }, МОРФ_МС);
  }

  function усадить(готово){
    var моё = ++поколение;
    if(!откудаУзел){ спрятатьМорф(); готово(); return; }
    var кружок = откудаУзел.querySelector(".кружок") || откудаУзел;
    морф.classList.remove("идёт");
    поставитьМорф({ л:0, в:0, ш:window.innerWidth, вы:window.innerHeight }, false);
    морф.style.opacity = "1";
    void морф.offsetWidth;
    морф.classList.add("идёт");
    поставитьМорф(коробка(кружок), true);
    setTimeout(function(){
      if(моё !== поколение) return;
      спрятатьМорф();
      откудаУзел = null;
      готово();
    }, МОРФ_МС);
  }

  /* ================= экран системы ================= */
  /* Колонка выходит, когда ролик пошёл по второму кругу. Круг ловится по
     откату времени назад: ролик зациклен, и событие ended у него не приходит
     вовсе — это уже ловилось на метках, где по той же причине не сработал
     timeupdate.

     Часы те же 200 мс, что и у меток. Порог в полсекунды нужен, чтобы дрожание
     currentTime у декодера не сошло за откат.

     Отдельная функция, а не кусок открытьСистему: у ЦД пласта ролик всё время
     крутится под встроенным показом и успевает уйти на второй круг, пока
     зритель смотрит 3D. Без повторного завода докладчик нажимал бы «дальше —
     ролик» и получал кадр уже с колонкой. */
  function завестиЧистое(ролик){
    if(часыЧистого){ clearInterval(часыЧистого); часыЧистого = null; }
    экран_системы.classList.add("чисто");
    var было = ролик.currentTime;
    часыЧистого = setInterval(function(){
      var т = ролик.currentTime;
      if(т + 0.5 < было){
        экран_системы.classList.remove("чисто");
        clearInterval(часыЧистого); часыЧистого = null;
      }
      было = т;
    }, 200);
  }

  function открытьСистему(б, м){
    системаОткрыта = true;
    б._узлы.forEach(function(у){
      у.группа.classList.toggle("ушёл", у.проект !== м.проект);
    });

    var пр = м.проект, с = СОСТОЯНИЯ[пр.состояние];
    var стадия = document.getElementById("сис_стадия");
    стадия.textContent = СТАДИИ[б.стадия].имя + " · " + б.имя;
    стадия.style.color = СТАДИИ[б.стадия].цвет;
    document.getElementById("сис_имя").textContent = пр.имя;
    document.getElementById("сис_эффект").textContent = пр.эффект || "Эффект не заполнен";
    document.getElementById("сис_суть").textContent = пр.описание;
    document.getElementById("сис_отв").textContent =
      б.ответственный + "   ·   форум " + б.форум + "   ·   правительство " + б.гос;

    var состояние = document.getElementById("сис_состояние");
    состояние.className = "сост " + с.класс;
    состояние.textContent = с.имя;

    var демо = document.getElementById("сис_демо");
    if(пр.демо){ демо.href = пр.демо; демо.hidden = false; } else { демо.hidden = true; }
    document.getElementById("сис_ролик").hidden = !!пр.видео;

    /* Стоп-кадр ставится всегда, ролик — поверх него. Не «или», а «поверх»:
       если mp4 не дойдёт (не выложен, не докачался, кодек не поддержан), под
       ним остаётся кадр, и экран системы не чернеет посреди показа. Проверять
       наличие файла заранее нечем — ошибка приходит от самого элемента. */
    var фон = document.getElementById("фон_системы");
    var кадр = пр.кадр || б._кадр;
    фон.innerHTML = "";
    фон.style.backgroundImage = кадр ? 'url("' + кадр + '")' : "";
    /* Встроенный показ. Адрес ставится в момент открытия, а не заранее: iframe
       с адресом в разметке тянул бы 25 МБ моделей при каждом заходе на любой
       экран системы, даже туда, где никакого ЦД нет. */
    var рамка = document.getElementById("внешний_показ");
    var кРолику = document.getElementById("сис_кролику");
    экран_системы.classList.toggle("снаружи", !!пр.внешний);
    кРолику.hidden = !(пр.внешний && пр.видео);
    рамка.src = пр.внешний || "about:blank";

    /* Метки пересобираются под каждую систему: они привязаны к её ролику.
       Старые часы гасятся здесь же — иначе при быстром переходе от системы к
       системе их накапливалось бы по одному на каждый показ. */
    var поле = document.getElementById("метки_ролика");
    поле.innerHTML = "";
    if(часыМеток){ clearInterval(часыМеток); часыМеток = null; }
    if(часыЧистого){ clearInterval(часыЧистого); часыЧистого = null; }
    экран_системы.classList.remove("чисто");
    if(пр.видео){
      var ролик = document.createElement("video");
      ролик.src = пр.видео;
      ролик.autoplay = true; ролик.loop = true; ролик.muted = true;
      ролик.playsInline = true; ролик.preload = "auto";
      /* Звуковой дорожки у роликов нет, поэтому muted ничего не отнимает, а
         без него браузер не даст автозапуска. */
      ролик.addEventListener("error", function(){ ролик.remove(); });
      фон.appendChild(ролик);

      завестиЧистое(ролик);

      if(пр.метки && пр.метки.length){
        var элементы = пр.метки.map(function(м){
          var э = узел("div", "метка_видео", поле);
          э.textContent = м.текст;
          return { м:м, э:э };
        });
        /* Состояние метки считается опросом времени ролика, а не по событию
           timeupdate. Событие показалось очевидным выбором и не сработало:
           оно приходит только пока ролик реально проигрывается, а если браузер
           его придержал — кадры не выдаются, окно свёрнуто, ролик стоит —
           метки просто не загорались. Проверено замером: пять меток на месте,
           ни одна не горит ни на одной секунде.

           Опрос от этого не зависит: ролик остаётся источником времени, петля
           сама обнуляет метки, а перемотка подхватывается следующим тиком.
           Пятая доля секунды достаточна — метки висят по несколько секунд. */
        var обновить = function(){
          var т = ролик.currentTime;
          элементы.forEach(function(п_){
            п_.э.classList.toggle("горит", т >= п_.м.от && т < п_.м.до);
          });
        };
        обновить();
        часыМеток = setInterval(обновить, 200);
      }
    }

    /* Экран проявляется не сразу, а когда кадр вырос: иначе зритель видит две
       анимации подряд вместо одного движения. Узел ищется по проекту, а не
       берётся из события — открытьСистему вызывается и из отладочного крючка. */
    var свой = б._узлы.filter(function(у){ return у.проект === м.проект; })[0];
    вырастить(свой ? свой.группа : null, кадр, function(){
      экран_системы.classList.add("открыт");
      экран_системы.setAttribute("aria-hidden", "false");
      спрятатьМорф();
      document.getElementById("сис_назад").focus();
    });
  }

  function закрытьСистему(){
    if(!системаОткрыта) return;
    системаОткрыта = false;
    экран_системы.classList.remove("открыт");
    экран_системы.setAttribute("aria-hidden", "true");
    /* Ролик не просто ставится на паузу, а отматывается: докладчик открывает
       систему заново и должен получить начало, а не середину прошлого показа. */
    if(часыМеток){ clearInterval(часыМеток); часыМеток = null; }
    if(часыЧистого){ clearInterval(часыЧистого); часыЧистого = null; }
    экран_системы.classList.remove("чисто");
    /* Встроенный показ выгружается, а не прячется: за рамкой живёт своя сцена
       на Three.js, и оставленная работать она жгла бы кадры под нашим показом. */
    экран_системы.classList.remove("снаружи");
    document.getElementById("внешний_показ").src = "about:blank";
    document.getElementById("сис_кролику").hidden = true;
    var в = экран_системы.querySelector("video");
    if(в){ в.pause(); в.currentTime = 0; }
    /* Кадр садится обратно в свой узел, и только потом узлы возвращаются:
       иначе они проявятся под ещё летящим кадром. */
    усадить(function(){
      if(текущий) открыть(текущий);
    });
  }
  /* Шаг «дальше — ролик»: макет снимается, под ним оказывается ролик, который
     всё это время уже был загружен и играл. Перезапускать его с нуля не нужно —
     он и есть фон экрана системы. */
  document.getElementById("сис_кролику").addEventListener("click", function(){
    экран_системы.classList.remove("снаружи");
    document.getElementById("внешний_показ").src = "about:blank";
    document.getElementById("сис_кролику").hidden = true;
    var в = экран_системы.querySelector("video");
    if(в){
      в.currentTime = 0;
      var о = в.play(); if(о && о.catch) о.catch(function(){});
      /* Для зрителя это первый показ ролика, хотя технически он крутится с
         момента открытия системы: до сих пор его закрывал встроенный показ. */
      завестиЧистое(в);
    }
  });

  document.getElementById("сис_назад").addEventListener("click", закрытьСистему);
  /* Вторая ступень возврата: из системы сразу ко всей цепочке, минуя передел. */
  document.getElementById("сис_вцепочку").addEventListener("click", function(){
    if(!системаОткрыта){ закрыть(); return; }
    системаОткрыта = false;
    экран_системы.classList.remove("открыт");
    экран_системы.setAttribute("aria-hidden", "true");
    if(часыМеток){ clearInterval(часыМеток); часыМеток = null; }
    if(часыЧистого){ clearInterval(часыЧистого); часыЧистого = null; }
    экран_системы.classList.remove("чисто");
    /* Встроенный показ выгружается, а не прячется: за рамкой живёт своя сцена
       на Three.js, и оставленная работать она жгла бы кадры под нашим показом. */
    экран_системы.classList.remove("снаружи");
    document.getElementById("внешний_показ").src = "about:blank";
    document.getElementById("сис_кролику").hidden = true;
    var в = экран_системы.querySelector("video");
    if(в){ в.pause(); в.currentTime = 0; }
    усадить(закрыть);
  });

  /* ================= камера ================= */
  /* Наезд — один transform на всю сцену: площадки едут вместе с биркой, линией
     и светом стола, поэтому ничто не разъезжается между собой. Источник
     площадки 2048 px, так что при увеличении видно деталь, а не пиксели —
     ради этого площадки и генерировались поштучно.

     Площадка уезжает в левую четверть кадра: справа освобождается место под
     веер. Числа в процентах сцены, поэтому от размера окна не зависят и
     одинаково работают на ноутбуке и на экране стенда. */
  var НАЕЗД_МАКС = 2.4;
  var ЦЕЛЬ_Y = 52;
  /* Отъезд у слоя меньше единицы намеренно — см. открыть(). Полоса при этом
     гарантированно остаётся в кадре: она занимает 94% ширины, и любой масштаб
     больше 1,06 вынес бы её концы за края. */
  var ОТЪЕЗД = 0.9;
  /* Полоса опущена ниже середины, чтобы над ней уместилась строка узлов.
     Число подбиралось замером, а не на глаз: при 68 строка (401..569 на окне
     900 px) задевала полосу, начинавшуюся на 547. Сверху строку прижимает
     подпись передела, снизу — полоса, и на окне 900 px между ними остаётся
     около 250 px при высоте узла 168. */
  var СЛОЙ_Y = 77;        /* куда встаёт середина полосы, проценты окна */
  /* Зона под веер очерчена заказчиком: правая половина кадра целиком.
     Узлы раскладываются по ней диагональю, а не дугой. Дуга выносила вправо
     только средний узел, крайние оставались у левого края зоны, и правая
     треть пустовала — заказчик это и заметил. */
  var ВЕЕР_X    = 60;     /* верхний левый узел, проценты окна */
  var РАЗМАХ    = 24;     /* насколько нижний узел правее верхнего */
  var ВЕРХ_ВЕЕРА = 20;
  var НИЗ_ВЕЕРА  = 80;
  /* Ширина узла меряется у настоящего узла, а не дублируется числом.
     Дубль уже разошёлся с CSS: в расчёте мест стояло min(20vw,220px), в стилях
     к тому моменту было min(26vw,300px), и строка узлов у сквозного слоя
     вылезла за экран. Одно значение — одно место. */
  var _габаритУзла = null;
  function габаритУзла(){
    if(_габаритУзла) return _габаритУзла;
    /* В пробу ставится САМОЕ ДЛИННОЕ имя из всех систем, а не слово «Проба».

       С коротким именем проба давала высоту узла с однострочной подписью, а у
       половины систем имя переносится на две строки — «ИИ в УТО — тепловая
       карта», «OTS — тренажёры операторов». Раскладка считала шаг по заниженной
       высоте, и узлы налезали друг на друга: замер показал 14 px на добыче и
       переработке сразу после того, как подпись подняли до 20 px.

       Длиннейшее имя даёт худший случай, а раскладка обязана держаться именно
       по нему — иначе она верна для одних блоков и ломается на других. */
    var длинное = "";
    ВСЕ_БЛОКИ.forEach(function(б){
      б.проекты.forEach(function(пр){
        if(пр.имя.length > длинное.length) длинное = пр.имя;
      });
    });
    var проба = узел("div", "узел", веер);
    проба.style.visibility = "hidden";
    проба.innerHTML = '<div class="кружок"></div><div class="подпись">' + длинное + '</div>' +
                      '<span class="сост слайды">только презентация</span>';
    _габаритУзла = { ш: проба.offsetWidth, в: проба.offsetHeight };
    проба.remove();
    return _габаритУзла;
  }
  function ширинаУзла(){ return габаритУзла().ш; }

  /* Просвет между подписью и веером меряется, а не назначается: подпись задана
     шириной в символах и её край в пикселях от окна не зависит, а площадка
     задана процентами сцены. Подобранные числа сходились на одном размере окна
     и наезжали друг на друга на другом. */
  function наездПодПросвет(){
    var сцШ = сцена.offsetWidth;                 /* без учёта transform */
    var сцЛево = (window.innerWidth - сцШ) / 2;
    var подп = подпись_передела.getBoundingClientRect();
    var слева = (подп.width ? подп.right : сцЛево) + 26;
    var полУзла = ширинаУзла() / 2;
    var справа = ВЕЕР_X/100 * window.innerWidth - полУзла - 26;
    var просвет = Math.max(120, справа - слева);
    var к = Math.min(НАЕЗД_МАКС, просвет / (ШИРИНА_МОДУЛЯ/100 * сцШ));
    var серединаПx = слева + просвет/2;
    return { к:к, цельX: (серединаПx - сцЛево) / сцШ * 100 };
  }

  function открыть(п){
    текущий = п;
    document.body.classList.add("вглубь");
    /* Подпись заполняется первой: её измеренный край задаёт и просвет для
       наезда, и начало строки узлов у сквозного слоя. */
    показатьПодпись(п);

    /* Наезд одинаков для всех восьми блоков: слой стал такой же площадкой, и
       разводить два способа движения больше не за чем.

       Отклонён прежний вариант — отъезд для слоёв. Он был вынужденным: пока
       слой был полосой во всю ширину, наезд выносил её концы за кадр. С
       модулем такой беды нет, а разное движение для одинаковых на вид блоков
       сбивало бы: докладчик нажимает на такой же значок и ждёт такого же
       ответа. */
    var р = п._р, ц = наездПодПросвет();
    var цy = р.низМодуля - р.высотаМодуля/2;
    сцена.style.transform = "translate(" + (ц.цельX - ц.к*р.центр) + "%," +
                            (ЦЕЛЬ_Y - ц.к*цy) + "%) scale(" + ц.к + ")";
    п._наезд = ц;

    /* Бирки гасятся все до одной, включая свою: передел назван в подписи, а
       подпись под площадкой уезжает вместе со сценой и на таком увеличении
       становится в палец высотой. */
    ВСЕ_БЛОКИ.forEach(function(д){
      var свой = (д === п);
      /* Соседи гасятся сильнее, чем кажется нужным: режим screen не даёт им
         уйти в чёрный, и при 0,1 труба соседней площадки просвечивала прямо
         под подписью узла. */
      д._слой.style.opacity  = свой ? "1" : "0.06";
      д._ореол.style.opacity = свой ? ""  : "0";
      д._бирка.style.opacity = "0";
    });
    /* При наезде на передел полосы гасятся совсем, а не приглушаются: они
       едут вместе со сценой, их текст вырастает вдвое и лезет в кадр снизу
       крупной строкой. Приглушение до 0,14 этого не спасало. */
    /* Слои теперь такие же площадки, как переделы, и гасятся вместе с ними
       общим проходом выше. Здесь остаётся только их бирка. */
    СЛОИ.forEach(function(д){ д._бирка.style.opacity = "0"; });

    document.getElementById("где").textContent = СТАДИИ[п.стадия].имя + " / " + п.имя;
    показатьУзлы(п);
  }

  function закрыть(){
    системаОткрыта = false;
    экран_системы.classList.remove("открыт");
    экран_системы.setAttribute("aria-hidden", "true");
    текущий = null;
    document.body.classList.remove("вглубь");
    сцена.style.transform = "none";
    ВСЕ_БЛОКИ.forEach(function(д){
      д._слой.style.opacity  = "1";
      д._ореол.style.opacity = "";
      д._бирка.style.opacity = "1";
    });
    скрытьУзлы();
    подпись_передела.classList.remove("виден");
    подпись_передела.innerHTML = "";
  }
  document.getElementById("назад").addEventListener("click", закрыть);

  /* ================= счётчики проектов ================= */
  function обновитьСписки(){
    ВСЕ_БЛОКИ.forEach(function(б){
      б._счётчик.textContent = б.проекты.length + " " + склонение(б.проекты.length);
    });
  }
  обновитьСписки();
  window.addEventListener("resize", function(){
    if(!текущий) return;
    /* Узлы пересобираются, а не только переставляются: их места считаются от
       ширины окна и от края подписи, и при другом размере окна старые
       координаты уже неверны. Ошибку нашёл замер: узлы, построенные при
       нулевой ширине окна, дали `100 - 110/0` и координату NaN — браузер
       молча пропустил свойство, и все три встали в левый край. */
    if(текущий._узлы){
      текущий._узлы.forEach(function(у){ у.группа.remove(); });
      текущий._узлы = null;
    }
    открыть(текущий);
  });

  /* Докладчик стоит у экрана и не целится мышью: внутри передела стрелки
     переводят на соседний, Esc поднимает на шаг вверх. */
  document.addEventListener("keydown", function(с){
    if(с.key === "Escape"){
      if(системаОткрыта) закрытьСистему();
      else if(текущий) закрыть();
      return;
    }
    if(!текущий || системаОткрыта) return;
    if(с.key !== "ArrowLeft" && с.key !== "ArrowRight") return;
    с.preventDefault();
    var где = ВСЕ_БЛОКИ.indexOf(текущий);
    var шаг = с.key === "ArrowRight" ? 1 : -1;
    открыть(ВСЕ_БЛОКИ[(где + шаг + ВСЕ_БЛОКИ.length) % ВСЕ_БЛОКИ.length]);
  });

  /* ================= сторож петель =================
     Заказчик заметил, что в какой-то момент площадки перестают двигаться.
     Причина не в файлах: у них стоит loop, и сами по себе они не кончаются.
     Останавливает их браузер — при сворачивании окна, переключении вкладки,
     нехватке памяти или засыпании машины медиа ставится на паузу, и обратно
     сама она не запускается: автозапуск срабатывает один раз при загрузке.

     На стенде это выглядит хуже всего: докладчик отвёл взгляд, вернулся — а
     макет мёртвый, и оживить его можно только перезагрузкой страницы.

     Поэтому паузу здесь считаем всегда ошибкой и чиним тремя способами сразу.
     Одного мало: событие pause приходит не во всех случаях, visibilitychange
     не ловит сворачивание окна на части систем, а таймер один срабатывает
     слишком редко, чтобы им ограничиться. */
  function завестиПетли(){
    Array.prototype.forEach.call(document.querySelectorAll(".площадка video"), function(в){
      if(в.paused){
        var п = в.play();
        /* play() отдаёт промис и отклоняет его, если браузер запретил
           автозапуск. Молчаливое падение здесь недопустимо — но и ронять показ
           нечем, поэтому просто гасим. */
        if(п && п.catch) п.catch(function(){});
      }
    });
  }

  document.addEventListener("visibilitychange", function(){
    if(!document.hidden) завестиПетли();
  });
  window.addEventListener("focus", завестиПетли);
  window.addEventListener("pageshow", завестиПетли);
  /* Раз в четыре секунды — на случаи, которые события не покрывают. Проверка
     дешёвая: шесть обращений к свойству paused. */
  setInterval(завестиПетли, 4000);

  /* Отладочный крючок — как window.__dbg в проекте ЦД. Нужен для замера: узлы
     проявляются через setTimeout, а в фоновой вкладке браузер душит таймеры,
     и синхронная проверка видит пустой экран. Через крючок состояние читается
     напрямую, без ожидания анимации. */
  window.__показ = {
    БЛОКИ: ВСЕ_БЛОКИ,
    открыть: открыть,
    открытьСистему: открытьСистему,
    закрытьСистему: закрытьСистему,
    закрыть: закрыть,
    текущий: function(){ return текущий ? текущий.код : null; },
    раскладка: раскладка,
    сквозные: СКВОЗНЫЕ,
    завестиПетли: завестиПетли,
    петлиИдут: function(){
      var в = [].slice.call(document.querySelectorAll(".площадка video"));
      return в.filter(function(э){ return !э.paused; }).length + "/" + в.length;
    },
    системаОткрыта: function(){ return системаОткрыта; },
    морф: морф,
    МОРФ_МС: МОРФ_МС,
    /* Сколько систем осталось без иконки: имя проекта — ключ, и переименование
       оборвало бы связь беззвучно. */
    безИконки: function(){
      return ВСЕ_БЛОКИ.reduce(function(нет, б){
        return нет.concat(б.проекты.filter(function(пр){ return !ИКОНКИ[пр.имя]; })
                                   .map(function(пр){ return пр.имя; }));
      }, []);
    },
    спрятатьМорф: спрятатьМорф,
    проявить: function(код){
      var б = ВСЕ_БЛОКИ.filter(function(д){ return д.код === код; })[0];
      if(!б._узлы) построитьУзлы(б);
      б._узлы.forEach(function(у){
        у.группа.classList.add("виден");
        у.группа.setAttribute("tabindex", "0");
      });
      return б._узлы.length;
    }
  };
})();
</script>
</body>
</html>
