  }

  /* Скобки стадий. Границы считаются из центров и ширины модуля, а не
     вписываются числом: сдвинется раскладка — скобки поедут за ней. */
  [ { стадия:"верх",    от:"разведка", до:"добыча" },
    { стадия:"средний", от:"транспорт", до:"транспорт" },
    { стадия:"низ",     от:"переработка", до:"реализация" } ].forEach(function(гр){
    /* Запас внутрь, а не наружу: с запасом наружу соседние скобки сходились
       краями — замер пересечений показал наложение 32 px. Между Upstream и
       Midstream остаётся 2% ширины сцены, и черта одной стадии не упирается
       в черту другой. */
    var л = ЦЕНТРЫ[гр.от] - ШИРИНА_МОДУЛЯ/2 + 0.5;
    var п = ЦЕНТРЫ[гр.до] + ШИРИНА_МОДУЛЯ/2 - 0.5;
    var с = узел("div", "скоба", сцена);
    с.style.left = л + "%";
    с.style.width = (п - л) + "%";
    /* Скобы ставятся над самым высоким модулем, а не на фиксированной высоте.
       Числом уже ошибся: поднял цепочку с 66% до 54%, скобы остались на 17%, и
       «UPSTREAM» легло на буровую вышку геологии — её модуль тянется до 11%.
       Теперь высота считается из тех же габаритов, из которых строится сама
       цепочка, и при следующем подъёме скобы поедут за ней. */
    с.style.top = самыйВысокий() + "%";
    с.innerHTML = '<div class="имя" style="color:' + СТАДИИ[гр.стадия].цвет + '">' +
                  СТАДИИ[гр.стадия].имя + '</div>' +
                  '<div class="черта" style="background:' + СТАДИИ[гр.стадия].цвет + '"></div>';
  });

  /* Иконки систем. Ключ — имя проекта, потому что своего кода у проекта в
     данных нет: данные перенесены из «цепочки» дословно, и заводить там новое
     поле значит развести два файла. Имя переименуют — иконка исчезнет молча,
     поэтому совпадения считаются и выставлены в отладочный крючок. */
  var ИКОНКИ = {
    "GeoRAG":                          "georag",
    "Цифровая геология":               "цифровая_геология",
    /* Значки ABAI разведены по смыслу модуля, а не по прежним именам строк.
       Сетка на пласте — это рейтинг секторов, то есть ЦРНС. Качалка в кольце —
       цикл мероприятий на действующей скважине, то есть подбор ГТМ.
       Заводнению нарисован свой значок: прежде оно делило кольцо с ГТМ. */
    "ABAI — цифровой рейтинг новых скважин":   "abai_црнс",
    "ABAI — управление заводнением":           "abai_заводнение",
    "ABAI — подбор и анализ эффективности ГТМ":"abai_гтм",
    "ЦД пласта":                       "цд_пласта",
    "KMG Automation — ММГ":            "kmg_automation",
    "AIAN — отслеживание перевозки":   "aian_перевозка",
    "Предиктивная аналитика АНПЗ":     "пкоп",
    "PME — энергомониторинг":          "pme",
    "OTS — тренажёры операторов":      "ots",
    "AIAN — распределение дефицита":   "aian_баланс",
    "TUMAR":                           "tumar",
    "Коргау — сообщения об опасности на промысле": "коргау",
    "Коргау — сообщения об опасности на заводе":   "коргау",
    "ABAI — ГГДМ, модель пласта":      "abai_ггдм",
    "ABAI — подбор ГНО":               "abai_гно",
    "ABAI — технологический режим":    "abai_техрежим",
    /* Один продукт в трёх переделах — три строки с именем по функции, значок
       один. Так решено 02.09 на примере AIAN: «не будем писать, что это один
       продукт, будем писать, что он делает здесь». */
    "ЭНД — наряды-допуски на промысле":      "энд",
    "ЭНД — наряды-допуски на заводе":        "энд",
    "ИИ в УТО — тепловая карта":       "ии_уто",
    "AI-Broker":                       "ai_broker",
    "ProcuPriceMetal":                 "procupricemetal"
  };

  /* ================= веер систем ================= */
  /* Места узлов задаются в процентах окна, а не считаются от экранной рамки
     площадки: во время наезда рамка отдаёт промежуточные значения, и веер
     раскрывался бы по позиции, которой уже нет. */
  function местаУзлов(б){
    var список = б.проекты, н = список.length, места = [];
    for(var и = 0; и < н; и++){
      /* Веер один на все пять блоков. Раскрывается вправо по диагонали.
         Разброс вокруг неё пробовали и отклонили: заказчик сказал, что узлы
         стали смотреться обособленно друг от друга. */
      /* Раскладка веера. Узлы держатся одной группой: шаг между соседями
         одинаков при любом их числе, а лишнее место остаётся по краям.

         Пока узлы влезают в один столбец — идут диагональю. Когда перестают,
         веер разворачивается в сетку. Это не украшение: после того как подпись
         подняли с 15 до 20 px, узел вырос со 168 до 211 px, и четыре системы
         безопасности перестали помещаться в отведённые 60% высоты — замер
         показал наложение до 18 px. Растягивать зону некуда, ужимать шаг
         нельзя, значит второй столбец.

         Разброс вокруг диагонали пробовали и отклонили: заказчик сказал, что
         узлы стали смотреться обособленно друг от друга. */
      var г = габаритУзла();
      var шагY = (г.в * 1.06) / window.innerHeight * 100;
      var шагX = (г.ш * 1.08) / window.innerWidth * 100;
      var зонаY = НИЗ_ВЕЕРА - ВЕРХ_ВЕЕРА;
      var влезает = Math.max(1, Math.floor(зонаY / шагY) + 1);
      var колонок = Math.ceil(н / влезает);
      var рядов = Math.ceil(н / колонок);
      var серединаY = (ВЕРХ_ВЕЕРА + НИЗ_ВЕЕРА) / 2;
      var серединаX = ВЕЕР_X + РАЗМАХ / 2;

      if(колонок > 1){
        /* Сетка: диагональ здесь только мешала бы — столбцы и так разводят
           узлы по горизонтали, а наклон рядов сделал бы группу кривой. */
        var кол = Math.floor(и / рядов), ряд = и % рядов;
        места.push({ проект:список[и],
                     x: серединаX + (кол - (колонок - 1) / 2) * шагX,
                     y: серединаY + (ряд - (рядов - 1) / 2) * шагY });
      } else {
        var шагYодин = н > 1 ? Math.min(зонаY / (н - 1), шагY) : 0;
        var шагXодин = шагYодин * (РАЗМАХ / зонаY);
        var сдвиг = и - (н - 1) / 2;
        места.push({ проект:список[и],
                     x: серединаX + сдвиг * шагXодин,
                     y: серединаY + сдвиг * шагYодин });
      }
    }
    return места;
  }

  function построитьУзлы(б){
    var цвет = СТАДИИ[б.стадия].цвет;
    б._узлы = местаУзлов(б).map(function(м){
      var г = узел("div", "узел" + (м.проект.состояние === "скоро" ? " скоро" : ""), веер);
      г.style.left = м.x + "%";
      г.style.top  = м.y + "%";
      г.style.color = цвет;
      г.setAttribute("role", "button");
      г.setAttribute("tabindex", "-1");
      г.setAttribute("aria-label", "Система " + м.проект.имя + ", " + СОСТОЯНИЯ[м.проект.состояние].имя);
      var с = СОСТОЯНИЯ[м.проект.состояние];
      var знак = ИКОНКИ[м.проект.имя];
      г.innerHTML =
        '<div class="кружок"><span class="волна"></span>' +
        (знак ? '<img class="знак" src="медиа/иконки/' + знак + '.png" alt="">'
              : '<span class="ядро"></span>') +
        /* Печать «AI» на узле — один из двух вариантов «вытянуть ИИ», которые
           заказчик просил показать оба; включается классом на body. Ставится
           по ярлыку в данных, а не по имени: ярлык уже стоит у всех систем с
           ИИ, и второй список вести незачем. */
        ((м.проект.ярлыки || []).indexOf("ИИ") >= 0
           ? '<span class="печать_ии" aria-label="Искусственный интеллект">AI</span>' : '') +
        '</div>' +
        '<div class="подпись">' + м.проект.имя + '</div>' +
        '<span class="сост ' + с.класс + '">' + с.имя + '</span>';
      г.addEventListener("click", function(с){ с.stopPropagation(); открытьСистему(б, м); });
      г.addEventListener("keydown", function(с){
        if(с.key === "Enter" || с.key === " "){ с.preventDefault(); открытьСистему(б, м); }
      });
      return { проект:м.проект, группа:г };
    });
  }

  /* Отложенные показы узлов держатся списком и снимаются при уходе с блока.

     Без этого на стенде вылезала настоящая ошибка, и её заметил заказчик.
     Узлы проявляются лесенкой через setTimeout; если докладчик кликнет на
     соседний передел раньше, чем лесенка доиграла, скрытьУзлы гасит всё, но
     отложенные показы предыдущего блока остаются в очереди и срабатывают уже
     после — чужие узлы проявляются поверх нового передела.

     Воспроизведено: клик по переработке через 200 мс после добычи давал шесть
     видимых узлов вместо трёх, три из них чужие. Я сначала списал это на
     застывший снимок панели, и это было неверно. */
  var отложенные = [];

  /* Больше девяти узлов — тесный веер. Девять ещё ложатся сеткой 3×3 в
     обычном размере (замерено на добыче до возврата ГГДМ, ГНО и техрежима),
     двенадцать — уже нет. Класс ставится при каждом показе, а не при
     построении: узлы других блоков лежат в разметке готовыми, и режим веера
     должен соответствовать открытому блоку, а не тому, при котором их
     построили. */
  var ТЕСНО_ОТ = 10;
  function показатьУзлы(б){
    скрытьУзлы();
    var тесно = б.проекты.length >= ТЕСНО_ОТ;
    if(веер.classList.contains("тесно") !== тесно){
      веер.classList.toggle("тесно", тесно);
      /* Узлы, построенные под другой режим, стоят не там: пересобрать. */
      if(б._узлы){ б._узлы.forEach(function(у){ у.группа.remove(); }); б._узлы = null; }
    }
    if(!б._узлы) построитьУзлы(б);
    б._узлы.forEach(function(у, и){
      /* фокус даётся в тот же такт, что и видимость: если выставить tabindex
         сразу, между кликом и появлением узла есть окно, когда Tab встаёт на
         невидимый узел */
      отложенные.push(setTimeout(function(){
        у.группа.classList.add("виден");
        у.группа.setAttribute("tabindex", "0");
      }, 260 + и*90));
    });
  }

  /* Гасится не по спискам блоков, а по разметке. Разница не косметическая:
     список _узлы можно обнулить (так делает пересборка при смене размера окна),
     и тогда узел, оставшийся в разметке, становится сиротой — ни один блок его
     больше не знает, и обход по блокам его не погасит.

     Один раз я снял такой кадр: подпись «Геология», под ней модуль сбыта, а на
     экране шесть узлов из безопасности и корпоратива разом. Повторить на
     замерах не удалось — состояние собралось из совпадения придушенных
     таймеров в фоновой вкладке. Поэтому правка не по симптому, а по классу:
     обход разметки гасит и сирот тоже, и повториться этому нечем.

     На стенде цена ошибки высокая: докладчик открывает передел и видит чужие
     системы под правильной подписью. */
  function скрытьУзлы(){
    отложенные.forEach(clearTimeout);
    отложенные = [];
    Array.prototype.forEach.call(document.querySelectorAll(".узел"), function(г){
      г.classList.remove("виден", "ушёл");
      г.setAttribute("tabindex", "-1");
    });
  }

  /* ================= подпись передела ================= */
  function показатьПодпись(б){
    подпись_передела.innerHTML =
      '<span class="стадия" style="color:' + СТАДИИ[б.стадия].цвет + '">' + СТАДИИ[б.стадия].имя + '</span>' +
      '<h2>' + б.номер + ' · ' + б.имя + '</h2>' +
      '<p>' + б.суть + '</p>' +
      '<p class="хронометраж"><span>Форум ' + б.форум + '</span><span>Правительство ' + б.гос + '</span></p>' +
      '<p class="ответственный">' + б.ответственный + '</p>' +
      '<details class="речь"><summary>Текст рассказчика</summary><p>' + б.рассказчик + '</p></details>';
    /* Верх подписи отсчитывается от нижнего края строки возврата, а не задаётся
       числом: в прошлый раз фиксированные 100 px налезали заголовком на строку
       возврата у сквозных слоёв, и это поймал заказчик, а не мой замер. */
    var подПутём = Math.round(document.querySelector(".путь").getBoundingClientRect().bottom) + 22;
    подпись_передела.style.top = подПутём + "px";
    /* Класс ставится после принудительного reflow, а не в requestAnimationFrame.
       rAF в невидимой вкладке не срабатывает вовсе — и подпись оставалась с
       opacity 0 до следующего открытия. Поймано замером: h2 заполнен, класса
       «виден» нет. На стенде это окно, потерявшее фокус в момент нажатия.
       Чтение offsetHeight заставляет браузер применить top до смены класса,
       и переход играет так же, как играл через rAF. */
    void подпись_передела.offsetHeight;
    подпись_передела.classList.add("виден");
  }

  /* ================= морф ================= */
  /* Кадр вырастает из кружка узла и садится обратно в него. Узел, из которого
     ушли, запоминается: при возврате кадр обязан сесть именно в него, иначе
     переход читается как две разные анимации, а не как одно движение. */
  var часыМеток = null;
  var часыЧистого = null;
  var текущаяСистема = null;   /* проект на открытом экране системы — для кликера и кнопки «дальше — система» */
  var морф = document.getElementById("морф");
  var откудаУзел = null;
  var МОРФ_МС = 620;
  /* Счётчик перелётов. Та же болезнь, что и у отложенных показов узлов:
     завершение морфа висит на setTimeout, и быстрый второй клик приводил бы к
     тому, что окончание первого перелёта срабатывает уже поверх второго —
     прячет кадр, который только начал расти. Считается поколение: сработавшее
     завершение проверяет, что оно ещё актуально. */
  var поколение = 0;

  function коробка(э){
    var р = э.getBoundingClientRect();
    return { л:р.left, в:р.top, ш:р.width, вы:р.height };
  }

  /* Морф прячется в два шага, и это не перестраховка. Замер поймал состояние,
     в котором инлайн opacity уже 0, а вычисленная застряла на 1: переход не
     доиграл, и кадр остался висеть поверх всего экрана. Полагаться на
     завершение перехода нельзя — сначала гасим плавно, затем снимаем класс с
     переходом, и записанный ноль применяется мгновенно и окончательно. */
  function спрятатьМорф(){
    морф.style.opacity = "0";
    setTimeout(function(){
      морф.classList.remove("идёт");
      /* Снятия класса мало. Переход, который успел стартовать, снятием
         transition-property не всегда обрывается, и с fill:backwards он
         продолжает показывать своё НАЧАЛЬНОЕ значение — то есть непрозрачный
         кадр поверх всего показа, хотя в стиле уже записан ноль.

         Поймано замером: инлайн 0, вычисленная 1, класс без перехода, а на
         элементе висят девять незавершённых переходов на currentTime 0.
         В той панели браузера не выдавались кадры вовсе, так что переходы
         не сэмплировались; на живом экране они бы доиграли. Но полагаться на
         то, что кадры выдаются, для конечного состояния нельзя. */
      морф.getAnimations().forEach(function(а){ а.cancel(); });
      морф.style.opacity = "0";
    }, 240);
  }

  function поставитьМорф(к, круглый){
    морф.style.left = к.л + "px";
    морф.style.top = к.в + "px";
    морф.style.width = к.ш + "px";
    морф.style.height = к.вы + "px";
    морф.style.borderRadius = круглый ? "50%" : "0px";
  }

  function вырастить(узелЭ, кадр, готово){
    var моё = ++поколение;
    откудаУзел = узелЭ;
    var кружок = узелЭ.querySelector(".кружок") || узелЭ;
    морф.style.backgroundImage = кадр ? 'url("' + кадр + '")' : "";
    морф.classList.remove("идёт");
    поставитьМорф(коробка(кружок), true);
    морф.style.opacity = "1";
    /* Чтение вынуждает браузер применить начальное положение до того, как
       включится переход. Без него анимации не будет вовсе: обе записи
       свернутся в одну, и кадр просто окажется на месте. */
    void морф.offsetWidth;
    морф.classList.add("идёт");
    поставитьМорф({ л:0, в:0, ш:window.innerWidth, вы:window.innerHeight }, false);
    setTimeout(function(){ if(моё === поколение) готово(); }, МОРФ_МС);
  }

  function усадить(готово){
    var моё = ++поколение;
    if(!откудаУзел){ спрятатьМорф(); готово(); return; }
    var кружок = откудаУзел.querySelector(".кружок") || откудаУзел;
    морф.classList.remove("идёт");
    поставитьМорф({ л:0, в:0, ш:window.innerWidth, вы:window.innerHeight }, false);
    морф.style.opacity = "1";
    void морф.offsetWidth;
    морф.classList.add("идёт");
    поставитьМорф(коробка(кружок), true);
    setTimeout(function(){
      if(моё !== поколение) return;
      спрятатьМорф();
      откудаУзел = null;
      готово();
    }, МОРФ_МС);
  }

  /* ================= экран системы ================= */
  /* Колонка выходит, когда ролик пошёл по второму кругу. Круг ловится по
     откату времени назад: ролик зациклен, и событие ended у него не приходит
     вовсе — это уже ловилось на метках, где по той же причине не сработал
     timeupdate.

     Часы те же 200 мс, что и у меток. Порог в полсекунды нужен, чтобы дрожание
     currentTime у декодера не сошло за откат.

     Отдельная функция, а не кусок открытьСистему: у ЦД пласта ролик всё время
     крутится под встроенным показом и успевает уйти на второй круг, пока
     зритель смотрит 3D. Без повторного завода докладчик нажимал бы «дальше —
     ролик» и получал кадр уже с колонкой. */
  function завестиЧистое(ролик){
    if(часыЧистого){ clearInterval(часыЧистого); часыЧистого = null; }
    экран_системы.classList.add("чисто");
    var было = ролик.currentTime;
    часыЧистого = setInterval(function(){
      var т = ролик.currentTime;
      if(т + 0.5 < было){
        экран_системы.classList.remove("чисто");
        clearInterval(часыЧистого); часыЧистого = null;
      }
      было = т;
    }, 200);
  }

  function открытьСистему(б, м){
    системаОткрыта = true;
    б._узлы.forEach(function(у){
      у.группа.classList.toggle("ушёл", у.проект !== м.проект);
    });

    var пр = м.проект, с = СОСТОЯНИЯ[пр.состояние];
    var стадия = document.getElementById("сис_стадия");
    стадия.textContent = СТАДИИ[б.стадия].имя + " · " + б.имя;
    стадия.style.color = СТАДИИ[б.стадия].цвет;
    document.getElementById("сис_имя").textContent = пр.имя;
    document.getElementById("сис_эффект").textContent = пр.эффект || "Эффект не заполнен";
    document.getElementById("сис_суть").textContent = пр.описание;
    document.getElementById("сис_отв").textContent =
      б.ответственный + "   ·   форум " + б.форум + "   ·   правительство " + б.гос;

    var состояние = document.getElementById("сис_состояние");
    состояние.className = "сост " + с.класс;
    состояние.textContent = с.имя;

    var демо = document.getElementById("сис_демо");
    if(пр.демо){ демо.href = пр.демо; демо.hidden = false; } else { демо.hidden = true; }
    document.getElementById("сис_ролик").hidden = !!пр.видео;

    /* Стоп-кадр ставится всегда, ролик — поверх него. Не «или», а «поверх»:
       если mp4 не дойдёт (не выложен, не докачался, кодек не поддержан), под
       ним остаётся кадр, и экран системы не чернеет посреди показа. Проверять
       наличие файла заранее нечем — ошибка приходит от самого элемента. */
    var фон = document.getElementById("фон_системы");
    var кадр = пр.кадр || б._кадр;
    /* Прежний ролик глушится до очистки разметки. Пока ролики были немыми,
       хватало innerHTML = "": картинка исчезала вместе с элементом. Со звуком
       так нельзя — отсоединённый video продолжает звучать, и быстрый переход
       от системы к системе накладывал бы две дорожки друг на друга. */
    Array.prototype.forEach.call(фон.querySelectorAll("video"), function(в){
      в.pause(); в.removeAttribute("src"); в.load();
    });
    фон.innerHTML = "";
    фон.style.backgroundImage = кадр ? 'url("' + кадр + '")' : "";
    /* Встроенный показ. Адрес ставится в момент открытия, а не заранее: iframe
       с адресом в разметке тянул бы 25 МБ моделей при каждом заходе на любой
       экран системы, даже туда, где никакого ЦД нет. */
    var рамка = document.getElementById("внешний_показ");
    var кСистеме = document.getElementById("сис_кролику");
    текущаяСистема = пр;
    /* Порядок «ролик → живая система» — решение совещания 02.09: «сразу
       начинать с ролика, после ролика переходим к демонстрации живого
       продукта». Прежде у ЦД было наоборот — сначала 3D-макет, потом кнопка
       «дальше — ролик», — так просил Адиль до совещания; решение заказчика
       новее. Встроенный показ теперь открывается кнопкой, а если ролика у
       системы нет — сразу, чтобы экран не стоял пустым. */
    var сразуСнаружи = !!пр.внешний && !пр.видео;
    экран_системы.classList.toggle("снаружи", сразуСнаружи);
    кСистеме.hidden = !(пр.внешний && пр.видео);
    рамка.src = сразуСнаружи ? пр.внешний : "about:blank";

    /* Метки пересобираются под каждую систему: они привязаны к её ролику.
       Старые часы гасятся здесь же — иначе при быстром переходе от системы к
       системе их накапливалось бы по одному на каждый показ. */
    var поле = document.getElementById("метки_ролика");
    поле.innerHTML = "";
    if(часыМеток){ clearInterval(часыМеток); часыМеток = null; }
    if(часыЧистого){ clearInterval(часыЧистого); часыЧистого = null; }
    экран_системы.classList.remove("чисто");
    if(пр.видео){
      var ролик = document.createElement("video");
      ролик.src = пр.видео;
      ролик.loop = true; ролик.playsInline = true; ролик.preload = "auto";
      /* Ролики идут со звуком — заказчик попросил звук во всех, озвучка при
         этом не нужна, так что это музыка и шумы, а не диктор.

         autoplay здесь больше не ставится: атрибут запускает ролик до того,
         как мы решим вопрос со звуком, и браузер запустил бы его молча.
         Пускаем сами, ниже.

         Разрешение на звук берётся от заставки: она не идёт, пока по ней не
         нажали, а нажатие даёт странице «липкую активацию» — после него
         браузер пускает со звуком уже всё. Поэтому к моменту, когда докладчик
         доходит до системы, звук разрешён. Если показ открыли не через
         заставку (пропустили кнопкой — это тоже нажатие) или запретили
         автозапуск иначе, откат один: играем молча, картинка важнее. */
      ролик.muted = false;
      ролик.addEventListener("error", function(){ ролик.remove(); });
      фон.appendChild(ролик);
      (function пустить(){
        var о = ролик.play();
        if(о && о.catch) о.catch(function(е){
          if(е && е.name === "NotAllowedError" && !ролик.muted){
            ролик.muted = true;
            var о2 = ролик.play();
            if(о2 && о2.catch) о2.catch(function(){});
          }
        });
      })();

      завестиЧистое(ролик);

      if(пр.метки && пр.метки.length){
        var элементы = пр.метки.map(function(м){
          var э = узел("div", "метка_видео", поле);
          э.textContent = м.текст;
          return { м:м, э:э };
        });
        /* Состояние метки считается опросом времени ролика, а не по событию
           timeupdate. Событие показалось очевидным выбором и не сработало:
           оно приходит только пока ролик реально проигрывается, а если браузер
           его придержал — кадры не выдаются, окно свёрнуто, ролик стоит —
           метки просто не загорались. Проверено замером: пять меток на месте,
           ни одна не горит ни на одной секунде.

           Опрос от этого не зависит: ролик остаётся источником времени, петля
           сама обнуляет метки, а перемотка подхватывается следующим тиком.
           Пятая доля секунды достаточна — метки висят по несколько секунд. */
        var обновить = function(){
          var т = ролик.currentTime;
          элементы.forEach(function(п_){
            п_.э.classList.toggle("горит", т >= п_.м.от && т < п_.м.до);
          });
        };
        обновить();
        часыМеток = setInterval(обновить, 200);
      }
    }

    /* Экран проявляется не сразу, а когда кадр вырос: иначе зритель видит две
       анимации подряд вместо одного движения. Узел ищется по проекту, а не
       берётся из события — открытьСистему вызывается и из отладочного крючка. */
    var свой = б._узлы.filter(function(у){ return у.проект === м.проект; })[0];
    вырастить(свой ? свой.группа : null, кадр, function(){
      экран_системы.classList.add("открыт");
      экран_системы.setAttribute("aria-hidden", "false");
      спрятатьМорф();
      document.getElementById("сис_назад").focus();
    });
  }

  function закрытьСистему(){
    if(!системаОткрыта) return;
    системаОткрыта = false;
    экран_системы.classList.remove("открыт");
    экран_системы.setAttribute("aria-hidden", "true");
    /* Ролик не просто ставится на паузу, а отматывается: докладчик открывает
       систему заново и должен получить начало, а не середину прошлого показа. */
    if(часыМеток){ clearInterval(часыМеток); часыМеток = null; }
    if(часыЧистого){ clearInterval(часыЧистого); часыЧистого = null; }
    экран_системы.classList.remove("чисто");
    /* Встроенный показ выгружается, а не прячется: за рамкой живёт своя сцена
       на Three.js, и оставленная работать она жгла бы кадры под нашим показом. */
    экран_системы.classList.remove("снаружи");
    document.getElementById("внешний_показ").src = "about:blank";
    document.getElementById("сис_кролику").hidden = true;
    var в = экран_системы.querySelector("video");
    if(в){ в.pause(); в.currentTime = 0; }
    /* Кадр садится обратно в свой узел, и только потом узлы возвращаются:
       иначе они проявятся под ещё летящим кадром. */
    усадить(function(){
      if(текущий) открыть(текущий);
    });
  }
  /* Шаг «дальше — система»: ролик уже показан, поверх него поднимается
     встроенный живой показ. Адрес ставится только сейчас — iframe с адресом
     тянул бы модели ЦД при каждом открытии экрана. Ролик ставится на паузу:
     под рамкой его не видно, а декодер под 3D-сценой ни к чему. */
  document.getElementById("сис_кролику").addEventListener("click", function(){
    if(!текущаяСистема || !текущаяСистема.внешний) return;
    var в = экран_системы.querySelector("video");
    if(в) в.pause();
    document.getElementById("внешний_показ").src = текущаяСистема.внешний;
    экран_системы.classList.add("снаружи");
    document.getElementById("сис_кролику").hidden = true;
  });

  document.getElementById("сис_назад").addEventListener("click", закрытьСистему);
  /* Вторая ступень возврата: из системы сразу ко всей цепочке, минуя передел. */
  document.getElementById("сис_вцепочку").addEventListener("click", function(){
    if(!системаОткрыта){ закрыть(); return; }
    системаОткрыта = false;
    экран_системы.classList.remove("открыт");
    экран_системы.setAttribute("aria-hidden", "true");
    if(часыМеток){ clearInterval(часыМеток); часыМеток = null; }
    if(часыЧистого){ clearInterval(часыЧистого); часыЧистого = null; }
    экран_системы.classList.remove("чисто");
    /* Встроенный показ выгружается, а не прячется: за рамкой живёт своя сцена
       на Three.js, и оставленная работать она жгла бы кадры под нашим показом. */
    экран_системы.classList.remove("снаружи");
    document.getElementById("внешний_показ").src = "about:blank";
    document.getElementById("сис_кролику").hidden = true;
    var в = экран_системы.querySelector("video");
    if(в){ в.pause(); в.currentTime = 0; }
    усадить(закрыть);
  });

  /* ================= камера ================= */
  /* Наезд — один transform на всю сцену: площадки едут вместе с биркой, линией
     и светом стола, поэтому ничто не разъезжается между собой. Источник
     площадки 2048 px, так что при увеличении видно деталь, а не пиксели —
     ради этого площадки и генерировались поштучно.

     Площадка уезжает в левую четверть кадра: справа освобождается место под
     веер. Числа в процентах сцены, поэтому от размера окна не зависят и
     одинаково работают на ноутбуке и на экране стенда. */
  var НАЕЗД_МАКС = 2.4;
  var ЦЕЛЬ_Y = 52;
  /* Зона под веер очерчена заказчиком: правая половина кадра целиком.
     Узлы раскладываются по ней диагональю, а не дугой. Дуга выносила вправо
     только средний узел, крайние оставались у левого края зоны, и правая
     треть пустовала — заказчик это и заметил. */
  var ВЕЕР_X    = 60;     /* верхний левый узел, проценты окна */
  var РАЗМАХ    = 24;     /* насколько нижний узел правее верхнего */
  /* Верх зоны 24, а не 20: при девяти узлах в добыче верхний ряд вставал на
     54 px от верха окна и на 13 px заходил в полосу шапки, прямо под чип
     «Драфт». Замер на 1912×844 после сдвига — верхний ряд начинается ниже
     шапки, нижний не доходит до края. */
  var ВЕРХ_ВЕЕРА = 24;
  var НИЗ_ВЕЕРА  = 80;
  /* Ширина узла меряется у настоящего узла, а не дублируется числом.
     Дубль уже разошёлся с CSS: в расчёте мест стояло min(20vw,220px), в стилях
     к тому моменту было min(26vw,300px), и строка узлов у сквозного слоя
     вылезла за экран. Одно значение — одно место. */
  var _габаритУзла = null;
  /* Две пробы, по одной на режим веера: тесный узел меньше, и шаг сетки для
     него другой. Кэш по режиму, иначе первая же проба задавала бы размер на
     оба режима. */
  var _габаритТесного = null;
  function габаритУзла(){
    var тесно = веер.classList.contains("тесно");
    if(тесно && _габаритТесного) return _габаритТесного;
    if(!тесно && _габаритУзла) return _габаритУзла;
    /* В пробу ставится САМОЕ ДЛИННОЕ имя из всех систем, а не слово «Проба».

       С коротким именем проба давала высоту узла с однострочной подписью, а у
       половины систем имя переносится на две строки — «ИИ в УТО — тепловая
       карта», «OTS — тренажёры операторов». Раскладка считала шаг по заниженной
       высоте, и узлы налезали друг на друга: замер показал 14 px на добыче и
       переработке сразу после того, как подпись подняли до 20 px.

       Длиннейшее имя даёт худший случай, а раскладка обязана держаться именно
       по нему — иначе она верна для одних блоков и ломается на других. */
    var длинное = "";
    ПЕРЕДЕЛЫ.forEach(function(б){
      б.проекты.forEach(function(пр){
        if(пр.имя.length > длинное.length) длинное = пр.имя;
      });
    });
    var проба = узел("div", "узел", веер);
    проба.style.visibility = "hidden";
    проба.innerHTML = '<div class="кружок"></div><div class="подпись">' + длинное + '</div>' +
                      '<span class="сост слайды">только презентация</span>';
    var г = { ш: проба.offsetWidth, в: проба.offsetHeight };
    проба.remove();
    if(тесно) _габаритТесного = г; else _габаритУзла = г;
    return г;
  }
  function ширинаУзла(){ return габаритУзла().ш; }

  /* Просвет между подписью и веером меряется, а не назначается: подпись задана
     шириной в символах и её край в пикселях от окна не зависит, а площадка
     задана процентами сцены. Подобранные числа сходились на одном размере окна
     и наезжали друг на друга на другом. */
  function наездПодПросвет(){
    var сцШ = сцена.offsetWidth;                 /* без учёта transform */
    var сцЛево = (window.innerWidth - сцШ) / 2;
    var подп = подпись_передела.getBoundingClientRect();
    var слева = (подп.width ? подп.right : сцЛево) + 26;
    var полУзла = ширинаУзла() / 2;
    var справа = ВЕЕР_X/100 * window.innerWidth - полУзла - 26;
    var просвет = Math.max(120, справа - слева);
    var к = Math.min(НАЕЗД_МАКС, просвет / (ШИРИНА_МОДУЛЯ/100 * сцШ));
    var серединаПx = слева + просвет/2;
    return { к:к, цельX: (серединаПx - сцЛево) / сцШ * 100 };
  }

  function открыть(п){
    текущий = п;
    document.body.classList.add("вглубь");
    /* Подпись заполняется первой: её измеренный край задаёт и просвет для
       наезда, и начало строки узлов у сквозного слоя. */
    показатьПодпись(п);

    /* Наезд одинаков для всех пяти блоков: докладчик нажимает на такой же
       значок и ждёт такого же ответа. */
    var р = п._р, ц = наездПодПросвет();
    var цy = р.низМодуля - р.высотаМодуля/2;
    сцена.style.transform = "translate(" + (ц.цельX - ц.к*р.центр) + "%," +
                            (ЦЕЛЬ_Y - ц.к*цy) + "%) scale(" + ц.к + ")";
    п._наезд = ц;

    /* Бирки гасятся все до одной, включая свою: передел назван в подписи, а
       подпись под площадкой уезжает вместе со сценой и на таком увеличении
       становится в палец высотой. */
    ПЕРЕДЕЛЫ.forEach(function(д){
      var свой = (д === п);
      /* Соседи гасятся сильнее, чем кажется нужным: режим screen не даёт им
         уйти в чёрный, и при 0,1 труба соседней площадки просвечивала прямо
         под подписью узла. */
      д._площадка.style.opacity  = свой ? "1" : "0.06";
      д._ореол.style.opacity = свой ? ""  : "0";
      д._бирка.style.opacity = "0";
    });
    document.getElementById("где").textContent = СТАДИИ[п.стадия].имя + " / " + п.имя;
    показатьУзлы(п);
  }

  function закрыть(){
    системаОткрыта = false;
    экран_системы.classList.remove("открыт");
    экран_системы.setAttribute("aria-hidden", "true");
    текущий = null;
    document.body.classList.remove("вглубь");
    сцена.style.transform = "none";
    /* Инлайн снимается, а не ставится в «1»: в режиме экрана роли чужие
       площадки и бирки приглушены правилами CSS, и «1» инлайном перебивало их
       после первого же возврата — на общем экране соседи вспыхивали в полную
       силу. Пустое значение возвращает слово стилям. */
    ПЕРЕДЕЛЫ.forEach(function(д){
      д._площадка.style.opacity  = "";
      д._ореол.style.opacity = "";
      д._бирка.style.opacity = "";
    });
    скрытьУзлы();
    подпись_передела.classList.remove("виден");
    подпись_передела.innerHTML = "";
  }
  document.getElementById("назад").addEventListener("click", закрыть);

  /* ================= счётчики проектов ================= */
  function обновитьСписки(){
    ПЕРЕДЕЛЫ.forEach(function(б){
      б._счётчик.textContent = б.проекты.length + " " + склонение(б.проекты.length);
    });
  }
  обновитьСписки();

  /* ================= стартовый экран роли ================= */
  /* ?экран=добыча — этот экран стенда отвечает за добычу; ?экран=добыча,переработка
     — за два передела (так у ИСУТО). Чужие площадки приглушаются стилями по
     классу «своя», под цепочкой строка «Этот экран — …». Неизвестный код в
     адресе молча пропускается: показ на стенде не должен падать из-за опечатки
     в ярлыке запуска. */
  (function(){
    var коды = (new URLSearchParams(location.search).get("экран") || "")
      .split(",").map(function(с){ return с.trim(); }).filter(Boolean);
    var свои = ПЕРЕДЕЛЫ.filter(function(б){ return коды.indexOf(б.код) >= 0; });
    if(!свои.length) return;
    document.body.classList.add("экран_роли");
    свои.forEach(function(б){
      б._площадка.classList.add("своя");
      б._ореол.classList.add("своя");
      б._бирка.classList.add("своя");
    });
    var р = узел("div", "роль_экрана", сцена);
    р.textContent = "Этот экран — " + свои.map(function(б){ return б.имя; }).join(" · ");
    /* Строка стоит под бирками: ниже низа модуля на высоту бирки с запасом. */
    р.style.top = (НИЗ_МОДУЛЯ + 14) + "%";
  })();

  window.addEventListener("resize", function(){
    /* Узлы пересобираются, а не только переставляются: их места считаются от
       ширины окна и от края подписи, и при другом размере окна старые
       координаты уже неверны. Ошибку нашёл замер: узлы, построенные при
       нулевой ширине окна, дали `100 - 110/0` и координату NaN — браузер
       молча пропустил свойство, и все три встали в левый край.

       Сбрасываются узлы всех блоков, а не только открытого. Прежде
       чистился один текущий, и это давало отложенную поломку: блоки, открытые
       до смены размера, держали узлы, посчитанные под старую ширину, и при
       следующем заходе в них подписи наезжали друг на друга, а часть узлов
       уходила за кадр. Замер на 1912×844 после смены размера: в добыче три
       наложения из трёх узлов, в другом блоке два узла за рамкой. После сброса
       всех — ноль и ноль.

       Условия «если блок открыт» здесь нет намеренно: чистить кэш надо и на
       общем экране, иначе первый же заход в блок после смены размера получит
       старые координаты. */
    скрытьУзлы();          /* снимает и отложенные показы: они ссылаются на узлы,
                              которых через строку уже не будет */
    /* Пробы размера узла тоже устаревают: ширина узла задана в vw, и при другом
       окне шаг сетки другой. Без сброса пересборка шла по старым числам. */
    _габаритУзла = null; _габаритТесного = null;
    ПЕРЕДЕЛЫ.forEach(function(б){
      if(!б._узлы) return;
      б._узлы.forEach(function(у){ у.группа.remove(); });
      б._узлы = null;
    });
    if(текущий) открыть(текущий);
  });

  /* Докладчик стоит у экрана с кликером, а не с мышью — так решено 02.09
     («планшет или кликер, тач-панель не нужна»). Кликер шлёт PageDown /
     PageUp, иногда стрелки, и должен работать на каждом уровне:
       — на цепочке «вперёд» открывает первый передел, «назад» — последний;
       — в переделе «вперёд/назад» переводят на соседний передел;
       — на экране системы «вперёд/назад» листают системы этого передела;
       — Esc поднимает на шаг вверх.
     Прежде стрелки работали только внутри передела, а с цепочки открыть
     что-то без мыши можно было лишь Tab и Enter — это нашла проверка. */
  document.addEventListener("keydown", function(с){
    if(с.key === "Escape"){
      if(системаОткрыта) закрытьСистему();
      else if(текущий) закрыть();
      return;
    }
    if(заставкаНаЭкране()) return;   /* пока стоит заставка, клавиши — её */
    var вперёд = (с.key === "ArrowRight" || с.key === "PageDown");
    var назад  = (с.key === "ArrowLeft"  || с.key === "PageUp");
    if(!вперёд && !назад) return;
    с.preventDefault();
    var шаг = вперёд ? 1 : -1;
    if(системаОткрыта && текущий && текущий._узлы && текущаяСистема){
      var узлы = текущий._узлы;
      var i = -1;
      узлы.forEach(function(у, к){ if(у.проект === текущаяСистема) i = к; });
      if(i < 0) return;
      открытьСистему(текущий, узлы[(i + шаг + узлы.length) % узлы.length]);
      return;
    }
    if(!текущий){
      открыть(вперёд ? ПЕРЕДЕЛЫ[0] : ПЕРЕДЕЛЫ[ПЕРЕДЕЛЫ.length - 1]);
      return;
    }
    var где = ПЕРЕДЕЛЫ.indexOf(текущий);
    открыть(ПЕРЕДЕЛЫ[(где + шаг + ПЕРЕДЕЛЫ.length) % ПЕРЕДЕЛЫ.length]);
  });

  /* ================= сторож петель =================
     Заказчик заметил, что в какой-то момент площадки перестают двигаться.
     Причина не в файлах: у них стоит loop, и сами по себе они не кончаются.
     Останавливает их браузер — при сворачивании окна, переключении вкладки,
     нехватке памяти или засыпании машины медиа ставится на паузу, и обратно
     сама она не запускается: автозапуск срабатывает один раз при загрузке.

     На стенде это выглядит хуже всего: докладчик отвёл взгляд, вернулся — а
     макет мёртвый, и оживить его можно только перезагрузкой страницы.

     Поэтому паузу здесь считаем всегда ошибкой и чиним тремя способами сразу.
     Одного мало: событие pause приходит не во всех случаях, visibilitychange
     не ловит сворачивание окна на части систем, а таймер один срабатывает
     слишком редко, чтобы им ограничиться. */
  function завестиПетли(){
    /* Под заставкой петли не заводятся: экран занят её роликом, и делить с ним
       декодер незачем. Сторож всё равно тикает раз в четыре секунды и заведёт
       их сразу после — но заставка вызывает эту функцию сама, не дожидаясь. */
    if(заставкаНаЭкране()) return;
    Array.prototype.forEach.call(document.querySelectorAll(".площадка video"), function(в){
      if(в.preload === "none") в.preload = "auto";
      if(в.paused){
        var п = в.play();
        /* play() отдаёт промис и отклоняет его, если браузер запретил
           автозапуск. Молчаливое падение здесь недопустимо — но и ронять показ
           нечем, поэтому просто гасим. */
        if(п && п.catch) п.catch(function(){});
      }
    });
  }

  document.addEventListener("visibilitychange", function(){
    if(!document.hidden) завестиПетли();
  });
  window.addEventListener("focus", завестиПетли);
  window.addEventListener("pageshow", завестиПетли);
  /* Раз в четыре секунды — на случаи, которые события не покрывают. Проверка
     дешёвая: пять обращений к свойству paused. */
  setInterval(завестиПетли, 4000);

  /* ================= заставка ================= */
  /* Ролик перед цепочкой. Правило одно: заставка не имеет права остаться на
     экране. Всё, что ниже, — способы её снять, и их четыре, потому что ролик
     на чужой машине может не пойти по причинам, которых мы отсюда не видим.

     1. Кончился — обычный путь.
     2. Докладчик нажал «Пропустить →».
     3. Ролик отдал ошибку — файла нет, кодек не тот.
     4. Ролик запущен, но время стоит; или данные не пришли за восемь секунд.

     Четвёртый и есть главный. Ролик заказчика пришёл в HEVC Main 10; такой
     файл в Chrome играет не везде, и в зале это выглядело бы как чёрный экран
     вместо показа. Ролик перекодирован в H.264 — но сторож оставлен: он
     закрывает и остальные причины, от кривой сборки до сорванного файла.

     Дальше — две ловушки, в которые я по очереди попал на замерах.

     Отклонено: «отказ play() снимает заставку». Заставка исчезала мгновенно —
     у невидимой вкладки Chrome глушит video-only media ради экономии питания,
     play() отдаёт AbortError. Показ, открытый заранее и выведенный на экран
     перед выступлением, потерял бы заставку ещё до того, как на него
     посмотрели. Теперь отказ пуска не снимает ничего: пуск повторяется.

     Отклонено: «время стоит — значит сломалось». Тоже сняло заставку живьём.
     Стоящее время само по себе ничего не значит: браузер вправе держать ролик
     на паузе, и document.hidden этого не показывает — окно может быть не
     видно, пока вкладка считается открытой. Простой считается поломкой только
     у запущенного ролика: играет, а время не идёт — вот это декодер встал.
     Придержанный браузером ролик просто ждёт, показывая первый кадр, и уйдёт
     сам, как только окно выведут вперёд.

     Отдельная защита на «файл не грузится»: восемь секунд без данных
     (readyState < 2) — снимаем. Иначе на сорванной сборке заставка осталась бы
     чёрным прямоугольником навсегда. */

  /* Звук и старт по нажатию.

     Браузер не пускает автозапуск со звуком, пока на странице не было ни
     одного действия человека, — это политика браузера, а не настройка показа,
     и обойти её со стороны страницы нельзя. Мы прошли по этому кругу трижды:
     сначала ролик шёл молча, потом звук включала кнопка в углу, потом любое
     действие. Заказчик выбрал последнее решение сам: ролик не идёт вовсе,
     пока не нажали, а по нажатию идёт сразу со звуком, с первого кадра.

     Это самый честный вариант из возможных. Нажатие — и есть то действие,
     которого требует браузер, поэтому звук гарантирован, а не «как повезёт».
     И зритель ничего не теряет: до нажатия висит первый кадр ролика, а не
     чёрный экран.

     Раньше этот вариант отклонялся мной из-за заглушки на проекторе — пока
     никто не нажал, гость видит неподвижную картинку. Возражение снято тем,
     что картинка эта — кадр самой заставки: степь на рассвете со знаком КМГ
     в цепочке, вполне себе титульный экран.

     Кнопки на нём нет: заказчик попросил просто паузу. Значит, докладчик должен
     знать, что показ начинается с любого нажатия, — на экране об этом не
     написано. Размен осознанный: надпись на титульном кадре стоит дороже, чем
     одна строка в памятке. Строка есть в README.

     Кнопка «Включить звук» больше не нужна и убрана: звук приходит сам вместе
     со стартом. */
  var заставка = document.getElementById("заставка");
  var роликЗаставки = document.getElementById("ролик_заставки");
  var сторожЗаставки = null;

  function снятьЗаставку(){
    if(!заставка || заставкаСнята) return;
    заставкаСнята = true;
    if(сторожЗаставки){ clearInterval(сторожЗаставки); сторожЗаставки = null; }
    /* Петли заводятся в начале проявления, а не после: 720 мс им как раз
       хватает, чтобы дотянуть первые кадры, и цепочка открывается уже живой. */
    завестиПетли();
    заставка.classList.add("ушла");
    роликЗаставки.pause();
    /* hidden ставится после проявления, а не сразу: display:none обрывает
       переход и заставка исчезла бы рывком. */
    setTimeout(function(){
      заставка.hidden = true;
      /* Ролик выгружается: 9 МБ декодера под показом ни к чему, а вернуть
         заставку можно только перезагрузкой. */
      роликЗаставки.removeAttribute("src");
      роликЗаставки.load();
    }, 720);
  }

  var заставкаПущена = false;

  function пуститьЗаставку(){
    if(!заставка || заставкаСнята || !заставкаПущена) return;
    var о = роликЗаставки.play();
    if(о && о.catch) о.catch(function(е){
      /* Разбирается ровно одна причина. NotAllowedError после нажатия быть не
         должно — нажатие и есть требуемое действие, — но если браузер всё же
         откажет, картинка важнее звука: идём молча. Прочие отказы (AbortError
         от экономии питания и подобные) лечатся повтором, его делает сторож. */
      if(е && е.name === "NotAllowedError" && !роликЗаставки.muted){
        роликЗаставки.muted = true;
        var о2 = роликЗаставки.play();
        if(о2 && о2.catch) о2.catch(function(){});
      }
    });
  }

  function начатьЗаставку(){
    if(!заставка || заставкаСнята || заставкаПущена) return;
    заставкаПущена = true;
    роликЗаставки.muted = false;
    роликЗаставки.currentTime = 0;
    пуститьЗаставку();
  }

  if(заставка){
    /* Пропуск — только кнопкой. Прежде заставку снимал щелчок по кадру и любая
       клавиша; заказчик попросил убрать, и правильно: на стенде по экрану
       трогают и просто так, а докладчик может смахнуть заставку локтем мыши.
       Единственный выход остаётся видимым и нарочным. */
    document.getElementById("пропустить").addEventListener("click", снятьЗаставку);

    /* Начинает щелчок по кадру, касание или клавиша — всё это одно действие
       человека, и оба пути ведут в одну функцию. Пропуск при этом остаётся
       только на своей кнопке: щелчок по кадру заставку не снимает. */
    заставка.addEventListener("pointerdown", начатьЗаставку);
    document.addEventListener("keydown", function(с){
      if(заставкаСнята) return;
      /* Esc — единственная клавиша, которая пропускает, а не пускает. Она и
         во всём остальном показе поднимает на шаг вверх, и рука докладчика
         тянется к ней сама; пускать ею ролик значило бы делать обратное
         тому, чего от неё ждут. */
      if(с.key === "Escape") снятьЗаставку(); else начатьЗаставку();
    });
    роликЗаставки.addEventListener("ended", снятьЗаставку);
    роликЗаставки.addEventListener("error", снятьЗаставку);
    document.addEventListener("visibilitychange", function(){
      if(!document.hidden) пуститьЗаставку();
    });
    window.addEventListener("focus", пуститьЗаставку);

    var былоЗ = -1, стоит = 0, тиков = 0;
    сторожЗаставки = setInterval(function(){
      тиков += 1;
      /* Восемь секунд без данных — файла нет или кодек не тот. Проверяется и до
         нажатия: заставка не должна держать цепочку за кнопкой, за которой
         ничего нет. */
      if(роликЗаставки.readyState < 2){
        if(тиков >= 16) снятьЗаставку();   /* 16 × 500 мс = восемь секунд без данных */
        return;
      }
      /* До нажатия ролик стоит по замыслу, и сторожить тут нечего. */
      if(!заставкаПущена) return;
      if(роликЗаставки.paused){ стоит = 0; пуститьЗаставку(); return; }
      var т = роликЗаставки.currentTime;
      if(т === былоЗ){
        стоит += 1;
        if(стоит >= 6) снятьЗаставку();    /* 6 × 500 мс = три секунды на месте */
      } else { стоит = 0; былоЗ = т; }
    }, 500);
  }

  /* ================= курсор ================= */
  /* Прячется после 2,5 с без движения мыши и возвращается от первого же
     движения. Считается по mousemove, а не по pointermove: с касаний
     pointermove приходит пачкой и на сенсорном экране стрелка мигала бы.

     Таймер перезаводится, а не тикает постоянно: движений мыши в секунду
     десятки, и дешевле один setTimeout, чем проверка на каждом событии. */
  var ЧАС_КУРСОРА = 2500;
  var курсорЧасы = null;
  function показатьКурсор(){
    document.body.classList.remove("без_мыши");
    if(курсорЧасы) clearTimeout(курсорЧасы);
    курсорЧасы = setTimeout(function(){
      document.body.classList.add("без_мыши");
    }, ЧАС_КУРСОРА);
  }
  document.addEventListener("mousemove", показатьКурсор);
  /* Колесо и нажатие тоже считаются присутствием: докладчик может держать
     руку на месте и крутить или щёлкать. */
  document.addEventListener("mousedown", показатьКурсор);
  document.addEventListener("wheel", показатьКурсор, { passive: true });
  показатьКурсор();

  /* Отладочный крючок — как window.__dbg в проекте ЦД. Нужен для замера: узлы
     проявляются через setTimeout, а в фоновой вкладке браузер душит таймеры,
     и синхронная проверка видит пустой экран. Через крючок состояние читается
     напрямую, без ожидания анимации. */
  window.__показ = {
    БЛОКИ: ПЕРЕДЕЛЫ,
    снятьЗаставку: снятьЗаставку,
    заставкаИдёт: function(){
      return !заставка.hidden && !роликЗаставки.paused;
    },
    открыть: открыть,
    открытьСистему: открытьСистему,
    закрытьСистему: закрытьСистему,
    закрыть: закрыть,
    текущий: function(){ return текущий ? текущий.код : null; },
    раскладка: раскладка,
    завестиПетли: завестиПетли,
    петлиИдут: function(){
      var в = [].slice.call(document.querySelectorAll(".площадка video"));
      return в.filter(function(э){ return !э.paused; }).length + "/" + в.length;
    },
    системаОткрыта: function(){ return системаОткрыта; },
    морф: морф,
    МОРФ_МС: МОРФ_МС,
    /* Сколько систем осталось без иконки: имя проекта — ключ, и переименование
       оборвало бы связь беззвучно. */
    безИконки: function(){
      return ПЕРЕДЕЛЫ.reduce(function(нет, б){
        return нет.concat(б.проекты.filter(function(пр){ return !ИКОНКИ[пр.имя]; })
                                   .map(function(пр){ return пр.имя; }));
      }, []);
    },
    спрятатьМорф: спрятатьМорф,
    проявить: function(код){
      var б = ПЕРЕДЕЛЫ.filter(function(д){ return д.код === код; })[0];
      if(!б._узлы) построитьУзлы(б);
      б._узлы.forEach(function(у){
        у.группа.classList.add("виден");
        у.группа.setAttribute("tabindex", "0");
      });
      return б._узлы.length;
    }
  };
})();
</script>
</body>
</html>
