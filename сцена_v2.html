<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>КМГ — цифровая цепочка · v2 процессы</title>
<style>
/* Палитра и шрифты перенесены из ЦД через AIAN: заказчик просил у всех показов
   один стиль. Собственного набора цветов здесь нет намеренно — показы стоят
   рядом на одном стенде, и разнобой читается как разные продукты.
   Фирменный синий КМГ добавлен отдельно: он замерен по логотипу подсчётом
   пикселей, а не подобран на глаз. */
:root{
  --кмг:#02AEF0; --кмг_свет:#90D6F7;
  --циан:#4FE3FF; --мята:#3EE6B8; --янтарь:#F0AE4A; --зелёный:#3ED598; --красный:#FF5A4F;
  --фон0:#050810; --фон1:#0C1626;
  --грань:#1B2E48; --грань_мягкая:#142338;
  --текст:#D7E2F2; --текст2:#AFC0D8; --приглуш:#7C8DA6;
  /* Ширина узла веера. Держится здесь, потому что от неё зависит и раскладка
     узлов, и масштаб наезда: JS читает её у настоящего элемента. */
  --узел-ширина:min(calc(26 * 19.2px),300px);
}
/* Шрифты самохостятся: в зале может не быть интернета, а показ обязан
   открыться. Фоллбек на системные — если woff2 не дойдёт, экран живёт. */
@font-face{font-family:'Unbounded';font-weight:500 700;font-display:swap;
  src:url('медиа/шрифты/унб_700_cyrillic.woff2') format('woff2');
  unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Unbounded';font-weight:500 700;font-display:swap;
  src:url('медиа/шрифты/унб_700_latin.woff2') format('woff2');
  unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:'Golos Text';font-weight:400 600;font-display:swap;
  src:url('медиа/шрифты/голос_400_cyrillic.woff2') format('woff2');
  unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Golos Text';font-weight:400 600;font-display:swap;
  src:url('медиа/шрифты/голос_400_latin.woff2') format('woff2');
  unicode-range:U+0000-00FF,U+2000-206F}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
/* ================= стол 1920×1080 =================
   Весь показ свёрстан под 1920×1080 и вписывается в любой экран целиком:
   масштаб = min(ширина/1920, высота/1080), по краям чёрные поля. Так же
   устроены слайды закупок. До этого сцена жила в vw/vh, а слои поверх неё
   (подпись, веер, панель процессов, экран системы) — в px с примесью vw, и
   на 16:10, 5:4 и 2560+ они разъезжались или мельчали (снимки 11.09).
   position:fixed внутри трансформированного стола считается от стола —
   это и нужно. Единицы vw/vh в стилях переведены в px стола. */
/* 11.09 (Адиль): в окне не 16:9 по краям были чёрные полосы — «так быть не
   должно». Стол не режется до 1920×1080, а покрывает всё окно в единицах
   стола: ширина = окно/масштаб, высота = окно/масштаб. Масштаб тот же — по
   меньшей стороне, поэтому ничего не мельчает и не обрезается, а слои с
   inset:0 растягиваются на весь экран. */
#стол_1920{position:fixed;left:50%;top:50%;width:var(--стол_ш,1920px);height:var(--стол_в,1080px);
  transform:translate(-50%,-50%) scale(var(--масштаб,1));transform-origin:center;overflow:hidden;background:#000}
body{
  /* Фон страницы чёрный, а свет стола лежит внутри сцены (.подложка).
     Причина не косметическая: .сцена создаёт свой контекст наложения из-за
     transform, и площадки в режиме screen смешивались не с градиентом
     страницы, а с прозрачностью внутри контекста — из-за чего вокруг каждой
     площадки стоял чёрный прямоугольник. Проверено подменой режима на normal:
     прямоугольники становились явными, на чёрном фоне исчезали совсем. */
  background:#000;
  color:var(--текст);
  font-family:'Golos Text',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:19.5px;line-height:1.55;overflow:hidden;touch-action:manipulation;
  -webkit-font-smoothing:antialiased;
}
/* дисплейный шрифт — только знаковым вещам: имя экрана, названия переделов,
   имя проекта. Подписи остаются в Golos: Unbounded широкий, строки не влезут */
.дисплей{font-family:'Unbounded',system-ui,sans-serif;letter-spacing:.01em}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--кмг);outline-offset:4px;border-radius:4px}
.надпись{font-size:16px;letter-spacing:.18em;text-transform:uppercase;color:var(--приглуш)}

/* ================= шапка и путь ================= */
.шапка{position:fixed;inset:0 0 auto 0;z-index:40;padding:20px 34px 0;
  display:flex;justify-content:space-between;align-items:flex-start;gap:20px;
  pointer-events:none}
.шапка > *{pointer-events:auto}
h1{font-size:clamp(24.5px,calc(2.6 * 19.2px),35px);font-weight:700;margin-top:5px}
/* Трёхточечный градиент на коротком слове читался пятном: светлый край,
   тёмная середина, светлый край — заказчик это и заметил. Он предложил либо
   убрать градиент, либо оживить его. Оживляю: блик медленно проходит по слову,
   и то, что было пятном, читается как движение света.

   Полотно втрое шире слова, поэтому блик успевает уйти и вернуться, а не
   дёргается на месте. Двенадцать секунд — на грани заметности: докладчик
   говорит, а не смотрит на заголовок.

   Перелив идёт только на уровне 0. Внутри передела и на экране системы
   заголовок остаётся, и мерцающая строка там отвлекала бы от того, ради чего
   туда провалились. */
h1 .град{background:linear-gradient(100deg,
    var(--кмг) 0%, var(--кмг) 30%, #EAF9FF 42%, var(--кмг_свет) 54%, var(--кмг) 70%, var(--кмг) 100%);
  background-size:300% 100%;background-position:100% 0;
  -webkit-background-clip:text;background-clip:text;color:transparent}
body:not(.вглубь) h1 .град{animation:перелив 12s ease-in-out infinite}
@keyframes перелив{0%{background-position:100% 0}
  55%{background-position:0% 0}100%{background-position:100% 0}}
.шапка_п{display:flex;align-items:center;gap:14px}
/* Логотип заказчика тёмный и на чёрном не читается: выбеливаем фильтром,
   исходный файл остаётся как был. Инверсную версию надо запросить у
   пресс-службы — перекраска фирменного знака это временная мера. */
/* 60 px, а не 40: заказчик дважды просил крупнее — с расстояния стенда 40 px
   читался как штамп в углу, а не как имя компании. */
#лого{height:60px;filter:brightness(0) invert(1);opacity:.92}

/* Отступ пересчитан после того, как из шапки убрали строку форумов: она
   держала высоту, и без неё между заголовком и строкой возврата зияла дыра. */
.путь{position:fixed;left:34px;top:82px;z-index:40;display:flex;align-items:center;gap:12px;
  opacity:0;pointer-events:none;transition:opacity .3s}
body.вглубь .путь{opacity:1;pointer-events:auto}
.путь button{display:inline-flex;align-items:center;gap:8px;color:var(--текст2);
  border:1px solid var(--грань);border-radius:8px;padding:7px 13px;font-size:16px;
  transition:border-color .2s,color .2s,background .2s}
.путь button:hover{border-color:var(--кмг);color:var(--кмг);background:rgba(2,174,240,.08)}
.путь .где{font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:var(--приглуш)}

/* ================= стол и сцена ================= */
.стол{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}
/* Ширина сцены — от размера стола, а не 1920: в окне с панелью браузера стол
   шире 1920 единиц, и цепочка на фиксированной ширине стояла мелкой с пустыми
   полями по бокам (Адиль 11.09). Теперь сцена занимает всю ширину стола,
   пока позволяет высота — как раньше с vw/vh. */
.сцена{position:relative;width:min(var(--стол_ш,1920px), calc(var(--стол_в,1080px) * 2560 / 1098));
  aspect-ratio:2560/1098;transform-origin:0 0;
  transition:transform 900ms cubic-bezier(.22,.7,.24,1)}

/* Свет стола. Растянут далеко за пределы сцены, чтобы его край не влез в кадр,
   и намеренно оставлен внутри .сцены: при наезде он едет вместе с макетом, как
   и положено свету, падающему на стол. */
.подложка{position:absolute;inset:-60%;pointer-events:none;
  background:radial-gradient(46% 40% at 50% 62%, var(--фон1) 0%, var(--фон0) 46%, #000 76%);
  animation:дыхание 19s ease-in-out infinite}
@keyframes дыхание{0%,100%{opacity:.86}50%{opacity:1}}

/* Линия связи рисуется кодом, а не лежит в картинке: она обязана тянуться
   между площадками при любом их сдвиге, а нарисованную пришлось бы
   перегенерировать после каждой правки раскладки. */
.линия{position:absolute;left:0;right:0;top:var(--низ,66%);height:2px;
  background:linear-gradient(90deg,transparent 0%,var(--кмг) 6%,var(--кмг) 94%,transparent 100%);
  box-shadow:0 0 14px rgba(2,174,240,.75);opacity:.9}
/* Импульсы по линии — единственное движение, которое честно означает смысл:
   по цепочке идёт поток. Остальная фоновая анимация только оживляет кадр. */
.импульс{position:absolute;top:-3px;width:64px;height:8px;border-radius:4px;
  background:linear-gradient(90deg,transparent,var(--кмг_свет),transparent);
  filter:blur(1px);animation:бег 7s linear infinite}
@keyframes бег{0%{left:-6%;opacity:0}8%{opacity:1}92%{opacity:1}100%{left:102%;opacity:0}}

/* Площадки лежат на чёрном фоне до нуля по яркости (замерено: углы 0,1–0,3 из
   255), поэтому кладутся режимом screen — чёрное ничего не добавляет. Вырезать
   их порогом не нужно: на прошлой сборке порог съедал грунт по контуру. */
.площадка{position:absolute;mix-blend-mode:screen;
  transition:opacity .42s ease;
  animation:парение var(--период,9s) ease-in-out var(--сдвиг,0s) infinite;
  will-change:transform}
.площадка img,.площадка video{width:100%;height:100%;display:block}
/* Периоды у площадок разные и не кратные друг другу: с одинаковым периодом
   ряд начинает дышать как один предмет, и макет читается картинкой, а не
   набором объектов. */
/* Размах замерен, а не подобран: при 0,9% высоты слоя смещение выходило
   2,6 px на экране 1600 px — движения не видно вовсе. 1,8% дают около 5 px:
   боковым зрением читается, речи докладчика не мешает. */
@keyframes парение{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.8%)}}

/* Ореол под основанием: пульсирует в том же ритме, что и парение своей
   площадки, поэтому свет читается принадлежащим объекту, а не фону. */
.ореол{position:absolute;pointer-events:none;border-radius:50%;
  background:radial-gradient(closest-side, rgba(2,174,240,.30), transparent 72%);
  animation:тление var(--период,9s) ease-in-out var(--сдвиг,0s) infinite}
@keyframes тление{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}

/* Зона клика невидима совсем. Раньше при наведении она подсвечивалась
   прямоугольником — заказчику это не понравилось, и по делу: модуль
   восьмиугольный, стоит на чёрном столе, а вокруг него загоралась
   прямоугольная плашка. Она выдавала разметку интерфейса там, где зритель
   видит предмет на столе.

   Вместо подсветки предмет РЕАГИРУЕТ: приподнимается и ярче светится ореол под
   ним. Это то же самое, что сделал бы человек, беря макет в руки, и не требует
   рисовать ни одной новой фигуры. */
.зона{position:absolute;cursor:pointer}
body.вглубь .зона{pointer-events:none}

/* Подъём вешается на картинку внутри площадки, а не на саму площадку: у
   площадки уже занят transform анимацией парения, и второй transform на том же
   элементе её бы перебил. */
.площадка img,.площадка video{transition:transform .34s cubic-bezier(.34,1.4,.5,1)}
.площадка.поднята img,.площадка.поднята video{transform:translateY(-2.2%) scale(1.02)}
/* Ореол ярчает фильтром, а не прозрачностью: прозрачность и масштаб у него
   заняты анимацией тления. */
.ореол{transition:filter .34s ease}
.ореол.ярче{filter:brightness(2.1) saturate(1.15)}

.бирка{position:absolute;transform:translate(-50%,0);text-align:center;
  white-space:nowrap;pointer-events:none;transition:opacity .32s ease}
.бирка .номер{font-size:16.5px;letter-spacing:.24em;color:var(--кмг);opacity:.8}
.бирка .имя{font-size:19px;font-weight:700;margin-top:2px;text-shadow:0 2px 14px #000}
/* 14.09 (Адиль): счётчик проектов под именем передела снят; считается по-прежнему, вернуть — убрать display:none */
.бирка .счёт{font-size:16px;color:var(--приглуш);margin-top:1px;display:none}

/* Скобки стадий. Подписаны над цепочкой, а не в легенде: докладчик показывает
   рукой на группу объектов, и надпись должна быть там же, где рука. */
.скоба{position:absolute;text-align:center;pointer-events:none;transition:opacity .32s}
.скоба .черта{height:1px;width:100%;opacity:.6}
/* Крупнее по просьбе заказчика: стадия — это то, что докладчик называет
   первым, и с расстояния она читалась хуже подписей переделов под ней. */
.скоба .имя{font-family:'Unbounded',system-ui,sans-serif;font-size:19.5px;letter-spacing:.24em;
  text-transform:uppercase;margin-bottom:8px}
body.вглубь .скоба{opacity:0}

/* ================= ИИ на экране ================= */
/* Сквозных слоёв в разметке больше нет — ни полосы, ни второй линии, ни
   связок. Сняты по решению совещания 02.09; история попыток записана в JS у
   ПЕРЕДЕЛЫ. */
/* Два способа «вытянуть ИИ» — заказчик просил показать оба и выбрать на
   встрече. Печать: круглый штамп «AI» у значка каждой системы с ИИ — ей это
   нравится больше («как печать, лейбл»). Заголовок: «Цифровая цепочка на ИИ» —
   так называется и сам сценарий показа. Оба включаются классами на body по
   параметру адреса ?ии=печать|заголовок|оба, по умолчанию оба. Штамп чуть повёрнут — так он читается оттиском, а не
   ещё одним кружком в ряду. */
.печать_ии{display:none;position:absolute;right:-8px;top:-6px;width:36px;height:36px;
  border-radius:50%;border:1.5px solid var(--кмг);color:var(--кмг);
  font:700 11.5px/33px 'Unbounded',system-ui,sans-serif;letter-spacing:.08em;
  text-align:center;background:rgba(5,8,16,.88);transform:rotate(-12deg);
  box-shadow:0 0 0 3px rgba(2,174,240,.14),0 0 14px rgba(2,174,240,.25)}
body.ии_печать .печать_ии{display:block}
/* У span своё имя класса, не то же, что у body: с одинаковым именем правило
   display:none накрывало и body — в режиме заголовка исчезала вся страница.
   Поймано замером: элемент с классом нашёлся, но им оказался body. */
/* Отступ даёт настоящий пробел в разметке, а не margin: с margin в тексте
   страницы стояло «цепочкана ИИ» — так это и читалось при копировании и
   в озвучке экранного диктора. */
.ии_в_заголовке{display:none;color:var(--кмг);font-weight:700}
body.ии_заголовок .ии_в_заголовке{display:inline}

/* ================= узлы систем ================= */
/* Узлы живут в экранных координатах, а не внутри .сцены: сцена при наезде
   масштабируется в 2,4 раза, и подписи узлов уехали бы вместе с ней в палец
   высотой. Место веера считается числом, а не замеряется у элемента — во
   время перехода замер отдаёт промежуточные значения. */
.веер{position:fixed;inset:0;z-index:12;pointer-events:none}
.узел{position:absolute;transform:translate(-50%,-50%);text-align:center;
  cursor:pointer;opacity:0;pointer-events:none;transition:opacity .45s ease;
  width:var(--узел-ширина)}
.узел.виден{opacity:1;pointer-events:auto}
.узел.ушёл{opacity:0;pointer-events:none}
/* Размер знака рос дважды по замечаниям заказчика: 52 → 72 → 110. Правая
   половина кадра под веер всё равно оставалась полупустой, а иконка с рисунком
   при 72 px читалась хуже подписи под ней — знак должен опознаваться раньше,
   чем прочитано имя, иначе он лишний. Ограничение сверху — просвет между
   подписью передела и веером: он меряется в наездПодПросвет(), и слишком
   широкий узел начинает сдавливать саму площадку. */
.узел .кружок{width:110px;height:110px;margin:0 auto;border-radius:50%;position:relative;
  display:grid;place-items:center;transition:transform .2s}
.узел:hover .кружок{transform:scale(1.1)}
/* Ядро осталось запасным видом: если иконка для системы не найдена, узел
   рисуется точкой, а не пустым кружком. Молча ломаться он не должен. */
.узел .ядро{width:32px;height:32px;border-radius:50%;background:currentColor}
/* Знак сохраняет собственный фирменный синий и не красится в цвет стадии:
   цвет стадии несут волна под ним, подпись передела и строка возврата, а
   иконка отвечает за узнавание продукта. Один цвет не может значить двух
   вещей — стадию и систему. */
.узел .знак{width:100%;height:100%;display:block;object-fit:contain;
  filter:drop-shadow(0 0 12px rgba(2,174,240,.55))}
.узел .волна{position:absolute;inset:0;border-radius:50%;background:currentColor;
  animation:пульс 3.2s ease-in-out infinite}
@keyframes пульс{0%,100%{transform:scale(1);opacity:.26}50%{transform:scale(1.5);opacity:.05}}
/* Кегль подписи против размера значка. При значке 110 px подпись в 15 px
   занимала около 14% его высоты и читалась приписью к картинке, а не именем
   системы — заказчик это и заметил. 20 px дают примерно 18%: имя весит
   наравне со значком, но не спорит с ним.

   Плашка состояния поднята следом. Она служебная и должна оставаться мельче
   имени, но на 9,5 px рядом с двадцатым кеглем читалась случайной крошкой. */
.узел .подпись{font-family:'Unbounded',system-ui,sans-serif;font-size:26px;font-weight:700;
  color:var(--текст);margin-top:15px;line-height:1.25;text-shadow:0 2px 12px #000}
.узел .сост{margin-top:10px}

.сост{display:inline-flex;align-items:center;gap:6px;font-size:17.5px;letter-spacing:.09em;
  text-transform:uppercase;padding:4px 10px;border-radius:5px;white-space:nowrap}
.сост::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.сост.готово{background:rgba(62,213,152,.13);color:var(--зелёный)}
.сост.демо{background:rgba(62,230,184,.13);color:var(--мята)}
.сост.делается{background:rgba(255,90,79,.13);color:var(--красный)}
.сост.слайды{background:rgba(124,141,166,.15);color:var(--приглуш)}
.сост.черновик{background:rgba(240,174,74,.13);color:var(--янтарь)}
/* «в проработке» — рабочая пометка, не статус продукта: янтарь, как у незаполненного эффекта */
.сост.пусто{background:rgba(240,174,74,.13);color:var(--янтарь);border:1px dashed rgba(240,174,74,.5)}
.сост.скоро{background:rgba(124,141,166,.12);color:var(--приглуш);border:1px dashed rgba(124,141,166,.5)}
/* Узел «coming soon» серый и полупрозрачный, значок обесцвечен — заказчик
   так и сказал: «серые, неактивные». Но не выключен: по нему можно
   провалиться и прочитать, что это будет. */
.узел.скоро .кружок{filter:grayscale(1);opacity:.55}
.узел.скоро .подпись{color:var(--приглуш)}
.узел.скоро .печать_ии{display:none}   /* печать сквозь grayscale и .55 давала 2,5:1 — на «скоро» ей делать нечего */
/* Тесный веер — когда узлов больше девяти. Двенадцать узлов добычи в четыре
   обычных столбца уходили за правый край: замер дал правую кромку 2337 px при
   ширине окна 1912. Ужимается всё, из чего раскладка считает шаг: ширина узла,
   кружок, подпись, печать. Раскладка меряет пробный узел уже с этим классом,
   поэтому шаг сетки пересчитывается сам. */
.веер.тесно{--узел-ширина:min(calc(19 * 19.2px),220px)}
.веер.тесно .узел .кружок{width:82px;height:82px}
.веер.тесно .узел .подпись{font-size:19.5px}
.веер.тесно .печать_ии{width:30px;height:30px;font-size:15px;line-height:27px;right:-6px;top:-5px}

/* ================= стартовый экран роли ================= */
/* На стенде пять-шесть экранов по кругу, каждый — свой передел. По решению
   02.09 каждый экран открывается цепочкой и говорит: «в этой цепочке я занимаю
   вот эту роль». Адрес ?экран=добыча (или ?экран=добыча,переработка — у ИСУТО
   переделов два) приглушает чужие площадки и оставляет свои в полную силу.
   Провал по клику работает как обычно. Приглушение 0,3, а не 0,06 как при
   наезде: на общем экране соседи должны читаться, иначе теряется сама
   цепочка, ради которой всё и затевалось. */
body.экран_роли .площадка:not(.своя){opacity:.3}
body.экран_роли .ореол:not(.своя){opacity:0}
body.экран_роли .бирка:not(.своя){opacity:.6}
.роль_экрана{position:absolute;left:50%;transform:translateX(-50%);
  font-size:clamp(16.5px,calc(1.425 * 19.2px),22.5px);letter-spacing:.14em;text-transform:uppercase;
  color:var(--текст2);white-space:nowrap;pointer-events:none;
  transition:opacity .4s}
body.вглубь .роль_экрана{opacity:0}

/* ===== общий эффект программы (Адиль 16.09: «цифры эффекта до 2030 на главной») =====
   420,7 млрд ₸ и +2 864 тыс. т дополнительной добычи за 2026–2030 по всем
   проектам — цифры Адиля 16.09, источник сводный, по переделам не бьются,
   поэтому строка одна и только на уровне цепочки. Внутри передела гаснет:
   там свои эффекты у карточек, и общая цифра рядом с ними читалась бы как
   эффект этого передела. */
.итог_эффекта{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:40;
  display:flex;align-items:center;gap:28px;padding:14px 30px;border-radius:18px;
  border:1px solid rgba(2,174,240,.28);background:rgba(5,8,16,.55);backdrop-filter:blur(8px);
  white-space:nowrap;pointer-events:none;transition:opacity .4s}
/* 17.09, разбор по дизайн-системе сцены: метка — в стиле номера бирки
   (Unbounded, циан, разрядка), а не третьим стилем подписей; число не крупнее
   h1 (27 px) — строка итог, а не заголовок экрана; подписи к числам — Golos,
   как весь текст показа, Unbounded при 13 px читался тяжело; 14 px вместо 12–13
   — расстояние до стенда 2–3 м. Цифры округлены и подписаны «оценка»: до 2030
   года десятые читаются как отчёт, а не как прогноз. */
.итог_эффекта .метка{font-family:'Unbounded',system-ui,sans-serif;font-size:16px;letter-spacing:.22em;text-transform:uppercase;color:var(--кмг);opacity:.85}
.итог_эффекта .цифра{display:flex;align-items:baseline;gap:9px}
.итог_эффекта .цифра b{font-size:clamp(24.5px,calc(1.82 * 19.2px),35px);font-weight:700;color:var(--кмг_свет);letter-spacing:-.01em}
.итог_эффекта .цифра span{font-family:'Golos Text',system-ui,sans-serif;font-size:19.5px;color:var(--текст2)}
.итог_эффекта .разд{width:1px;height:30px;background:rgba(2,174,240,.28)}
body.вглубь .итог_эффекта{opacity:0}

/* ================= подпись передела ================= */
#подпись_передела{position:fixed;z-index:14;left:34px;pointer-events:none;
  display:flex;flex-direction:column;gap:7px;max-width:min(34ch,calc(30 * 19.2px));
  opacity:0;transform:translateY(10px);
  transition:opacity .45s ease .1s,transform .45s ease .1s}
#подпись_передела.виден{opacity:1;transform:none}
#подпись_передела .стадия{font-size:16px;letter-spacing:.2em;text-transform:uppercase;font-weight:600}
#подпись_передела h2{font-family:'Unbounded',system-ui,sans-serif;font-weight:700;
  font-size:clamp(26px,calc(3.12 * 19.2px),39px);line-height:1.1}
#подпись_передела p{font-size:18px;color:var(--приглуш);line-height:1.45}
.ответственный{font-size:16px;color:var(--приглуш);letter-spacing:.02em}
#подпись_передела .эффекты{margin-top:10px;font-size:17.5px;color:var(--мята);line-height:1.4}
#подпись_передела .эффекты span{display:block;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--приглуш);margin-bottom:2px}
/* речь докладчика лежит свёрнутой: на стенде она мешает, на репетиции нужна */
.речь{pointer-events:auto;margin-top:4px}
.речь summary{font-size:16px;padding:6px 0;letter-spacing:.12em;text-transform:uppercase;color:var(--кмг);
  cursor:pointer;list-style:none;padding:4px 0}
.речь summary::-webkit-details-marker{display:none}
.речь summary::before{content:"▸ ";display:inline-block}
.речь[open] summary::before{content:"▾ "}
.речь p{font-size:17.5px;color:var(--текст2);line-height:1.5;
  border-left:2px solid var(--грань);padding-left:10px;margin-top:4px}

/* ================= экран системы ================= */
/* Не окно, а конечное состояние перелёта: въезжает из точки узла, потому что
   пространственная связь между узлом и экраном рваться не должна. */
/* Слой выше шапки и строки возврата: экран системы это полный захват кадра,
   а не окно поверх показа. В прежнем файле он перекрывал их потому, что шапка
   лежала внутри общего блока; здесь она закреплена отдельно, поэтому порядок
   задаётся числом. */
/* Собственного въезда у экрана больше нет: его выводит морф, а экран просто
   проявляется поверх уже выросшего кадра. Прежний scale(.92) при этом дёргал
   картинку второй раз — кадр приезжал морфом и тут же ехал ещё раз. */
/* visibility, а не только opacity: закрытый экран иначе остаётся в порядке
   Tab, и фокус с кликера уходил бы на невидимые кнопки. */
#экран_системы{position:fixed;inset:0;z-index:60;opacity:0;pointer-events:none;visibility:hidden;
  background:var(--фон0);overflow:hidden;
  /* visibility прячется с задержкой в длину растворения и показывается
     мгновенно (0s): так экран не пропадает рывком, а при открытии не
     зависит от того, играют ли переходы — в окне без фокуса они стоят. */
  transition:opacity .3s ease,visibility 0s linear .3s}
#экран_системы.открыт{opacity:1;pointer-events:auto;visibility:visible;transition:opacity .3s ease,visibility 0s}
.фон_системы{position:absolute;inset:0;background-size:cover;background-position:center;
  background-color:#0A1A2C}
.фон_системы video{width:100%;height:100%;object-fit:cover}
/* Шторка слева обеспечивает контраст текста. Кадр генеративный, его тон
   гарантировать нельзя, поэтому читаемость держится затемнением, а не
   надеждой на удачный кадр. */
/* Метки поверх ролика. Стиль перенесён из показа AIAN дословно: два показа
   КМГ стоят на одном стенде, и подпись, оформленная по-своему, читалась бы
   как чужая система.

   Текст держится в HTML, а не вжигается в ролик, по двум причинам. Правка
   формулировки не должна стоить перегенерации, а кириллицу генератор рисует
   нечитаемой псевдографикой — на роликах это уже проверено. */
.метка_видео{position:absolute;left:auto;right:clamp(28px,calc(4 * 19.2px),64px);bottom:calc(14 * 10.8px);
  display:flex;align-items:center;gap:9px;max-width:min(46ch,calc(42 * 19.2px));
  padding:10px 16px;border-radius:9px;
  background:linear-gradient(165deg,rgba(10,20,34,.9),rgba(6,12,22,.84));
  border:1px solid rgba(2,174,240,.38);border-top-color:rgba(215,226,242,.16);
  font-size:clamp(18px,calc(2.1 * 19.2px),28px);letter-spacing:.02em;color:var(--текст);
  opacity:0;transform:translateY(10px);transition:opacity .6s ease,transform .6s ease;
  pointer-events:none;backdrop-filter:blur(6px)}
.метка_видео::before{content:'';width:8px;height:8px;border-radius:50%;flex:0 0 auto;
  background:var(--кмг);box-shadow:0 0 10px var(--кмг)}
.метка_видео.горит{opacity:1;transform:none}
/* Метка на кадре (17.09, Geo AI): стоит под карточкой ролика, координаты
   считаются в JS из долей кадра с учётом object-fit: cover — экран системы
   не в столе, а во весь viewport, и кадр обрезается по высоте или ширине.
   Плашка мельче угловой: она подпись к предмету, а не тезис на весь экран. */
.метка_видео.на_кадре{right:auto;bottom:auto;transform:translate(-50%,8px);padding:7px 13px;
  font-size:clamp(17px,calc(1.47 * 19.2px),22.5px);gap:8px;white-space:nowrap;max-width:none}
.метка_видео.на_кадре.горит{transform:translate(-50%,0)}

.шторка{position:absolute;inset:0;background:linear-gradient(100deg,
  rgba(5,8,16,.97) 0%, rgba(5,8,16,.92) 34%, rgba(5,8,16,.55) 62%, rgba(5,8,16,.35) 100%)}
/* 16.09 (Адиль: «систем не видно») — у карточки со своим кадром (скрины
   систем, коллажи) шторка держит только левую треть под текстом, справа
   кадр виден как есть: у таких кадров тёмный край уже вшит */
#экран_системы.скрин .шторка{background:linear-gradient(100deg,
  rgba(5,8,16,.96) 0%, rgba(5,8,16,.88) 30%, rgba(5,8,16,.2) 46%, rgba(5,8,16,0) 58%)}
.текст_системы{position:absolute;left:0;top:0;height:100%;width:min(52%,720px);
  padding:clamp(28px,calc(5 * 10.8px),72px) clamp(28px,calc(4 * 19.2px),64px);
  display:flex;flex-direction:column;justify-content:center;gap:14px}
.текст_системы .стадия{font-size:16px;letter-spacing:.22em;text-transform:uppercase;font-weight:600}
.текст_системы h2{font-family:'Unbounded',system-ui,sans-serif;font-weight:700;
  font-size:clamp(30.5px,calc(4.484 * 19.2px),61.5px);line-height:1.06;letter-spacing:-.01em;text-wrap:balance}
.сис_эффект{font-size:clamp(19.5px,calc(1.95 * 19.2px),27.5px);color:var(--кмг);line-height:1.35;
  border-left:2px solid var(--кмг);padding-left:14px}
/* 10.09 ДАЦ (Шарипова): текст слева крупнее */
.сис_суть{font-size:clamp(21px,calc(1.885 * 19.2px),27.5px);color:var(--текст2);line-height:1.5;max-width:60ch;white-space:pre-line}
/* 16.09 (Адиль): подписи департаментов под карточкой сняты */
.сис_отв{display:none}
.сис_низ{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px}
#сис_ссылки{display:contents}
.кнопка{padding:13px 22px;border-radius:8px;border:1px solid var(--грань);
  font-size:17px;letter-spacing:.1em;text-transform:uppercase;color:var(--текст2);
  text-decoration:none;display:inline-flex;align-items:center;cursor:pointer;
  transition:border-color .2s,color .2s,background .2s}
.кнопка:hover:not([disabled]){border-color:var(--кмг);color:var(--кмг);background:rgba(2,174,240,.08)}
.кнопка[disabled]{opacity:.55;cursor:default}
.кнопка[hidden]{display:none}
.назад_система{position:absolute;left:clamp(28px,calc(4 * 19.2px),64px);bottom:clamp(22px,calc(4 * 10.8px),44px);
  font-size:16.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--текст2);
  border:1px solid var(--грань);border-radius:7px;padding:8px 14px;cursor:pointer;
  transition:border-color .2s,color .2s}
.назад_система:hover{border-color:var(--кмг);color:var(--кмг)}
@media (max-width:900px){ .текст_системы{width:100%} }

/* ================= морф ================= */
/* Кадр системы вырастает из кружка узла и садится обратно в него. Это не
   украшение: между уровнями показа не должно быть разрыва, иначе докладчик
   каждый раз объясняет, куда он попал. Расширенный узел и есть экран системы.

   Анимируется коробка (left/top/width/height), а не transform. Transform был
   бы дешевле, но он масштабирует кадр неравномерно — у кружка и у экрана
   разное отношение сторон, и кадр внутри плющило бы. Элемент один, 620 мс,
   ради этого можно потерпеть перерасчёт раскладки. */
.морф{position:fixed;z-index:55;pointer-events:none;opacity:0;
  background-size:cover;background-position:center;background-color:#0A1A2C;
  box-shadow:0 0 0 1px rgba(2,174,240,.5), 0 24px 80px rgba(0,0,0,.6);
  will-change:left,top,width,height,border-radius}
.морф.идёт{transition:left .62s cubic-bezier(.3,.02,.15,1),
  top .62s cubic-bezier(.3,.02,.15,1), width .62s cubic-bezier(.3,.02,.15,1),
  height .62s cubic-bezier(.3,.02,.15,1), border-radius .62s ease, opacity .2s ease}

.возврат{position:absolute;right:clamp(20px,calc(3 * 19.2px),40px);top:clamp(20px,calc(3 * 10.8px),36px);
  display:flex;gap:10px;z-index:3}

/* Встроенный показ ЦД занимает экран целиком: у него своя навигация, свои
   подписи и своя панель контура. Наша текстовая колонка рядом с ними читалась
   бы как второй интерфейс поверх первого, поэтому на этом экране она снимается,
   и остаются только кнопки возврата. */
#внешний_показ{position:absolute;inset:0;border:0;width:100%;height:100%;
  opacity:0;pointer-events:none;transition:opacity .4s ease;background:var(--фон0)}
#экран_системы.снаружи #внешний_показ{opacity:1;pointer-events:auto}
#экран_системы.снаружи .текст_системы,
#экран_системы.снаружи .шторка,
#экран_системы.снаружи #метки_ролика{opacity:0;pointer-events:none}

/* Чистый первый прогон. Ролик открывается на весь кадр: ни шторки, ни
   текстовой колонки. Заказчик смотрел показ и сказал прямо — при нажатии
   должно пойти видео, а не страница о видео.

   Так и по делу: докладчик в этот момент говорит сам, и колонка повторяет за
   ним теми же словами. Она нужна на стенде, где к экрану подходят без
   докладчика, — поэтому не убрана совсем, а выходит после первого круга.

   Подписи-метки остаются: они справа, ролика не закрывают и несут то, чего в
   кадре нет словами. Их заказчик как раз просил добавить.

   Отклонён вариант с кнопкой «показать описание». Ещё одна кнопка в кадре —
   ещё одно решение докладчику на сцене; строку «Все проекты / Только показ»
   сняли ровно по этой причине. */
#экран_системы.чисто .текст_системы,
#экран_системы.чисто .шторка{opacity:0;pointer-events:none}
.текст_системы,.шторка{transition:opacity .55s ease}

/* Экран бизнес-процесса (11.09, Адиль): при открытии системы сначала не
   ролик, а верхнеуровневый процесс — семь шагов в стиле AISAP, и две кнопки:
   «Ролик» и «Открыть систему». Ролик не должен выходить сразу (особенно
   МПГРР). Черновик на УТО и МПГРР, дальше — на все проекты с материалами. */
#процесс_системы{position:absolute;inset:0;display:none;flex-direction:column;
  padding:clamp(28px,calc(5 * 10.8px),60px) clamp(28px,calc(4 * 19.2px),64px) clamp(22px,calc(4 * 10.8px),44px);
  background:linear-gradient(180deg,rgba(5,8,16,.94),rgba(5,8,16,.9));z-index:2}
#экран_системы.процесс #процесс_системы{display:flex}
/* 16.09 (Адиль: «для ЭНД по тени порешай») — у карточки со своим кадром и без
   шагов процесса экран выбора не гасит кадр целиком: тень только слева, под
   карточкой и кнопками; у проектов с шагами (AISAP) панель шагов на всю
   ширину, там тень прежняя */
#экран_системы.процесс.скрин:not(.с_шагами) #процесс_системы{background:linear-gradient(100deg,
  rgba(5,8,16,.96) 0%, rgba(5,8,16,.9) 34%, rgba(5,8,16,.3) 50%, rgba(5,8,16,.06) 64%)}
/* у проекта с шагами и своим кадром (AISAP) — тень легче, чтобы кадр читался за панелью */
#экран_системы.процесс.скрин.с_шагами #процесс_системы{background:linear-gradient(180deg,rgba(5,8,16,.86),rgba(5,8,16,.78))}
#экран_системы.процесс .текст_системы,#экран_системы.процесс .шторка,
#экран_системы.процесс #метки_ролика{opacity:0;pointer-events:none}
.бп_шапка{display:flex;flex-direction:column;gap:10px;max-width:70%}
.бп_шапка h2{font-family:'Unbounded',system-ui,sans-serif;font-weight:700;font-size:clamp(26px,calc(3.068 * 19.2px),45px);line-height:1.08;letter-spacing:-.01em}
.бп_шаги{margin:auto 0;display:grid;grid-template-columns:repeat(7,1fr);gap:clamp(12px,calc(1.2 * 19.2px),22px)}
.бп_шаг{border-top:2px solid rgba(2,174,240,.42);padding-top:14px;opacity:0;transform:translateY(12px);transition:opacity .5s ease,transform .5s ease}
#экран_системы.открыт.процесс .бп_шаг{opacity:1;transform:none}
.бп_шаг.ии{border-top-color:rgba(62,230,184,.6)}
.бп_шаг .н{font-family:'Unbounded',sans-serif;font-size:18px;color:var(--кмг);font-weight:700}
.бп_шаг.ии .н{color:var(--мята)}
.бп_шаг h3{margin:12px 0 0;font-size:clamp(19.5px,calc(1.61 * 19.2px),28px);font-weight:700;line-height:1.25;min-height:3.75em;color:var(--текст)}
.бп_шаг .сис{margin-top:10px;font-size:clamp(16.5px,calc(1.275 * 19.2px),21px);line-height:1.4;color:var(--приглуш)}
.бп_шаг .сис b{display:block;font-size:1.07em;color:var(--кмг);font-weight:700}
.бп_шаг.ии .сис b{color:var(--мята)}
.бп_шаг .сис span{display:block;margin-top:4px}
.бп_шаг .ик{width:clamp(44px,calc(3.6 * 19.2px),64px);height:clamp(44px,calc(3.6 * 19.2px),64px);margin-top:10px;display:block;color:var(--кмг);opacity:.9}
.бп_шаг.ии .ик{color:var(--мята)}
.бп_описание{margin:auto 0;max-width:60ch;font-size:clamp(16px,1.3vw,22px);line-height:1.55;color:var(--текст2);white-space:pre-line}
.бп_кнопки{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
/* 16.09 (Адиль): экран выбора у проекта без шагов процесса собран как карточка —
   заголовок, эффект, описание и кнопки одной колонкой слева, по центру по
   вертикали (как ТКРС и AIAN). У проектов с шагами (УТО, AISAP) — прежняя
   раскладка с панелью шагов на всю ширину. */
#экран_системы.процесс:not(.с_шагами) #процесс_системы{justify-content:center;gap:14px;
  padding:clamp(28px,calc(5 * 10.8px),72px) clamp(28px,calc(4 * 19.2px),64px)}
#экран_системы.процесс:not(.с_шагами) .бп_шапка{max-width:min(52%,720px);gap:14px}
#экран_системы.процесс:not(.с_шагами) .бп_шапка h2{font-size:clamp(30.5px,calc(4.484 * 19.2px),61.5px);line-height:1.06;letter-spacing:-.01em;text-wrap:balance}
#экран_системы.процесс:not(.с_шагами) .бп_описание{margin:0;max-width:min(52%,720px)}
#экран_системы.процесс:not(.с_шагами) .бп_кнопки{margin-top:10px}
.бп_кнопки .кнопка.главная{border-color:var(--кмг);color:var(--кмг);background:rgba(2,174,240,.08)}

/* ================= заставка ================= */
/* Ролик заказчика: цепочка от сейсморазведки до карты страны и знака КМГ.
   Идёт первым делом при загрузке, потом уходит в цепочку.

   z-index выше экрана системы (60) и морфа (55): заставка перекрывает всё, что
   в показе вообще бывает на экране.

   Кадр 16:9, сцена шире — поэтому cover, а не contain: чёрные поля по бокам на
   стенде читаются как «видео не на весь экран», а срез сверху и снизу у этого
   ролика ничего не отнимает, композиция в нём центральная. */
#заставка{position:fixed;inset:0;z-index:90;background:#000;
  opacity:1;transition:opacity .7s ease}
#заставка video{width:100%;height:100%;object-fit:cover;display:block}
#заставка.ушла{opacity:0;pointer-events:none}
#заставка[hidden]{display:none}
/* Кнопки — там же, где кнопки возврата на экране системы: докладчик уже знает
   этот угол, и рука идёт туда без поиска. */
#заставка .кнопка{background:rgba(5,8,16,.55);backdrop-filter:blur(6px)}
/* Кнопки «Начать показ» и пелены под ней здесь больше нет: заказчик попросил
   оставить в начале просто паузу на первом кадре. Ролик пускает любое действие
   человека — щелчок, касание, клавиша, — а кнопка только объясняла то, что и
   так делается само собой. Единственная надпись на кадре — «Пропустить →». */

/* Курсор уходит через 2,5 с покоя: на большом экране стрелка, забытая посреди
   кадра, видна всему залу и читается как недоделанный показ.

   !important нужен по делу, а не от лени. У кнопок, узлов и площадок свой
   cursor:pointer, и он выиграл бы у правила с тем же весом — стрелка пропала
   бы везде, кроме ровно тех мест, где она заметнее всего. */
body.без_мыши, body.без_мыши *{cursor:none !important}

@media (prefers-reduced-motion:reduce){
  .площадка,.ореол,.подложка,.импульс,.узел .волна,h1 .град{animation:none}
  .морф.идёт{transition-duration:.01ms}
  .сцена,#подпись_передела,.узел{transition-duration:.01ms}
}
@media (max-width:900px){
  .шапка{padding:14px 16px 0;flex-direction:column;gap:10px}
  #подпись_передела{display:none}
}

/* ================= v2: процессная схема передела ================= */
/* Лежит там же, где веер: фиксированный слой поверх сцены, в экранных
   координатах. Слева остаётся подпись передела и площадка под ней. */
#процесс{position:fixed;left:31%;right:2.5%;top:15%;bottom:4%;z-index:12;display:none;flex-direction:column;gap:20px;pointer-events:none;overflow:hidden}
body.вглубь #процесс{display:flex}
#процесс > *{pointer-events:auto}
#процесс .бровь{font-size:17px;letter-spacing:.22em;text-transform:uppercase;color:var(--приглуш);opacity:0;transition:opacity .4s ease}
.заголовок_процесса{display:inline-flex;align-items:center;gap:14px;padding:0;font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--кмг)}
.заголовок_процесса span{font-family:'Unbounded',system-ui,sans-serif;font-size:19.5px;letter-spacing:.06em;text-transform:none;color:var(--текст)}
.заголовок_процесса i{font-style:normal;font-size:16.5px;color:var(--кмг);border:1px solid rgba(2,174,240,.45);border-radius:6px;padding:3px 9px;transition:background .2s}
.заголовок_процесса:hover i{background:rgba(2,174,240,.12)}
.ссылка_заголовка{margin-left:14px;padding:4px 11px;font:inherit;font-size:16.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--кмг);
  border:1px solid rgba(2,174,240,.45);border-radius:6px;background:transparent;cursor:pointer;transition:background .2s}
.ссылка_заголовка:hover{background:rgba(2,174,240,.12)}
.ссылка_заголовка + .ссылка_заголовка{margin-left:8px}
#процесс.виден .бровь{opacity:1}
/* 11.09 (Адиль): линия цепочки проходила прямо под надписью «Поддерживающая
   деятельность» и смазывала её. Надпись сидит на плашке в цвет фона и чуть
   выше, а сама полоса поддержки отрезана от линии тёмной подложкой. */
.поддержка .бровь{position:relative;z-index:1;align-self:flex-start;display:inline-block;padding:4px 12px 4px 0;
  background:linear-gradient(90deg,var(--фон0) 80%,transparent);border-radius:6px}
.поддержка{position:relative}
.поддержка::before{content:"";position:absolute;left:-16px;right:-16px;top:-8px;bottom:-10px;z-index:0;
  background:linear-gradient(180deg,rgba(5,8,16,.0),rgba(5,8,16,.88) 18%,rgba(5,8,16,.88));border-radius:18px;pointer-events:none}
.поддержка > *{position:relative;z-index:1}
/* ряд шагов не растягивается на высоту панели: карточки высотой по содержимому,
   иначе три чипа в одной карточке вылезали за её низ (скрин Адиля 10.09) */
.шаги_процесса{display:flex;align-items:stretch;gap:0;flex:0 0 auto}
.шаг_процесса{flex:1 1 0;min-width:0;border:1px solid var(--грань);border-radius:20px;padding:18px 18px 16px;
  background:linear-gradient(180deg, rgba(12,22,38,.92), rgba(5,8,16,.72));display:flex;flex-direction:column;
  opacity:0;transform:translateY(14px);transition:opacity .45s ease, transform .45s cubic-bezier(.2,.7,.3,1), border-color .25s, box-shadow .25s}
#процесс.виден .шаг_процесса{opacity:1;transform:none}
.шаг_процесса.охват{border-color:rgba(62,230,184,.75);box-shadow:0 0 0 3px rgba(62,230,184,.14),0 0 28px rgba(62,230,184,.28)}
.шаг_процесса .номер{font-family:'Unbounded',system-ui,sans-serif;font-size:17px;letter-spacing:.2em;color:var(--кмг)}
/* 18.09: шрифты крупнее по всему показу; заголовок шага — до 23 px, иначе «внутрискважинные» не влезает в колонку; длинные слова переносятся */
.шаг_процесса h3{font-family:'Unbounded',system-ui,sans-serif;font-size:clamp(17px,calc(1.1 * 19.2px),21px);font-weight:700;line-height:1.2;margin-top:10px;color:var(--текст);overflow-wrap:break-word}
.шаг_процесса .суть_шага{margin-top:8px;font-size:clamp(17px,calc(1.12 * 19.2px),21px);line-height:1.45;color:var(--текст2)}
/* 16.09 (Адиль): приглушённые значки читались как выделение одних чипов
   над другими — яркость у всех одна; чип без карточки отличается только тем,
   что не кликается */
.проект_чип img.серый{opacity:1}
.проект_чип:disabled{cursor:default}
.проект_чип.в_работе{border:1px dashed rgba(240,174,74,.55);background:rgba(240,174,74,.05)}
.проект_чип.в_работе img{filter:drop-shadow(0 0 8px rgba(240,174,74,.35))}
.проект_чип .метка_работы{margin-left:auto;flex:0 0 auto;padding:4px 8px;border-radius:999px;border:1px solid rgba(240,174,74,.6);
  font-size:15px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--янтарь);line-height:1}
.проект_чип.переход > span:nth-child(2){text-decoration:underline dotted rgba(2,174,240,.7);text-underline-offset:3px}
.шаг_процесса.кликабельный{cursor:pointer;transition:border-color .2s, box-shadow .2s, opacity .5s ease, transform .5s ease}
.шаг_процесса.кликабельный:hover,.шаг_процесса.кликабельный:focus-visible{border-color:rgba(2,174,240,.7);box-shadow:0 0 0 3px rgba(2,174,240,.14),0 0 28px rgba(2,174,240,.25)}
.подсказка_шага{margin-top:12px;font-size:16px;letter-spacing:.12em;text-transform:uppercase;color:var(--кмг)}
.пункты_шага{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:5px}
.пункты_шага li{position:relative;padding-left:14px;font-size:clamp(16px,calc(1.036 * 19.2px),19.5px);line-height:1.35;color:var(--текст2)}
.пункты_шага li::before{content:"";position:absolute;left:0;top:.55em;width:5px;height:5px;border-radius:50%;background:var(--кмг);opacity:.7}
.пункты_шага li.переход button{padding:0;font:inherit;color:var(--кмг_свет);text-align:left;border-bottom:1px dashed rgba(2,174,240,.5)}
.пункты_шага li.переход button i{font-style:normal;color:var(--кмг)}
.пункты_шага li.переход button:hover{color:#fff;border-bottom-color:var(--кмг)}
.шаг_процесса .ведётся{margin-top:auto;padding-top:14px;font-size:16px;letter-spacing:.12em;text-transform:uppercase;color:var(--приглуш)}
.шаг_процесса .ведётся.проработка{color:var(--янтарь)}
.стрелка_шага{flex:0 0 26px;display:flex;align-items:center;justify-content:center;color:var(--циан);font-size:26px;opacity:.7}
/* проект под шагом: значок + имя, кликается как узел веера */
.проекты_шага{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.проект_чип{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;border:1px solid transparent;
  cursor:pointer;text-align:left;background:rgba(2,174,240,.06);transition:background .2s, border-color .2s}
.проект_чип:hover,.проект_чип:focus-visible{background:rgba(2,174,240,.14);border-color:rgba(2,174,240,.5);outline:none}
.проект_чип img{width:38px;height:38px;flex:0 0 38px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(2,174,240,.5))}
.проект_чип .точка{width:14px;height:14px;flex:0 0 14px;margin:0 12px;border-radius:50%;background:var(--кмг)}
.проект_чип span{font-size:clamp(15px,calc(.95 * 19.2px),18px);font-weight:600;line-height:1.25;color:var(--текст);overflow-wrap:break-word}
/* 14.09 (Жанат Зарубековна): значок AI крупнее, как было раньше */
.проект_чип .печать_ии{position:static;width:32px;height:32px;flex:0 0 32px;font-size:16.5px;line-height:30px;transform:none;margin-left:auto}
.шаг_процесса.плотно .проекты_шага{gap:5px;margin-top:10px}
.шаг_процесса.плотно .проект_чип{padding:5px 6px;gap:6px;min-width:0}
.шаг_процесса.плотно .проект_чип span{min-width:0}
.шаг_процесса.плотно .проект_чип img{width:30px;height:30px;flex-basis:30px}
.шаг_процесса.плотно .проект_чип span{font-size:clamp(13.5px,calc(.85 * 19.2px),16px);line-height:1.2}
.шаг_процесса.плотно h3{font-size:clamp(15px,calc(.95 * 19.2px),18px)}
.шаг_процесса.плотно .суть_шага{font-size:clamp(14px,calc(.9 * 19.2px),17px);line-height:1.35}
.шаг_процесса.плотно .пункты_шага li{font-size:clamp(13.5px,calc(.85 * 19.2px),16px)}
.шаг_процесса.плотно .проект_чип .печать_ии{width:26px;height:26px;flex-basis:26px;font-size:15px;line-height:24px}
/* полоса поддержки */
.поддержка{border-top:1px solid var(--грань);padding-top:14px;display:flex;flex-direction:column;gap:10px;flex:0 0 auto;
  opacity:0;transform:translateY(10px);transition:opacity .45s ease .25s, transform .45s ease .25s}
#процесс.виден .поддержка{opacity:1;transform:none}
.поддержка .ряд{display:flex;gap:14px;flex-wrap:wrap}
.группа_поддержки{flex:1 1 0;min-width:0;border:1px dashed rgba(124,141,166,.45);border-radius:16px;padding:12px 14px 12px}
.поддержка .бровь.крупная{font-family:'Unbounded',system-ui,sans-serif;font-size:clamp(19.5px,calc(1.4 * 19.2px),26.5px);letter-spacing:.01em;text-transform:none;color:var(--текст)}
.группа_поддержки.в_ряд .имя_группы{text-transform:none;letter-spacing:0;font-size:clamp(17px,calc(1.092 * 19.2px),20.5px);color:var(--текст2)}
.группа_поддержки.в_ряд .проекты_шага{flex-direction:row;flex-wrap:wrap;gap:10px}
.группа_поддержки.в_ряд .проект_чип{flex:1 1 180px}
.группа_поддержки .имя_группы{font-size:16px;letter-spacing:.16em;text-transform:uppercase;color:var(--приглуш);margin-bottom:8px}
.группа_поддержки .проекты_шага{margin-top:0;flex-direction:row;flex-wrap:wrap}
.группа_поддержки .проект_чип{flex:1 1 200px}
#процесс .примечание{font-size:16px;color:var(--приглуш);letter-spacing:.02em}
/* в режиме v2 веер не рисуется */
body.процессы .веер{display:none}
</style>
</head>
<body>
<div id="стол_1920">

<!-- Заставка идёт перед цепочкой при загрузке. Стоит первой в разметке и выше
     всех по z-index: цепочка под ней уже собрана и петли уже играют, поэтому
     после снятия заставки зритель попадает на живой экран, а не на сборку. -->
<div id="заставка">
  <video id="ролик_заставки" src="медиа/ролики/заставка.mp4"
         playsinline preload="auto" poster="медиа/ролики/заставка_кадр.jpg"></video>
  <!-- Первый кадр стоит неподвижно, пока не нажали. Нажатие и есть то самое
       действие человека, без которого браузер не даёт звука. Ни кнопки, ни
       пелены поверх кадра нет: заказчик попросил оставить просто паузу. -->
  <div class="возврат">
    <button class="кнопка" id="пропустить" type="button">Пропустить →</button>
  </div>
</div>

<header class="шапка">
  <div>
    <h1 class="дисплей"><span class="град">Цифровая цепочка</span> <span class="ии_в_заголовке">на ИИ</span></h1>
  </div>
  <div class="шапка_п">
    <img id="лого" src="медиа/лого_кмг.png" alt="КазМунайГаз">
    <!-- Плашка «Драфт» снята 08.09 по просьбе заказчика: показ идёт заказчикам, штамп мешал. -->
  </div>
</header>

<div class="путь">
  <button id="назад" type="button">← Вся цепочка</button>
  <span class="где" id="где"></span>
</div>

<div class="стол"><div class="сцена" id="сцена">
  <div class="подложка"></div>
  <div class="линия" id="линия"></div>
</div></div>


<!-- Общий эффект программы за 2026–2030 — только на уровне цепочки -->
<div class="итог_эффекта" id="итог_эффекта" aria-label="Общий эффект программы за 2026–2030">
  <span class="метка">Ожидаемый эффект 2026–2030</span>
  <span class="цифра дисплей"><b>≈ 420 млрд ₸</b><span>по всем проектам</span></span>
  <span class="разд"></span>
  <span class="цифра дисплей"><b>+2,9 млн т</b><span>нефти дополнительно</span></span>
</div>
<div class="веер" id="веер"></div>
<div id="процесс" aria-live="polite"></div>
<div id="подпись_передела"></div>


<!-- Морф: кадр системы вырастает из самого узла, по которому кликнули.
     Лежит между веером и экраном системы, живёт только во время перехода. -->
<div class="морф" id="морф" aria-hidden="true"></div>

<!-- Экран системы — не окно, а конечное состояние перелёта. Фон и будущий
     ролик занимают один слот, поэтому согласованное видео ляжет сюда без
     правки разметки. -->
<div id="экран_системы" aria-hidden="true">
  <div class="фон_системы" id="фон_системы"></div>

  var СТАДИИ = {

    готово:   { класс:"готово",   имя:"" },

  function склонение(н){
    var е = н % 10, с = н % 100;

  /* ================= раскладка сцены ================= */
  /* Снаружи известно ровно одно: где внутри каждого файла лежит сам модуль.

     Раньше раскладка лежала готовыми числами, посчитанными снаружи. Когда

  /* 17.09: разведка перемерена по новому тайлу с буровой вышкой (геологи: вышка

  var ГАБАРИТЫ = {
    "разведка": {л:19.53, п:79.87, в:3.85, н:88.54, отн:1.3333},
    "добыча": {л:13.75, п:86.72, в:3.12, н:84.58, отн:1.3333},

    "переработка": {л:23.75, п:75.94, в:3.96, н:83.33, отн:1.3333},
    "маркетинг": {л:15.78, п:83.75, в:5.83, н:81.04, отн:1.3333}

  /* Место каждого из пяти блоков: центр по ширине, ширина модуля и высота

     соседями; при шести модулях просвет был 1%, и площадки почти касались. */
  /* 11.09: четыре передела — центры 12,5 … 87,5 с шагом 25. */

     между соседями 2% — как раз чтобы площадки не касались. */
  var ШИРИНА_МОДУЛЯ = 18.0;   /* проценты ширины сцены */
  /* Второй линии под цепочкой больше нет, и цепочка опущена к середине: при

  var НИЗ_МОДУЛЯ    = 68.0;   /* проценты высоты сцены */
  var ОТН_СЦЕНЫ     = 2560 / 1098;

  /* Файл ставится так, чтобы его модуль встал в заданное место заданной
     ширины: доля модуля в файле гуляет от 51 до 73 процентов, и по краям
     файлов модули вышли бы разного размера. */
  function раскладка(код){
    var г = ГАБАРИТЫ[код], м = МЕСТО[код];
    var шф = м.ширина / ((г.п - г.л) / 100);
    var вф = шф * ОТН_СЦЕНЫ / г.отн;
    return { лево: м.центр - м.ширина/2 - г.л/100*шф,
             верх: м.низ - г.н/100*вф,
             ширина: шф, высота: вф, центр: м.центр,
             ширинаМодуля: м.ширина, низМодуля: м.низ,
             высотаМодуля: (г.н - г.в)/100 * вф };
  }

  var ПАРЕНИЕ = { разведка:[8.4,0], добыча:[7.2,2.1], транспорт:[9.8,0.7],

  /* МЕСТО собирается из ЦЕНТРЫ и одного набора размеров: все пять блоков —

  var МЕСТО = {};
  ПЕРЕДЕЛЫ.forEach(function(п){

  if(ИИ_РЕЖИМ === "печать" || ИИ_РЕЖИМ === "оба") document.body.classList.add("ии_печать");

  var заставка = document.getElementById("заставка");

  var текущий = null, системаОткрыта = false;

  function узел(тег, класс, родитель){

  /* Петли рисуются вместо картинки там, где они есть. Список остался списком,
     а не флагом «все петли готовы»: если ролик придётся снять с показа, он

     Габариты выше замерены по первому кадру петли, а не по картинке:
     кадрирование у ролика своё и отличается от исходной площадки на проценты. */
  var ПЕТЛИ = {
    разведка:    "медиа/петли/разведка_петля.mp4",

  };

  ПЕРЕДЕЛЫ.forEach(function(п){
    var р = раскладка(п.код), пар = ПАРЕНИЕ[п.код];
    п._р = р;

    /* Ореол кладётся под площадку отдельным слоем, а не рисуется в картинке:

    var ор = узел("div", "ореол", сцена);
    ор.style.left   = (р.центр - р.ширинаМодуля*0.72) + "%";
    ор.style.width  = (р.ширинаМодуля*1.44) + "%";

    п._ореол = ор;

    сл.style.left   = р.лево + "%";
    сл.style.top    = р.верх + "%";
    сл.style.width  = р.ширина + "%";

    /* Пока идёт заставка, петли не грузятся и не играют: preload="none" и без

    var ждём = заставкаНаЭкране();
    сл.innerHTML = ПЕТЛИ[п.код]
      ? '<video src="' + ПЕТЛИ[п.код] + '" loop muted playsinline' +

  /* ================= веер систем ================= */
  /* Места узлов задаются в процентах окна, а не считаются от экранной рамки
     площадки: во время наезда рамка отдаёт промежуточные значения, и веер
     раскрывался бы по позиции, которой уже нет. */
  function местаУзлов(б){
    var список = б.проекты, н = список.length, места = [];
    for(var и = 0; и < н; и++){
      /* Веер один на все пять блоков. Раскрывается вправо по диагонали.
         Разброс вокруг неё пробовали и отклонили: заказчик сказал, что узлы
         стали смотреться обособленно друг от друга. */
      /* Раскладка веера. Узлы держатся одной группой: шаг между соседями
         одинаков при любом их числе, а лишнее место остаётся по краям.

         Пока узлы влезают в один столбец — идут диагональю. Когда перестают,
         веер разворачивается в сетку. Это не украшение: после того как подпись
         подняли с 15 до 20 px, узел вырос со 168 до 211 px, и четыре системы
         безопасности перестали помещаться в отведённые 60% высоты — замер
         показал наложение до 18 px. Растягивать зону некуда, ужимать шаг
         нельзя, значит второй столбец.

         Разброс вокруг диагонали пробовали и отклонили: заказчик сказал, что
         узлы стали смотреться обособленно друг от друга. */
      var г = габаритУзла();
      var шагY = (г.в * 1.06) / СТОЛ_В * 100;
      var шагX = (г.ш * 1.08) / СТОЛ_Ш * 100;
      var зонаY = НИЗ_ВЕЕРА - ВЕРХ_ВЕЕРА;
      var влезает = Math.max(1, Math.floor(зонаY / шагY) + 1);
      var колонок = Math.ceil(н / влезает);
      var рядов = Math.ceil(н / колонок);
      var серединаY = (ВЕРХ_ВЕЕРА + НИЗ_ВЕЕРА) / 2;
      var серединаX = ВЕЕР_X + РАЗМАХ / 2;

      if(колонок > 1){
        /* Сетка: диагональ здесь только мешала бы — столбцы и так разводят
           узлы по горизонтали, а наклон рядов сделал бы группу кривой. */
        var кол = Math.floor(и / рядов), ряд = и % рядов;
        места.push({ проект:список[и],
                     x: серединаX + (кол - (колонок - 1) / 2) * шагX,
                     y: серединаY + (ряд - (рядов - 1) / 2) * шагY });
      } else {
        var шагYодин = н > 1 ? Math.min(зонаY / (н - 1), шагY) : 0;
        var шагXодин = шагYодин * (РАЗМАХ / зонаY);
        var сдвиг = и - (н - 1) / 2;
        места.push({ проект:список[и],
                     x: серединаX + сдвиг * шагXодин,
                     y: серединаY + сдвиг * шагYодин });
      }
    }
    return места;
  }

  function построитьУзлы(б){
    var цвет = СТАДИИ[б.стадия].цвет;
    б._узлы = местаУзлов(б).map(function(м){
      var г = узел("div", "узел" + (м.проект.состояние === "скоро" ? " скоро" : ""), веер);
      г.style.left = м.x + "%";
      г.style.top  = м.y + "%";
      г.style.color = цвет;
      г.setAttribute("role", "button");
      г.setAttribute("tabindex", "-1");
      г.setAttribute("aria-label", "Система " + м.проект.имя + (СОСТОЯНИЯ[м.проект.состояние].имя ? ", " + СОСТОЯНИЯ[м.проект.состояние].имя : ""));
      var с = СОСТОЯНИЯ[м.проект.состояние];
      var знак = ИКОНКИ[м.проект.имя];
      г.innerHTML =
        '<div class="кружок"><span class="волна"></span>' +
        (знак ? '<img class="знак" src="медиа/иконки/' + знак + '.png" alt="">'
              : '<span class="ядро"></span>') +
        /* Печать «AI» на узле — один из двух вариантов «вытянуть ИИ», которые
           заказчик просил показать оба; включается классом на body. Ставится
           по ярлыку в данных, а не по имени: ярлык уже стоит у всех систем с
           ИИ, и второй список вести незачем. */
        ((м.проект.ярлыки || []).indexOf("ИИ") >= 0
           ? '<span class="печать_ии" aria-label="Искусственный интеллект">AI</span>' : '') +
        '</div>' +
        '<div class="подпись">' + м.проект.имя + '</div>' +
        (с.имя ? '<span class="сост ' + с.класс + '">' + с.имя + '</span>'
               : (безМатериалов(м.проект) ? '<span class="сост пусто">в проработке</span>' : ''));
      г.addEventListener("click", function(с){ с.stopPropagation(); открытьСистему(б, м); });
      г.addEventListener("keydown", function(с){
        if(с.key === "Enter" || с.key === " "){ с.preventDefault(); открытьСистему(б, м); }
      });
      return { проект:м.проект, группа:г };
    });
  }

  /* Отложенные показы узлов держатся списком и снимаются при уходе с блока.

     Без этого на стенде вылезала настоящая ошибка, и её заметил заказчик.
     Узлы проявляются лесенкой через setTimeout; если докладчик кликнет на
     соседний передел раньше, чем лесенка доиграла, скрытьУзлы гасит всё, но
     отложенные показы предыдущего блока остаются в очереди и срабатывают уже
     после — чужие узлы проявляются поверх нового передела.

     Воспроизведено: клик по переработке через 200 мс после добычи давал шесть
     видимых узлов вместо трёх, три из них чужие. Я сначала списал это на
     застывший снимок панели, и это было неверно. */
  var отложенные = [];

  /* Больше девяти узлов — тесный веер. Девять ещё ложатся сеткой 3×3 в
     обычном размере (замерено на добыче до возврата ГГДМ, ГНО и техрежима),
     двенадцать — уже нет. Класс ставится при каждом показе, а не при
     построении: узлы других блоков лежат в разметке готовыми, и режим веера
     должен соответствовать открытому блоку, а не тому, при котором их
     построили. */
  var ТЕСНО_ОТ = 10;
  function показатьУзлы(б){
    скрытьУзлы();
    var тесно = б.проекты.length >= ТЕСНО_ОТ;
    if(веер.classList.contains("тесно") !== тесно){
      веер.classList.toggle("тесно", тесно);
      /* Узлы, построенные под другой режим, стоят не там: пересобрать. */
      if(б._узлы){ б._узлы.forEach(function(у){ у.группа.remove(); }); б._узлы = null; }
    }
    if(!б._узлы) построитьУзлы(б);
    б._узлы.forEach(function(у, и){
      /* фокус даётся в тот же такт, что и видимость: если выставить tabindex
         сразу, между кликом и появлением узла есть окно, когда Tab встаёт на
         невидимый узел */
      отложенные.push(setTimeout(function(){
        у.группа.classList.add("виден");
        у.группа.setAttribute("tabindex", "0");
      }, 260 + и*90));
    });
  }

  /* Гасится не по спискам блоков, а по разметке. Разница не косметическая:
     список _узлы можно обнулить (так делает пересборка при смене размера окна),
     и тогда узел, оставшийся в разметке, становится сиротой — ни один блок его
     больше не знает, и обход по блокам его не погасит.

     Один раз я снял такой кадр: подпись «Геология», под ней модуль сбыта, а на
     экране шесть узлов из безопасности и корпоратива разом. Повторить на
     замерах не удалось — состояние собралось из совпадения придушенных
     таймеров в фоновой вкладке. Поэтому правка не по симптому, а по классу:
     обход разметки гасит и сирот тоже, и повториться этому нечем.

     На стенде цена ошибки высокая: докладчик открывает передел и видит чужие
     системы под правильной подписью. */
  function скрытьУзлы(){
    отложенные.forEach(clearTimeout);
    отложенные = [];
    Array.prototype.forEach.call(document.querySelectorAll(".узел"), function(г){
      г.classList.remove("виден", "ушёл");
      г.setAttribute("tabindex", "-1");
    });
  }

  /* ================= подпись передела ================= */
  function показатьПодпись(б){
    подпись_передела.innerHTML =
      '<span class="стадия" style="color:' + СТАДИИ[б.стадия].цвет + '">' + СТАДИИ[б.стадия].имя + '</span>' +
      '<h2>' + б.номер + ' · ' + б.имя + '</h2>' +
      '<p>' + б.суть + '</p>' +
      /* Строка ответственных (ДЗО и департаменты) снята с подписи передела
         (Адиль 11.09, красным на скринах); в данных остаётся. */
      /* 11.09 (Мария): «эффектов не хватает, показать справочно снизу»;
         14.09 (Адиль): пока убрать все — цифры не согласованы. Данные в
         поле «эффекты» остаются, вернуть — раскомментировать строку. */
      // (б.эффекты ? '<p class="эффекты"><span>Эффекты</span>' + б.эффекты + '</p>' : '') +
      /* Текст рассказчика на экране скрыт (08.09: «пока скрой, подумаем, что с ним
         делать»). В данных он остаётся — это шпаргалка докладчика и основа
         озвучки; вернуть — раскомментировать строку. */
      '';
      // '<details class="речь"><summary>Текст рассказчика</summary><p>' + б.рассказчик + '</p></details>';
    /* Верх подписи отсчитывается от нижнего края строки возврата, а не задаётся
       числом: в прошлый раз фиксированные 100 px налезали заголовком на строку
       возврата у сквозных слоёв, и это поймал заказчик, а не мой замер. */
    var подПутём = Math.round(document.querySelector(".путь").getBoundingClientRect().bottom / масштабСтола()) + 22;
    подпись_передела.style.top = подПутём + "px";
    /* Класс ставится после принудительного reflow, а не в requestAnimationFrame.
       rAF в невидимой вкладке не срабатывает вовсе — и подпись оставалась с
       opacity 0 до следующего открытия. Поймано замером: h2 заполнен, класса
       «виден» нет. На стенде это окно, потерявшее фокус в момент нажатия.
       Чтение offsetHeight заставляет браузер применить top до смены класса,
       и переход играет так же, как играл через rAF. */
    void подпись_передела.offsetHeight;
    подпись_передела.classList.add("виден");
  }

  /* ================= морф ================= */
  /* Кадр вырастает из кружка узла и садится обратно в него. Узел, из которого
     ушли, запоминается: при возврате кадр обязан сесть именно в него, иначе
     переход читается как две разные анимации, а не как одно движение. */
  var часыМеток = null;
  var часыЧистого = null;
  var текущаяСистема = null;   /* проект на открытом экране системы — для кликера и кнопки «дальше — система» */
  var морф = document.getElementById("морф");
  var откудаУзел = null;
  var МОРФ_МС = 620;
  /* Счётчик перелётов. Та же болезнь, что и у отложенных показов узлов:
     завершение морфа висит на setTimeout, и быстрый второй клик приводил бы к
     тому, что окончание первого перелёта срабатывает уже поверх второго —
     прячет кадр, который только начал расти. Считается поколение: сработавшее
     завершение проверяет, что оно ещё актуально. */
  var поколение = 0;

  function коробка(э){
    var р = э.getBoundingClientRect(), к = масштабСтола();
    return { л:р.left/к, в:р.top/к, ш:р.width/к, вы:р.height/к };
  }

  /* Морф прячется в два шага, и это не перестраховка. Замер поймал состояние,
     в котором инлайн opacity уже 0, а вычисленная застряла на 1: переход не
     доиграл, и кадр остался висеть поверх всего экрана. Полагаться на
     завершение перехода нельзя — сначала гасим плавно, затем снимаем класс с
     переходом, и записанный ноль применяется мгновенно и окончательно. */
  function спрятатьМорф(){
    морф.style.opacity = "0";
    setTimeout(function(){
      морф.classList.remove("идёт");
      /* Снятия класса мало. Переход, который успел стартовать, снятием
         transition-property не всегда обрывается, и с fill:backwards он
         продолжает показывать своё НАЧАЛЬНОЕ значение — то есть непрозрачный
         кадр поверх всего показа, хотя в стиле уже записан ноль.

         Поймано замером: инлайн 0, вычисленная 1, класс без перехода, а на
         элементе висят девять незавершённых переходов на currentTime 0.
         В той панели браузера не выдавались кадры вовсе, так что переходы
         не сэмплировались; на живом экране они бы доиграли. Но полагаться на
         то, что кадры выдаются, для конечного состояния нельзя. */
      морф.getAnimations().forEach(function(а){ а.cancel(); });
      морф.style.opacity = "0";
    }, 240);
  }

  function поставитьМорф(к, круглый){
    морф.style.left = к.л + "px";
    морф.style.top = к.в + "px";
    морф.style.width = к.ш + "px";
    морф.style.height = к.вы + "px";
    морф.style.borderRadius = круглый ? "50%" : "0px";
  }

  function вырастить(узелЭ, кадр, готово){
    var моё = ++поколение;
    откудаУзел = узелЭ;
    var кружок = узелЭ.querySelector(".кружок") || узелЭ;
    морф.style.backgroundImage = кадр ? 'url("' + кадр + '")' : "";
    морф.classList.remove("идёт");
    поставитьМорф(коробка(кружок), true);
    морф.style.opacity = "1";
    /* Чтение вынуждает браузер применить начальное положение до того, как
       включится переход. Без него анимации не будет вовсе: обе записи
       свернутся в одну, и кадр просто окажется на месте. */
    void морф.offsetWidth;
    морф.classList.add("идёт");
    поставитьМорф({ л:0, в:0, ш:СТОЛ_Ш, вы:СТОЛ_В }, false);
    setTimeout(function(){ if(моё === поколение) готово(); }, МОРФ_МС);
  }

  function усадить(готово){
    var моё = ++поколение;
    if(!откудаУзел){ спрятатьМорф(); готово(); return; }
    var кружок = откудаУзел.querySelector(".кружок") || откудаУзел;
    морф.classList.remove("идёт");
    поставитьМорф({ л:0, в:0, ш:СТОЛ_Ш, вы:СТОЛ_В }, false);
    морф.style.opacity = "1";
    void морф.offsetWidth;
    морф.classList.add("идёт");
    поставитьМорф(коробка(кружок), true);
    setTimeout(function(){
      if(моё !== поколение) return;
      спрятатьМорф();
      откудаУзел = null;
      готово();
    }, МОРФ_МС);
  }

  /* ================= экран системы ================= */
  /* Колонка выходит, когда ролик пошёл по второму кругу. Круг ловится по
     откату времени назад: ролик зациклен, и событие ended у него не приходит
     вовсе — это уже ловилось на метках, где по той же причине не сработал
     timeupdate.

     Часы те же 200 мс, что и у меток. Порог в полсекунды нужен, чтобы дрожание
     currentTime у декодера не сошло за откат.

     Отдельная функция, а не кусок открытьСистему: у ЦД пласта ролик всё время
     крутится под встроенным показом и успевает уйти на второй круг, пока
     зритель смотрит 3D. Без повторного завода докладчик нажимал бы «дальше —
     ролик» и получал кадр уже с колонкой. */
  function завестиЧистое(ролик){
    if(часыЧистого){ clearInterval(часыЧистого); часыЧистого = null; }
    экран_системы.classList.add("чисто");
    var было = ролик.currentTime;
    часыЧистого = setInterval(function(){
      var т = ролик.currentTime;
      if(т + 0.5 < было){
        экран_системы.classList.remove("чисто");
        clearInterval(часыЧистого); часыЧистого = null;
      }
      было = т;
    }, 200);
  }

  /* ЦД во встроенном режиме спит: рендерит 4 кадра в секунду и не трассирует,
     пока родитель не пришлёт «слайд:показать» (так он ждал подводку в
     AIAN_DEMO). Сцена сообщения не слала — отсюда «жёстко лагает» при
     открытии ЦД (08.09). Будим по загрузке рамки; повтор через секунду — на
     случай, если слушатель в рамке встал позже события load. */
  function разбудитьРамку(){
    var р = document.getElementById("внешний_показ");
    function скажи(){ try{ р.contentWindow && р.contentWindow.postMessage("слайд:показать", "*"); }catch(е){} }
    скажи(); setTimeout(скажи, 1000); setTimeout(скажи, 3000);
    /* Под рамкой продолжали крутиться пять петель площадок и декодировались
       впустую — их не видно, а ЦД с ними делит видеокарту. Ставим на паузу,
       завестиПетли() поднимет их при возврате в цепочку. */
    Array.prototype.forEach.call(document.querySelectorAll("video"), function(в){
      if(!экран_системы.contains(в) && !в.paused){ в.pause(); в.setAttribute("data-усыплена", "1"); }
    });
  }
  function разбудитьПетли(){
    Array.prototype.forEach.call(document.querySelectorAll('video[data-усыплена]'), function(в){
      в.removeAttribute("data-усыплена"); var п = в.play(); if(п && п.catch) п.catch(function(){});
    });
  }
  /* Ни ролика, ни встроенного показа, ни ссылки — по этому проекту ещё нечего
     показывать; пометка нужна Адилю как список, что дорабатывать. */
  function безМатериалов(пр){ return !пр.видео && !пр.внешний && !пр.демо; }
  function открытьСистему(б, м){
    системаОткрыта = true;
    (б._узлы || []).forEach(function(у){
      у.группа.classList.toggle("ушёл", у.проект !== м.проект);
    });

    var пр = м.проект, с = СОСТОЯНИЯ[пр.состояние];
    var стадия = document.getElementById("сис_стадия");
    стадия.textContent = СТАДИИ[б.стадия].имя + " · " + б.имя;
    стадия.style.color = СТАДИИ[б.стадия].цвет;
    document.getElementById("сис_имя").textContent = пр.имя;
    document.getElementById("сис_эффект").textContent = пр.эффект || "Эффект не заполнен";
    document.getElementById("сис_суть").textContent = пр.описание;
    /* У системы может быть свой ответственный, уже передела: AIAN — только
       ДАЦ, без Департамента закупок (09.09). */
    document.getElementById("сис_отв").textContent = пр.ответственный || б.ответственный;

    var состояние = document.getElementById("сис_состояние");
    состояние.className = "сост " + с.класс;
    состояние.textContent = с.имя || (безМатериалов(пр) ? "в проработке" : "");
    if(!с.имя && безМатериалов(пр)) состояние.className = "сост пусто";
    состояние.hidden = !состояние.textContent;

    var демо = document.getElementById("сис_демо");
    if(пр.демо){ демо.href = пр.демо; демо.hidden = false; } else { демо.hidden = true; }
    var през = document.getElementById("сис_презентация");
    през.hidden = !(пр.внешний && !снаружиСайт(пр.внешний));
    през.textContent = (пр.кнопка_внешнего || "Презентация") + " →";
    /* подпись кнопки демо — своя, если задана (у AIAN: «Доклад — по клику») */
    демо.textContent = пр.кнопка_демо || "Открыть демо";
    var ссыл = document.getElementById("сис_ссылки"); ссыл.innerHTML = "";
    (пр.ссылки || []).forEach(function(с){
      var кн = document.createElement("button"); кн.type = "button"; кн.className = "кнопка";
      кн.textContent = с.имя + (с.адрес ? " →" : " · адрес уточняется"); кн.disabled = !с.адрес;
      кн.addEventListener("click", function(е){
        е.stopPropagation();
        if(снаружиСайт(с.адрес)) window.open(с.адрес, "_blank", "noopener"); else открытьВРамке(с.адрес);
      });
      ссыл.appendChild(кн);
    });
    /* неактивная кнопка «Ролик на согласовании» снята везде (Адиль 10.09);
       разметка оставлена на случай возврата */
    document.getElementById("сис_ролик").hidden = true;

    /* Стоп-кадр ставится всегда, ролик — поверх него. Не «или», а «поверх»:
       если mp4 не дойдёт (не выложен, не докачался, кодек не поддержан), под
       ним остаётся кадр, и экран системы не чернеет посреди показа. Проверять
       наличие файла заранее нечем — ошибка приходит от самого элемента. */
    var фон = document.getElementById("фон_системы");
    var кадр = пр.кадр || б._кадр;
    экран_системы.classList.toggle("скрин", !!пр.кадр);
    /* Прежний ролик глушится до очистки разметки. Пока ролики были немыми,
       хватало innerHTML = "": картинка исчезала вместе с элементом. Со звуком
       так нельзя — отсоединённый video продолжает звучать, и быстрый переход
       от системы к системе накладывал бы две дорожки друг на друга. */
    Array.prototype.forEach.call(фон.querySelectorAll("video"), function(в){
      в.pause(); в.removeAttribute("src"); в.load();
    });
    фон.innerHTML = "";
    фон.style.backgroundImage = кадр ? 'url("' + кадр + '")' : "";
    /* Встроенный показ. Адрес ставится в момент открытия, а не заранее: iframe
       с адресом в разметке тянул бы 25 МБ моделей при каждом заходе на любой
       экран системы, даже туда, где никакого ЦД нет. */
    var рамка = document.getElementById("внешний_показ");
    var кСистеме = document.getElementById("сис_кролику");
    текущаяСистема = пр;
    /* Порядок «ролик → живая система» — решение совещания 02.09: «сразу
       начинать с ролика, после ролика переходим к демонстрации живого
       продукта». Прежде у ЦД было наоборот — сначала 3D-макет, потом кнопка
       «дальше — ролик», — так просил Адиль до совещания; решение заказчика
       новее. Встроенный показ открывается кнопкой всегда — и когда ролика
       нет. Раньше без ролика он открывался сразу, и карточка «о чём проект»
       (эффект, описание — текст заказчика) пропадала; ДАЦ 08.09 просил её
       оставить. Теперь без ролика на экране стоп-кадр и карточка, кнопка
       «Дальше — система» — та же. */
    /* `сразу:true` у проекта — встроенный показ открывается без карточки
       (AISAP, Адиль 10.09: «пусть сразу открывается преза»). */
    var сразуСнаружи = !!пр.сразу && !!пр.внешний;
    экран_системы.classList.remove("снаружи");
    кСистеме.hidden = !пр.внешний;
    /* 25.09: у проекта, где «внешний» — своя страница-презентация (кибербезопасность.html), а ролика нет,
       кнопка звалась «Открыть систему», хотя вела на слайды; подпись — по адресу, как у нижней кнопки */
    кСистеме.textContent = пр.видео ? "Дальше — система →" : (/^https?:\/\//.test(пр.внешний || "") ? "Открыть систему →" : "Презентация →");
    рамка.src = сразуСнаружи ? пр.внешний : "about:blank";
    if(сразуСнаружи){ экран_системы.classList.add("снаружи"); кСистеме.hidden = true; }
    /* 25.09 (Контроль промбез): у сразу-снаружи проекта с видео в верхнем баре
       появляются две кнопки-переключателя «▶ Ролик» / «Открыть систему →», чтобы
       докладчик мог гонять ролик поверх презы и обратно, не мешая презентационному
       материалу. У остальных проектов эти кнопки скрыты. */
    var кРолику = document.getElementById("сис_кРолику");
    var кПрезе = document.getElementById("сис_кПрезе");
    кРолику.hidden = !(сразуСнаружи && пр.видео);
    кПрезе.hidden = !(сразуСнаружи && пр.видео);
    /* Презентации внутри рамки листаются стрелками со своей страницы. Без
       фокуса в рамке стрелки уходят нашему показу — докладчик жмёт, а слайд
       стоит. Фокус ставится по загрузке: раньше рамки ещё нет. */
    if(сразуСнаружи) рамка.addEventListener("load", function ф(){ рамка.removeEventListener("load", ф); рамка.focus(); разбудитьРамку(); });

    /* Метки пересобираются под каждую систему: они привязаны к её ролику.
       Старые часы гасятся здесь же — иначе при быстром переходе от системы к
       системе их накапливалось бы по одному на каждый показ. */
    var поле = document.getElementById("метки_ролика");
    поле.innerHTML = "";
    if(часыМеток){ clearInterval(часыМеток); часыМеток = null; }
    if(часыЧистого){ clearInterval(часыЧистого); часыЧистого = null; }
    экран_системы.classList.remove("чисто");
    экран_системы.classList.remove("процесс");
    /* 14.09 (Жанат Зарубековна): «не автоматом видео загружалось, а две
       ссылки — ролик либо система». Экран выбора у всех проектов с
       материалами; у кого есть процесс — с шагами, у остальных — карточка
       и кнопки. Автозапуск ролика оставлен только там, где нет системы и
       нет процесса — выбирать не из чего. */
    /* 16.09 (Адиль): «как на Geo AI» — у ролика с живой системой (демо) тоже экран
       выбора «Ролик / Открыть систему», иначе ролик стартовал сам и ссылка на
       систему не была видна (ABAI, ссылки от Адиля) */
    if(м.сразуРолик && пр.видео){
      /* 16.09 (Адиль): со страницы геологов — сразу ролик, экран выбора
         пропускаем; после ролика остаётся карточка с «Презентация →» */
      экран_системы.classList.remove("процесс");
      пуститьРолик(пр);
      document.getElementById("сис_кролику").hidden = !пр.внешний;
    } else if(пр.процесс || (пр.видео && (пр.внешний || пр.демо || (пр.ссылки && пр.ссылки.length)) && !сразуСнаружи)){
      показатьПроцессСистемы(б, пр);
      кСистеме.hidden = true;
    } else if(пр.видео && !сразуСнаружи) пуститьРолик(пр);
    /* 25.09: при сразуСнаружи+видео (Контроль промбез) ролик не пускается автоматом
       под рамкой — играет только по нажатию верхней кнопки «▶ Ролик». */

    /* Экран проявляется не сразу, а когда кадр вырос: иначе зритель видит две
       анимации подряд вместо одного движения. Узел ищется по проекту, а не
       берётся из события — открытьСистему вызывается и из отладочного крючка. */
    var свой = (б._узлы || []).filter(function(у){ return у.проект === м.проект; })[0];
    вырастить(свой ? свой.группа : (м.группа || null), кадр, function(){
      экран_системы.classList.add("открыт");
      экран_системы.setAttribute("aria-hidden", "false");
      спрятатьМорф();
      document.getElementById("сис_назад").focus();
    });
  }

  /* Семь шагов процесса в стиле закупок (AISAP): номер, значок, шаг, система.
     Шаг с ИИ помечается мятным. Кнопки: «Ролик» — уводит в обычный экран с
     роликом и карточкой; «Открыть систему» — как «Дальше — система». */
  function показатьПроцессСистемы(б, пр){
    экран_системы.classList.add("процесс");
    экран_системы.classList.toggle("с_шагами", !!пр.процесс);
    var панель = document.getElementById("процесс_системы");
    панель.innerHTML = "";
    var шапка = узел("div", "бп_шапка", панель);
    var ст = узел("span", "стадия", шапка);
    ст.textContent = СТАДИИ[б.стадия].имя + " · " + б.имя + " · бизнес-процесс";
    ст.style.color = СТАДИИ[б.стадия].цвет;
    узел("h2", "", шапка).textContent = пр.имя;
    var эф = узел("p", "сис_эффект", шапка); эф.textContent = пр.эффект || "";
    if(!пр.процесс){
      /* без шагов — описание проекта вместо сетки процесса; пустая сетка не
         создаётся, иначе между описанием и кнопками зияла дыра */
      var оп = узел("p", "бп_описание", панель); оп.textContent = пр.описание || "";
    }
    var сетка = пр.процесс ? узел("div", "бп_шаги", панель) : null;
    (пр.процесс || []).forEach(function(ш, и){
      var к = узел("div", "бп_шаг" + (ш.ии ? " ии" : ""), сетка);
      к.style.transitionDelay = (0.15 + и * 0.09) + "s";
      узел("div", "н", к).textContent = (и < 9 ? "0" : "") + (и + 1);
      if(ш.значок && ЗНАЧКИ_БП[ш.значок]){
        var св = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        св.setAttribute("viewBox", "0 0 24 24"); св.setAttribute("class", "ик");
        св.innerHTML = ЗНАЧКИ_БП[ш.значок]; к.appendChild(св);
      }
      узел("h3", "", к).textContent = ш.шаг;
      var с = узел("div", "сис", к);
      узел("b", "", с).textContent = ш.система || "";
      if(ш.модуль) узел("span", "", с).textContent = ш.модуль;
    });
    var кн = узел("div", "бп_кнопки", панель);
    if(пр.видео){
      var р = узел("button", "кнопка главная", кн); р.type = "button"; р.textContent = "▶ Ролик";
      р.addEventListener("click", function(){
        экран_системы.classList.remove("процесс");
        пуститьРолик(пр);
        document.getElementById("сис_кролику").hidden = !пр.внешний;
      });
    }
    /* Подпись кнопки — по тому, куда она ведёт: чужой сайт — «Открыть
       систему», свой html — «Презентация» или «Демо». У Geo AI «внешний» —
       презентация геораг.html, а живая система лежит в «демо»: без этого
       кнопка «Открыть систему» вела на слайды (Адиль 14.09: «баг в Geo AI»). */
    function подписьКнопки(адрес, своё){ return снаружиСайт(адрес) ? "Открыть систему →" : своё + " →"; }
    if(пр.внешний){

      о.textContent = пр.кнопка_внешнего ? пр.кнопка_внешнего + " →" : подписьКнопки(пр.внешний, "Презентация");
      о.addEventListener("click", кСистемеСнаружи);

       чтобы место было видно и адрес не забыли спросить */
    (пр.ссылки || []).forEach(function(с){

      б.textContent = с.имя + (с.адрес ? " →" : " · адрес уточняется");

      });
    });
    if(пр.демо){
      var д = узел("button", "кнопка", кн); д.type = "button"; д.textContent = подписьКнопки(пр.демо, "Демо");
      д.addEventListener("click", function(){
