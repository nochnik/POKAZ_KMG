  function пуститьРолик(пр){
    var фон = document.getElementById("фон_системы");
    var поле = document.getElementById("метки_ролика");
    {
      var ролик = document.createElement("video");
      ролик.src = пр.видео;
      ролик.loop = true; ролик.playsInline = true; ролик.preload = "auto";
      /* Ролики идут со звуком — заказчик попросил звук во всех, озвучка при
         этом не нужна, так что это музыка и шумы, а не диктор.

         autoplay здесь больше не ставится: атрибут запускает ролик до того,
         как мы решим вопрос со звуком, и браузер запустил бы его молча.
         Пускаем сами, ниже.

         Разрешение на звук берётся от заставки: она не идёт, пока по ней не
         нажали, а нажатие даёт странице «липкую активацию» — после него
         браузер пускает со звуком уже всё. Поэтому к моменту, когда докладчик
         доходит до системы, звук разрешён. Если показ открыли не через
         заставку (пропустили кнопкой — это тоже нажатие) или запретили
         автозапуск иначе, откат один: играем молча, картинка важнее. */
      ролик.muted = false;
      /* Звук — только на первом круге (Адиль 10.09: на втором-третьем круге
         озвучка «чуть бесит»). Ролик зациклен, «ended» у loop не приходит —
         круг ловится по откату currentTime назад. Каждое новое открытие
         системы создаёт новый элемент, поэтому звук снова с первого круга. */
      var былоВремя = 0;
      ролик.addEventListener("timeupdate", function(){
        if(ролик.currentTime + 0.5 < былоВремя && !ролик.muted) ролик.muted = true;
        былоВремя = ролик.currentTime;
      });
      ролик.addEventListener("error", function(){ ролик.remove(); });
      фон.appendChild(ролик);
      (function пустить(){
        var о = ролик.play();
        if(о && о.catch) о.catch(function(е){
          if(е && е.name === "NotAllowedError" && !ролик.muted){
            ролик.muted = true;
            var о2 = ролик.play();
            if(о2 && о2.catch) о2.catch(function(){});
          }
        });
      })();

      завестиЧистое(ролик);

      if(пр.метки && пр.метки.length){
        var элементы = пр.метки.map(function(м){
          var э = узел("div", "метка_видео" + (м.место ? " на_кадре" : ""), поле);
          э.textContent = м.текст;
          return { м:м, э:э };
        });
        /* Метки с местом привязаны к точке кадра: кадр 16:9 лежит в экране
           по object-fit: cover, поэтому доля кадра переводится в px через
           масштаб по большей стороне и смещение обрезанного края. */
        var расставить = function(){
          var Ш = экран_системы.clientWidth, В = экран_системы.clientHeight;
          var к = Math.max(Ш / 1920, В / 1080), сх = (Ш - 1920 * к) / 2, су = (В - 1080 * к) / 2;
          элементы.forEach(function(п_){
            if(!п_.м.место) return;
            п_.э.style.left = (сх + п_.м.место.x * 1920 * к) + "px";
            п_.э.style.top = (су + п_.м.место.y * 1080 * к) + "px";
          });
        };
        расставить();
        window.addEventListener("resize", расставить);
        /* Состояние метки считается опросом времени ролика, а не по событию
           timeupdate. Событие показалось очевидным выбором и не сработало:
           оно приходит только пока ролик реально проигрывается, а если браузер
           его придержал — кадры не выдаются, окно свёрнуто, ролик стоит —
           метки просто не загорались. Проверено замером: пять меток на месте,
           ни одна не горит ни на одной секунде.

           Опрос от этого не зависит: ролик остаётся источником времени, петля
           сама обнуляет метки, а перемотка подхватывается следующим тиком.
           Пятая доля секунды достаточна — метки висят по несколько секунд. */
        var обновить = function(){
          var т = ролик.currentTime;
          элементы.forEach(function(п_){
            п_.э.classList.toggle("горит", т >= п_.м.от && т < п_.м.до);
          });
        };
        обновить();
        часыМеток = setInterval(обновить, 200);
      }
    }
  }

  function закрытьСистему(){
    if(!системаОткрыта) return;
    системаОткрыта = false;
    экран_системы.classList.remove("открыт");
    экран_системы.setAttribute("aria-hidden", "true");

       систему заново и должен получить начало, а не середину прошлого показа. */
    if(часыМеток){ clearInterval(часыМеток); часыМеток = null; }
    if(часыЧистого){ clearInterval(часыЧистого); часыЧистого = null; }
    экран_системы.classList.remove("чисто");
    экран_системы.classList.remove("процесс");

       на Three.js, и оставленная работать она жгла бы кадры под нашим показом. */
    экран_системы.classList.remove("снаружи");
    document.getElementById("внешний_показ").src = "about:blank";
    разбудитьПетли();
    document.getElementById("сис_кролику").hidden = true;
    document.getElementById("сис_кРолику").hidden = true;
    document.getElementById("сис_кПрезе").hidden = true;
    var в = экран_системы.querySelector("video");
    if(в){ в.pause(); в.currentTime = 0; }
    /* Кадр садится обратно в свой узел, и только потом узлы возвращаются:
       иначе они проявятся под ещё летящим кадром. */
    усадить(function(){
      if(текущий) открыть(текущий);
    });
  }
  /* Шаг «дальше — система»: ролик уже показан, поверх него поднимается
     встроенный живой показ. Адрес ставится только сейчас — iframe с адресом
     тянул бы модели ЦД при каждом открытии экрана. Ролик ставится на паузу:
     под рамкой его не видно, а декодер под 3D-сценой ни к чему. */
  function открытьВРамке(адрес){
    var в = экран_системы.querySelector("video");
    if(в) в.pause();
    var рамка = document.getElementById("внешний_показ");
    рамка.addEventListener("load", function ф(){ рамка.removeEventListener("load", ф); рамка.focus(); разбудитьРамку(); });
    рамка.src = адрес;
    /* Экран выбора лежит поверх рамки (z-index 2) и без этого закрывал
       презентацию, открытую с него (Адиль 15.09: «косяк при нажатии на
       презентацию» у Geo AI). */
    экран_системы.classList.remove("процесс");
    экран_системы.classList.add("снаружи");
    document.getElementById("сис_кролику").hidden = true;
  }
  function снаружиСайт(адрес){ return /^https?:\/\//.test(адрес); }
  function кСистемеСнаружи(){
    if(!текущаяСистема || !текущаяСистема.внешний) return;
    /* Живая система на чужом домене в рамку не встанет (X-Frame-Options) —
       открывается вкладкой; свои показы (копии в репозитории) — в рамке. */
    if(снаружиСайт(текущаяСистема.внешний)) window.open(текущаяСистема.внешний, "_blank", "noopener");
    else открытьВРамке(текущаяСистема.внешний);

  document.getElementById("сис_кролику").addEventListener("click", кСистемеСнаружи);
  document.getElementById("сис_презентация").addEventListener("click", кСистемеСнаружи);
  /* 25.09 (Контроль промбез): переключатели «Ролик»/«Открыть систему» в верхнем баре.
     «Ролик» гасит рамку (иначе ролик играет под ней и не виден) и запускает mp4.
     «Открыть систему» снимает ролик (video-элемент нужно и src сбросить и удалить —
     иначе после remove звук может сохраняться до сборки мусора) и снова поднимает
     рамку с презентацией. */
  document.getElementById("сис_кРолику").addEventListener("click", function(){
    if(!текущаяСистема || !текущаяСистема.видео) return;
    document.getElementById("внешний_показ").src = "about:blank";
    экран_системы.classList.remove("снаружи");
    /* Прежний video-элемент подчищается перед новым, иначе на второй-третий клик
       по «Ролик» накапливаются video-теги и звук перекрывается. */
    Array.prototype.forEach.call(экран_системы.querySelectorAll("#фон_системы video"), function(в){
      в.pause(); в.removeAttribute("src"); в.load(); в.remove();
    });
    пуститьРолик(текущаяСистема);
  });
  document.getElementById("сис_кПрезе").addEventListener("click", function(){
    if(!текущаяСистема || !текущаяСистема.внешний) return;
    Array.prototype.forEach.call(экран_системы.querySelectorAll("#фон_системы video"), function(в){
      в.pause(); в.removeAttribute("src"); в.load(); в.remove();

  /* «Открыть демо» с локальным адресом — тоже в рамке, без новой вкладки. */
  document.getElementById("сис_демо").addEventListener("click", function(с){
    if(!текущаяСистема || !текущаяСистема.демо || снаружиСайт(текущаяСистема.демо)) return;
    с.preventDefault(); открытьВРамке(текущаяСистема.демо);
  });

  document.getElementById("сис_назад").addEventListener("click", закрытьСистему);

  document.getElementById("сис_вцепочку").addEventListener("click", function(){
    if(!системаОткрыта){ закрыть(); return; }
    системаОткрыта = false;
    экран_системы.classList.remove("открыт");
    экран_системы.setAttribute("aria-hidden", "true");
    if(часыМеток){ clearInterval(часыМеток); часыМеток = null; }
    if(часыЧистого){ clearInterval(часыЧистого); часыЧистого = null; }
    экран_системы.classList.remove("чисто");
    экран_системы.classList.remove("процесс");
    /* Встроенный показ выгружается, а не прячется: за рамкой живёт своя сцена
       на Three.js, и оставленная работать она жгла бы кадры под нашим показом. */
    экран_системы.classList.remove("снаружи");
    document.getElementById("внешний_показ").src = "about:blank";
    разбудитьПетли();
    document.getElementById("сис_кролику").hidden = true;
    document.getElementById("сис_кРолику").hidden = true;
    document.getElementById("сис_кПрезе").hidden = true;
    var в = экран_системы.querySelector("video");
    if(в){ в.pause(); в.currentTime = 0; }
    усадить(закрыть);
  });

  /* ================= камера ================= */
  /* Наезд — один transform на всю сцену: площадки едут вместе с биркой, линией
     и светом стола, поэтому ничто не разъезжается между собой. Источник
     площадки 2048 px, так что при увеличении видно деталь, а не пиксели —
     ради этого площадки и генерировались поштучно.

     Площадка уезжает в левую четверть кадра: справа освобождается место под
     веер. Числа в процентах сцены, поэтому от размера окна не зависят и
     одинаково работают на ноутбуке и на экране стенда. */
  var НАЕЗД_МАКС = 2.4;
  var ЦЕЛЬ_Y = 64;   /* v2: площадка ниже, под текстом подписи (Адиль 10.09, стрелки на скрине) */
  /* Зона под веер очерчена заказчиком: правая половина кадра целиком.
     Узлы раскладываются по ней диагональю, а не дугой. Дуга выносила вправо
     только средний узел, крайние оставались у левого края зоны, и правая
     треть пустовала — заказчик это и заметил. */
  var ВЕЕР_X    = 32;   /* v2: правее начинается процессная схема */     /* верхний левый узел, проценты окна */
  var РАЗМАХ    = 24;     /* насколько нижний узел правее верхнего */
  /* Верх зоны 24, а не 20: при девяти узлах в добыче верхний ряд вставал на
     54 px от верха окна и на 13 px заходил в полосу шапки, прямо под чип
     «Драфт». Замер на 1912×844 после сдвига — верхний ряд начинается ниже
     шапки, нижний не доходит до края. */
  var ВЕРХ_ВЕЕРА = 24;
  var НИЗ_ВЕЕРА  = 80;
  /* Ширина узла меряется у настоящего узла, а не дублируется числом.
     Дубль уже разошёлся с CSS: в расчёте мест стояло min(calc(20 * 19.2px),220px), в стилях
     к тому моменту было min(calc(26 * 19.2px),300px), и строка узлов у сквозного слоя
     вылезла за экран. Одно значение — одно место. */
  var _габаритУзла = null;
  /* Две пробы, по одной на режим веера: тесный узел меньше, и шаг сетки для
     него другой. Кэш по режиму, иначе первая же проба задавала бы размер на
     оба режима. */
  var _габаритТесного = null;
  function габаритУзла(){
    var тесно = веер.classList.contains("тесно");
    if(тесно && _габаритТесного) return _габаритТесного;
    if(!тесно && _габаритУзла) return _габаритУзла;
    /* В пробу ставится САМОЕ ДЛИННОЕ имя из всех систем, а не слово «Проба».

       С коротким именем проба давала высоту узла с однострочной подписью, а у
       половины систем имя переносится на две строки — «ИИ в УТО — тепловая
       карта», «OTS — тренажёры операторов». Раскладка считала шаг по заниженной
       высоте, и узлы налезали друг на друга: замер показал 14 px на добыче и
       переработке сразу после того, как подпись подняли до 20 px.

       Длиннейшее имя даёт худший случай, а раскладка обязана держаться именно
       по нему — иначе она верна для одних блоков и ломается на других. */
    var длинное = "";
    ПЕРЕДЕЛЫ.forEach(function(б){
      б.проекты.forEach(function(пр){
        if(пр.имя.length > длинное.length) длинное = пр.имя;
      });
    });
    var проба = узел("div", "узел", веер);
    проба.style.visibility = "hidden";
    проба.innerHTML = '<div class="кружок"></div><div class="подпись">' + длинное + '</div>' +
                      '<span class="сост слайды">только презентация</span>';
    var г = { ш: проба.offsetWidth, в: проба.offsetHeight };
    проба.remove();
    if(тесно) _габаритТесного = г; else _габаритУзла = г;
    return г;
  }
  function ширинаУзла(){ return габаритУзла().ш; }

  /* Просвет между подписью и веером меряется, а не назначается: подпись задана
     шириной в символах и её край в пикселях от окна не зависит, а площадка
     задана процентами сцены. Подобранные числа сходились на одном размере окна
     и наезжали друг на друга на другом. */
  function наездПодПросвет(){
    var сцШ = сцена.offsetWidth;                 /* без учёта transform */
    var сцЛево = (СТОЛ_Ш - сцШ) / 2;
    var подп = подпись_передела.getBoundingClientRect(), кс = масштабСтола();
    var слева = (подп.width ? подп.right / кс : сцЛево) + 26;
    var полУзла = ширинаУзла() / 2;
    var справа = ВЕЕР_X/100 * СТОЛ_Ш - полУзла - 26;
    var просвет = Math.max(120, справа - слева);
    var к = Math.min(НАЕЗД_МАКС, просвет / (ШИРИНА_МОДУЛЯ/100 * сцШ));
    var серединаПx = слева + просвет/2;
    return { к:к, цельX: (серединаПx - сцЛево) / сцШ * 100 };

  function скрытьПроцесс(){ процесс.classList.remove("виден"); процесс.innerHTML = ""; }

  /* v2: площадка не ищет просвет до веера, а встаёт в левую треть кадра под
     подписью — правее начинается схема, и площадка не должна её задевать. */
  function наездПодПросвет(){
    var сцШ = сцена.offsetWidth, сцЛево = (СТОЛ_Ш - сцШ) / 2;
    var просвет = 0.22 * СТОЛ_Ш;
    var к = Math.min(НАЕЗД_МАКС, просвет / (ШИРИНА_МОДУЛЯ/100 * сцШ));
    var серединаПx = 0.15 * СТОЛ_Ш;
    return { к:к, цельX: (серединаПx - сцЛево) / сцШ * 100 };

  function открыть(п){
    текущий = п;
    document.body.classList.add("вглубь");
    /* Подпись заполняется первой: её измеренный край задаёт и просвет для
       наезда, и начало строки узлов у сквозного слоя. */
    показатьПодпись(п);

    /* Наезд одинаков для всех пяти блоков: докладчик нажимает на такой же
       значок и ждёт такого же ответа. */
    var р = п._р, ц = наездПодПросвет();
    var цy = р.низМодуля - р.высотаМодуля/2;
    сцена.style.transform = "translate(" + (ц.цельX - ц.к*р.центр) + "%," +
                            (ЦЕЛЬ_Y - ц.к*цy) + "%) scale(" + ц.к + ")";
    п._наезд = ц;

    /* Бирки гасятся все до одной, включая свою: передел назван в подписи, а
       подпись под площадкой уезжает вместе со сценой и на таком увеличении
       становится в палец высотой. */
    ПЕРЕДЕЛЫ.forEach(function(д){

         уйти в чёрный, и при 0,1 труба соседней площадки просвечивала прямо
         под подписью узла. */
      д._площадка.style.opacity  = свой ? "1" : "0.06";
      д._ореол.style.opacity = свой ? ""  : "0";
      д._бирка.style.opacity = "0";
    });
    document.getElementById("где").textContent = СТАДИИ[п.стадия].имя + " / " + п.имя;
    /* v2: вместо веера — процессная схема */
    показатьПроцесс(п);
  }

  function закрыть(){

    ПЕРЕДЕЛЫ.forEach(function(д){

  /* ?экран=добыча — этот экран стенда отвечает за добычу; ?экран=добыча,переработка

  /* Стол: масштаб по меньшей стороне окна; прямоугольники, измеренные
     getBoundingClientRect, приходят в экранных px и делятся на масштаб. */
  var СТОЛ_Ш = 1920, СТОЛ_В = 1080;
  function вписатьСтол(){
    var к = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    /* стол покрывает окно целиком: его размер в единицах стола — окно/масштаб */
    СТОЛ_Ш = window.innerWidth / к; СТОЛ_В = window.innerHeight / к;
    var кэ = document.documentElement.style;
    кэ.setProperty("--масштаб", к);
    кэ.setProperty("--стол_ш", СТОЛ_Ш + "px");
    кэ.setProperty("--стол_в", СТОЛ_В + "px");
    return к;
  }
  function масштабСтола(){ return parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--масштаб")) || 1; }
  вписатьСтол();
  /* Кроме resize — visualViewport и редкий опрос: эмуляция размера в

  if(window.visualViewport) window.visualViewport.addEventListener("resize", вписатьСтол);
  setInterval(вписатьСтол, 700);
  window.addEventListener("resize", function(){
    вписатьСтол();
    /* Узлы пересобираются, а не только переставляются: их места считаются от
       ширины окна и от края подписи, и при другом размере окна старые
       координаты уже неверны. Ошибку нашёл замер: узлы, построенные при
       нулевой ширине окна, дали `100 - 110/0` и координату NaN — браузер
       молча пропустил свойство, и все три встали в левый край.

       Сбрасываются узлы всех блоков, а не только открытого. Прежде
       чистился один текущий, и это давало отложенную поломку: блоки, открытые
       до смены размера, держали узлы, посчитанные под старую ширину, и при
       следующем заходе в них подписи наезжали друг на друга, а часть узлов
       уходила за кадр. Замер на 1912×844 после смены размера: в добыче три
       наложения из трёх узлов, в другом блоке два узла за рамкой. После сброса
       всех — ноль и ноль.

       Условия «если блок открыт» здесь нет намеренно: чистить кэш надо и на
       общем экране, иначе первый же заход в блок после смены размера получит
       старые координаты. */
    скрытьУзлы();          /* снимает и отложенные показы: они ссылаются на узлы,
                              которых через строку уже не будет */
    /* Пробы размера узла тоже устаревают: ширина узла задана в vw, и при другом
       окне шаг сетки другой. Без сброса пересборка шла по старым числам. */
    _габаритУзла = null; _габаритТесного = null;

      if(!б._узлы) return;

    });

  /* Докладчик стоит у экрана с кликером, а не с мышью — так решено 02.09
     («планшет или кликер, тач-панель не нужна»). Кликер шлёт PageDown /
     PageUp, иногда стрелки, и должен работать на каждом уровне:
       — на цепочке «вперёд» открывает первый передел, «назад» — последний;
       — в переделе «вперёд/назад» переводят на соседний передел;
       — на экране системы «вперёд/назад» листают системы этого передела;
       — Esc поднимает на шаг вверх.
     Прежде стрелки работали только внутри передела, а с цепочки открыть
     что-то без мыши можно было лишь Tab и Enter — это нашла проверка. */
  document.addEventListener("keydown", function(с){
    if(с.key === "Escape"){
      if(системаОткрыта) закрытьСистему();
      else if(текущий) закрыть();
      return;
    }
    if(заставкаНаЭкране()) return;   /* пока стоит заставка, клавиши — её */
    var вперёд = (с.key === "ArrowRight" || с.key === "PageDown");
    var назад  = (с.key === "ArrowLeft"  || с.key === "PageUp");
    if(!вперёд && !назад) return;
    с.preventDefault();
    var шаг = вперёд ? 1 : -1;
    /* Открыта встроенная презентация (ГеоРАГ, KMG AISAP) — стрелки её, а не
       наши: она листается со своей страницы теми же клавишами. Событие
       пробрасывается в рамку напрямую, чтобы не зависеть от того, где фокус:
       кликер шлёт клавиши окну, а не рамке. */
    if(системаОткрыта && экран_системы.classList.contains("снаружи")){
      var окноРамки = document.getElementById("внешний_показ").contentDocument;
      if(окноРамки){ окноРамки.dispatchEvent(new KeyboardEvent("keydown", {key: с.key, bubbles: true})); return; }
    }
    if(системаОткрыта && текущий && текущий._узлы && текущаяСистема){
      var узлы = текущий._узлы;
      var i = -1;
      узлы.forEach(function(у, к){ if(у.проект === текущаяСистема) i = к; });
      if(i < 0) return;
      открытьСистему(текущий, узлы[(i + шаг + узлы.length) % узлы.length]);
      return;
    }
    if(!текущий){
      открыть(вперёд ? ПЕРЕДЕЛЫ[0] : ПЕРЕДЕЛЫ[ПЕРЕДЕЛЫ.length - 1]);
      return;
    }
    var где = ПЕРЕДЕЛЫ.indexOf(текущий);
    открыть(ПЕРЕДЕЛЫ[(где + шаг + ПЕРЕДЕЛЫ.length) % ПЕРЕДЕЛЫ.length]);
  });

  /* ================= сторож петель =================
     Заказчик заметил, что в какой-то момент площадки перестают двигаться.
     Причина не в файлах: у них стоит loop, и сами по себе они не кончаются.
     Останавливает их браузер — при сворачивании окна, переключении вкладки,
     нехватке памяти или засыпании машины медиа ставится на паузу, и обратно
     сама она не запускается: автозапуск срабатывает один раз при загрузке.

     На стенде это выглядит хуже всего: докладчик отвёл взгляд, вернулся — а
     макет мёртвый, и оживить его можно только перезагрузкой страницы.

     Поэтому паузу здесь считаем всегда ошибкой и чиним тремя способами сразу.
     Одного мало: событие pause приходит не во всех случаях, visibilitychange
     не ловит сворачивание окна на части систем, а таймер один срабатывает
     слишком редко, чтобы им ограничиться. */
  function завестиПетли(){
    /* Под заставкой петли не заводятся: экран занят её роликом, и делить с ним
       декодер незачем. Сторож всё равно тикает раз в четыре секунды и заведёт
       их сразу после — но заставка вызывает эту функцию сама, не дожидаясь. */
    if(заставкаНаЭкране()) return;
    Array.prototype.forEach.call(document.querySelectorAll(".площадка video"), function(в){
      if(в.preload === "none") в.preload = "auto";
      /* усыплённые под встроенным показом не трогаем — сторож тикает раз в
         четыре секунды и иначе будил бы их обратно под ЦД */
      if(в.paused && !в.hasAttribute("data-усыплена")){
        var п = в.play();
        /* play() отдаёт промис и отклоняет его, если браузер запретил
           автозапуск. Молчаливое падение здесь недопустимо — но и ронять показ
           нечем, поэтому просто гасим. */
        if(п && п.catch) п.catch(function(){});
      }
    });
  }

  document.addEventListener("visibilitychange", function(){
    if(!document.hidden) завестиПетли();
  });
  window.addEventListener("focus", завестиПетли);
  window.addEventListener("pageshow", завестиПетли);
  /* Раз в четыре секунды — на случаи, которые события не покрывают. Проверка
     дешёвая: пять обращений к свойству paused. */
  setInterval(завестиПетли, 4000);

  /* ================= заставка ================= */
  /* Ролик перед цепочкой. Правило одно: заставка не имеет права остаться на
     экране. Всё, что ниже, — способы её снять, и их четыре, потому что ролик
     на чужой машине может не пойти по причинам, которых мы отсюда не видим.

     1. Кончился — обычный путь.
     2. Докладчик нажал «Пропустить →».
     3. Ролик отдал ошибку — файла нет, кодек не тот.
     4. Ролик запущен, но время стоит; или данные не пришли за восемь секунд.

     Четвёртый и есть главный. Ролик заказчика пришёл в HEVC Main 10; такой
     файл в Chrome играет не везде, и в зале это выглядело бы как чёрный экран
     вместо показа. Ролик перекодирован в H.264 — но сторож оставлен: он
     закрывает и остальные причины, от кривой сборки до сорванного файла.

     Дальше — две ловушки, в которые я по очереди попал на замерах.

     Отклонено: «отказ play() снимает заставку». Заставка исчезала мгновенно —
     у невидимой вкладки Chrome глушит video-only media ради экономии питания,
     play() отдаёт AbortError. Показ, открытый заранее и выведенный на экран
     перед выступлением, потерял бы заставку ещё до того, как на него
     посмотрели. Теперь отказ пуска не снимает ничего: пуск повторяется.

     Отклонено: «время стоит — значит сломалось». Тоже сняло заставку живьём.
     Стоящее время само по себе ничего не значит: браузер вправе держать ролик
     на паузе, и document.hidden этого не показывает — окно может быть не
     видно, пока вкладка считается открытой. Простой считается поломкой только
     у запущенного ролика: играет, а время не идёт — вот это декодер встал.
     Придержанный браузером ролик просто ждёт, показывая первый кадр, и уйдёт
     сам, как только окно выведут вперёд.

     Отдельная защита на «файл не грузится»: восемь секунд без данных
     (readyState < 2) — снимаем. Иначе на сорванной сборке заставка осталась бы
     чёрным прямоугольником навсегда. */

  /* Звук и старт по нажатию.

     Браузер не пускает автозапуск со звуком, пока на странице не было ни
     одного действия человека, — это политика браузера, а не настройка показа,
     и обойти её со стороны страницы нельзя. Мы прошли по этому кругу трижды:
     сначала ролик шёл молча, потом звук включала кнопка в углу, потом любое
     действие. Заказчик выбрал последнее решение сам: ролик не идёт вовсе,
     пока не нажали, а по нажатию идёт сразу со звуком, с первого кадра.

     Это самый честный вариант из возможных. Нажатие — и есть то действие,
     которого требует браузер, поэтому звук гарантирован, а не «как повезёт».
     И зритель ничего не теряет: до нажатия висит первый кадр ролика, а не
     чёрный экран.

     Раньше этот вариант отклонялся мной из-за заглушки на проекторе — пока
     никто не нажал, гость видит неподвижную картинку. Возражение снято тем,
     что картинка эта — кадр самой заставки: степь на рассвете со знаком КМГ
     в цепочке, вполне себе титульный экран.

     Кнопки на нём нет: заказчик попросил просто паузу. Значит, докладчик должен
     знать, что показ начинается с любого нажатия, — на экране об этом не
     написано. Размен осознанный: надпись на титульном кадре стоит дороже, чем
     одна строка в памятке. Строка есть в README.

     Кнопка «Включить звук» больше не нужна и убрана: звук приходит сам вместе
     со стартом. */
  var заставка = document.getElementById("заставка");
  var роликЗаставки = document.getElementById("ролик_заставки");
  var сторожЗаставки = null;

  function снятьЗаставку(){
    if(!заставка || заставкаСнята) return;
    заставкаСнята = true;
    if(сторожЗаставки){ clearInterval(сторожЗаставки); сторожЗаставки = null; }
    /* Петли заводятся в начале проявления, а не после: 720 мс им как раз
       хватает, чтобы дотянуть первые кадры, и цепочка открывается уже живой. */
    завестиПетли();
    заставка.classList.add("ушла");
    роликЗаставки.pause();
    /* hidden ставится после проявления, а не сразу: display:none обрывает
       переход и заставка исчезла бы рывком. */
    setTimeout(function(){
      заставка.hidden = true;
      /* Ролик выгружается: 9 МБ декодера под показом ни к чему, а вернуть
         заставку можно только перезагрузкой. */
      роликЗаставки.removeAttribute("src");
      роликЗаставки.load();
    }, 720);
  }

  var заставкаПущена = false;

  function пуститьЗаставку(){
    if(!заставка || заставкаСнята || !заставкаПущена) return;
    var о = роликЗаставки.play();
    if(о && о.catch) о.catch(function(е){
      /* Разбирается ровно одна причина. NotAllowedError после нажатия быть не
         должно — нажатие и есть требуемое действие, — но если браузер всё же
         откажет, картинка важнее звука: идём молча. Прочие отказы (AbortError
         от экономии питания и подобные) лечатся повтором, его делает сторож. */
      if(е && е.name === "NotAllowedError" && !роликЗаставки.muted){
        роликЗаставки.muted = true;
        var о2 = роликЗаставки.play();
        if(о2 && о2.catch) о2.catch(function(){});
      }
    });
  }

  function начатьЗаставку(){
    if(!заставка || заставкаСнята || заставкаПущена) return;
    заставкаПущена = true;
    роликЗаставки.muted = false;
    роликЗаставки.currentTime = 0;
    пуститьЗаставку();
  }

  if(заставка){
    /* Пропуск — только кнопкой. Прежде заставку снимал щелчок по кадру и любая
       клавиша; заказчик попросил убрать, и правильно: на стенде по экрану
       трогают и просто так, а докладчик может смахнуть заставку локтем мыши.
       Единственный выход остаётся видимым и нарочным. */
    document.getElementById("пропустить").addEventListener("click", снятьЗаставку);

    /* Начинает щелчок по кадру, касание или клавиша — всё это одно действие
       человека, и оба пути ведут в одну функцию. Пропуск при этом остаётся
       только на своей кнопке: щелчок по кадру заставку не снимает. */
    заставка.addEventListener("pointerdown", начатьЗаставку);
    document.addEventListener("keydown", function(с){
      if(заставкаСнята) return;
      /* Esc — единственная клавиша, которая пропускает, а не пускает. Она и
         во всём остальном показе поднимает на шаг вверх, и рука докладчика
         тянется к ней сама; пускать ею ролик значило бы делать обратное
         тому, чего от неё ждут. */
      if(с.key === "Escape") снятьЗаставку(); else начатьЗаставку();
    });
    роликЗаставки.addEventListener("ended", снятьЗаставку);
    роликЗаставки.addEventListener("error", снятьЗаставку);
    document.addEventListener("visibilitychange", function(){
      if(!document.hidden) пуститьЗаставку();
    });
    window.addEventListener("focus", пуститьЗаставку);

    var былоЗ = -1, стоит = 0, тиков = 0;
    сторожЗаставки = setInterval(function(){
      тиков += 1;
      /* Восемь секунд без данных — файла нет или кодек не тот. Проверяется и до
         нажатия: заставка не должна держать цепочку за кнопкой, за которой
         ничего нет. */
      if(роликЗаставки.readyState < 2){
        if(тиков >= 16) снятьЗаставку();   /* 16 × 500 мс = восемь секунд без данных */
        return;
      }
      /* До нажатия ролик стоит по замыслу, и сторожить тут нечего. */
      if(!заставкаПущена) return;
      if(роликЗаставки.paused){ стоит = 0; пуститьЗаставку(); return; }
      var т = роликЗаставки.currentTime;
      if(т === былоЗ){
        стоит += 1;
        if(стоит >= 6) снятьЗаставку();    /* 6 × 500 мс = три секунды на месте */
      } else { стоит = 0; былоЗ = т; }
    }, 500);
  }

  /* ================= курсор ================= */
  /* Прячется после 2,5 с без движения мыши и возвращается от первого же
     движения. Считается по mousemove, а не по pointermove: с касаний
     pointermove приходит пачкой и на сенсорном экране стрелка мигала бы.

     Таймер перезаводится, а не тикает постоянно: движений мыши в секунду
     десятки, и дешевле один setTimeout, чем проверка на каждом событии. */
  var ЧАС_КУРСОРА = 2500;
  var курсорЧасы = null;
  function показатьКурсор(){
    document.body.classList.remove("без_мыши");
    if(курсорЧасы) clearTimeout(курсорЧасы);
    курсорЧасы = setTimeout(function(){
      document.body.classList.add("без_мыши");
    }, ЧАС_КУРСОРА);
  }
  document.addEventListener("mousemove", показатьКурсор);
  /* Колесо и нажатие тоже считаются присутствием: докладчик может держать
     руку на месте и крутить или щёлкать. */
  document.addEventListener("mousedown", показатьКурсор);
  document.addEventListener("wheel", показатьКурсор, { passive: true });
  показатьКурсор();

  /* Отладочный крючок — как window.__dbg в проекте ЦД. Нужен для замера: узлы
     проявляются через setTimeout, а в фоновой вкладке браузер душит таймеры,
     и синхронная проверка видит пустой экран. Через крючок состояние читается
     напрямую, без ожидания анимации. */
  window.__показ = {
    БЛОКИ: ПЕРЕДЕЛЫ,
    снятьЗаставку: снятьЗаставку,
    заставкаИдёт: function(){
      return !заставка.hidden && !роликЗаставки.paused;
    },
    открыть: открыть,
    открытьСистему: открытьСистему,
    закрытьСистему: закрытьСистему,
    /* 16.09 (Адиль): страница в рамке (бассейны.html) просит открыть карточку
       проекта показа — например, ролик Geo AI с кнопкой «Презентация». Рамка
       выгружается, карточка открывается в своём переделе. */
    открытьПроект: function(имя){
      var б = null, пр = null;
      ПЕРЕДЕЛЫ.forEach(function(п){ var x = п.проекты.filter(function(y){ return y.имя === имя; })[0]; if(x && !пр){ б = п; пр = x; } });
      if(!пр) return false;
      экран_системы.classList.remove("снаружи");
      document.getElementById("внешний_показ").src = "about:blank";
      var тотЖе = текущий === б;
      if(!тотЖе) открыть(б);
      /* Адиль 16.09: «сразу открывать ролик, а после ролика — та карточка,
         что после ролика»: экран выбора пропускается */
      setTimeout(function(){ открытьСистему(б, { проект:пр, сразуРолик:true }); }, тотЖе ? 0 : 900);
      return true;
    },
    закрыть: закрыть,
    текущий: function(){ return текущий ? текущий.код : null; },
    раскладка: раскладка,
    завестиПетли: завестиПетли,
    петлиИдут: function(){
      var в = [].slice.call(document.querySelectorAll(".площадка video"));
      return в.filter(function(э){ return !э.paused; }).length + "/" + в.length;
    },
    системаОткрыта: function(){ return системаОткрыта; },
    морф: морф,
    МОРФ_МС: МОРФ_МС,
    /* Сколько систем осталось без иконки: имя проекта — ключ, и переименование
       оборвало бы связь беззвучно. */
    безИконки: function(){
      return ПЕРЕДЕЛЫ.reduce(function(нет, б){
        return нет.concat(б.проекты.filter(function(пр){ return !ИКОНКИ[пр.имя]; })
                                   .map(function(пр){ return пр.имя; }));
      }, []);
    },
    спрятатьМорф: спрятатьМорф,
    проявить: function(код){
      var б = ПЕРЕДЕЛЫ.filter(function(д){ return д.код === код; })[0];
      if(!б._узлы) построитьУзлы(б);
      б._узлы.forEach(function(у){
        у.группа.classList.add("виден");
        у.группа.setAttribute("tabindex", "0");
      });
      return б._узлы.length;
    }
  };
})();
</script>
</body>
